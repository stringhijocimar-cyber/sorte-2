/* ==================== a cartela ====================
   Uma função só desenha a cartela em todos os usos: marcação manual, jogo
   salvo, e conferência. Três desenhos separados divergiriam no primeiro ajuste
   — e o volante é a peça de identidade do app, então ele tem de ser o mesmo
   objeto em qualquer tela.

   `sorteadas` pinta o resultado; quando há marcadas E sorteadas, a casa que é
   as duas coisas ganha o contorno âmbar: é o acerto.                       */
function cartela(modalidade, marcadas, opcoes){
  const o = Object.assign({sorteadas:null, interativa:false, rodape:"", selo:""}, opcoes||{});
  const c = MODALIDADES[modalidade];
  const cols = GRADE[modalidade] || 10;
  const marc = new Set(marcadas || []);
  const sort = o.sorteadas ? new Set(o.sorteadas) : null;
  const casas = [];
  for(let d = c.base; d <= c.N + c.base - 1; d++){
    const m = marc.has(d), s = sort && sort.has(d);
    const classe = s && m ? "casa acertou" : s ? "casa sorteada" : "casa";
    casas.push(`<button type="button" class="${classe}" ${o.interativa?"":"disabled"}
      data-casa="${d}" aria-pressed="${m}"
      aria-label="${d}${s?" sorteada":""}${m?" marcada":""}"><span>${pad(d)}</span></button>`);
  }
  const acertos = sort ? [...marc].filter(d => sort.has(d)).length : null;
  return `<div class="cartela">
    <div class="tarja"><b>${esc(c.nome)}</b>
      <span>${o.selo || `${marc.size}/${c.N}`}</span></div>
    <div class="miolo">
      <div class="grade-volante" style="grid-template-columns:repeat(${cols},1fr)"
        ${o.interativa?'id="volante"':""}>${casas.join("")}</div>
    </div>
    ${o.rodape || (acertos !== null
      ? `<div class="pe"><span>${acertos} acerto${acertos===1?"":"s"}</span>
          <span>${marc.size} dezenas marcadas</span></div>`
      : "")}
  </div>`;
}

const legendaCartela = `<div class="legenda-cartela">
  <span><i style="background:var(--tintaPapel)"></i>marcada</span>
  <span><i style="background:var(--acaso)"></i>sorteada</span>
  <!-- O selo do acerto reproduz o que a casa faz: caneta escura sobre a casa
       sorteada, com o fio claro em volta. Antes era um quadrado âmbar, que não
       aparece em lugar nenhum da cartela — legenda que não bate com o desenho
       é pior que legenda nenhuma. -->
  <span><i style="background:var(--acaso);box-shadow:inset 0 0 0 1px #fff,
    inset 0 0 0 3px var(--tintaPapel)"></i>acerto</span>
</div>`;

/* ==================== avisos e conferência automática ====================
   Conferir à mão só funciona para quem lembra de conferir. O motor abaixo roda
   sozinho a cada vez que o histórico muda: percorre os jogos salvos e as
   teimosinhas, confere contra todo concurso que ainda não foi conferido, e
   registra um aviso para cada faixa de prêmio atingida.

   Duas decisões que evitam mentira:

   * Um jogo salvo sem concurso-alvo declarado vale para os concursos **a
     partir da data em que foi salvo** — nunca para trás. Conferir um jogo
     contra um sorteio anterior ao dia em que ele foi criado produziria
     "acertos" que ninguém poderia ter apostado.
   * A conferência é idempotente: reprocessar o mesmo concurso não duplica
     conferência nem aviso, porque a chave é (jogo, concurso).            */

const AVISO_MAX = 200;

function avisar(tipo, titulo, texto, chave){
  /* `chave` torna o aviso idempotente: o mesmo fato não avisa duas vezes. */
  if(chave && S.avisos.some(a => a.chave === chave)) return false;
  S.avisos.unshift({
    id:`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`,
    tipo, titulo, texto, chave, quando:new Date().toISOString(), lido:false
  });
  if(S.avisos.length > AVISO_MAX) S.avisos.length = AVISO_MAX;
  Guardar.gravar("avisos", S.avisos);
  return true;
}

/* Notificação do sistema, quando a pessoa autorizou. O app funciona igual sem
   ela — o sino no cabeçalho é a via garantida, porque não depende de permissão
   nem de o app estar aberto no momento certo. */
function notificarSistema(titulo, texto){
  try{
    if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
    new Notification(titulo, {body:texto, icon:"icone.svg", tag:"lotolab"});
  }catch(e){ /* alguns navegadores exigem service worker; o sino cobre */ }
}

async function pedirPermissaoDeAviso(){
  try{
    if(typeof Notification === "undefined") return "indisponível";
    if(Notification.permission !== "default") return Notification.permission;
    return await Notification.requestPermission();
  }catch(e){ return "indisponível"; }
}

/* Faixa de prêmio atingida, ou null. Lotomania premia 0 acerto, e é por isso
   que a comparação é contra a lista de faixas e não contra um mínimo. */
function faixaAtingida(modalidade, acertos){
  const c = MODALIDADES[modalidade];
  return c.faixas.includes(acertos) ? acertos : null;
}

/* Os concursos que um jogo cobre. Para teimosinha é a faixa declarada; para um
   jogo comum, todo concurso conhecido da modalidade a partir da data de
   criação. */
function concursosDoJogo(j){
  return S.resultados.filter(r =>
    r.modalidade === j.modalidade &&
    (j.deConcurso
      ? r.concurso >= j.deConcurso && r.concurso <= j.deConcurso + (j.concursos||1) - 1
      : String(r.data || "") >= String(j.data || "")));
}

function conferenciaAutomatica(){
  let novas = 0, premios = 0;
  const todos = S.jogos.concat(S.teimosinhas || []);
  todos.forEach(j => {
    j.conferencias = j.conferencias || [];
    const jaFeitas = new Set(j.conferencias.map(cf => cf.concurso));
    concursosDoJogo(j).forEach(r => {
      if(jaFeitas.has(r.concurso)) return;
      const acertos = j.dezenas.filter(d => r.dezenas.includes(d)).length;
      j.conferencias.push({concurso:r.concurso, data:r.data, dezenas:r.dezenas, acertos});
      novas++;
      const faixa = faixaAtingida(j.modalidade, acertos);
      if(faixa !== null){
        premios++;
        const nome = MODALIDADES[j.modalidade].nome;
        avisar("premio", `${nome}: ${faixa} acerto${faixa===1?"":"s"}`,
          `Concurso ${r.concurso} — o jogo ${j.dezenas.map(pad).join(" ")} está numa faixa de prêmio. Confira no volante oficial antes de comemorar.`,
          `premio:${j.id}:${r.concurso}`);
      }
    });
  });
  if(novas){
    Guardar.gravar("jogos", S.jogos);
    Guardar.gravar("teimosinhas", S.teimosinhas);
  }
  return {novas, premios};
}

/* Chamado sempre que o histórico muda: confere, avisa quantos concursos
   entraram, e só então notifica o sistema. */
function aoMudarHistorico(quantosConcursos, origem){
  const r = conferenciaAutomatica();
  if(quantosConcursos > 0){
    const titulo = `${quantosConcursos} concurso${quantosConcursos===1?"":"s"} novo${quantosConcursos===1?"":"s"}`;
    const texto = r.novas
      ? `${r.novas} conferência${r.novas===1?"":"s"} feita${r.novas===1?"":"s"} automaticamente` +
        (r.premios ? `, ${r.premios} em faixa de prêmio.` : ", nenhuma em faixa de prêmio.")
      : "Nenhum jogo salvo cobria esses concursos.";
    if(avisar("historico", titulo, `${texto} Origem: ${origem}.`,
              `hist:${origem}:${S.resultados.length}:${Date.now()}`))
      notificarSistema(titulo, texto);
  }
  if(r.premios) notificarSistema("Faixa de prêmio atingida",
    "Abra o LotoLab para ver qual jogo e qual concurso.");
  if(S.autoAnalise !== false) analisarPendentes();
  return r;
}

/* ==================== análise automática por concurso ====================
   Cada concurso novo dispara o retreino das modalidades afetadas, e o aviso
   sai quando a análise fica pronta.

   Duas travas, porque "automático" não pode significar "desperdiçado":

   * **Assinatura do histórico.** Se a modalidade não recebeu concurso novo, a
     análise anterior continua exata e não é refeita. Sem isso, importar um
     concurso da Quina retreinaria as oito modalidades à toa.
   * **Uma modalidade por vez, com respiro.** Oito treinos em sequência
     travariam a tela por segundos. Cada um vai num setTimeout, então o app
     continua respondendo enquanto analisa.

   Sobre bateria: eu havia decidido não fazer isto automático por causa do
   custo de reconfirmar, a cada concurso, algo que já se sabe — que não há
   sinal. A decisão não era minha. Fica automático, e quem quiser o
   comportamento anterior desliga em Análise › Aprendizado.                */

function assinaturaHistorico(modalidade){
  const h = S.resultados.filter(r => r.modalidade === modalidade);
  if(!h.length) return "0";
  return `${h.length}:${Math.max(...h.map(r => r.concurso))}`;
}

/* As modalidades que têm histórico bastante E mudaram desde a última análise. */
function modalidadesPendentes(){
  return Object.keys(MODALIDADES).filter(k => {
    const n = S.resultados.filter(r => r.modalidade === k).length;
    if(n < MINIMO_CONCURSOS) return false;
    const anterior = S.aprendizado[k];
    return !anterior || anterior.assinatura !== assinaturaHistorico(k);
  });
}

/* Devolve quantas ficaram na fila. O `aoTerminar` existe para os testes
   poderem esperar o fim sem depender de tempo de relógio. */
function analisarPendentes(aoTerminar){
  const fila = modalidadesPendentes();
  if(!fila.length){ if(aoTerminar) aoTerminar([]); return 0; }

  const prontas = [];
  const proxima = () => {
    const k = fila.shift();
    if(k === undefined){
      /* A correção vem antes do aviso: avisar "revisar" e só depois descobrir
         que o achado não sobrevive à correção seria alarme falso entregue. */
      aplicarCorrecao(S.aprendizado);
      Guardar.gravar("aprendizado", S.aprendizado);
      if(prontas.length){
        const nomes = prontas.map(x => MODALIDADES[x.modalidade].nome).join(", ");
        const semSinal = prontas.filter(x => !x.aprendeu).length;
        const titulo = prontas.length === 1
          ? `Análise pronta: ${nomes}`
          : `${prontas.length} análises prontas`;
        const texto = semSinal === prontas.length
          ? `${nomes}: nenhum sinal encontrado, que é o resultado esperado de sorteios independentes.`
          : `${nomes}. ${prontas.length - semSinal} com desvio a revisar — desvio não é sinal, veja a tela.`;
        avisar("analise", titulo, texto,
          `analise:${prontas.map(x => x.modalidade + ":" + x.assinatura).join("|")}`);
        notificarSistema(titulo, texto);
      }
      /* Repinta só se a pessoa estiver olhando a tela que mudou. Repintar
         sempre roubaria a rolagem de quem está em outra aba. */
      if(S.tela === "aprendizado") pintar(); else pintarContaAvisos();
      if(aoTerminar) aoTerminar(prontas);
      return;
    }
    try{
      const r = aprender(k);
      if(!r.erro){
        r.assinatura = assinaturaHistorico(k);
        r.quando = new Date().toISOString();
        r.automatica = true;
        S.aprendizado[k] = r;
        prontas.push(r);
      }
    }catch(e){
      avisar("erro", `Falha ao analisar ${MODALIDADES[k].nome}`,
        `${e.message}. As outras modalidades seguem normalmente.`,
        `erroAnalise:${k}:${assinaturaHistorico(k)}`);
    }
    setTimeout(proxima, 0);   // devolve a linha principal entre modalidades
  };
  setTimeout(proxima, 0);
  return fila.length;
}

function avisosNaoLidos(){ return S.avisos.filter(a => !a.lido).length; }

function pintarContaAvisos(){
  const n = avisosNaoLidos(), b = $("#conta-avisos");
  if(!b) return;
  b.hidden = n === 0;
  b.textContent = n > 9 ? "9+" : String(n);
}

function pintarAvisos(){
  const corpo = $("#corpo-avisos");
  if(!corpo) return;
  const perm = (typeof Notification !== "undefined") ? Notification.permission : "indisponível";
  const cabeca = `<div style="display:flex;justify-content:space-between;align-items:center;
      gap:10px;margin-bottom:12px">
      <h2 style="margin:0">avisos</h2>
      <div class="botoes">
        ${perm === "granted" ? "" :
          `<button class="acao contorno mini" id="a-permitir">permitir notificação</button>`}
        ${S.avisos.length ? `<button class="acao contorno mini" id="a-limpar">limpar</button>` : ""}
      </div></div>`;
  const lista = !S.avisos.length
    ? `<div class="vazio">Nenhum aviso ainda.<br>Eles aparecem quando novos concursos
        entram no histórico e a conferência automática roda.</div>`
    : `<div class="lista">${S.avisos.map(a=>`
        <div class="item ${a.tipo==="premio"?"ok":a.tipo==="erro"?"aviso":""} ${a.lido?"":"nao-lido"}">
          <span class="marca-cor"></span>
          <span class="txt"><b>${esc(a.titulo)}</b><span>${esc(a.texto)}</span></span>
          <span class="quando">${esc(new Date(a.quando).toLocaleDateString("pt-BR"))}</span>
        </div>`).join("")}</div>`;
  corpo.innerHTML = cabeca + lista;
  const lim = $("#a-limpar");
  if(lim) lim.onclick = () => {
    S.avisos = []; Guardar.gravar("avisos", S.avisos); pintarAvisos(); pintarContaAvisos();
  };
  const perm2 = $("#a-permitir");
  if(perm2) perm2.onclick = async () => {
    const r = await pedirPermissaoDeAviso();
    if(r === "granted") notificarSistema("Notificações ligadas",
      "Você será avisado quando novos concursos forem conferidos.");
    pintarAvisos();
  };
}

/* ==================== importação de resultados ====================
   Duas vias, e a diferença entre elas é declarada na tela:

   * **Colar/arquivo** — funciona sem rede e é o caminho verificado.
   * **Buscar na Caixa** — consulta o serviço público do Portal de Loterias.
     NÃO PUDE TESTAR esta via: o ambiente onde este código foi escrito bloqueia
     o domínio da Caixa. O formato abaixo segue o que o portal publica, mas se
     ele mudar, a tela informa o erro em vez de inventar um resultado.       */

const SLUG_CAIXA = {
  "mega-sena":"megasena", "lotofacil":"lotofacil", "quina":"quina",
  "lotomania":"lotomania", "dupla-sena":"duplasena", "dia-de-sorte":"diadesorte",
  "timemania":"timemania", "mais-milionaria":"maismilionaria"
};

function dataBrParaIso(s){
  const m = String(s||"").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : String(s||"").slice(0,10);
}

/* Converte a resposta do portal no registro do app, e recusa o que não
   reconhece — devolver um resultado pela metade é pior que devolver erro. */
function normalizarCaixa(bruto, modalidade){
  const c = MODALIDADES[modalidade];
  const dezenas = (bruto.listaDezenas || bruto.dezenas || [])
    .map(x => parseInt(String(x), 10)).filter(x => Number.isFinite(x));
  if(dezenas.length !== c.k)
    throw new Error(`o serviço devolveu ${dezenas.length} dezenas, esperava ${c.k}`);
  const concurso = parseInt(bruto.numero ?? bruto.concurso, 10);
  if(!Number.isFinite(concurso)) throw new Error("o serviço não informou o número do concurso");
  const r = {concurso, data:dataBrParaIso(bruto.dataApuracao || bruto.data),
             dezenas:dezenas.sort((a,b)=>a-b), modalidade, origem:"caixa"};
  const trevos = (bruto.trevosSorteados || []).map(x=>parseInt(String(x),10))
    .filter(Number.isFinite);
  if(trevos.length) r.trevos = trevos;
  return r;
}

async function buscarNaCaixa(modalidade, concurso){
  const slug = SLUG_CAIXA[modalidade];
  if(!slug) throw new Error("modalidade sem serviço público conhecido");
  const url = `https://servicebus2.caixa.gov.br/portaldeloterias/api/${slug}` +
              (concurso ? `/${concurso}` : "");
  const resp = await fetch(url, {cache:"no-cache", headers:{Accept:"application/json"}});
  if(!resp.ok) throw new Error(`o serviço respondeu ${resp.status}`);
  return normalizarCaixa(await resp.json(), modalidade);
}

/* Colagem: aceita JSON (array de objetos) ou linhas soltas
   "concurso; data; dezenas". O formato de linha existe porque é o que sai de
   uma planilha, e planilha é o que as pessoas realmente têm. */
function lerColagem(texto, modalidade){
  const t = (texto||"").trim();
  if(!t) throw new Error("nada para importar");
  const c = MODALIDADES[modalidade];
  const saida = [];
  if(t.startsWith("[") || t.startsWith("{")){
    const bruto = JSON.parse(t);
    (Array.isArray(bruto) ? bruto : [bruto]).forEach(o =>
      saida.push(normalizarCaixa(o, modalidade)));
    return saida;
  }
  t.split(/\r?\n/).forEach((linha, i) => {
    const limpa = linha.trim();
    if(!limpa || /concurso/i.test(limpa)) return;      // cabeçalho de planilha
    const campos = limpa.split(/[;\t]|,(?=\s*\d{2}\/)/).map(x=>x.trim());
    const numeros = limpa.match(/\d+/g) || [];
    if(numeros.length < c.k + 1)
      throw new Error(`linha ${i+1}: esperava concurso, data e ${c.k} dezenas`);
    const concurso = parseInt(campos[0] ?? numeros[0], 10);
    const dataBruta = (campos[1] || "").match(/\d{2}\/\d{2}\/\d{4}|\d{4}-\d{2}-\d{2}/);
    const dezenas = limpa.slice(String(campos[0]).length + (campos[1]||"").length + 2)
      .match(/\d+/g);
    const dez = (dezenas || []).map(Number).filter(d => d >= c.base && d <= c.N + c.base - 1);
    if(dez.length < c.k) throw new Error(`linha ${i+1}: só reconheci ${dez.length} dezenas válidas`);
    saida.push({concurso, data: dataBruta ? dataBrParaIso(dataBruta[0]) : hoje(),
                dezenas: dez.slice(0, c.k).sort((a,b)=>a-b), modalidade, origem:"colado"});
  });
  if(!saida.length) throw new Error("nenhuma linha reconhecida");
  return saida;
}

/* Insere sem duplicar: a chave é (modalidade, concurso), e um concurso já
   conhecido é substituído, não repetido. */
function guardarResultados(novos){
  let inseridos = 0;
  novos.forEach(r => {
    const i = S.resultados.findIndex(x =>
      x.modalidade === r.modalidade && x.concurso === r.concurso);
    if(i >= 0) S.resultados[i] = r; else { S.resultados.push(r); inseridos++; }
  });
  S.resultados.sort((a,b)=> a.modalidade === b.modalidade
    ? a.concurso - b.concurso : a.modalidade.localeCompare(b.modalidade));
  Guardar.gravar("resultados", S.resultados);
  return inseridos;
}

/* ==================== aprendizado por modalidade ====================
   Um modelo POR MODALIDADE, treinado e avaliado separadamente. Juntar
   modalidades num modelo só seria mais fácil e estaria errado: o universo, a
   quantidade sorteada e a frequência de sorteios são diferentes, e o modelo
   aprenderia a distinguir modalidade em vez de qualquer coisa sobre dezenas.

   A pergunta que isto responde é honesta: **existe sinal aprendível no
   histórico desta modalidade?** A resposta esperada é não, porque sorteios
   honestos são independentes. O valor do módulo é medir isso em vez de afirmar,
   e mostrar o número.

   O que impede a auto-ilusão:

   * Treino e teste são separados no TEMPO. O modelo é treinado nos concursos
     antigos e medido nos recentes, que ele nunca viu.
   * As características de um concurso são calculadas só com os concursos
     ANTERIORES a ele. Usar o próprio concurso vazaria o alvo e produziria um
     AUC alto e falso.
   * A medida é AUC, não acerto. Com 15 de 25 dezenas sorteadas, um modelo que
     responde "sai" para tudo acerta 60% e não aprendeu nada.
   * Teste de permutação: embaralha os rótulos do teste e recalcula o AUC
     centenas de vezes. Se o AUC real cai dentro dessa nuvem, não há sinal.   */

const JANELA_CURTA = 10, JANELA_LONGA = 50;
const MINIMO_CONCURSOS = 60;

/* Características de uma dezena no instante do concurso `i`, usando apenas os
   concursos [0, i). Nomes e ordem ficam aqui para o relatório poder nomear os
   pesos — um modelo cujos pesos não se pode ler é um modelo em que não se
   pode confiar. */
const NOMES_ATRIBUTOS = ["freq curta", "freq longa", "atraso", "saiu no anterior",
                         "posição no volante"];

function atributosDezena(d, anteriores, c){
  const n = anteriores.length;
  const curta = anteriores.slice(-JANELA_CURTA);
  const longa = anteriores.slice(-JANELA_LONGA);
  const conta = lista => lista.reduce((a,r)=> a + (r.dezenas.includes(d)?1:0), 0);
  /* Atraso: quantos concursos desde a última aparição, normalizado pelo
     intervalo médio esperado (N/k). Sem aparição nenhuma no recorte, o valor
     satura em 1 — e não em infinito, que estouraria o gradiente. */
  let atraso = longa.length;
  for(let j = anteriores.length - 1; j >= 0; j--){
    if(anteriores[j].dezenas.includes(d)){ atraso = anteriores.length - 1 - j; break; }
  }
  const intervaloEsperado = c.N / c.k;
  return [
    curta.length ? conta(curta) / curta.length : 0,
    longa.length ? conta(longa) / longa.length : 0,
    Math.min(1, atraso / (intervaloEsperado * 3)),
    n && anteriores[n-1].dezenas.includes(d) ? 1 : 0,
    (d - c.base) / Math.max(1, c.N - 1)
  ];
}

/* Monta a matriz de treino/teste a partir do histórico de UMA modalidade. */
function dadosAprendizado(modalidade){
  const c = MODALIDADES[modalidade];
  const hist = S.resultados.filter(r => r.modalidade === modalidade)
    .slice().sort((a,b)=> a.concurso - b.concurso);
  if(hist.length < MINIMO_CONCURSOS)
    return {erro:`faltam ${MINIMO_CONCURSOS - hist.length} concursos`,
            tem:hist.length, precisa:MINIMO_CONCURSOS};

  const X = [], y = [], concursoDe = [];
  for(let i = JANELA_LONGA; i < hist.length; i++){
    const anteriores = hist.slice(0, i);
    const sorteadas = new Set(hist[i].dezenas);
    for(let d = c.base; d <= c.N + c.base - 1; d++){
      X.push(atributosDezena(d, anteriores, c));
      y.push(sorteadas.has(d) ? 1 : 0);
      concursoDe.push(i);
    }
  }
  /* Corte temporal: 70% dos CONCURSOS para treino. O corte é por concurso, e
     não por linha, porque as linhas de um mesmo concurso são dependentes entre
     si — dividir no meio de um concurso deixaria o modelo ver parte do alvo. */
  const primeiro = concursoDe[0], ultimo = concursoDe[concursoDe.length-1];
  const corte = primeiro + Math.floor((ultimo - primeiro + 1) * 0.7);
  const treino = [], teste = [];
  concursoDe.forEach((ci, k) => (ci < corte ? treino : teste).push(k));
  return {X, y, treino, teste, hist, concursoDe, nConcursos:hist.length,
          concursosTreino:corte - primeiro, concursosTeste:ultimo - corte + 1};
}

const sigmoide = z => 1 / (1 + Math.exp(-Math.max(-30, Math.min(30, z))));

/* Regressão logística por gradiente descendente, com regularização L2. Sem
   biblioteca: são vinte linhas, e uma dependência externa aqui significaria o
   app não abrir offline. */
function treinarLogistica(X, y, indices, opcoes){
  const o = Object.assign({epocas:220, taxa:0.6, l2:1e-3}, opcoes||{});
  const p = X[0].length;
  const w = new Array(p).fill(0);
  let b = 0;
  const n = indices.length;
  for(let e = 0; e < o.epocas; e++){
    const gw = new Array(p).fill(0);
    let gb = 0;
    for(const i of indices){
      const xi = X[i];
      let z = b;
      for(let j = 0; j < p; j++) z += w[j] * xi[j];
      const erro = sigmoide(z) - y[i];
      for(let j = 0; j < p; j++) gw[j] += erro * xi[j];
      gb += erro;
    }
    for(let j = 0; j < p; j++) w[j] -= o.taxa * (gw[j]/n + o.l2 * w[j]);
    b -= o.taxa * (gb/n);
  }
  return {w, b, prever(xi){
    let z = this.b;
    for(let j = 0; j < this.w.length; j++) z += this.w[j] * xi[j];
    return sigmoide(z);
  }};
}

/* AUC pela estatística de Mann-Whitney, com empates valendo meio. É a medida
   certa aqui: não depende do ponto de corte nem da proporção de positivos. */
function auc(escores, rotulos){
  const pares = escores.map((s,i)=>[s, rotulos[i]]).sort((a,b)=> a[0]-b[0]);
  let i = 0, somaPostos = 0, positivos = 0;
  while(i < pares.length){
    let j = i;
    while(j+1 < pares.length && pares[j+1][0] === pares[i][0]) j++;
    const posto = (i + j + 2) / 2;                      // postos de 1 a n
    for(let k = i; k <= j; k++) if(pares[k][1] === 1){ somaPostos += posto; positivos++; }
    i = j + 1;
  }
  const negativos = pares.length - positivos;
  if(!positivos || !negativos) return 0.5;
  return (somaPostos - positivos*(positivos+1)/2) / (positivos * negativos);
}

function logLoss(escores, rotulos){
  let s = 0;
  for(let i = 0; i < escores.length; i++){
    const p = Math.min(1-1e-12, Math.max(1e-12, escores[i]));
    s += rotulos[i] ? -Math.log(p) : -Math.log(1-p);
  }
  return s / escores.length;
}

/* Nuvem do acaso: embaralha os rótulos do teste e recalcula o AUC. Não
   retreina o modelo — o que testaria é a associação entre os escores que o
   modelo produziu e os rótulos, que é exatamente a hipótese em questão.
   Retreinar a cada permutação seria mais forte e levaria minutos no aparelho;
   a limitação está declarada na tela.

   O embaralhamento acontece DENTRO de cada concurso, e isso não é detalhe.
   As linhas de um mesmo concurso não são independentes: exatamente k dezenas
   saem, sempre. Embaralhar livremente entre concursos gera sorteios impossíveis
   — um com 3 dezenas, outro com 22 — e a nuvem resultante fica estreita demais.
   Nuvem estreita significa faixa do acaso estreita, e faixa estreita significa
   acusar sinal onde não existe.

   Foi exatamente assim que a primeira versão se comportou: com sorteios
   puramente aleatórios, ela marcou "revisar". Permutando dentro do concurso,
   cada sorteio permutado continua sendo um sorteio possível daquela modalidade,
   e a nuvem passa a descrever o acaso de verdade. */
function permutarAuc(escores, rotulos, repeticoes, rnd=Math.random, grupos){
  const nulos = [];
  const copia = rotulos.slice();
  /* Índices agrupados por concurso. Sem grupos informados, o conjunto inteiro
     vira um bloco só — o comportamento antigo, mantido para quem chama a função
     com dados que não têm estrutura de concurso. */
  const blocos = [];
  if(grupos){
    const porGrupo = new Map();
    grupos.forEach((g, i) => {
      if(!porGrupo.has(g)) porGrupo.set(g, []);
      porGrupo.get(g).push(i);
    });
    porGrupo.forEach(v => blocos.push(v));
  } else {
    blocos.push(rotulos.map((_, i) => i));
  }
  for(let r = 0; r < repeticoes; r++){
    for(const bloco of blocos){
      for(let i = bloco.length - 1; i > 0; i--){
        const j = Math.floor(rnd() * (i+1));
        const a = bloco[i], b = bloco[j];
        const t = copia[a]; copia[a] = copia[b]; copia[b] = t;
      }
    }
    nulos.push(auc(escores, copia));
  }
  nulos.sort((a,b)=>a-b);
  return nulos;
}

/* Gerador determinístico para o teste de permutação. Existe porque a primeira
   versão usava Math.random: o mesmo histórico produzia p-valores diferentes a
   cada execução, e o veredito podia mudar de "sem sinal" para "revisar" sem
   nenhum dado novo. Um teste desta bateria pegou isso falhando de forma
   intermitente. Resultado que não se repete não pode ser auditado. */
function geradorSemeado(semente){
  let x = semente >>> 0;
  return () => {
    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17;
    x ^= x << 5;  x >>>= 0;
    return x / 4294967296;
  };
}

function aprender(modalidade, opcoes){
  const o = Object.assign({permutacoes:200, semente:20260730}, opcoes||{});
  const d = dadosAprendizado(modalidade);
  if(d.erro) return d;

  const modelo = treinarLogistica(d.X, d.y, d.treino);
  const escoresTeste = d.teste.map(i => modelo.prever(d.X[i]));
  const rotulosTeste = d.teste.map(i => d.y[i]);
  const a = auc(escoresTeste, rotulosTeste);
  const perda = logLoss(escoresTeste, rotulosTeste);

  /* Referência: prever sempre a taxa-base do treino. Um modelo que não bate
     isto não aprendeu nada de útil, ainda que a perda pareça pequena. */
  const taxaBase = d.treino.reduce((s,i)=> s + d.y[i], 0) / d.treino.length;
  const perdaBase = logLoss(rotulosTeste.map(()=>taxaBase), rotulosTeste);

  const nulos = permutarAuc(escoresTeste, rotulosTeste, o.permutacoes,
                            geradorSemeado(o.semente),
                            d.teste.map(i => d.concursoDe[i]));
  /* p-valor bilateral por Monte Carlo, com a correção (r+1)/(m+1): sem ela um
     p-valor de exatamente zero seria reportado, e zero é impossível de medir
     com um número finito de permutações. */
  const acima = nulos.filter(x => x >= a).length;
  const abaixo = nulos.filter(x => x <= a).length;
  const m = nulos.length;
  const p = Math.min(1, 2 * Math.min((acima+1)/(m+1), (abaixo+1)/(m+1)));
  const faixa = [nulos[Math.floor(m*0.025)], nulos[Math.floor(m*0.975)]];

  return {
    modalidade, auc:a, perda, perdaBase, taxaBase, p, faixaAcaso:faixa,
    semente:o.semente, permutacoes:o.permutacoes,
    nConcursos:d.nConcursos, concursosTreino:d.concursosTreino,
    concursosTeste:d.concursosTeste, nLinhasTeste:d.teste.length,
    pesos: modelo.w.map((v,i)=>({nome:NOMES_ATRIBUTOS[i], peso:v})),
    /* `foraDaFaixa` é o achado bruto de UMA modalidade. `aprendeu` é a
       decisão final, e ela depende de quantas modalidades foram testadas —
       ver aplicarCorrecao(). Com uma modalidade só, as duas coincidem. */
    foraDaFaixa: p < 0.05 && (a < faixa[0] || a > faixa[1]),
    aprendeu: p < 0.05 && (a < faixa[0] || a > faixa[1]),
    familia: 1, limiteAplicado: 0.05
  };
}

/* Correção de Holm-Bonferroni entre as modalidades analisadas.

   Sem isto o app grita lobo, e não é teoria: medi. Com históricos puramente
   aleatórios, cada modalidade acusa sinal em cerca de 10% das vezes — o dobro
   do nominal de 5%. Rodando as 8 modalidades a cada concurso, a chance de pelo
   menos uma acusar por acaso é 1 − 0,90^8 ≈ 57%. Mais da metade dos concursos
   produziria um alarme falso, e um alarme que toca à toa ensina a pessoa a
   ignorar o alarme.

   Holm em vez de Bonferroni puro: mesma garantia contra o falso positivo, e
   menos cego para um efeito real, porque o limiar afrouxa conforme os achados
   mais fortes são aceitos. O procedimento é passo a passo — ao primeiro
   p-valor que não passa, todos os maiores são rejeitados junto, e é isso que
   preserva a garantia.

   Com uma modalidade só, m = 1 e nada muda: o limiar continua 0,05.          */
function aplicarCorrecao(mapa, alfa=0.05){
  const chaves = Object.keys(mapa).filter(k => mapa[k] && typeof mapa[k].p === "number");
  const m = chaves.length;
  if(!m) return mapa;

  const ordenadas = chaves.slice().sort((x, y) => mapa[x].p - mapa[y].p);
  let aindaRejeita = true;
  ordenadas.forEach((k, i) => {
    const limite = alfa / (m - i);
    const r = mapa[k];
    if(aindaRejeita && r.p <= limite && r.foraDaFaixa){
      r.aprendeu = true;
    } else {
      /* A partir do primeiro que não passa, nenhum dos maiores passa. É o
         passo que dá a garantia — aceitar um p-valor maior depois de rejeitar
         um menor quebraria o procedimento. */
      aindaRejeita = false;
      r.aprendeu = false;
    }
    r.familia = m;
    r.limiteAplicado = limite;
  });
  return mapa;
}

function vereditoAprendizado(r){
  const correcao = (r.familia > 1)
    ? ` O limiar aplicado foi ${nf(r.limiteAplicado,4)}, e não 0,05, porque
        ${r.familia} modalidades foram testadas: com vários testes ao mesmo tempo,
        parte dos achados é falsa por construção, e a correção de Holm compensa
        isso.`
    : "";
  if(!r.aprendeu){
    const quaseLa = r.foraDaFaixa
      ? ` O AUC saiu fora da faixa do acaso, mas <strong>não sobreviveu à correção
          para múltiplos testes</strong> — que é exatamente o tipo de achado que
          desaparece quando se olha com honestidade.${correcao}`
      : "";
    return `O modelo <strong>não distingue</strong> dezena sorteada de não sorteada
      melhor que o acaso: AUC ${nf(r.auc,4)}, faixa do embaralhamento
      ${nf(r.faixaAcaso[0],4)} a ${nf(r.faixaAcaso[1],4)}, p = ${nf(r.p,3)}.${quaseLa}
      <strong>Este é o resultado esperado.</strong> Sorteios honestos são eventos
      independentes: não há o que aprender no histórico, e um modelo que
      afirmasse o contrário estaria descrevendo ruído.`;
  }
  return `O AUC de ${nf(r.auc,4)} caiu <strong>fora</strong> da faixa do acaso
    (${nf(r.faixaAcaso[0],4)} a ${nf(r.faixaAcaso[1],4)}), p = ${nf(r.p,3)}, e
    sobreviveu à correção para múltiplos testes.${correcao}
    Ainda assim, isto <strong>não</strong> é prova de sinal: com poucos concursos
    um desvio assim aparece por variância amostral. O caminho é repetir com mais
    concursos e ver se sobrevive — não é apostar nisso.`;
}

/* ==================== telas novas ==================== */

const marcadasDe = m => S.marcadas[m] || [];

T.montar = () => {
  const c = MODALIDADES[S.modalidade];
  const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
  const valido = dez.length >= c.min && dez.length <= c.max;
  const cobertas = valido ? combinacoes(dez.length, c.k) : 0;
  const custo = cobertas * c.preco;
  const obs = dez.length >= c.k ? observacoes(dez, S.modalidade) : [];
  const ultimo = ultimoResultado(S.modalidade);

  return cartela(S.modalidade, dez, {interativa:true,
      selo:`${dez.length} de ${c.min}${c.max>c.min?`–${c.max}`:""}`,
      rodape:`<div class="pe">
        <span>${dez.length < c.min
          ? `faltam ${c.min - dez.length}`
          : dez.length > c.max ? `${dez.length - c.max} a mais` : "aposta válida"}</span>
        <span>${valido ? brl(custo) : "—"}</span></div>`}) +
    `<div class="contador">
      <span>marcadas <b>${dez.length}</b> de ${c.min}${c.max>c.min?` a ${c.max}`:""}</span>
      <span>${valido ? `${inf(cobertas)} aposta${cobertas>1?"s":""} simples` : "aposta incompleta"}</span>
    </div>
    <div class="botoes" style="margin-bottom:12px">
      <button class="acao mini" id="m-salvar" ${valido?"":"disabled"}>salvar jogo</button>
      <button class="acao contorno mini" id="m-completar">completar ao acaso</button>
      <button class="acao contorno mini" id="m-limpar" ${dez.length?"":"disabled"}>limpar</button>
    </div>
    ${dez.length >= c.k ? `<div class="carta">
      <h2>como este jogo se parece</h2>
      <ul style="margin:8px 0 0;padding-left:1.15em;font-size:.88rem">
        ${obs.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
      <div class="nota">Isto descreve a <strong>forma</strong> do jogo, não a chance dele.
        Todas as combinações válidas têm exatamente a mesma probabilidade. O que a forma
        muda é quanta gente costuma marcar algo parecido — e portanto com quantas pessoas
        você dividiria, se acertasse.</div>
    </div>` : ""}
    ${ultimo && dez.length ? `<div class="carta">
      <h2>contra o último concurso conhecido</h2>
      <p style="font-size:.85rem;color:var(--secundaria);margin:6px 0 10px">
        Concurso ${esc(ultimo.concurso)}. Isto é um teste retrospectivo: não diz nada
        sobre o próximo sorteio.</p>
      ${cartela(S.modalidade, dez, {sorteadas:ultimo.dezenas,
        selo:`concurso ${ultimo.concurso}`})}
      ${legendaCartela}
    </div>` : ""}
    <div id="m-saida"></div>`;
};

T.aprendizado = () => {
  const c = MODALIDADES[S.modalidade];
  const estoque = Object.keys(MODALIDADES).map(k => ({
    id:k, nome:MODALIDADES[k].nome,
    n:S.resultados.filter(r => r.modalidade === k).length
  }));
  const d = dadosAprendizado(S.modalidade);
  const r = S.aprendizado && S.aprendizado[S.modalidade];

  return `<div class="carta">
    <h2>${esc(c.nome)}</h2>
    <div class="nota"><strong>Um modelo por modalidade, treinado e medido
      separadamente.</strong> Juntar modalidades num modelo só seria mais fácil e
      estaria errado: universo, quantidade sorteada e calendário são diferentes, e o
      modelo aprenderia a distinguir modalidade em vez de aprender algo sobre
      dezenas.</div>
    <label style="display:flex;align-items:center;gap:10px;padding:11px 12px;
      border:1px solid var(--linha);border-radius:12px;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="ap-auto" ${S.autoAnalise!==false?"checked":""}
        style="width:20px;height:20px;flex:none;accent-color:var(--acaso)">
      <span style="flex:1;font-size:.88rem">
        <b>Analisar sozinho a cada concurso novo</b>
        <span style="display:block;font-size:.78rem;color:var(--secundaria)">
          Retreina só as modalidades que receberam concurso, e avisa quando fica
          pronta. Desligado, a análise só roda no botão.</span></span>
    </label>
    ${d.erro
      ? `<div class="nota atencao">Não dá para treinar ainda: ${esc(d.erro)}.
          Há ${d.tem} concurso${d.tem===1?"":"s"} desta modalidade no app e são
          necessários ${d.precisa}. Traga histórico na aba
          <strong>Conferir › Resultados</strong>.</div>`
      : `<div class="kpis">
          <div class="kpi"><div class="rot">concursos</div>
            <div class="val">${d.nConcursos}</div><div class="sub">no app</div></div>
          <div class="kpi"><div class="rot">divisão temporal</div>
            <div class="val" style="font-size:1.05rem">${d.concursosTreino} / ${d.concursosTeste}</div>
            <div class="sub">treino / teste</div></div>
        </div>
        <div class="pe" style="border:0;padding-left:0">
          <span>os ${JANELA_LONGA} primeiros concursos não entram na conta</span>
          <span>viram as características dos seguintes</span></div>
        <p style="font-size:.82rem;color:var(--secundaria);margin:0 0 12px">
          ${d.nConcursos} concursos no app − ${JANELA_LONGA} de aquecimento =
          ${d.concursosTreino + d.concursosTeste} usados. Um concurso só pode ser

        <button class="acao" id="ap-treinar">treinar e medir fora da amostra</button>
        <div class="nota">O modelo é treinado nos concursos antigos e medido nos
          recentes, que ele nunca viu. As características de cada concurso usam
          apenas os concursos anteriores a ele — usar o próprio vazaria a resposta e
          produziria um resultado excelente e falso.</div>`}
    <div id="ap-saida">${!r ? "" : `
      <div class="kpis">
        <div class="kpi"><div class="rot">AUC fora da amostra</div>
          <div class="val">${nf(r.auc,4)}</div>
          <div class="sub">acaso: 0,5000</div></div>
        <div class="kpi"><div class="rot">p-valor</div>
          <div class="val">${nf(r.p,3)}</div>
          <div class="sub">${r.aprendeu?"fora":"dentro"} da faixa do acaso</div></div>
        <div class="kpi"><div class="rot">perda do modelo</div>
          <div class="val" style="font-size:1.15rem">${nf(r.perda,4)}</div>
          <div class="sub">taxa-base: ${nf(r.perdaBase,4)}</div></div>
        <div class="kpi"><div class="rot">linhas no teste</div>
          <div class="val" style="font-size:1.15rem">${inf(r.nLinhasTeste)}</div>
          <div class="sub">dezena × concurso</div></div>
      </div>
      ${faixaAcaso(r.auc, 0.5, Math.max((r.faixaAcaso[1]-r.faixaAcaso[0])/4, 0.001))}
      <div class="nota ${r.aprendeu?"atencao":""}">${vereditoAprendizado(r)}</div>
      <div class="rolagem"><table>
        <tr><th>característica</th><th>peso</th><th>direção</th></tr>
        ${r.pesos.map(x=>`<tr><td>${esc(x.nome)}</td><td>${nf(x.peso,4)}</td>
          <td>${x.peso > 0 ? "aumenta o escore" : x.peso < 0 ? "reduz o escore" : "—"}</td>
          </tr>`).join("")}

      <div class="nota">Os pesos ficam à vista de propósito: um modelo cujos
        coeficientes não se pode ler é um modelo em que não se pode confiar. Peso

        algo — significa que o gradiente parou ali com os dados de treino.</div>
      <div class="nota atencao">Limitação declarada: o teste de permutação embaralha
        os rótulos do teste e recalcula o AUC, sem retreinar o modelo a cada
        permutação. Retreinar seria mais forte e levaria minutos no aparelho.
        O embaralhamento respeita a estrutura do sorteio: acontece dentro de cada
        concurso, para que cada sorteio permutado continue tendo exatamente
        ${c.k} dezenas — embaralhar livremente geraria sorteios impossíveis e

      <div class="pe" style="border:0;padding-left:0">
        <span>${r.permutacoes} permutações · semente ${r.semente}</span>
        <span>rodar de novo dá o mesmo resultado</span></div>
      ${!r.quando ? "" : `<div class="pe" style="border:0;padding-left:0;padding-top:0">
        <span>análise ${r.automatica?"automática":"manual"} de
          ${esc(new Date(r.quando).toLocaleString("pt-BR"))}</span>
        <span>${esc(r.assinatura||"")} concursos:último</span></div>`}`}
    </div>
  </div>
  <div class="carta">
    <h2>histórico disponível por modalidade</h2>
    <p style="font-size:.85rem;color:var(--secundaria);margin:6px 0 10px">
      Cada modalidade é analisada por conta própria, e só entra na análise com pelo
      menos ${MINIMO_CONCURSOS} concursos — abaixo disso qualquer resultado seria
      variância amostral com cara de descoberta.</p>
    <div class="rolagem"><table>
      <tr><th>modalidade</th><th>concursos</th><th>situação</th><th>AUC</th><th>p</th></tr>
      ${estoque.map(e=>{
        const res = S.aprendizado && S.aprendizado[e.id];
        return `<tr>
          <td>${esc(e.nome)}</td><td>${e.n}</td>
          <td>${e.n >= MINIMO_CONCURSOS
            ? (res ? `<span class="selo ${res.aprendeu?"seu":"ok"}"
                >${res.aprendeu?"revisar":"sem sinal"}</span>`
                   : `<span class="selo">pronta</span>`)
            : `faltam ${MINIMO_CONCURSOS - e.n}`}</td>
          <td>${res ? nf(res.auc,4) : "—"}</td>
          <td>${res ? nf(res.p,3) : "—"}</td></tr>`;
      }).join("")}
    </table></div>
  </div>`;
};

      : `<div class="lista" style="margin-top:10px">${meus.slice(0,40).map(r=>`
          <div class="item">
            <span class="marca-cor"></span>

          </div>`).join("")}</div>
        ${meus.length > 40 ? `<div class="pe">mostrando os 40 mais recentes</div>` : ""}`}
  </div>`;
};

T.teimosinha = () => {
  const c = MODALIDADES[S.modalidade];
  const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
  const minhas = (S.teimosinhas||[]).filter(t => t.modalidade === S.modalidade);
  const podeCriar = dez.length >= c.min && dez.length <= c.max;
  const ultimo = ultimoResultado(S.modalidade);
  return `<div class="carta">
    <h2>criar teimosinha</h2>
    <p style="font-size:.85rem;color:var(--secundaria);margin:6px 0 10px">
      Usa as dezenas marcadas na tela <strong>Manual</strong>${
        dez.length ? `: ${dez.map(pad).join(" ")}` : " — nenhuma marcada ainda"}.</p>
    <div class="linha2">
      <label class="campo"><label>a partir do concurso</label>
        <input id="t-de" type="number" inputmode="numeric"
          value="${ultimo ? ultimo.concurso + 1 : ""}" placeholder="ex.: 3422"></label>
      <label class="campo"><label>concursos seguidos</label>
        <select id="t-n">${[2,3,4,5,6,7,8,9].map(v=>
          `<option value="${v}">${v}</option>`).join("")}</select></label>
    </div>
    <button class="acao mini" id="t-criar" ${podeCriar?"":"disabled"}>criar teimosinha</button>
    <div class="nota">O custo é multiplicado pelo número de concursos e sai inteiro no ato,
      como na lotérica. Repetir o mesmo jogo não muda a chance de nenhum sorteio: cada
      concurso é independente do anterior.</div>
    <div id="t-saida"></div>
  </div>
  ${!minhas.length ? `<div class="vazio">Nenhuma teimosinha nesta modalidade.</div>`
    : minhas.map(t=>{
        const conf = t.conferencias || [];
        const fim = t.deConcurso + t.concursos - 1;
        const restam = Math.max(0, t.concursos - conf.length);
        const melhor = conf.length ? Math.max(...conf.map(x=>x.acertos)) : null;
        return `<div class="carta">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
            <h3>Concursos ${t.deConcurso}–${fim}</h3>
            <span class="selo ${restam?"seu":"ok"}">${restam?`${restam} por sair`:"encerrada"}</span>
          </div>
          ${cartela(t.modalidade, t.dezenas, {
            sorteadas: conf.length ? conf[conf.length-1].dezenas : null,
            selo:`${t.dezenas.length} dezenas`})}
          <div class="kpis">
            <div class="kpi"><div class="rot">custo total</div>
              <div class="val" style="font-size:1.15rem">${brl(t.custo)}</div>
              <div class="sub">${t.concursos} concursos</div></div>
            <div class="kpi"><div class="rot">melhor acerto</div>
              <div class="val">${melhor === null ? "—" : melhor}</div>
              <div class="sub">${conf.length} conferido${conf.length===1?"":"s"}</div></div>
          </div>
          ${conf.length ? `<div class="rolagem"><table>
            <tr><th>concurso</th><th>acertos</th><th>faixa</th></tr>
            ${conf.slice().sort((a,b)=>a.concurso-b.concurso).map(x=>`<tr>
              <td>${esc(x.concurso)}</td><td>${x.acertos}</td>
              <td>${faixaAtingida(t.modalidade, x.acertos) !== null
                ? `<span class="selo ok">prêmio</span>` : "—"}</td></tr>`).join("")}
          </table></div>` : `<div class="pe">Nenhum dos concursos entrou no histórico ainda.</div>`}
          <div class="botoes" style="margin-top:10px">
            <button class="acao perigo mini" data-apagar-teimosinha="${esc(t.id)}">apagar</button>
          </div>
        </div>`;
      }).join("")}`;
};

/* ============================ ações ============================ */
function acoesNovas(){
  /* --- volante manual --- */
  document.querySelectorAll("#volante [data-casa]").forEach(b => b.onclick = () => {
    const d = +b.dataset.casa, c = MODALIDADES[S.modalidade];
    const atual = marcadasDe(S.modalidade).slice();
    const i = atual.indexOf(d);
    if(i >= 0) atual.splice(i, 1);
    else if(atual.length >= c.max) return;      // teto da modalidade, sem aviso ruidoso
    else atual.push(d);
    S.marcadas[S.modalidade] = atual;
    Guardar.gravar("marcadas", S.marcadas);
    pintar();
  });

  const compl = $("#m-completar");
  if(compl) compl.onclick = () => {
    const c = MODALIDADES[S.modalidade];
    const atual = new Set(marcadasDe(S.modalidade));
    const faltam = Math.max(0, c.min - atual.size);
    const livres = universo(S.modalidade).filter(d => !atual.has(d));
    embaralhar(livres).slice(0, faltam).forEach(d => atual.add(d));
    S.marcadas[S.modalidade] = [...atual].sort((a,b)=>a-b);
    Guardar.gravar("marcadas", S.marcadas); pintar();
  };

  const limpar = $("#m-limpar");
  if(limpar) limpar.onclick = () => {
    S.marcadas[S.modalidade] = [];
    Guardar.gravar("marcadas", S.marcadas); pintar();
  };

  const salvar = $("#m-salvar");
  if(salvar) salvar.onclick = () => {
    const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
    S.jogos.push({
      id:`${Date.now().toString(36)}-m`, dezenas:dez, modalidade:S.modalidade,
      metodo:"manual", data:hoje(), lote:`M${Date.now().toString(36)}`, conferencias:[]
    });
    Guardar.gravar("jogos", S.jogos);
    conferenciaAutomatica();
    S.tela = "jogos"; pintar();
  };

  /* --- resultados --- */
  const colar = $("#r-colar");
  if(colar) colar.onclick = () => {
    const saida = $("#r-saida");
    try{
      const novos = lerColagem($("#r-texto").value, S.modalidade);
      const n = guardarResultados(novos);
      const r = aoMudarHistorico(n, "colado");
      saida.innerHTML = `<div class="nota"><strong>${n} concurso${n===1?"":"s"} novo${n===1?"":"s"}</strong>
        de ${novos.length} lido${novos.length===1?"":"s"}. ${r.novas} conferência${r.novas===1?"":"s"}
        automática${r.novas===1?"":"s"}.</div>`;
      setTimeout(pintar, 900);
    }catch(e){
      saida.innerHTML = `<div class="nota atencao">Não importei: ${esc(e.message)}.</div>`;
    }
  };

  const buscar = async (quantos) => {
    const saida = $("#r-saida");
    saida.innerHTML = `<div class="nota"><span class="girando"></span>consultando o serviço da Caixa…</div>`;
    try{
      const ultimo = await buscarNaCaixa(S.modalidade, null);
      const lote = [ultimo];
      for(let i = 1; i < quantos; i++){
        const n = ultimo.concurso - i;
        if(n < 1) break;
        try{ lote.push(await buscarNaCaixa(S.modalidade, n)); }
        catch(e){ break; }   // para no primeiro que falhar; o que veio já vale
      }
      const n = guardarResultados(lote);
      const r = aoMudarHistorico(n, "caixa");
      saida.innerHTML = `<div class="nota"><strong>${lote.length} concurso${lote.length===1?"":"s"}
        recebido${lote.length===1?"":"s"}</strong>, ${n} novo${n===1?"":"s"}.
        ${r.novas} conferência${r.novas===1?"":"s"} automática${r.novas===1?"":"s"}.</div>`;
      setTimeout(pintar, 900);
    }catch(e){
      saida.innerHTML = `<div class="nota atencao">A busca falhou: ${esc(e.message)}.
        Isto acontece sem internet, se o serviço estiver fora, ou se o formato dele
        mudou. Use a colagem abaixo — ela não depende de rede.</div>`;
    }
  };
  if($("#r-caixa")) $("#r-caixa").onclick = () => buscar(1);
  if($("#r-varios")) $("#r-varios").onclick = () => buscar(20);

  /* --- teimosinha --- */
  const criar = $("#t-criar");
  if(criar) criar.onclick = () => {
    const c = MODALIDADES[S.modalidade];
    const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
    const de = parseInt($("#t-de").value, 10), n = +$("#t-n").value;
    const saida = $("#t-saida");
    if(!Number.isFinite(de) || de < 1){
      saida.innerHTML = `<div class="nota atencao">Informe o concurso inicial.</div>`; return;
    }
    S.teimosinhas = S.teimosinhas || [];
    S.teimosinhas.push({
      id:`${Date.now().toString(36)}-t`, dezenas:dez, modalidade:S.modalidade,
      metodo:"teimosinha", data:hoje(), deConcurso:de, concursos:n,
      custo: combinacoes(dez.length, c.k) * c.preco * n, conferencias:[]
    });
    Guardar.gravar("teimosinhas", S.teimosinhas);
    conferenciaAutomatica(); pintar();
  };
  document.querySelectorAll("[data-apagar-teimosinha]").forEach(b => b.onclick = () => {
    S.teimosinhas = (S.teimosinhas||[]).filter(t => t.id !== b.dataset.apagarTeimosinha);
    Guardar.gravar("teimosinhas", S.teimosinhas); pintar();
  });

  /* --- aprendizado --- */
  const treinar = $("#ap-treinar");
  if(treinar) treinar.onclick = () => {
    const saida = $("#ap-saida");
    treinar.disabled = true;
    treinar.innerHTML = `<span class="girando"></span>treinando…`;
    /* setTimeout para o navegador pintar o estado "treinando" antes de o laço
       bloquear a linha principal. Sem isso o botão só muda depois de acabar. */
    setTimeout(()=>{
      try{
        const r = aprender(S.modalidade);
        r.assinatura = assinaturaHistorico(S.modalidade);
        r.quando = new Date().toISOString();
        r.automatica = false;
        S.aprendizado[S.modalidade] = r;
        aplicarCorrecao(S.aprendizado);
        Guardar.gravar("aprendizado", S.aprendizado);
        pintar();
      }catch(e){
        saida.innerHTML = `<div class="nota atencao">O treino falhou: ${esc(e.message)}.</div>`;
        treinar.disabled = false; treinar.textContent = "treinar e medir fora da amostra";
      }
    }, 30);
  };

  const auto = $("#ap-auto");
  if(auto) auto.onchange = e => {
    S.autoAnalise = e.target.checked;
    Guardar.gravar("autoAnalise", S.autoAnalise);
    /* Ligar já processa a fila pendente: esperar o próximo concurso deixaria
       a pessoa com a caixa marcada e nenhuma análise à vista.

       Evite aqui o vocabulário de dezena "em atraso", mesmo em comentário e
       mesmo falando de outra coisa: a trava do testar-motor.mjs procura por
       substring, sem olhar contexto. A cegueira é proposital — é a frase da
       falácia do apostador, e sai mais barato não escrevê-la nunca do que
       ensinar a trava a distinguir sentidos. */
    if(S.autoAnalise) analisarPendentes();
  };

  /* --- abrir um jogo salvo na cartela --- */
  document.querySelectorAll("[data-abrir-jogo]").forEach(b => b.onclick = () => {
    S.jogoAberto = S.jogoAberto === b.dataset.abrirJogo ? null : b.dataset.abrirJogo;
    pintar();
  });
}

function acoes(){
  acoesNovas();
  const tam = $("#g-tam");
  if(tam) tam.onchange = e => { S.tamanho = +e.target.value; REFERENCIA = {}; pintar(); };
  const qtd = $("#g-qtd");
  if(qtd) qtd.oninput = e => { S.quantidade = Math.max(1, Math.min(60, +e.target.value||1)); };

  document.querySelectorAll("[data-metodo]").forEach(el=>{
    const escolher = () => {
      if(el.dataset.metodo==="fechamento" && S.modalidade!=="lotofacil") return;
      S.metodo = el.dataset.metodo; pintar();
    };
    el.onclick = escolher;
    el.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); escolher(); } };
  });

  const go = $("#g-go");
  if(go) go.onclick = () => {
    const saida = $("#g-saida");
    const c = MODALIDADES[S.modalidade], t = tamanhoPadrao(S.modalidade);
    go.disabled = true; go.textContent = "montando…";
    setTimeout(()=>{
      try{
        let jogos, extra = "";
        if(S.metodo === "fechamento"){
          const dez = ($("#g-dez").value||"").split(/[\s,;]+/).filter(Boolean).map(Number);
          S.dezenasFechamento = dez;
          S.jFechamento = +$("#g-j").value; S.garantia = +$("#g-gar").value;
          const r = gerarFechamento(S.modalidade, dez, S.jFechamento, S.garantia);
          jogos = r.bilhetes;
          extra = `<div class="kpis" style="margin-top:12px">
            <div class="kpi"><div class="rot">garantia verificada</div>
              <div class="val">${r.garantiaVerificada}</div>
              <div class="sub">se ${S.jFechamento} das suas saírem</div></div>
            <div class="kpi"><div class="rot">custo</div>
              <div class="val" style="font-size:1.05rem">${brl(jogos.length*c.preco)}</div>
              <div class="sub">${jogos.length} jogos, volante inteiro: ${inf(combinacoes(dez.length,c.k))}</div></div>
          </div>`;
        } else {
          jogos = gerarPor(S.metodo, S.modalidade, S.quantidade, t);
        }

        S.ultimoLote = jogos.map((dez,i)=>({
          id: `${Date.now().toString(36)}-${i}`, dezenas: dez,
          modalidade: S.modalidade, metodo: S.metodo, data: hoje(),
          lote: `L${Date.now().toString(36)}`, conferencias: []
        }));
        const loteId = S.ultimoLote[0].lote;
        S.ultimoLote.forEach(j => j.lote = loteId);

        saida.innerHTML = extra + S.ultimoLote.map(j=>`
          <div class="ficha">
            <div class="topo"><span class="id">${esc(METODOS.find(m=>m.id===j.metodo).nome)}</span>
              <span class="selo">${j.dezenas.length} dezenas</span></div>
            <div class="dezenas">${j.dezenas.map(d=>`<span class="dz marcada">${pad(d)}</span>`).join("")}</div>
            ${S.metodo==="rateio" ? `<div style="margin-top:8px;font-size:.78rem;color:var(--secundaria)">
              ${esc(observacoes(j.dezenas, S.modalidade).join(" · "))}</div>` : ""}
          </div>`).join("") + `
          <button class="acao" id="g-salvar" style="margin-top:6px">Salvar ${S.ultimoLote.length} jogo${S.ultimoLote.length>1?"s":""}</button>`;

        $("#g-salvar").onclick = () => {
          S.jogos = S.jogos.concat(S.ultimoLote);
          Guardar.gravar("jogos", S.jogos);
          S.tela = "jogos"; pintar();
        };
      }catch(e){
        saida.innerHTML = `<div class="nota atencao">${esc(e.message)}</div>`;
      }
      go.disabled = false;
      go.textContent = `Gerar ${S.quantidade} jogo${S.quantidade>1?"s":""}`;
    }, 20);
  };

  if($("#b-rep")) $("#b-rep").onchange = e => { S.bancadaRep = Number(e.target.value); };
  if($("#b-qtd")) $("#b-qtd").onchange = e => { S.bancadaQtd = Number(e.target.value); };
  if($("#b-go")) $("#b-go").onclick = () => {
    const go = $("#b-go"), saida = $("#b-saida");
    const rotulo = go.textContent;
    go.disabled = true; go.textContent = "testando…";
    /* Cede o quadro antes de calcular: são milhares de combinações e o botão
       precisa ter mudado de estado na tela antes de a thread travar. */
    setTimeout(() => {
      try{
        const alvos = S.resultados.filter(r => r.modalidade === S.modalidade);
        const opcoes = {repeticoes:S.bancadaRep, quantos:S.bancadaQtd};
        /* Cada alvo é conferido com o concurso ANTERIOR como referência do
           "evita o concurso anterior" — nunca com ele próprio. */
        const partes = alvos.map((r,i) =>
          tabelaBancada(
            bancada(S.modalidade, r.dezenas,
              Object.assign({}, opcoes, {evitar: i>0 ? alvos[i-1].dezenas : null})),
            `concurso ${r.concurso} — ${r.dezenas.map(pad).join(" ")}`
              + (i>0 ? "" : " (sem concurso anterior registrado)"), true));
        /* Recorte agregado primeiro: é onde o ruído encolhe e a leitura passa
           a valer alguma coisa. Só existe com mais de um concurso. */
        if(alvos.length > 1){
          partes.unshift(tabelaBancada(
            bancadaAgregada(S.modalidade, alvos, opcoes),
            `os ${alvos.length} concursos juntos`));
        }
        saida.innerHTML = partes.join("");
      }catch(e){
        saida.innerHTML = `<div class="nota atencao">${esc(e.message)}</div>`;
      }
      go.disabled = false; go.textContent = rotulo;
    }, 20);
  };

  document.querySelectorAll("[data-apagar]").forEach(b => b.onclick = () => {
    if(!confirm("Apagar este lote de jogos?")) return;
    S.jogos = S.jogos.filter(j => j.lote !== b.dataset.apagar);
    Guardar.gravar("jogos", S.jogos); pintar();
  });
  document.querySelectorAll("[data-copiar]").forEach(b => b.onclick = async () => {
    const texto = S.jogos.filter(j=>j.lote===b.dataset.copiar)
      .map(j => j.dezenas.map(pad).join(" ")).join("\n");
    try{ await navigator.clipboard.writeText(texto); b.textContent = "copiado"; }
    catch(e){ b.textContent = "não deu para copiar"; }
    setTimeout(()=> b.textContent = "Copiar lote", 1600);
  });


  const cgo = $("#c-go");
  if(cgo) cgo.onclick = () => {
    const saida = $("#c-saida");
    const c = MODALIDADES[S.modalidade];
    const dezenas = ($("#c-dez").value||"").split(/[\s,;-]+/).filter(Boolean).map(Number);
    const concurso = $("#c-num").value.trim();
    const data = $("#c-data").value;
    if(dezenas.length !== c.k){
      saida.innerHTML = `<div class="nota atencao">A ${esc(c.nome)} sorteia ${c.k} dezenas;
        você digitou ${dezenas.length}.</div>`; return;
    }
    if(new Set(dezenas).size !== dezenas.length){
      saida.innerHTML = `<div class="nota atencao">Há dezenas repetidas no resultado.</div>`; return;
    }
    const fora = dezenas.filter(d => d < c.base || d > c.N + c.base - 1);
    if(fora.length){
      saida.innerHTML = `<div class="nota atencao">Fora do intervalo permitido: ${fora.join(", ")}.</div>`;
      return;
    }
    if(!concurso){
      saida.innerHTML = `<div class="nota atencao">Informe o número do concurso.</div>`; return;
    }

    const alvo = S.jogos.filter(j => j.modalidade === S.modalidade);
    if(!alvo.length){
      saida.innerHTML = `<div class="nota atencao">Nenhum jogo salvo desta modalidade.</div>`;
      return;
    }
    let soma = 0, somaEsperado = 0;
    alvo.forEach(j=>{
      j.conferencias = (j.conferencias||[]).filter(cf => cf.concurso !== concurso);
      const acertos = j.dezenas.filter(d => dezenas.includes(d)).length;
      j.conferencias.push({concurso, data, dezenas, acertos});
      soma += acertos; somaEsperado += esperadoAcertos(j.modalidade, j.dezenas.length);
    });
    S.resultados = S.resultados.filter(r => !(r.concurso===concurso && r.modalidade===S.modalidade));
    S.resultados.push({concurso, data, dezenas, modalidade:S.modalidade});
    Guardar.gravar("jogos", S.jogos); Guardar.gravar("resultados", S.resultados);

    const media = soma/alvo.length, esperado = somaEsperado/alvo.length;
    const dp = desvioAcertos(S.modalidade, alvo[0].dezenas.length)/Math.sqrt(alvo.length);
    const premiou = alvo.filter(j => c.faixas.includes(
      j.conferencias[j.conferencias.length-1].acertos)).length;

    saida.innerHTML = `<div class="carta">
      <h3>Concurso ${esc(concurso)} — ${alvo.length} jogo${alvo.length>1?"s":""} conferido${alvo.length>1?"s":""}</h3>
      ${/* O resultado sai na cartela, e não em chips: é o mesmo objeto que a
             pessoa marcou, agora com o sorteio impresso. Quando há um jogo só,
             a cartela mostra as duas camadas — marcação e sorteio — e o acerto
             é a sobreposição. Com vários jogos seria ambíguo de quem é a
             marcação, então aí a cartela mostra apenas o sorteio, e cada jogo
             tem a sua própria cartela em Meus jogos. */
        alvo.length === 1
          ? cartela(S.modalidade, alvo[0].dezenas,
              {sorteadas:dezenas, selo:`concurso ${concurso}`}) + legendaCartela
          : cartela(S.modalidade, [], {sorteadas:dezenas,
              selo:`concurso ${concurso}`,
              rodape:`<div class="pe"><span>resultado sorteado</span>
                <span>${alvo.length} jogos conferidos — veja cada cartela em Meus jogos</span></div>`})}
      <div class="kpis">
        <div class="kpi"><div class="rot">acertos médios</div><div class="val">${nf(media,2)}</div>
          <div class="sub">acaso: ${nf(esperado,2)}</div></div>
        <div class="kpi"><div class="rot">jogos em faixa de prêmio</div>
          <div class="val">${premiou}</div><div class="sub">de ${alvo.length}</div></div>
      </div>
      ${faixaAcaso(media, esperado, Math.max(dp,0.05))}
    </div>
    ${alvo.map(j=>ficha(j)).join("")}`;
  };

  const tema = $("#btn-tema");
  if(tema) tema.onclick = () => {
    S.tema = S.tema === "claro" ? "escuro" : "claro";
    document.documentElement.dataset.tema = S.tema;
    Guardar.gravar("tema", S.tema);
  };
}

/* ============================ navegação ============================ */
/* ============================ navegação ============================
   Duas camadas, e não uma barra com nove ícones. A barra inferior tem cinco
   seções — o limite prático antes de os alvos ficarem pequenos demais para o
   dedo — e cada seção abre suas telas num controle segmentado. Sem isso, cada
   tela nova encolheria todas as outras.

   Cada tela declara também um subtítulo: o título sozinho ("Bancada") não diz
   o que a tela faz, e a explicação ficava perdida no meio do conteúdo.      */
const SECOES = [
  {id:"gerar", nome:"gerar",
   icone:'<path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="3"/>',
   telas:[
     {id:"gerar", nome:"Automático", titulo:"Gerar jogos",
      sub:"Monta combinações válidas por método. Todos têm a mesma chance de acerto — o que muda é com quantas pessoas você dividiria."},
     {id:"montar", nome:"Manual", titulo:"Montar à mão",
      sub:"Marque as dezenas que quiser. O app mostra as características do jogo e como elas se comparam ao esperado do acaso."}
   ]},
  {id:"jogos", nome:"jogos",
   icone:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/>',
   telas:[
     {id:"jogos", nome:"Meus jogos", titulo:"Meus jogos",
      sub:"Tudo o que você salvou, conferido automaticamente contra os resultados que o app conhece."},
     {id:"teimosinha", nome:"Teimosinha", titulo:"Teimosinha",
      sub:"Repete o mesmo jogo por vários concursos seguidos. O app acompanha o custo total e confere cada concurso sozinho."}
   ]},
  {id:"conferir", nome:"conferir", icone:'<path d="M4 12l5 5L20 6"/>',
   telas:[
     {id:"conferir", nome:"Conferir", titulo:"Conferir",
      sub:"Informe o resultado de um concurso e o app confere todos os seus jogos daquela modalidade."},
     {id:"resultados", nome:"Resultados", titulo:"Histórico de resultados",
      sub:"Os concursos que o app conhece. É esta base que alimenta a análise, a bancada e o aprendizado."}
   ]},
  {id:"analise", nome:"análise",
   icone:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
   telas:[
     {id:"placar", nome:"Placar", titulo:"Placar",
      sub:"Seu resultado acumulado, comparado com o que o acaso teria feito com o mesmo dinheiro."},
     {id:"bancada", nome:"Bancada", titulo:"Bancada de testes",
      sub:"Roda todos os métodos contra o mesmo sorteio e mede se algum se distingue do acaso."},
     {id:"aprendizado", nome:"Aprendizado", titulo:"Aprendizado por modalidade",
      sub:"Treina um modelo em cada modalidade separadamente e mede, fora da amostra, se ele aprendeu algo."}
   ]},
  {id:"entender", nome:"entender",
   icone:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
   telas:[
     {id:"entender", nome:"Entender", titulo:"Entender",
      sub:"O que este app faz, o que ele não faz, e por quê."}
   ]}
];

const secaoAtual = () => SECOES.find(s => s.telas.some(t => t.id === S.tela)) || SECOES[0];
const telaAtual = () => secaoAtual().telas.find(t => t.id === S.tela) || secaoAtual().telas[0];

function navegacao(){
  const sec = secaoAtual();
  $("#abas").innerHTML = SECOES.map(s=>`
    <button data-secao="${s.id}" ${s.id===sec.id?'aria-current="page"':""}>
      <svg viewBox="0 0 24 24">${s.icone}</svg>${esc(s.nome)}</button>`).join("");
  document.querySelectorAll("[data-secao]").forEach(b => b.onclick = () => {
    const s = SECOES.find(x => x.id === b.dataset.secao);
    /* Entrar numa seção leva à primeira tela dela, salvo quando já se está
       nela — aí o clique é um "voltar ao topo", não uma troca de tela. */
    if(s.id !== sec.id) S.tela = s.telas[0].id;
    window.scrollTo(0,0); pintar();
  });
}

function trilhaModalidade(){
  $("#trilha-mod").innerHTML = Object.entries(MODALIDADES).map(([k,v])=>
    `<button data-mod="${k}" aria-pressed="${k===S.modalidade}">${esc(v.nome)}</button>`).join("");
  document.querySelectorAll("[data-mod]").forEach(b => b.onclick = () => {
    if(b.dataset.mod === S.modalidade) return;
    S.modalidade = b.dataset.mod; S.tamanho = null; REFERENCIA = {};
    Guardar.gravar("modalidade", S.modalidade);
    pintar();
  });
}

function pintar(){
  const sec = secaoAtual(), tela = telaAtual();
  const segmento = sec.telas.length < 2 ? "" :
    `<div class="segmento" role="tablist">${sec.telas.map(t=>
      `<button role="tab" data-tela="${t.id}" aria-selected="${t.id===tela.id}">
        ${esc(t.nome)}</button>`).join("")}</div>`;
  $("#tela").innerHTML = segmento +
    `<div class="titulo"><h1>${esc(tela.titulo)}</h1><p>${esc(tela.sub)}</p></div>` +
    T[tela.id]() +
    `<div class="aviso-fixo">Nenhum método aumenta a chance de acertar.<br>
     Loteria é gasto de entretenimento, não investimento.</div>`;
  document.querySelectorAll("[data-tela]").forEach(b => b.onclick = () => {
    S.tela = b.dataset.tela; window.scrollTo(0,0); pintar();
  });
  navegacao();
  trilhaModalidade();
  pintarContaAvisos();
  acoes();
}

async function carregarCalibracao(){
  try{
    const r = await fetch("pesos.json", {cache:"no-cache"});
    if(!r.ok) return;
    const c = await r.json();
    if(c && c.pesos_app) CALIBRACAO = c;
  }catch(e){ /* sem arquivo: seguem as hipóteses declaradas */ }
}

(function iniciar(){
  S.jogos = Guardar.ler("jogos", []);
  S.resultados = Guardar.ler("resultados", []);
  S.tema = Guardar.ler("tema", "claro");
  S.avisos = Guardar.ler("avisos", []);
  S.teimosinhas = Guardar.ler("teimosinhas", []);
  S.marcadas = Guardar.ler("marcadas", {});
  S.aprendizado = Guardar.ler("aprendizado", {});
  S.autoAnalise = Guardar.ler("autoAnalise", true);
  S.modalidade = Guardar.ler("modalidade", S.modalidade);
  document.documentElement.dataset.tema = S.tema;
  /* Conferir na abertura: quem digitou um resultado e fechou o app antes de
     conferir os jogos encontra tudo conferido ao voltar. */
  conferenciaAutomatica();
  pintar();
  /* Análises pendentes na abertura. Sem isto, quem já tinha histórico ficaria
     esperando o próximo concurso para ver a primeira análise — e quem fechou o
     app no meio de uma análise nunca a veria terminar. Roda depois do pintar()
     para a tela aparecer primeiro; o processamento é fatiado e não trava. */
  if(S.autoAnalise !== false) analisarPendentes();

  /* Sino e folha de avisos. Ficam fora de pintar() porque vivem no cabeçalho,
     que não é redesenhado a cada troca de tela. */
  const folha = $("#folha-avisos");
  $("#btn-avisos").onclick = () => {
    pintarAvisos();
    folha.dataset.aberta = "1";
  };
  folha.addEventListener("click", e => {
    if(!e.target.closest("[data-fechar]")) return;
    folha.dataset.aberta = "0";
    /* Fechar marca como lido: o aviso já foi mostrado, e manter o contador
       aceso depois disso treinaria a pessoa a ignorá-lo. */
    S.avisos.forEach(a => a.lido = true);
    Guardar.gravar("avisos", S.avisos);
    pintarContaAvisos();
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && folha.dataset.aberta === "1")
      folha.querySelector("[data-fechar]").click();
  });
  carregarCalibracao().then(()=>{ if(CALIBRACAO && S.tela==="gerar") pintar(); });
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
