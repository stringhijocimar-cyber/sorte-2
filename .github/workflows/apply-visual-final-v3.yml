name: Apply Visual Final V3

on:
  push:
    branches:
      - agent/visual-final-v3
    paths:
      - 'ui/**'
      - 'ferramentas/aplicar-visual-final-v3.mjs'
      - '.github/workflows/apply-visual-final-v3.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4
        with:
          ref: agent/visual-final-v3
          fetch-depth: 0

      - name: Apply visual final
        run: node ferramentas/aplicar-visual-final-v3.mjs

      - name: Verify visual assets
        run: |
          test -f ui/sorte2-ui-final.css
          test -f ui/sorte2-ui-final.js
          test -f ui/brain-network.svg
          test -f www/ui/sorte2-ui-final.css
          test -f www/ui/sorte2-ui-final.js
          test -f www/ui/brain-network.svg
          grep -q 'data-sorte2-visual-final="3.0.0"' index.html
          cmp -s index.html www/index.html
          grep -q 'const VERSAO = "6";' sw.js

      - name: Run existing interface tests
        run: |
          if [ -f ferramentas/testar-interface.mjs ]; then
            python3 -m http.server 8123 >/tmp/sorte2-http.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            sleep 1
            node ferramentas/testar-interface.mjs
          fi

      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html www/index.html sw.js www/sw.js www/ui android/app/src/main/res/values/colors.xml
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'feat(ui): integrate visual final v3 into app shell'
            git push origin HEAD:agent/visual-final-v3
          fi
