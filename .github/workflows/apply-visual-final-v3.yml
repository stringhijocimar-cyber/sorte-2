name: Apply LotoLab Mockup Fidelity V4

on:
  push:
    branches:
      - agent/mockup-fidelity-v4
    paths:
      - 'ui/**'
      - 'ferramentas/aplicar-visual-final-v3.mjs'
      - '.github/workflows/apply-visual-final-v3.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotolab-mockup-fidelity-v4
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fidelity branch
        uses: actions/checkout@v4
        with:
          ref: agent/mockup-fidelity-v4
          fetch-depth: 0

      - name: Apply visual fidelity
        run: node ferramentas/aplicar-visual-final-v3.mjs

      - name: Verify LotoLab identity and deterministic CSS integration
        run: |
          test -f ui/sorte2-ui-final.css
          test -f ui/brain-network.svg
          test -f www/ui/sorte2-ui-final.css
          test -f www/ui/brain-network.svg
          grep -q 'data-sorte2-visual-final="4.0.0"' index.html
          grep -q '<b>LotoLab</b><span>Laboratório Estatístico</span>' index.html
          ! grep -q '<b>Sorte 2</b><span>Laboratório Estatístico</span>' index.html
          ! grep -q '<script src="ui/sorte2-ui-final.js' index.html
          grep -q '<title>LotoLab — Laboratório Estatístico</title>' index.html
          cmp -s index.html www/index.html
          cmp -s sw.js www/sw.js
          cmp -s ui/sorte2-ui-final.css www/ui/sorte2-ui-final.css
          grep -q 'const VERSAO = "7";' sw.js

      - name: Run motor tests
        run: node ferramentas/testar-motor.mjs

      - name: Run interface tests
        run: |
          python3 -m http.server 8123 >/tmp/lotolab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node ferramentas/testar-interface.mjs

      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'feat(ui): integrate LotoLab mockup fidelity v4'
            git pull --rebase origin agent/mockup-fidelity-v4
            git push origin HEAD:agent/mockup-fidelity-v4
          fi
