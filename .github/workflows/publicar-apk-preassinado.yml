# Publica somente binários já assinados e conferidos, sem transportar a chave.
name: Publicar APK com assinatura permanente conferida

on:
  pull_request:
    paths:
      - distribuicao/**
      - .github/workflows/publicar-apk-preassinado.yml
      - ferramentas/assinar-apk-local.py
      - ferramentas/conferir-apk.py
      - ferramentas/conferir-assinatura.sh
  push:
    branches: [main]
    paths:
      - distribuicao/**
      - .github/workflows/publicar-apk-preassinado.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotolab-publicacao-assinada
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.numero }}
      pronta: ${{ steps.versao.outputs.pronta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Conferir assinatura, identidade e fontes dos dois APKs
        id: versao
        run: |
          versao=$(cat VERSION)
          [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "numero=$versao" >> "$GITHUB_OUTPUT"
          pasta=distribuicao/$versao
          if [ ! -d "$pasta" ]; then
            echo "pronta=false" >> "$GITHUB_OUTPUT"
            echo 'Nenhum APK pré-assinado nesta revisão; a publicação seguirá pelo fluxo protegido após os testes da main.'
            exit 0
          fi
          echo "pronta=true" >> "$GITHUB_OUTPUT"
          export LOTOLAB_SIGNING_SHA256=$(cat android/assinatura.sha256)
          (cd "$pasta" && sha256sum --check "LotoLab-$versao.sha256")
          bash ferramentas/conferir-assinatura.sh "$pasta/LotoLab-$versao.apk" final
          bash ferramentas/conferir-assinatura.sh "$pasta/LotoLab-$versao-transferencia.apk" transferencia
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('assinatura_local', 'ferramentas/assinar-apk-local.py')
          modulo = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(modulo)
          versao = Path('VERSION').read_text().strip()
          for sufixo in ('', '-transferencia'):
              modulo.conferir_fontes(Path(f'distribuicao/{versao}/LotoLab-{versao}{sufixo}.apk'))
          PY
  publicar:
    needs: conferir
    if: needs.conferir.outputs.pronta == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar a versão conferida sem substituir releases existentes
        env:
          GH_TOKEN: ${{ github.token }}
          LOTOLAB_VERSAO: ${{ needs.conferir.outputs.versao }}
        run: |
          if gh release view "v$LOTOLAB_VERSAO" >/dev/null 2>&1; then
            echo 'Esta versão já está publicada; os arquivos serão preservados.'
            exit 0
          fi
          pasta=distribuicao/$LOTOLAB_VERSAO
          gh release create "v$LOTOLAB_VERSAO" \
            "$pasta/LotoLab-$LOTOLAB_VERSAO.apk" \
            "$pasta/LotoLab-$LOTOLAB_VERSAO-transferencia.apk" \
            "$pasta/LotoLab-$LOTOLAB_VERSAO.sha256" \
            --target "$GITHUB_SHA" --latest --title "LotoLab $LOTOLAB_VERSAO" \
            --notes-file "docs/release-$LOTOLAB_VERSAO.md"
