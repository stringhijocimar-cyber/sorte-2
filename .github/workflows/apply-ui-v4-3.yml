name: Apply LotoLab UI V4.3

on:
  push:
    branches:
      - agent/ui-v4-3-approved-mockup
    paths:
      - 'ui/lotolab-ui-v4-3.css'
      - 'ferramentas/aplicar-ui-v4-3.mjs'
      - '.github/workflows/apply-ui-v4-3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotolab-ui-v4-3
  cancel-in-progress: true

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4.3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-v4-3-approved-mockup
          fetch-depth: 0

      - name: Apply approved mockup layer
        run: node ferramentas/aplicar-ui-v4-3.mjs

      - name: Verify integration
        run: |
          test -f ui/lotolab-ui-v4-3.css
          test -f www/ui/lotolab-ui-v4-3.css
          grep -q 'data-lotolab-ui="4.3.0"' index.html
          grep -q 'lotolab-ui-v4-3.css?v=4.3.0' index.html
          grep -q 'lotolab-ui-v4-3.css' sw.js
          grep -q 'APPROVED MOCKUP V4.3' ui/lotolab-ui-v4-3.css
          grep -q '.concurso.ganhou' ui/lotolab-ui-v4-3.css
          grep -q '.concurso.acumulou' ui/lotolab-ui-v4-3.css
          grep -q 'data-mod="lotofacil"' ui/lotolab-ui-v4-3.css
          cmp -s index.html www/index.html
          cmp -s sw.js www/sw.js
          cmp -s ui/lotolab-ui-v4-3.css www/ui/lotolab-ui-v4-3.css

      - name: Run motor tests
        run: node ferramentas/testar-motor.mjs

      - name: Run interface tests
        run: |
          python3 -m http.server 8123 >/tmp/lotolab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/index.html >/dev/null && break
            sleep 0.5
          done
          node ferramentas/testar-interface.mjs

      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html www/index.html sw.js www/sw.js www/ui/lotolab-ui-v4-3.css
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'feat(ui): integrate approved LotoLab visual v4.3'
            git push origin HEAD:agent/ui-v4-3-approved-mockup
          fi
