name: Apply LotoLab UI Polish V4.1

on:
  push:
    branches:
      - agent/ui-polish-v4-1
    paths:
      - 'ui/lotolab-ui-polish-v4-1.css'
      - 'ferramentas/aplicar-ui-polish-v4-1.mjs'
      - 'ferramentas/corrigir-teste-data.mjs'
      - '.github/workflows/ui-polish-v4-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ui/lotolab-ui-polish-v4-1.css'
      - 'ferramentas/aplicar-ui-polish-v4-1.mjs'
      - 'ferramentas/corrigir-teste-data.mjs'
      - '.github/workflows/ui-polish-v4-1.yml'
      - 'index.html'
      - 'www/index.html'
      - 'sw.js'
      - 'www/sw.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotolab-ui-polish-v4-1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-polish-v4-1
          fetch-depth: 0

      - name: Stabilize date-sensitive test
        run: node ferramentas/corrigir-teste-data.mjs

      - name: Apply UI polish
        run: node ferramentas/aplicar-ui-polish-v4-1.mjs

      - name: Verify deterministic integration
        run: |
          test -f ui/lotolab-ui-polish-v4-1.css
          test -f www/ui/lotolab-ui-polish-v4-1.css
          grep -q 'data-lotolab-ui-polish="4.1.0"' index.html
          grep -q 'ui/lotolab-ui-polish-v4-1.css?v=4.1.0' index.html
          grep -q 'lotolab-ui-polish-v4-1.css' sw.js
          grep -q 'min-width:40px!important' ui/lotolab-ui-polish-v4-1.css
          cmp -s index.html www/index.html
          cmp -s sw.js www/sw.js
          cmp -s ui/lotolab-ui-polish-v4-1.css www/ui/lotolab-ui-polish-v4-1.css

      - name: Run motor tests
        run: node ferramentas/testar-motor.mjs

      - name: Run interface tests
        run: |
          python3 -m http.server 8123 >/tmp/lotolab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/index.html >/dev/null && break
            sleep 0.5
          done
          node ferramentas/testar-interface.mjs

      - name: Commit generated integration
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html www/index.html sw.js www/sw.js ui/lotolab-ui-polish-v4-1.css www/ui/lotolab-ui-polish-v4-1.css ferramentas/testar-motor.mjs
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'feat(ui): integrate LotoLab UI polish v4.1'
            git pull --rebase origin agent/ui-polish-v4-1
            git push origin HEAD:agent/ui-polish-v4-1
          fi
