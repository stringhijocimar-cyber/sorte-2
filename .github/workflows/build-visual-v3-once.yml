name: Build LotoLab Visual V3 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-visual-v3-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate synchronized web shell
        run: |
          cmp index.html www/index.html
          cmp sw.js www/sw.js
          grep -q '<title>LotoLab — Laboratório Estatístico</title>' index.html
          grep -q 'data-sorte2-visual-final="3.0.0"' index.html
          ! grep -q '<script src="ui/sorte2-ui-final.js' index.html
          test -f www/ui/sorte2-ui-final.css
          test -f www/ui/brain-network.svg

      - name: Run motor tests
        run: node ferramentas/testar-motor.mjs

      - name: Validate Android XML
        run: python3 ferramentas/conferir-xml-android.py

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon

      - name: Verify packaged app and rename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LotoLab-Visual-V3.apk
          esperado=$(wc -c < index.html)
          dentro=$(unzip -p LotoLab-Visual-V3.apk assets/public/index.html | wc -c)
          echo "index.html repo: $esperado bytes"
          echo "index.html APK : $dentro bytes"
          test "$esperado" = "$dentro"
          unzip -l LotoLab-Visual-V3.apk | grep -q 'assets/public/ui/sorte2-ui-final.css'
          unzip -l LotoLab-Visual-V3.apk | grep -q 'assets/public/ui/brain-network.svg'
          sha256sum LotoLab-Visual-V3.apk > LotoLab-Visual-V3.sha256.txt

      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v38-visual-final' \
            LotoLab-Visual-V3.apk \
            LotoLab-Visual-V3.sha256.txt \
            --title 'LotoLab Visual Final V3' \
            --notes 'APK de depuração do LotoLab Visual Final V3, compilado do main após validação do motor e verificação dos assets visuais dentro do APK.'
