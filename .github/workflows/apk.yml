# Compila o APK e publica numa release para download direto.
#
# Por que aqui: o runner do GitHub já vem com Android SDK instalado, então não
# é preciso instalar nada nem ter máquina configurada. O APK sai assinado com a
# chave de depuração — serve para instalar no celular, não para a Play Store,
# que exige a keystore do dono e essa não fica em repositório.

name: Compilar APK

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Nome da versão (vira a tag da release, ex.: 6)"
        required: true
        default: "6"

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conferir que www/ está sincronizado com a raiz
        # O erro clássico deste projeto: editar index.html e esquecer de copiar
        # para www/, gerando um APK sem as mudanças. Falhar aqui é melhor que
        # entregar um APK velho parecendo novo.
        run: |
          cmp index.html www/index.html
          # O executor em segundo plano viaja no APK pela pasta www/. Um APK
          # com o executor antigo confere com regra antiga e avisa errado no
          # aparelho, sem nada vermelho na compilação.
          diff -r runner www/runner

      - name: Rodar a bateria antes de compilar
        run: node ferramentas/testar-motor.mjs

      - name: O XML do projeto Android é bem-formado
        # Vale repetir aqui o que "Testes" já confere: quando falha, o Gradle
        # gasta quarenta segundos para dizer a mesma coisa enterrada em duzentas
        # linhas de stack trace de Java. Foi assim que a v26 morreu.
        run: python3 ferramentas/conferir-xml-android.py

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar o projeto Android
        run: npx cap sync android

      - name: Compilar
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon

      - name: Renomear com a versão
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "LotoLab-v${{ inputs.versao }}.apk"
          ls -la "LotoLab-v${{ inputs.versao }}.apk"

      - name: Conferir que o APK tem a versão certa do app
        # Sem isto, um APK compilado de cache antigo passaria por novo.
        run: |
          esperado=$(wc -c < index.html)
          dentro=$(unzip -p "LotoLab-v${{ inputs.versao }}.apk" assets/public/index.html | wc -c)
          echo "index.html no repositório: $esperado bytes"
          echo "index.html dentro do APK : $dentro bytes"
          test "$esperado" = "$dentro"

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target no COMMIT que foi compilado, e não no branch padrão.
          #
          # Sem isto, `gh release create` cria a tag apontando para o branch
          # padrão do repositório quando a tag ainda não existe. Numa build
          # disparada de outro branch, o resultado é uma release cujo APK veio
          # de um código e cujo código-fonte anexado é outro — foi exatamente o
          # que aconteceu com a primeira v4.2.0-stat: o binário era a edição
          # estatística e a tag apontava para o main, a edição completa.
          #
          # Quem baixa o zip da release e quem baixa o .apk levava coisas
          # diferentes, sem nada na página avisando.
          #
          # O nome sai do appName do capacitor.config.json em vez de ser fixo,
          # porque cada edição tem o seu: assim a release nasce chamando o que
          # ela é, sem depender de alguém lembrar de renomear depois.
          nome=$(node -p "require('./capacitor.config.json').appName")
          # A versão do PRODUTO vem do arquivo VERSION. O parâmetro `versao`
          # serve à tag e ao nome do arquivo, onde o sufixo de edição precisa
          # aparecer para não colidir — mas "LotoLab Estatístico 4.2.0-stat"
          # não é o nome de nada: a edição já está no nome do app.
          versaoDoProduto=$(cat VERSION)
          # Repetível: se a tag já existe de uma tentativa anterior, ela é
          # removida antes. Release meio publicada é pior que nenhuma.
          gh release delete "v${{ inputs.versao }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${{ inputs.versao }}" \
            "LotoLab-v${{ inputs.versao }}.apk" \
            --target "$GITHUB_SHA" \
            --title "$nome $versaoDoProduto" \
            --notes "APK de depuração, para instalar no celular.

          Baixe o arquivo .apk abaixo e toque nele. O Android vai pedir para
          permitir instalação de fontes desconhecidas.

          IMPORTANTE: desinstale a versão anterior do LotoLab antes. A
          assinatura é diferente e o Android recusa instalar por cima — os
          jogos salvos na versão antiga se perdem nessa troca.

          Este app NÃO prevê resultados e NÃO aumenta a chance de acerto.
          Sorteios honestos são eventos independentes."
