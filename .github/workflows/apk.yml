# Apenas APKs assinados com a chave permanente podem virar releases.
name: Publicar APK assinado

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão do arquivo VERSION (deixe vazio para usar a atual)"
        required: false
        default: ""
      incluir_migracao:
        description: "Incluir APK de transferência para recuperar instalações com assinatura antiga"
        type: boolean
        default: true
  workflow_call:
    inputs:
      incluir_migracao:
        type: boolean
        default: true
    secrets:
      LOTOLAB_KEYSTORE_BASE64:
        required: false
      LOTOLAB_STORE_PASSWORD:
        required: false
      LOTOLAB_KEY_ALIAS:
        required: false
      LOTOLAB_KEY_PASSWORD:
        required: false
      LOTOLAB_SIGNING_SHA256:
        required: false

permissions:
  contents: write

concurrency:
  group: lotolab-publicacao-assinada
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir versão e preservar releases existentes
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO_PEDIDA: ${{ inputs.versao }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          versao=$(cat VERSION)
          [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -z "$VERSAO_PEDIDA" || test "$VERSAO_PEDIDA" = "$versao"
          echo "numero=$versao" >> "$GITHUB_OUTPUT"
          if gh release view "v$versao" >/dev/null 2>&1; then
            echo 'Esta versão já está publicada; os arquivos serão preservados.'
            echo 'publicar=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publicar=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.versao.outputs.publicar == 'true'
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.versao.outputs.publicar == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar a assinatura permanente
        if: steps.versao.outputs.publicar == 'true'
        env:
          LOTOLAB_KEYSTORE_BASE64: ${{ secrets.LOTOLAB_KEYSTORE_BASE64 }}
          LOTOLAB_STORE_PASSWORD: ${{ secrets.LOTOLAB_STORE_PASSWORD }}
          LOTOLAB_KEY_ALIAS: ${{ secrets.LOTOLAB_KEY_ALIAS }}
          LOTOLAB_KEY_PASSWORD: ${{ secrets.LOTOLAB_KEY_PASSWORD }}
          LOTOLAB_SIGNING_SHA256: ${{ secrets.LOTOLAB_SIGNING_SHA256 }}
        run: python3 ferramentas/preparar-assinatura.py
      - name: Conferir os arquivos e preparar Android
        if: steps.versao.outputs.publicar == 'true'
        run: |
          cmp index.html www/index.html
          cmp sw.js www/sw.js
          diff -r ui www/ui
          diff -r runner www/runner
          node ferramentas/testar-motor.mjs
          python3 ferramentas/conferir-xml-android.py
          npm ci
          npx cap sync android
      - name: Compilar e conferir o APK final
        if: steps.versao.outputs.publicar == 'true'
        env:
          LOTOLAB_SIGNING_SHA256: ${{ secrets.LOTOLAB_SIGNING_SHA256 }}
          LOTOLAB_VERSAO: ${{ steps.versao.outputs.numero }}
        run: |
          (cd android && ./gradlew testDebugUnitTest assembleRelease --no-daemon)
          apk=android/app/build/outputs/apk/release/app-release.apk
          bash ferramentas/conferir-assinatura.sh "$apk" final
          python3 ferramentas/conferir-apk.py "$apk"
          unzip -p "$apk" assets/public/index.html > /tmp/index-apk.html
          cmp index.html /tmp/index-apk.html
          cp "$apk" "LotoLab-$LOTOLAB_VERSAO.apk"
      - name: Preparar o APK para a transferência única de dados
        if: steps.versao.outputs.publicar == 'true' && inputs.incluir_migracao
        env:
          LOTOLAB_SIGNING_SHA256: ${{ secrets.LOTOLAB_SIGNING_SHA256 }}
          LOTOLAB_VERSAO: ${{ steps.versao.outputs.numero }}
        run: |
          (cd android && ./gradlew assembleRelease -PlotolabMigracao --no-daemon)
          apk=android/app/build/outputs/apk/release/app-release.apk
          bash ferramentas/conferir-assinatura.sh "$apk" transferencia
          python3 ferramentas/conferir-apk.py "$apk"
          cp "$apk" "LotoLab-$LOTOLAB_VERSAO-transferencia.apk"
      - name: Publicar os arquivos verificados
        if: steps.versao.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOTOLAB_VERSAO: ${{ steps.versao.outputs.numero }}
        run: |
          sha256sum LotoLab-*.apk > "LotoLab-$LOTOLAB_VERSAO.sha256"
          gh release create "v$LOTOLAB_VERSAO" LotoLab-*.apk "LotoLab-$LOTOLAB_VERSAO.sha256"             --target "$GITHUB_SHA" --latest --title "LotoLab $LOTOLAB_VERSAO"             --notes-file "docs/release-$LOTOLAB_VERSAO.md"
      - name: Apagar os arquivos privados de assinatura do runner
        if: always()
        run: rm -f android/chave.properties android/lotolab-release.jks
