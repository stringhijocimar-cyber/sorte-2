name: Apply LotoLab UI Polish V4.2

on:
  push:
    branches:
      - agent/ui-polish-v4-2
    paths:
      - 'ui/lotolab-ui-polish-v4-2.css'
      - 'ferramentas/aplicar-ui-polish-v4-2.mjs'
      - '.github/workflows/ui-polish-v4-2.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lotolab-ui-polish-v4-2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4.2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-polish-v4-2
          fetch-depth: 0

      - name: Apply V4.2 polish
        run: node ferramentas/aplicar-ui-polish-v4-2.mjs

      - name: Verify visual integration
        run: |
          test -f ui/lotolab-ui-polish-v4-2.css
          test -f www/ui/lotolab-ui-polish-v4-2.css
          grep -q 'data-lotolab-ui-polish="4.2.0"' index.html
          grep -q 'lotolab-ui-polish-v4-2.css?v=4.2.0' index.html
          grep -q 'lotolab-ui-polish-v4-2.css' sw.js
          grep -q 'body:has(\[data-mod="lotofacil"\]\[aria-pressed="true"\])' ui/lotolab-ui-polish-v4-2.css
          grep -q '.concurso.ganhou' ui/lotolab-ui-polish-v4-2.css
          grep -q '.concurso.acumulou' ui/lotolab-ui-polish-v4-2.css
          cmp -s index.html www/index.html
          cmp -s sw.js www/sw.js
          cmp -s ui/lotolab-ui-polish-v4-2.css www/ui/lotolab-ui-polish-v4-2.css

      - name: Run motor tests
        run: node ferramentas/testar-motor.mjs

      - name: Run interface tests
        run: |
          python3 -m http.server 8123 >/tmp/lotolab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/index.html >/dev/null && break
            sleep 0.5
          done
          node ferramentas/testar-interface.mjs

      - name: Commit generated integration
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html www/index.html sw.js www/sw.js www/ui/lotolab-ui-polish-v4-2.css
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'feat(ui): integrate LotoLab UI polish v4.2'
            git push origin HEAD:agent/ui-polish-v4-2
          fi
