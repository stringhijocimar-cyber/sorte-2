# Atualiza os resultados das loterias todo dia.
#
# Por que aqui e não no aplicativo: um runner do GitHub é um servidor. Não há
# CORS, não há bloqueio de origem e não há dependência de proxy de terceiro —
# os três motivos pelos quais a busca falhava dentro do navegador.
#
# O app depois lê dados/*.json por raw.githubusercontent.com, que serve com
# CORS liberado e disponibilidade de CDN. Quem usa o app nunca precisa colar
# nada, e nunca depende de um espelho público estar de pé.

name: Atualizar resultados

on:
  schedule:
    # 04:00 e 12:00 UTC = 01:00 e 09:00 em Brasília. Os sorteios da Caixa
    # ocorrem à noite, então a primeira execução já pega o resultado do dia
    # anterior; a segunda é a rede de segurança para quando a primeira falha.
    - cron: "0 4,12 * * *"
  workflow_dispatch:
    inputs:
      tudo:
        description: "Backfill completo dos concursos que faltam (mais lento)"
        type: boolean
        default: false
      completar:
        description: "Preencher ganhadores nos concursos que entraram sem rateio"
        type: boolean
        default: false
      completar_teto:
        description: "Quantos concursos completar por modalidade nesta execução"
        default: "120"

# Precisa escrever no repositório para commitar os JSONs.
permissions:
  contents: write

concurrency:
  # Duas execuções ao mesmo tempo commitariam por cima uma da outra.
  group: resultados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar resultados
        # --completar entra também na execução diária, com orçamento pequeno:
        # o histórico foi semeado sem rateio, e sem isto a tela diria
        # "ganhadores não informados" para sempre. Vinte por modalidade por dia
        # fecham o buraco sozinhas, sem castigar o serviço da Caixa.
        run: |
          args=""
          [ "${{ inputs.tudo }}" = "true" ] && args="$args --tudo"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args="$args --completar --completar-teto=20"
          elif [ "${{ inputs.completar }}" = "true" ]; then
            args="$args --completar --completar-teto=${{ inputs.completar_teto }}"
          fi
          echo "rodando com:$args"
          node ferramentas/atualizar-resultados.mjs $args

      - name: Conferir o motor antes de publicar
        # Se o app estiver quebrado, publicar dado novo não ajuda ninguém —
        # e esconde a quebra atrás de um commit automático.
        run: node ferramentas/testar-motor.mjs

      - name: Commitar o que mudou
        run: |
          if [ -z "$(git status --porcelain dados/)" ]; then
            echo "nada mudou"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          # Mensagem simples de propósito: a versão anterior montava o corpo do
          # commit com $(node -e '...') dentro de heredoc, e o aninhamento de
          # aspas quebrava o passo — que era o único a falhar num job que fazia
          # todo o resto certo.
          git commit -m "Resultados atualizados automaticamente"
          git push
