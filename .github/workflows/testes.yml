# Roda a bateria de testes a cada push e a cada pull request.
#
# Por que existe: até agora os testes só rodavam dentro de "Compilar APK", que
# é manual. O resultado foi que um teste instável só apareceu na hora de gerar
# a v10 — a compilação falhou, e a única pista era um log de release. Testar no
# push transforma isso num aviso de trinta segundos, no lugar certo.
#
# O APK de revisão só é compilado após os testes aprovarem o código.

name: Testes

on:
  push:
    branches: ["**"]
  pull_request:

# Um push novo cancela a execução anterior do mesmo galho: o interessante é o
# resultado do último commit, não a fila inteira.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Conferir que www/ está sincronizado com a raiz
        # O erro clássico deste projeto: editar index.html e esquecer de copiar
        # para www/. Os testes passam (rodam sobre a raiz) e o APK sai sem a
        # mudança — o usuário instala e conclui, com razão, que nada mudou.
        #
        # A pasta ui/ entrou nesta conferência depois de divergir de verdade:
        # a auditoria da 4.2.0 achou lotolab-ui-polish-v4-2.css com conteúdo
        # diferente dos dois lados. As regras eram equivalentes e o visual não
        # quebrou, mas era sorte — quem edita um lado e esquece o outro só
        # descobre quando o APK sai com a folha antiga. cmp cobria só o
        # index.html e deixava toda a camada visual de fora.
        run: |
          cmp index.html www/index.html
          cmp sw.js www/sw.js
          cmp manifest.webmanifest www/manifest.webmanifest
          diff -r ui www/ui
          # O executor em segundo plano entra no APK pela pasta www/. Editar
          # só a raiz produziria um APK que confere com regra antiga — e o
          # sintoma seria aviso errado no aparelho, sem nada vermelho aqui.
          diff -r runner www/runner

      - name: Versão e regressões da revisão funcional
        run: |
          npm run check:version
          npm run check:distribution
          npm run test:revisao
          npm run test:diagnostico

      - name: Testes do motor
        run: node ferramentas/testar-motor.mjs

      - name: Testes da inteligência de sugestões
        run: |
          node ferramentas/testar-inteligencia.mjs
          node ferramentas/testar-analitica.mjs
          node ferramentas/testar-recorrencia.mjs
          node --test ferramentas/testar-laboratorio.mjs
          node --test ferramentas/testar-recomendacao.mjs
          node --test ferramentas/testar-automatico.mjs
          node --test ferramentas/testar-backup.mjs

      - name: Metas, orçamento, cobertura e conferência colorida
        run: |
          node ferramentas/testar-metas.mjs
          node ferramentas/testar-complementos.mjs
          node ferramentas/testar-acompanhamento.mjs

      - name: Guarda de atraso do atualizador
        # O cron de resultados rodava todo dia, dava verde e commitava — com os
        # dados parados há dois dias. Este teste cobra o guarda que passou a
        # medir o resultado (os dados avançaram?) em vez do percurso (a busca
        # terminou?). Roda sem rede: um teste que depende da Caixa estar de pé
        # mede a Caixa, não o código.
        run: node ferramentas/testar-atualizador.mjs

      - name: O XML do projeto Android é bem-formado
        # A v26 quebrou com tudo verde: um "--" dentro de comentário em
        # colors.xml, que só o Gradle viu, no meio de uma compilação de release.
        # Nenhum teste olhava para o projeto nativo. Agora olha, em milissegundos.
        run: python3 ferramentas/conferir-xml-android.py

      - name: Testes de assinatura permanente e proteção dos backups
        run: python3 ferramentas/testar-assinatura.py

      - name: Os testes são reprodutíveis
        # Toda medida estatística desta suíte roda com gerador semeado. Se duas
        # execuções seguidas discordarem, algum teste voltou a depender do
        # acaso — e um teste que falha por acaso ensina a ignorar falha.
        #
        # Os tempos medidos são apagados antes de comparar: "166 ms" contra
        # "205 ms" é a máquina respirando, não o motor mudando de resposta.
        run: |
          semTempos() { sed -E 's/[0-9]+([.,][0-9]+)? ms/<tempo>/g' "$1"; }
          node ferramentas/testar-motor.mjs > /tmp/execucao-1.txt
          node ferramentas/testar-motor.mjs > /tmp/execucao-2.txt
          diff <(semTempos /tmp/execucao-1.txt) <(semTempos /tmp/execucao-2.txt) \
            || { echo "::error::duas execuções deram resultados diferentes"; exit 1; }

      - name: Instalar Pillow (conferência dos ícones)
        run: pip install --quiet pillow

      - name: Conferir os ícones
        # Não compara com uma renderização nova — o Chromium não garante saída
        # idêntica entre versões. Confere o que quebra de verdade no aparelho:
        # camada da frente transparente (senão o ícone monocromático do Android
        # 13 vira um quadrado chapado) e desenho dentro do recorte garantido.
        run: python3 ferramentas/conferir-icones.py

      - name: A referência dourada foi gerada pela ferramenta, e não à mão
        timeout-minutes: 2
        # Regravar douradas.json é uma decisão consciente de mudar números na
        # tela. Este passo não impede a mudança — só garante que o arquivo
        # continue sendo o que a ferramenta produz a partir do código atual.
        run: |
          node ferramentas/gerar-douradas.mjs > /tmp/douradas-agora.json
          if ! cmp -s /tmp/douradas-agora.json ferramentas/douradas.json; then
            echo "::error::caracteristicas() mudou. Se foi de propósito, regrave com:"
            echo "::error::  node ferramentas/gerar-douradas.mjs > ferramentas/douradas.json"
            diff <(head -c 4000 ferramentas/douradas.json) <(head -c 4000 /tmp/douradas-agora.json) || true
            exit 1
          fi

  interface:
    name: Interface e distribuição
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes da interface
        # Estes existiam desde sempre e não rodavam em lugar nenhum: nem aqui,
        # nem em "Compilar APK". Ficavam à espera de alguém lembrar de rodá-los
        # à mão — que é o mesmo que não existir. São eles que garantem que toda
        # tela continua alcançável pela navegação e que o laboratório não ganhou
        # botão de aposta.
        #
        # A bateria abre o app num Chrome de verdade, servido por HTTP: em
        # file:// o service worker não registra e o teste do modo avião mediria
        # outra coisa. O runner do GitHub já traz o google-chrome instalado.
        run: |
          python3 -m http.server 8123 >/dev/null 2>&1 &
          servidor=$!
          trap 'kill $servidor 2>/dev/null' EXIT
          # Espera a porta abrir em vez de dormir um tempo fixo e torcer.
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/index.html >/dev/null && break
            sleep 0.5
          done
          node ferramentas/testar-armazenamento.mjs
          node ferramentas/testar-distribuicao.mjs
          node ferramentas/testar-interface.mjs

      - name: Guardar as capturas de tela
        # As capturas são o único registro visual do que a build viu. Quando um
        # teste de layout falha, "estourou a largura em 360px" sem imagem manda
        # a pessoa reproduzir tudo de novo na mão.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore


  apk-preview:
    name: APK Android
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [motor, interface]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Android
        run: |
          npm ci
          npx cap sync android
      - name: Compilar APK de revisão
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Conferir conteúdo do APK
        run: |
          python3 ferramentas/conferir-apk.py android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/index.html > /tmp/index-apk.html
          cmp index.html /tmp/index-apk.html
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/ui/lab-recommendation.js > /tmp/recomendacao-apk.js
          cmp ui/lab-recommendation.js /tmp/recomendacao-apk.js
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/ui/lab-auto.js > /tmp/automatico-apk.js
          cmp ui/lab-auto.js /tmp/automatico-apk.js
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/ui/lab-auto-ui.js > /tmp/automatico-ui-apk.js
          cmp ui/lab-auto-ui.js /tmp/automatico-ui-apk.js
          for asset in ui/lab-check.js ui/lab-storage.js ui/lab-backup.js ui/conferencia-v4-22.css ui/acompanhamento-v4-25.css runner/segundo-plano.js; do
            unzip -p android/app/build/outputs/apk/debug/app-debug.apk "assets/public/$asset" > /tmp/conferencia-apk
            cmp "$asset" /tmp/conferencia-apk
          done
          cp android/app/build/outputs/apk/debug/app-debug.apk "LotoLab-$(cat VERSION)-preview.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LotoLab-preview
          path: LotoLab-*-preview.apk
          retention-days: 14

      - name: Preparar chave temporária somente para testar a compilação de release
        run: |
          python3 - <<'PY'
          import base64, importlib.util, json, os, tempfile
          from pathlib import Path
          def carregar(nome):
              spec = importlib.util.spec_from_file_location(nome, 'ferramentas/' + nome + '.py')
              modulo = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(modulo)
              return modulo
          pasta = Path(tempfile.mkdtemp(prefix='lotolab-teste-assinatura-'))
          sha = carregar('configurar-assinatura').configurar(pasta, somente_gerar=True, teste=True)
          dados = json.loads((pasta / 'assinatura-privada.json').read_text())
          dados['LOTOLAB_KEYSTORE_BASE64'] = base64.b64encode((pasta / 'lotolab-release.jks').read_bytes()).decode()
          os.environ.update(dados)
          carregar('preparar-assinatura').preparar(Path.cwd(), teste=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('LOTOLAB_SIGNING_SHA256=' + sha + '\n')
          PY

      - name: Verificar release final e transferência com a mesma assinatura
        run: |
          (cd android && ./gradlew assembleRelease --no-daemon)
          bash ferramentas/conferir-assinatura.sh android/app/build/outputs/apk/release/app-release.apk final teste
          python3 ferramentas/conferir-apk.py android/app/build/outputs/apk/release/app-release.apk
          (cd android && ./gradlew assembleRelease -PlotolabMigracao --no-daemon)
          bash ferramentas/conferir-assinatura.sh android/app/build/outputs/apk/release/app-release.apk transferencia teste
          python3 ferramentas/conferir-apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Apagar assinatura temporária de teste
        if: always()
        run: rm -f android/chave.properties android/lotolab-release.jks

  assinatura-disponivel:
    name: Verificar assinatura para publicação
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [motor, interface, apk-preview]
    runs-on: ubuntu-latest
    outputs:
      pronta: ${{ steps.assinatura.outputs.pronta }}
    steps:
      - name: Exigir os cinco Secrets da assinatura fixa
        id: assinatura
        env:
          CHAVE: ${{ secrets.LOTOLAB_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.LOTOLAB_STORE_PASSWORD }}
          ALIAS: ${{ secrets.LOTOLAB_KEY_ALIAS }}
          SENHA_CHAVE: ${{ secrets.LOTOLAB_KEY_PASSWORD }}
          CERTIFICADO: ${{ secrets.LOTOLAB_SIGNING_SHA256 }}
        run: |
          if [ -n "$CHAVE" ] && [ -n "$SENHA" ] && [ -n "$ALIAS" ] && [ -n "$SENHA_CHAVE" ] && [ -n "$CERTIFICADO" ]; then
            echo 'pronta=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pronta=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Assinatura no runner bloqueada até cadastrar os Secrets. APKs de revisão não são atualizações.'
            echo '### Assinatura no GitHub indisponível: faltam os Secrets. APKs assinados localmente usam o fluxo Publicar APK com assinatura permanente conferida.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publicar:
    needs: [assinatura-disponivel]
    if: needs.assinatura-disponivel.outputs.pronta == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/apk.yml
    secrets: inherit
