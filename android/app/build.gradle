apply plugin: 'com.android.application'

android {
    namespace "app.lotolab.jogos"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.lotolab.jogos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode sobe a cada versão Android publicada.
        versionCode 16
        versionName "4.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['pt-rBR', 'en']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Assinatura de release: lida de android/chave.properties, que fica FORA
    // do controle de versão. Sem esse arquivo o projeto continua compilando —
    // apenas assembleDebug funciona, e o release sai sem assinatura.
    def arquivoChave = rootProject.file("chave.properties")
    def chave = new Properties()
    if (arquivoChave.exists()) {
        chave.load(new FileInputStream(arquivoChave))
    }

    signingConfigs {
        release {
            if (arquivoChave.exists()) {
                storeFile rootProject.file(chave['storeFile'])
                storePassword chave['storePassword']
                keyAlias chave['keyAlias']
                keyPassword chave['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (arquivoChave.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    lint {
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// A linha que faltava desde sempre.
//
// O capacitor.build.gradle é gerado pelo `cap sync` e contém a lista de
// plugins como dependência do :app. Sem aplicá-lo, os módulos dos plugins
// entram no settings.gradle (e até compilam, aparecendo no log da build), mas
// NUNCA viram dependência do aplicativo — as classes deles não chegam ao APK.
//
// O `cap sync` continua escrevendo assets/capacitor.plugins.json listando os
// plugins, então o Capacitor tenta carregá-los por reflexão em tempo de
// execução e falha calado. Nada quebra, nada avisa, e o recurso simplesmente
// não existe no aparelho.
//
// Foi assim que o @capacitor/local-notifications ficou fora de TODOS os APKs
// deste projeto: era por isso que as notificações nunca funcionaram.
// Descoberto ao conferir se o executor em segundo plano tinha entrado na
// 4.4.0 — ele também não tinha, e a mesma linha ausente explicava os dois.
apply from: 'capacitor.build.gradle'
