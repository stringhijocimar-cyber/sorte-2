<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E2E">
<meta name="description" content="Gerador e conferidor de jogos das loterias brasileiras, com comparação honesta contra o acaso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<title>LotoLab — jogos e conferência</title>
<style>
/* ------------------------------------------------------------------
   Direção visual: ficha de conferência, não cassino.
   Sem verde-feltro, sem moeda, sem trevo, sem brilho, sem animação de
   celebração. A peça de identidade é a FICHA DE JOGO — cartão com a
   grade de dezenas — e, depois da conferência, a FAIXA DO ACASO, que
   mostra onde uma escolha aleatória teria caído.
   Porcelana + tinta naval + dois sinais: teal para o acaso, âmbar para
   o que é seu.
------------------------------------------------------------------ */
:root{
  --fundo:#EDF0F2; --carta:#FFFFFF; --tinta:#0F1E2E; --secundaria:#5C6B7A;
  --acaso:#0E6E62; --seu:#B26B00; --alerta:#A3324C; --linha:#D9DFE4; --trama:#E7ECEF;
  --veu:rgba(15,30,46,.045);
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:15px;
  --sombra:0 1px 2px rgba(15,30,46,.05),0 12px 28px -20px rgba(15,30,46,.45);
  --sombra-alta:0 2px 4px rgba(15,30,46,.06),0 20px 44px -26px rgba(15,30,46,.55);
  --topo:env(safe-area-inset-top,0px); --base:env(safe-area-inset-bottom,0px);
  /* Largura da coluna de leitura. Cabeçalho, conteúdo e abas se alinham a
     ela, para que os três leiam como uma peça só em tela larga. */
  --coluna:720px;
  --barra:55px; /* altura da barra de abas; dita o respiro do fim do main */
  /* Escala de espaço. Existir num só lugar é o que faz o ritmo da página ser
     uma decisão, e não o acúmulo de números escolhidos um a um. */
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:34px;
  /* Papel da cartela. Fica fora de --carta porque a cartela não segue o tema
     da interface: papel de lotérica é creme no claro e continua papel no
     escuro, apenas rebaixado, senão a marca de caneta perde o contraste. */
  --papel:#FBF8F1; --tintaPapel:#1A1A17; --grade:#CFC9BC;
}
html[data-tema="escuro"]{
  --fundo:#0B1622; --carta:#132030; --tinta:#E7EDF2; --secundaria:#8FA0AF;
  --acaso:#3FB3A3; --seu:#E9A73C; --alerta:#E2607C; --linha:#1E2E40; --trama:#16253A;
  --veu:rgba(255,255,255,.04);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 12px 28px -20px rgba(0,0,0,.8);
  --sombra-alta:0 2px 4px rgba(0,0,0,.35),0 20px 44px -26px rgba(0,0,0,.9);
  --papel:#E8E3D8; --tintaPapel:#14140F; --grade:#A9A296;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--sans);
  font-size:16px;line-height:1.55;overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
h1{font-size:1.42rem;letter-spacing:-.03em}
h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--secundaria);
  font-weight:600}
h3{font-size:1rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select,input{font-family:inherit;font-size:1rem;color:inherit}
:focus-visible{outline:2px solid var(--acaso);outline-offset:2px}

/* ---------- estrutura ---------- */
header{position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--fundo) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  padding:calc(var(--topo) + 12px) 16px 10px;border-bottom:1px solid var(--linha)}
@supports not (backdrop-filter:blur(2px)){header{background:var(--fundo)}}
.cabeca{display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:var(--coluna);margin:0 auto}
.marca{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:600;
  font-size:1rem;letter-spacing:-.03em}
.marca span{color:var(--acaso)}
.marca svg{width:26px;height:26px;display:block;flex:none}
main{padding:14px 16px calc(var(--barra) + 45px + var(--base));
  max-width:var(--coluna);margin:0 auto}

/* ---------- trilha de modalidade: uma escolha, válida em todas as telas ----
   Antes cada tela tinha o seu próprio <select> de modalidade, e trocar numa
   não trocava nas outras — o usuário podia gerar na Quina e conferir na
   Lotofácil sem perceber. A escolha subiu para o cabeçalho: é global, fica
   sempre visível, e não há como as telas discordarem entre si.            */
.trilha{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:10px -16px 0;padding:0 16px 2px;scroll-snap-type:x proximity}
.trilha::-webkit-scrollbar{display:none}
.trilha button{flex:none;scroll-snap-align:start;background:var(--carta);
  border:1px solid var(--linha);border-radius:20px;padding:6px 13px;font-size:.8rem;
  color:var(--secundaria);cursor:pointer;white-space:nowrap;font-weight:550;
  transition:color .16s ease,border-color .16s ease,background .16s ease}
.trilha button:hover{border-color:var(--secundaria)}
.trilha button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);
  color:var(--carta)}

/* ---------- controle segmentado: as telas dentro de uma seção ---------- */
.segmento{display:flex;gap:2px;background:var(--trama);border-radius:12px;padding:3px;
  margin-bottom:var(--e3)}
.segmento button{flex:1;background:none;border:0;border-radius:9px;padding:8px 6px;
  font-size:.82rem;font-weight:600;color:var(--secundaria);cursor:pointer;
  transition:background .16s ease,color .16s ease}
.segmento button[aria-selected="true"]{background:var(--carta);color:var(--tinta);
  box-shadow:0 1px 2px rgba(15,30,46,.09)}

/* ---------- título de tela com subtítulo ---------- */
.titulo{margin-bottom:var(--e3)}
.titulo p{margin:3px 0 0;font-size:.85rem;color:var(--secundaria);line-height:1.45}

/* ---------- sino de avisos ---------- */
.sino{position:relative;background:none;border:1px solid var(--linha);border-radius:11px;
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--tinta)}
.sino svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.sino b{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--alerta);color:#fff;font-family:var(--mono);
  font-size:.6rem;display:grid;place-items:center;border:2px solid var(--fundo)}
/* `display:grid` acima vence o [hidden] do navegador, e o contador aparecia
   com "0". Precisa ser explícito. */
.sino b[hidden]{display:none}

/* ---------- folha inferior (avisos) ---------- */
.folha{position:fixed;inset:0;z-index:50;display:none}
.folha[data-aberta="1"]{display:block}
.folha .fundo{position:absolute;inset:0;background:rgba(15,30,46,.42);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.folha .corpo{position:absolute;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;
  background:var(--fundo);border-radius:var(--r) var(--r) 0 0;
  padding:var(--e4) var(--e4) calc(var(--e5) + var(--base));
  max-width:var(--coluna);margin:0 auto;box-shadow:var(--sombra-alta)}
.folha .alca{width:38px;height:4px;border-radius:2px;background:var(--linha);
  margin:0 auto var(--e3)}

/* ---------- cartela: a forma do volante de lotérica ------------------------
   A referência é o cartão de papel: fundo creme, grade impressa contínua (uma
   linha entre células, não uma borda por célula), número pequeno no canto e a
   marca ocupando a casa inteira, como caneta preta.

   Deliberadamente NÃO reproduz a identidade da Caixa — nada de logo, nome de
   marca ou paleta oficial. Imitar a forma ajuda a reconhecer o gesto; imitar a
   marca seria se passar por eles.                                          */
.cartela{background:var(--papel);border:1px solid var(--linha);border-radius:12px;
  overflow:hidden;box-shadow:var(--sombra);margin-bottom:var(--e3)}
.cartela .tarja{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 12px;background:var(--tinta);color:var(--carta)}
.cartela .tarja b{font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;
  font-weight:650}
.cartela .tarja span{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;
  opacity:.72}
.cartela .miolo{padding:10px}
/* A grade impressa: colapsada, com a linha desenhada pela própria célula. */
.grade-volante{display:grid;gap:0;border:1px solid var(--grade);border-radius:4px;
  overflow:hidden;background:var(--grade)}
.casa{position:relative;aspect-ratio:1;background:var(--papel);border:0;
  margin:0 1px 1px 0;padding:0;display:grid;place-items:center;cursor:pointer;
  font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--tintaPapel);
  font-variant-numeric:tabular-nums;transition:background .1s ease,color .1s ease}
.casa:hover:not(:disabled){background:color-mix(in srgb,var(--seu) 12%,var(--papel))}
/* A marca de caneta: um retângulo dentro da casa, e não a casa inteira
   invertida. A casa inteira lê como seleção de interface; o retângulo com a
   margem de papel em volta lê como alguém que passou a caneta.

   O número fica num <span> com z-index próprio. Sem isso ele desaparece: o
   ::before é posicionado, e conteúdo posicionado pinta ACIMA do texto em fluxo
   do mesmo contexto de empilhamento — a marca cobria o dígito inteiro. */
.casa span{position:relative;z-index:1}
.casa[aria-pressed="true"]{color:var(--papel)}
.casa[aria-pressed="true"]::before{content:"";position:absolute;inset:9%;
  border-radius:4px;background:var(--tintaPapel)}
/* Sorteada é o resultado impresso na casa; acerto é a caneta sobre ela — as
   duas camadas juntas, como conferir o papel contra o resultado. */
.casa.sorteada{background:var(--acaso);color:#fff}
.casa.acertou{background:var(--acaso)}
.casa.acertou::before{background:var(--tintaPapel);
  box-shadow:0 0 0 1.5px color-mix(in srgb,#fff 70%,transparent)}
.casa:disabled{cursor:default;color:color-mix(in srgb,var(--tintaPapel) 40%,var(--papel))}
.cartela .pe{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;
  border-top:1px dashed var(--grade);font-family:var(--mono);font-size:.66rem;
  color:var(--secundaria);flex-wrap:wrap}
.legenda-cartela{display:flex;gap:12px;flex-wrap:wrap;font-size:.66rem;
  color:var(--secundaria);font-family:var(--mono);margin-top:var(--e2)}
.legenda-cartela i{display:inline-block;width:11px;height:11px;border-radius:2px;
  vertical-align:-1px;margin-right:4px}
.contador{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:.76rem;color:var(--secundaria);margin:var(--e3) 0 var(--e2)}
.contador b{font-size:1.05rem;color:var(--tinta)}

/* ---------- lista de linhas (avisos, resultados, teimosinha) ---------- */
.lista{display:flex;flex-direction:column;gap:var(--e2)}
.item{display:flex;gap:var(--e3);align-items:flex-start;background:var(--carta);
  border:1px solid var(--linha);border-radius:13px;padding:var(--e3)}
.item .marca-cor{flex:none;width:3px;align-self:stretch;border-radius:2px;
  background:var(--secundaria)}
.item.ok .marca-cor{background:var(--acaso)}
.item.aviso .marca-cor{background:var(--seu)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:.9rem}
.item .txt span{display:block;font-size:.78rem;color:var(--secundaria)}
.item .quando{font-family:var(--mono);font-size:.62rem;color:var(--secundaria);flex:none}
.nao-lido{background:color-mix(in srgb,var(--acaso) 6%,var(--carta))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;
  /* Uma coluna por aba, derivada da quantidade real: um número fixo aqui
     deixa coluna vazia assim que ABAS muda de tamanho. */
  grid-auto-flow:column;grid-auto-columns:1fr;
  background:color-mix(in srgb,var(--carta) 92%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--linha);padding-bottom:var(--base)}
/* Em tela larga a barra acompanha a coluna em vez de atravessar a página. */
@media (min-width:760px){
  nav{width:var(--coluna);margin-inline:auto;
    border-inline:1px solid var(--linha);border-radius:var(--r) var(--r) 0 0;
    box-shadow:var(--sombra-alta)}
}
@supports not (backdrop-filter:blur(2px)){nav{background:var(--carta)}}
nav button{position:relative;background:none;border:0;padding:10px 1px 9px;display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--secundaria);font-size:.58rem;
  cursor:pointer;letter-spacing:.03em;transition:color .18s ease}
nav button[aria-current="page"]{color:var(--tinta)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:26px;height:2.5px;border-radius:0 0 3px 3px;
  background:var(--acaso)}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .18s ease}
nav button[aria-current="page"] svg{stroke-width:2.2}


/* ---------- cartão do próximo concurso ------------------------------------
   A primeira coisa que se vê ao abrir. Fundo de tinta naval em vez de carta
   branca porque ele é o único bloco que não é conteúdo de trabalho: é o
   contexto de tudo o que vem abaixo, e precisa se distinguir sem gritar.
   Nada de dourado, nada de brilho — o valor é grande por si só.            */
.proximo{position:relative;overflow:hidden;border-radius:var(--r);
  background:linear-gradient(150deg,var(--tinta) 0%,
    color-mix(in srgb,var(--tinta) 82%,var(--acaso)) 100%);
  color:var(--carta);padding:15px 16px;margin-bottom:var(--e3);
  box-shadow:var(--sombra-alta)}
.proximo::after{content:"";position:absolute;right:-28px;top:-28px;width:130px;
  height:130px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acaso) 34%,transparent) 0%,
    transparent 70%);pointer-events:none}
.proximo .rot{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;
  letter-spacing:.14em;opacity:.72}
.proximo .valor{font-family:var(--mono);font-size:1.75rem;font-weight:650;
  letter-spacing:-.03em;margin:3px 0 1px;line-height:1.15}
.proximo .quando{font-size:.82rem;opacity:.82}
.proximo .selo-acumulou{display:inline-block;font-family:var(--mono);font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:20px;
  border:1px solid color-mix(in srgb,var(--carta) 45%,transparent);margin-top:8px}
.proximo .contagem{position:absolute;right:16px;top:15px;text-align:right}
.proximo .contagem b{display:block;font-family:var(--mono);font-size:1.6rem;
  font-weight:650;line-height:1}
.proximo .contagem span{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;
  opacity:.72}

/* ---------- blocos ---------- */
.carta{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  padding:15px;box-shadow:var(--sombra);margin-bottom:12px}
.campo{display:block;margin-bottom:12px}
.campo label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--secundaria);margin-bottom:5px;font-weight:600}
select,input[type=number],input[type=text],input[type=date]{width:100%;padding:11px 12px;
  background:var(--fundo);border:1px solid var(--linha);border-radius:11px;
  transition:border-color .16s ease,box-shadow .16s ease}
select:focus,input:focus{border-color:var(--acaso);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acaso) 16%,transparent);outline:none}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acao{width:100%;padding:14px;border:0;border-radius:13px;background:var(--tinta);
  color:var(--carta);font-weight:650;cursor:pointer;letter-spacing:.01em;
  transition:transform .12s ease,opacity .16s ease,box-shadow .16s ease;
  box-shadow:0 1px 2px rgba(15,30,46,.12),0 8px 18px -12px rgba(15,30,46,.5)}
.acao:active{transform:translateY(1px)}
.acao:disabled{opacity:.5;box-shadow:none}
.acao.contorno{background:transparent;color:var(--tinta);border:1px solid var(--linha);
  box-shadow:none}
.acao.contorno:hover{background:var(--veu)}
.acao.perigo{background:transparent;color:var(--alerta);border:1px solid var(--alerta);
  box-shadow:none}
.acao.aviao{background:var(--acaso);color:#fff}
.mini{padding:9px 12px;font-size:.85rem;border-radius:10px;width:auto}
.botoes{display:flex;gap:8px;flex-wrap:wrap}
.girando{display:inline-block;width:13px;height:13px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;vertical-align:-2px;margin-right:7px;
  animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.girando{animation:none}}

/* ---------- ficha de jogo: a peça de identidade ---------- */
.ficha{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  padding:13px;margin-bottom:10px;position:relative;overflow:hidden;
  box-shadow:var(--sombra)}
.ficha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;
  background:var(--seu)}
.ficha.conferida::before{background:var(--acaso)}
.ficha .topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:9px}
.ficha .id{font-family:var(--mono);font-size:.68rem;color:var(--secundaria);
  letter-spacing:.08em}
.dezenas{display:flex;flex-wrap:wrap;gap:5px}
.dz{font-family:var(--mono);font-size:.85rem;font-weight:600;min-width:35px;height:35px;
  display:grid;place-items:center;border:1px solid var(--linha);border-radius:10px;
  background:var(--fundo);font-variant-numeric:tabular-nums}
.dz.acertou{background:var(--acaso);border-color:var(--acaso);color:#fff;
  box-shadow:0 2px 8px -3px color-mix(in srgb,var(--acaso) 70%,transparent)}
.dz.marcada{border-color:var(--seu);color:var(--seu)}
.dz.trevo{border-color:var(--acaso);color:var(--acaso);border-radius:50%}

/* ---------- faixa do acaso ---------- */
.faixa{margin-top:11px}
.faixa svg{display:block;width:100%;height:38px;overflow:visible}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.66rem;color:var(--secundaria);
  font-family:var(--mono);margin-top:5px}
.legenda i{display:inline-block;width:14px;height:0;vertical-align:middle;margin-right:4px}

/* ---------- indicadores ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  padding:13px;box-shadow:var(--sombra)}
.kpi .rot{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--secundaria);font-weight:600}
.kpi .val{font-family:var(--mono);font-size:1.45rem;font-weight:650;letter-spacing:-.02em;
  margin-top:2px}
.kpi .sub{font-size:.7rem;color:var(--secundaria);font-family:var(--mono)}

/* ---------- avisos ---------- */
.nota{border-left:3px solid var(--acaso);background:var(--carta);border-radius:0 10px 10px 0;
  padding:10px 12px;font-size:.85rem;color:var(--secundaria);margin:10px 0}
.nota strong{color:var(--tinta)}
.nota.atencao{border-left-color:var(--alerta)}
.selo{display:inline-block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border:1px solid var(--linha);border-radius:20px;
  color:var(--secundaria)}
.selo.ok{color:var(--acaso);border-color:var(--acaso)}
.selo.seu{color:var(--seu);border-color:var(--seu)}
.vazio{text-align:center;color:var(--secundaria);padding:34px 16px;font-size:.9rem}
.metodo{border:1px solid var(--linha);border-radius:13px;padding:12px;margin-bottom:8px;
  cursor:pointer;background:var(--carta);transition:border-color .16s ease,box-shadow .16s ease}
.metodo:hover{border-color:var(--secundaria)}
.metodo[aria-checked="true"]{border-color:var(--tinta);
  box-shadow:inset 0 0 0 1px var(--tinta),var(--sombra)}
.metodo b{display:block;font-size:.94rem}
.metodo span{display:block;font-size:.78rem;color:var(--secundaria);margin-top:2px}
.prosa{font-size:.92rem}
.prosa p{margin:.7em 0}

<script>
"use strict";

/* ============================ dados base ============================ */
/* Regras vigentes das modalidades. Confirme na fonte oficial antes de
   qualquer uso sério — regras e preços mudam, e é por isso que ficam aqui,
   em um só lugar, e não espalhadas pelo código. */
const MODALIDADES = {
  "mega-sena":  {nome:"Mega-Sena",   N:60,  k:6,  min:6,  max:20, base:1, preco:5.00,
                 faixas:[6,5,4]},
  "lotofacil":  {nome:"Lotofácil",   N:25,  k:15, min:15, max:20, base:1, preco:3.50,
                 faixas:[15,14,13,12,11]},
  "quina":      {nome:"Quina",       N:80,  k:5,  min:5,  max:15, base:1, preco:3.00,
                 faixas:[5,4,3,2]},
  "lotomania":  {nome:"Lotomania",   N:100, k:20, min:50, max:50, base:0, preco:3.00,
                 faixas:[20,19,18,17,16,15,0]},
  "dupla-sena": {nome:"Dupla Sena",  N:50,  k:6,  min:6,  max:15, base:1, preco:2.50,
                 faixas:[6,5,4,3]},
  "dia-de-sorte":{nome:"Dia de Sorte",N:31, k:7,  min:7,  max:15, base:1, preco:2.50,
                 faixas:[7,6,5,4]},
  "timemania":  {nome:"Timemania",   N:80,  k:7,  min:10, max:10, base:1, preco:3.50,
                 faixas:[7,6,5,4,3]},
  "mais-milionaria":{nome:"+Milionária",N:50,k:6, min:6,  max:12, base:1, preco:6.00,
                 faixas:[6,5,4,3,2], trevos:{N:6,k:2,min:2,max:6}}
};

const METODOS = [
  {id:"uniforme", nome:"Sorteio uniforme",
   desc:"Cada combinação com a mesma chance. É a referência — e é tão boa quanto qualquer outra."},
  {id:"rateio", nome:"Otimizado para rateio",
   desc:"Evita padrões que muita gente marca (datas, sequências, desenhos). Mesma chance de acertar, menos gente para dividir se acertar."},
  {id:"cobertura", nome:"Cobertura espalhada",
   desc:"Distribui os jogos pelo volante para que se repitam pouco entre si. Não muda a chance de cada jogo."},
  {id:"antirepeticao", nome:"Evita o concurso anterior",
   desc:"Muita gente repete as dezenas que acabaram de sair. Evitá-las não muda sua chance — muda com quantas pessoas você dividiria."},
  {id:"contraste", nome:"Contraste por restrição",
   desc:"Em vez de peso suave, descarta a candidata que não fica abaixo da referência em datas, sequências, soma e desenho. Mesma chance; rateio esperado menor."},
  {id:"fechamento", nome:"Fechamento com garantia verificada",
   desc:"A partir das dezenas que você marcar, monta jogos com piso de acertos comprovado por enumeração. Disponível na Lotofácil."}
];

/* ============================ estado ============================ */
const S = {
  tela:"gerar", modalidade:"lotofacil", metodo:"rateio", quantidade:3,
  tamanho:null, dezenasFechamento:[], jFechamento:14, garantia:13,
  jogos:[], resultados:[], tema:"claro", ultimoLote:[],
  bancadaRep:40, bancadaQtd:3,
  /* marcadas: dezenas do volante manual, por modalidade, para trocar de
     modalidade e voltar não apagar o que a pessoa já tinha marcado. */
  marcadas:{}, avisos:[], teimosinhas:[], aprendizado:{}, jogoAberto:null,
  autoAnalise:true, tipoEstatistica:"dezenas", ordemEstatistica:"vezes",
  calibracao:{}, buscaAutomatica:true, ultimaBusca:{}
};

/* Persistência tolerante: se o navegador bloquear, o app segue funcionando
   na sessão em vez de quebrar. */
const Guardar = {
  ler(chave, padrao){
    try{ const v = localStorage.getItem("lotolab:"+chave);
      return v ? JSON.parse(v) : padrao; }catch(e){ return padrao; }
  },
  gravar(chave, valor){
    try{ localStorage.setItem("lotolab:"+chave, JSON.stringify(valor)); return true; }
    catch(e){ return false; }
  }
};

/* ============================ utilidades ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = (v,d=2) => Number(v).toLocaleString("pt-BR",
  {minimumFractionDigits:d, maximumFractionDigits:d});
const inf = v => Number(v).toLocaleString("pt-BR");
const brl = v => Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");
const hoje = () => new Date().toISOString().slice(0,10);

function combinacoes(n,k){
  if(k<0||k>n) return 0;
  let r = 1;
  for(let i=1;i<=k;i++) r = r*(n-k+i)/i;
  return Math.round(r);
}
function universo(m){
  const c = MODALIDADES[m];
  return Array.from({length:c.N}, (_,i)=> i + c.base);
}
function embaralhar(a, rnd=Math.random){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; }
  return x;
}
function sortear(m, quantos){
  return embaralhar(universo(m)).slice(0, quantos).sort((a,b)=>a-b);
}
function tamanhoPadrao(m){ return S.tamanho || MODALIDADES[m].min; }

/* ============================ modelo de rateio ============================
   Porta do módulo `premio/impopularidade.py`. Pontua o quanto uma combinação
   PARECE escolhida por gente. Combinação que parece escolhida por gente é
   marcada por mais gente — e divide o prêmio com mais gente.
   Isto NÃO altera a chance de a combinação ser sorteada.               */
const PESOS = {
  ate31:1.20, ate12:0.45, consecutivos:0.55, somaCentral:0.40,
  espacamentoRegular:0.50, mesmaLinha:0.60, mesmaColuna:0.60,
  terminacoesIguais:0.35, contem7:0.15,
  /* Peso baixo, e deliberadamente. Fibonacci é padrão que gente que programa
     acha bonito, não hábito comum de apostador — ao contrário de data de
     nascimento, que domina o volante. Dar peso alto aqui seria fingir uma
     popularidade que não medi. Se a calibração do pesos.json vier dos
     ganhadores reais, ela substitui esta suposição por dado. */
  fibonacci:0.12
};
/* Fibonacci dentro do universo da modalidade. O 1 entra uma vez só — a
   sequência tem 1,1,2,3,5… e repetir a dezena 1 não faz sentido num volante. */
function fibonacciAte(n){
  const saida = new Set();
  let a = 1, b = 2;
  while(a <= n){ saida.add(a); const t = b; b = a + b; a = t; }
  return saida;
}

const GRADE = {"mega-sena":10, "lotofacil":5, "quina":10, "lotomania":10,
               "dupla-sena":10, "dia-de-sorte":7, "timemania":10, "mais-milionaria":10};

function caracteristicas(dez, m){
  const c = MODALIDADES[m], n = dez.length, cols = GRADE[m] || 10;
  const ord = dez.slice().sort((a,b)=>a-b);
  const linhas = {}, colunas = {}, finais = {};
  let consec = 0;
  ord.forEach((d,i)=>{
    const p = d - c.base;
    linhas[Math.floor(p/cols)] = (linhas[Math.floor(p/cols)]||0)+1;
    colunas[p%cols] = (colunas[p%cols]||0)+1;
    finais[d%10] = (finais[d%10]||0)+1;
    if(i>0 && ord[i]-ord[i-1]===1) consec++;
  });
  const difs = ord.slice(1).map((d,i)=> d-ord[i]);
  const media = difs.reduce((a,b)=>a+b,0)/(difs.length||1);
  const desvio = Math.sqrt(difs.reduce((a,b)=>a+(b-media)**2,0)/(difs.length||1));
  const soma = ord.reduce((a,b)=>a+b,0);
  const somaMedia = n*(c.N + 2*c.base - 1)/2;
  const somaDP = Math.sqrt(n*(c.N+1)*(c.N-n)/12) || 1;
  return {
    ate31: ord.filter(d=>d<=31).length/n,
    ate12: ord.filter(d=>d<=12).length/n,
    consecutivos: consec/Math.max(n-1,1),
    somaCentral: Math.exp(-0.5*((soma-somaMedia)/somaDP)**2),
    espacamentoRegular: Math.max(0, Math.min(1, 1 - desvio/(media||1))),
    mesmaLinha: Math.max(...Object.values(linhas))/n,
    mesmaColuna: Math.max(...Object.values(colunas))/n,
    terminacoesIguais: Math.max(...Object.values(finais))/n,
    contem7: ord.includes(7) ? 1 : 0,
    /* Fração das dezenas que caem na sequência de Fibonacci, dividida pela
       fração que se esperaria por acaso. 1,0 = exatamente o esperado; acima
       disso, o jogo tem mais Fibonacci do que o acaso costuma dar.

       É normalizado porque a contagem crua não é comparável entre
       modalidades: na Lotofácil 8 dos 25 números são Fibonacci (32%) e na
       Quina são 10 de 80 (12,5%). Sem dividir pelo esperado, todo jogo de
       Lotofácil pareceria "cheio de Fibonacci". */
    fibonacci: (() => {
      const fib = fibonacciAte(c.N + c.base - 1);
      const noUniverso = [...fib].filter(d => d >= c.base).length;
      const esperado = noUniverso / c.N;
      const observado = ord.filter(d => fib.has(d)).length / n;
      return esperado > 0 ? Math.min(3, observado / esperado) : 0;
    })()
  };
}

/* Pesos calibrados, se houver. Gerados por
   `python manage.py calibrar --modalidade X --preco Y --exportar app/pesos.json`
   a partir dos ganhadores publicados pela Caixa. Sem o arquivo, valem as
   hipóteses declaradas acima — e o app diz qual dos dois está em uso. */
let CALIBRACAO = null;
function pesosVigentes(){
  /* Ordem de preferência: calibração medida no próprio aparelho, com os
     ganhadores reais desta modalidade; depois o pesos.json externo; por último
     as suposições declaradas em PESOS. Medido ganha de suposto. */
  const local = S.calibracao && S.calibracao[S.modalidade];
  if(local && !local.erro && local.util) return local.pesos;
  return (CALIBRACAO && CALIBRACAO.pesos_app) ? CALIBRACAO.pesos_app : PESOS;
}

let REFERENCIA = {};
function referencia(m){
  if(REFERENCIA[m]) return REFERENCIA[m];
  const n = tamanhoPadrao(m), soma = {}, amostras = 900;
  for(let i=0;i<amostras;i++){
    const c = caracteristicas(sortear(m,n), m);
    for(const k in c) soma[k] = (soma[k]||0) + c[k];
  }
  for(const k in soma) soma[k] /= amostras;
  REFERENCIA[m] = soma;
  return soma;
}

function escorePopularidade(dez, m){
  const c = caracteristicas(dez, m), ref = referencia(m), pesos = pesosVigentes();
  let e = 0;
  for(const k in pesos) e += pesos[k] * ((c[k]||0) - (ref[k]||0));
  return e;
}

function observacoes(dez, m){
  const c = caracteristicas(dez, m), ref = referencia(m), obs = [];
  if(c.ate31 > ref.ate31 + 0.15) obs.push("concentrada em 1–31, faixa das datas de nascimento");
  if(c.consecutivos > 0.30) obs.push("contém sequência consecutiva");
  if(Math.max(c.mesmaLinha,c.mesmaColuna) > 0.55) obs.push("forma desenho no volante");
  if(c.espacamentoRegular > 0.82) obs.push("espaçamento quase constante");
  if(c.somaCentral > 0.92) obs.push("soma exatamente na média");
  if(c.fibonacci > 1.6) obs.push(
    `concentra Fibonacci (${nf(c.fibonacci,1)}× o esperado do acaso)`);
  if(!obs.length) obs.push("sem padrão humano evidente");
  return obs;
}

/* ============================ geradores ============================ */
function gerarUniforme(m, quantos, tam){
  return Array.from({length:quantos}, ()=> sortear(m, tam));
}

function gerarRateio(m, quantos, tam){
  /* Sorteia candidatas UNIFORMEMENTE e fica com as de menor popularidade.
     Nenhuma dezena é privilegiada em momento nenhum: o filtro age sobre o
     rateio esperado, nunca sobre a chance de acerto. */
  const candidatas = Math.min(1400, 220*quantos);
  const lista = [];
  for(let i=0;i<candidatas;i++){
    const j = sortear(m, tam);
    lista.push({j, e: escorePopularidade(j, m)});
  }
  lista.sort((a,b)=> a.e - b.e);
  const saida = [], vistos = new Set();
  for(const c of lista){
    const chave = c.j.join("-");
    if(vistos.has(chave)) continue;
    vistos.add(chave); saida.push(c.j);
    if(saida.length === quantos) break;
  }
  return saida;
}

function gerarCobertura(m, quantos, tam){
  /* Maximiza a distância entre os jogos do lote: escolhe, entre candidatas
     uniformes, a que menos repete dezenas já usadas. Reduz sobreposição entre
     os seus jogos; não altera a chance de nenhum deles. */
  const saida = [];
  for(let q=0;q<quantos;q++){
    let melhor = null, melhorCusto = Infinity;
    for(let i=0;i<260;i++){
      const cand = sortear(m, tam);
      let custo = 0;
      for(const j of saida) custo += cand.filter(d=> j.includes(d)).length ** 2;
      custo += escorePopularidade(cand, m) * 0.5;
      if(custo < melhorCusto){ melhorCusto = custo; melhor = cand; }
    }
    saida.push(melhor);
  }
  return saida;
}

function ultimoResultado(m){
  for(let i=S.resultados.length-1;i>=0;i--)
    if(S.resultados[i].modalidade === m) return S.resultados[i];
  return null;
}

function gerarAntirepeticao(m, quantos, tam, dezenasEvitadas){
  /* Repetir as dezenas do concurso que acabou de sair é um dos hábitos mais
     comuns de quem aposta. Evitá-las não mexe na chance de acerto — mexe em
     quantas pessoas dividiriam o prêmio. Sem concurso registrado não há o que
     evitar, e o método é honesto quanto a isso: vira o rateio comum.

     `dezenasEvitadas` existe para a bancada poder informar QUAL concurso é o
     anterior ao que está sendo conferido. Sem esse parâmetro a bancada usaria
     o último concurso registrado e acabaria testando o método contra o próprio
     sorteio que ele foi mandado evitar — o que produziria um déficit de
     acertos garantido, e falso. */
  const base = dezenasEvitadas || (ultimoResultado(m) || {}).dezenas;
  if(!base) return gerarRateio(m, quantos, tam);
  const evitar = new Set(base);
  const candidatas = Math.min(1400, 220*quantos);
  const lista = [];
  for(let i=0;i<candidatas;i++){
    const j = sortear(m, tam);
    const repetidas = j.filter(d=>evitar.has(d)).length;
    lista.push({j, e: escorePopularidade(j, m) + repetidas*0.35});
  }
  lista.sort((a,b)=> a.e - b.e);
  const saida = [], vistos = new Set();
  for(const c of lista){
    const chave = c.j.join("-");
    if(vistos.has(chave)) continue;
    vistos.add(chave); saida.push(c.j);
    if(saida.length === quantos) break;
  }
  return saida;
}

function gerarContraste(m, quantos, tam){
  /* Restrição dura em vez de peso suave: a candidata só passa se ficar abaixo
     da referência em TODOS os eixos de padrão humano. Os limites são relativos
     à referência da própria modalidade, então nunca ficam impossíveis — na
     Lotofácil, onde 15 de 25 forçam consecutivos, o limite acompanha.
     Se ainda assim faltar jogo, completa pelo rateio em vez de travar. */
  const ref = referencia(m);
  const tetoDesenho = Math.max(ref.mesmaLinha, ref.mesmaColuna);
  const aceita = dez => {
    const c = caracteristicas(dez, m);
    return c.ate31 <= ref.ate31
        && c.consecutivos <= ref.consecutivos
        && c.somaCentral <= ref.somaCentral
        && Math.max(c.mesmaLinha, c.mesmaColuna) <= tetoDesenho;
  };
  const saida = [], vistos = new Set();
  for(let t=0; t<6000 && saida.length<quantos; t++){
    const j = sortear(m, tam);
    if(!aceita(j)) continue;
    const chave = j.join("-");
    if(vistos.has(chave)) continue;
    vistos.add(chave); saida.push(j);
  }
  if(saida.length < quantos) saida.push(...gerarRateio(m, quantos - saida.length, tam));
  return saida;
}

/* Porta única dos geradores. A bancada de testes chama exatamente o mesmo
   caminho que o botão Gerar — se divergissem, a bancada mediria outra coisa. */
function gerarPor(metodo, m, quantos, tam, contexto){
  if(metodo === "rateio")        return gerarRateio(m, quantos, tam);
  if(metodo === "cobertura")     return gerarCobertura(m, quantos, tam);
  if(metodo === "antirepeticao") return gerarAntirepeticao(m, quantos, tam,
                                          contexto && contexto.evitar);
  if(metodo === "contraste")     return gerarContraste(m, quantos, tam);
  return gerarUniforme(m, quantos, tam);
}

/* Fechamento: cobertura combinatória com garantia VERIFICADA por enumeração.
   Nunca exibimos um piso que não conseguimos provar. */
function combinacoesDe(arr, k){
  const saida = [], atual = [];
  (function rec(inicio){
    if(atual.length === k){ saida.push(atual.slice()); return; }
    for(let i=inicio;i<arr.length;i++){ atual.push(arr[i]); rec(i+1); atual.pop(); }
  })(0);
  return saida;
}

function verificarGarantia(bilhetes, dezenas, j){
  const idx = new Map(dezenas.map((d,i)=>[d,i]));
  const masc = bilhetes.map(b=>{ let m=0; b.forEach(d=> m |= (1 << idx.get(d))); return m; });
  const cenarios = combinacoesDe(dezenas.map((_,i)=>i), j);
  let pior = Infinity;
  for(const cen of cenarios){
    let mc = 0; cen.forEach(i => mc |= (1 << i));
    let melhor = 0;
    for(const mb of masc){
      let x = mb & mc, c = 0;
      while(x){ x &= x-1; c++; }
      if(c > melhor) melhor = c;
    }
    if(melhor < pior) pior = melhor;
  }
  return pior;
}

function gerarFechamento(m, dezenas, j, garantia){
  const c = MODALIDADES[m], tam = c.k;
  dezenas = dezenas.slice().sort((a,b)=>a-b);
  if(dezenas.length < tam) throw new Error(`marque ao menos ${tam} dezenas`);
  if(garantia > Math.min(tam, j)) throw new Error(
    `com ${j} das suas dezenas sorteadas, o máximo alcançável é ${Math.min(tam,j)} acertos`);

  const idx = dezenas.map((_,i)=>i);
  const candidatos = combinacoesDe(idx, tam).map(c=>{ let m2=0; c.forEach(i=> m2 |= (1<<i)); return m2; });
  const cenarios = combinacoesDe(idx, j).map(c=>{ let m2=0; c.forEach(i=> m2 |= (1<<i)); return m2; });
  if(candidatos.length * cenarios.length > 12e6)
    throw new Error("combinação pesada demais para o celular; reduza as dezenas marcadas");

  const conta = x => { let c=0; while(x){ x &= x-1; c++; } return c; };
  const cobre = candidatos.map(cd => cenarios.map(ce => conta(cd & ce) >= garantia));
  if(!cenarios.every((_,s)=> cobre.some(linha => linha[s])))
    throw new Error("garantia inalcançável com estas dezenas; reduza a garantia");

  const descobertos = new Array(cenarios.length).fill(true);
  const escolhidos = [];
  let restantes = cenarios.length;
  while(restantes > 0 && escolhidos.length < 400){
    let melhor = -1, ganho = 0;
    for(let i=0;i<candidatos.length;i++){
      let g = 0;
      for(let s=0;s<descobertos.length;s++) if(descobertos[s] && cobre[i][s]) g++;
      if(g > ganho){ ganho = g; melhor = i; }
    }
    if(melhor < 0) break;
    escolhidos.push(melhor);
    for(let s=0;s<descobertos.length;s++)
      if(descobertos[s] && cobre[melhor][s]){ descobertos[s] = false; restantes--; }
  }
  const bilhetes = escolhidos.map(i =>
    dezenas.filter((_,p)=> candidatos[i] & (1<<p)));
  return {bilhetes, garantiaVerificada: verificarGarantia(bilhetes, dezenas, j),
          piso: Math.max(0, tam + c.k - c.N)};
}

/* ============================ bancada de testes ============================
   Roda TODOS os métodos contra o mesmo concurso e mede quatro coisas.
   Três delas diferem de verdade entre métodos, porque são propriedades da
   combinação, decididas antes do sorteio:
     - rateio esperado (escore de popularidade)
     - sobreposição entre os jogos do lote
     - custo
   A quarta — acertos — NÃO difere. Cada combinação válida tem a mesma chance,
   então a diferença de acertos entre métodos é ruído amostral. A bancada
   mede assim mesmo e mostra a faixa de ruído junto, para que isso deixe de
   ser uma afirmação de quem escreveu o app e passe a ser um número que você
   confere. Ranquear método por acerto produziria um "vencedor" todo concurso,
   sempre por sorte.                                                        */
function sobreposicaoMedia(jogos){
  if(jogos.length < 2) return 0;
  let soma = 0, pares = 0;
  for(let i=0;i<jogos.length;i++)
    for(let k=i+1;k<jogos.length;k++){
      soma += jogos[i].filter(d=> jogos[k].includes(d)).length;
      pares++;
    }
  return soma/pares;
}

/* Erro padrão da média de acertos sobre `n` jogos independentes. */
function erroPadraoAcertos(m, tam, n){
  return desvioAcertos(m, tam) / Math.sqrt(Math.max(n,1));
}

function bancada(m, dezenasSorteadas, opcoes){
  const o = Object.assign({repeticoes:40, quantos:3}, opcoes||{});
  const tam = tamanhoPadrao(m), c = MODALIDADES[m];
  const sorteadas = new Set(dezenasSorteadas);
  /* O fechamento fica de fora: depende de dezenas que você marca à mão, então
     não há como sorteá-lo em pé de igualdade com os outros. */
  const linhas = METODOS.filter(x => x.id !== "fechamento").map(met => {
    const acertos = [];
    let pop = 0, sobre = 0;
    for(let r=0;r<o.repeticoes;r++){
      const lote = gerarPor(met.id, m, o.quantos, tam, {evitar: o.evitar});
      sobre += sobreposicaoMedia(lote);
      lote.forEach(j => {
        acertos.push(j.reduce((a,d)=> a + (sorteadas.has(d)?1:0), 0));
        pop += escorePopularidade(j, m);
      });
    }
    const n = acertos.length;
    const media = acertos.reduce((a,b)=>a+b,0)/n;
    return {
      id: met.id, nome: met.nome, jogos: n,
      media, melhor: Math.max(...acertos),
      popularidade: pop/n,
      sobreposicao: sobre/o.repeticoes,
      custo: o.quantos * c.preco
    };
  });
  const esperado = esperadoAcertos(m, tam);
  const ep = erroPadraoAcertos(m, tam, linhas[0].jogos);
  linhas.forEach(l => l.z = (l.media - esperado) / Math.max(ep, 1e-9));
  return {linhas, esperado, erroPadrao: ep, tamanho: tam};
}

/* Agrega vários concursos. Não dá para somar as dezenas sorteadas num conjunto
   só: cada jogo passaria a ser conferido contra um alvo muito maior, e tanto o
   esperado quanto o desvio deixariam de valer. O certo é rodar concurso a
   concurso e juntar as médias, com o erro padrão caindo pelo total de jogos. */
function bancadaAgregada(m, alvos, opcoes){
  const parciais = alvos.map((r,i) => bancada(m, r.dezenas,
    Object.assign({}, opcoes, {evitar: i>0 ? alvos[i-1].dezenas : null})));
  const base = parciais[0];
  const linhas = base.linhas.map((_, i) => {
    const ls = parciais.map(p => p.linhas[i]);
    const jogos = ls.reduce((a,l)=> a + l.jogos, 0);
    const peso = (sel) => ls.reduce((a,l)=> a + sel(l)*l.jogos, 0)/jogos;
    return {
      id: ls[0].id, nome: ls[0].nome, jogos,
      media: peso(l=>l.media),
      melhor: Math.max(...ls.map(l=>l.melhor)),
      popularidade: peso(l=>l.popularidade),
      sobreposicao: peso(l=>l.sobreposicao),
      custo: ls[0].custo
    };
  });
  const ep = erroPadraoAcertos(m, base.tamanho, linhas[0].jogos);
  linhas.forEach(l => l.z = (l.media - base.esperado)/Math.max(ep,1e-9));
  return {linhas, esperado: base.esperado, erroPadrao: ep, tamanho: base.tamanho};
}

/* Veredito sobre acertos: algum método saiu da faixa de ruído?
   Limite de 3 desvios porque são vários métodos comparados de uma vez — a 2
   desvios, com 5 métodos, um alarme falso seria esperado com frequência. */
function vereditoAcertos(r, umConcursoSo){
  const fora = r.linhas.filter(l => Math.abs(l.z) > 3);
  if(!fora.length)
    return {ok:true, texto:"Nenhum método se separou do acaso além do ruído — que é exatamente o previsto."};
  /* Em um concurso só, desvio grande costuma NÃO ser ruído: se as dezenas
     sorteadas têm cara de aposta humana (baixas, seguidas, soma na média), os
     métodos que fogem desse padrão acertam menos ali de propósito. É efeito
     estrutural, e some quando os concursos se acumulam, porque sorteio real
     sai uniforme. Dizer "é ruído" aqui seria impreciso. */
  const nomes = fora.map(f=>f.nome).join(", ");
  return umConcursoSo
    ? {ok:false, texto:`${nomes} ficou longe da média neste concurso. Em um concurso `
        + `isolado isso costuma ser efeito do próprio sorteio: quando as dezenas sorteadas `
        + `têm cara de aposta humana, os métodos que evitam esse padrão acertam menos ali — `
        + `e mais nos concursos de cara aleatória. Olhe o recorte com todos os concursos juntos.`}
    : {ok:false, texto:`${nomes} saiu da faixa mesmo com os concursos somados. `
        + `Isso ainda pode ser variação com poucos concursos registrados; só significaria `
        + `algo se persistisse ao longo de muitos.`};
}

/* ============================ faixa do acaso ============================
   Peça central da interface: onde uma escolha aleatória teria caído.       */
function faixaAcaso(observado, esperado, desvio, max){
  const L=360, H=38, p=10;
  const amp = Math.max(desvio*3, Math.abs(observado-esperado)*1.4, 1);
  const min = Math.max(0, esperado-amp), sup = Math.min(max ?? esperado+amp, esperado+amp);
  const x = v => p + (Math.min(Math.max(v,min),sup)-min)/((sup-min)||1)*(L-2*p);
  const fora = desvio>0 && Math.abs(observado-esperado) > 2*desvio;
  return `<div class="faixa"><svg viewBox="0 0 ${L} ${H}" role="img"
    aria-label="você fez ${nf(observado,2)}, o acaso faria ${nf(esperado,2)}">
    <rect x="${x(esperado-2*desvio)}" y="11" width="${Math.max(x(esperado+2*desvio)-x(esperado-2*desvio),2)}"
      height="15" rx="3" fill="var(--acaso)" opacity=".15"/>
    <line x1="${p}" y1="18.5" x2="${L-p}" y2="18.5" stroke="var(--linha)"/>
    <line x1="${x(esperado)}" y1="7" x2="${x(esperado)}" y2="30" stroke="var(--acaso)"
      stroke-width="1.6" stroke-dasharray="3 3"/>
    <rect x="${x(observado)-1.6}" y="5" width="3.2" height="27" rx="1.6"
      fill="${fora?"var(--alerta)":"var(--seu)"}"/>
  </svg>
  <div class="legenda">
    <span><i style="border-top:3px solid ${fora?"var(--alerta)":"var(--seu)"}"></i>você ${nf(observado,2)}</span>
    <span><i style="border-top:2px dashed var(--acaso)"></i>acaso ${nf(esperado,2)}</span>
    <span><i style="border-top:7px solid var(--acaso);opacity:.3"></i>faixa normal</span>
  </div></div>`;
}

function esperadoAcertos(m, tamanho){
  const c = MODALIDADES[m];
  return c.k * tamanho / c.N;

function desvioAcertos(m, tamanho){
  const c = MODALIDADES[m], N=c.N, K=c.k, n=tamanho;
  const v = n*(K/N)*(1-K/N)*((N-n)/(N-1));
  return Math.sqrt(Math.max(v,1e-9));
}

/* O placar é POR MODALIDADE, e isso não é preferência de layout.

   A versão anterior somava os acertos de todas as loterias e tirava uma média.
   O número saía bonito e não significava nada: o acaso espera 0,6 acerto na
   Mega-Sena e 9,0 na Lotofácil, então a média conjunta mede principalmente
   qual mistura de modalidades a pessoa jogou — não o desempenho dela. Somar
   grandezas com esperanças diferentes é o mesmo erro de somar temperaturas em
   Celsius e Fahrenheit.

   O que continua junto é o dinheiro, porque real é real em qualquer
   modalidade, e o total gasto é a informação que mais importa para quem joga.

   Por método, a comparação vive DENTRO de cada modalidade pela mesma razão. */
function blocoDaModalidade(codigo, conf){
  const c = MODALIDADES[codigo];
  const total = conf.length;
  const media = conf.reduce((a,b)=>a+b.acertos,0)/total;
  const esperado = conf.reduce((a,b)=> a + esperadoAcertos(codigo, b.tamanho), 0)/total;
  /* Erro padrão da média: o desvio de um jogo dividido pela raiz do número de
     jogos. Sem dividir, a faixa ficaria larga demais e nunca acusaria nada. */
  const dp = Math.sqrt(conf.reduce((a,b)=> a + desvioAcertos(codigo,b.tamanho)**2, 0))/total;
  const melhor = conf.reduce((a,b)=> b.acertos>a.acertos ? b : a);
  const dentro = Math.abs(media - esperado) <= 2*Math.max(dp,1e-9);
  const premiados = conf.filter(x => faixaAtingida(codigo, x.acertos) !== null).length;

  const porMetodo = {};
  conf.forEach(cf=>{
    const m = porMetodo[cf.metodo] = porMetodo[cf.metodo] || {n:0, acertos:0, esperado:0};
    m.n++; m.acertos += cf.acertos; m.esperado += esperadoAcertos(codigo, cf.tamanho);
  });

  return `<div class="carta">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;
      margin-bottom:10px">
      <h3>${esc(c.nome)}</h3>

    </div>

        <div class="val">${nf(media,3)}</div>
        <div class="sub">acaso: ${nf(esperado,3)}</div></div>
      <div class="kpi"><div class="rot">melhor resultado</div>
        <div class="val">${melhor.acertos}</div>
        <div class="sub">concurso ${esc(melhor.concurso)}</div></div>
      <div class="kpi"><div class="rot">jogos conferidos</div>
        <div class="val" style="font-size:1.15rem">${inf(total)}</div>
        <div class="sub">em ${inf(new Set(conf.map(x=>x.concurso)).size)} concursos</div></div>
      <div class="kpi"><div class="rot">em faixa de prêmio</div>
        <div class="val" style="font-size:1.15rem">${inf(premiados)}</div>
        <div class="sub">de ${inf(total)}</div></div>
    </div>
    ${faixaAcaso(media, esperado, Math.max(dp,0.02))}
    <div class="nota ${dentro?"":"atencao"}">
      ${dentro
        ? `Dentro da faixa do acaso nesta modalidade. É o resultado esperado: num sorteio honesto nenhum método muda essa média.`
        : `Fora da faixa normal nesta modalidade. Com poucas conferências isso acontece por variação comum — com o tempo tende a voltar para a linha do acaso.`}
    </div>
    ${Object.keys(porMetodo).length < 2 ? "" : `
      <h2 style="margin:14px 0 8px">por método, dentro da ${esc(c.nome)}</h2>
      <div class="rolagem"><table>
        <thead><tr><th>método</th><th>jogos</th><th>média</th><th>acaso</th><th>diferença</th></tr></thead>
        <tbody>${Object.entries(porMetodo).map(([k,v])=>{
          const m = v.acertos/v.n, e = v.esperado/v.n;
          return `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${nf(m,3)}</td><td>${nf(e,3)}</td>
            <td style="color:${m-e>=0?"var(--acaso)":"var(--alerta)"}">${m-e>=0?"+":""}${nf(m-e,3)}</td></tr>`;

}
