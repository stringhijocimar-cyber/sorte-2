    };
    el.onclick = escolher;
    el.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); escolher(); } };
  });

  /* --- motor de pesquisa --- */
  document.querySelectorAll("[data-atalho]").forEach(b => b.onclick = () => {
    irParaTela(b.dataset.atalho);
  });

  document.querySelectorAll("[data-aba-pq]").forEach(b => b.onclick = () => {
    S.abaPesquisa = b.dataset.abaPq; pintar();
  });

  /* Alternador do gráfico de evolução. Não é gravado: é como se está olhando
     agora, não uma preferência. */
  document.querySelectorAll("[data-serie]").forEach(b => b.onclick = () => {
    S.serieEvolucao = b.dataset.serie; pintar();
  });

  const pqauto = $("#pq-auto");
  if(pqauto) pqauto.onchange = e => {
    S.pesquisaAutomatica = e.target.checked;
    Guardar.gravar("pesquisaAutomatica", S.pesquisaAutomatica);
  };
  const pqgo = $("#pq-go");
  if(pqgo) pqgo.onclick = () => {
    const saida = $("#pq-saida");
    const quantas = Number(($("#pq-n") || {}).value || 5);
    const rotulo = pqgo.textContent;
    pqgo.disabled = true;
    const passos = Array.from({length: quantas}, (_, i) => i + 1);
    saida.innerHTML = barraProgresso(0, quantas + 1, "evoluindo hipóteses");
    /* emFatias devolve o controle ao navegador entre gerações: sem isso, 50
       gerações seguidas travam a tela e o app parece ter morrido. */
    emFatias(passos,
      () => rodarGeracao(S.modalidade),
      (feitos) => { saida.innerHTML = barraProgresso(feitos, quantas + 1, "evoluindo hipóteses"); },
      () => {
        saida.innerHTML = barraProgresso(quantas, quantas + 1, "julgando fora da amostra");
        setTimeout(() => {
          try{ concluirPesquisa(S.modalidade); }
          catch(e){ saida.innerHTML = `<div class="nota atencao">${esc(e.message)}</div>`; }
          Guardar.gravar("pesquisaAdaptativa", S.pesquisaAdaptativa);
          pqgo.disabled = false; pqgo.textContent = rotulo;
          pintar();
        }, 20);
      });
  };

  const sgo = $("#s-go");
  if(sgo) sgo.onclick = () => {
    const saida = $("#s-saida");
    sgo.disabled = true; sgo.textContent = "lendo o histórico…";
    /* setTimeout para o botão chegar a mudar de texto antes do cálculo: são
       algumas centenas de milissegundos de trabalho síncrono. */
    setTimeout(() => {
      let s;
      try{ s = sugestaoDoSistema(S.modalidade, tamanhoPadrao(S.modalidade)); }
      catch(e){ s = {erro: e.message}; }
      saida.innerHTML = tabelaSugestao(s);
      if(!s.erro && $("#s-salvar")) $("#s-salvar").onclick = () => {
        const jogo = {id: `${Date.now().toString(36)}-s`, dezenas: s.dezenas,
          modalidade: S.modalidade, metodo: "sugestao", data: hoje(),
          lote: `S${Date.now().toString(36)}`, conferencias: []};
        S.jogos = S.jogos.concat([jogo]);
        Guardar.gravar("jogos", S.jogos);
        irParaTela("jogos");
      };
      sgo.disabled = false; sgo.textContent = "Sugerir outro jogo";
    }, 20);
  };

  const go = $("#g-go");
  if(go) go.onclick = () => {
    const saida = $("#g-saida");
    const c = MODALIDADES[S.modalidade], t = tamanhoPadrao(S.modalidade);
    go.disabled = true; go.textContent = "montando…";
    setTimeout(()=>{
      try{
        let jogos, extra = "";
        if(S.metodo === "fechamento"){
          const dez = ($("#g-dez").value||"").split(/[\s,;]+/).filter(Boolean).map(Number);
          S.dezenasFechamento = dez;
          S.jFechamento = +$("#g-j").value; S.garantia = +$("#g-gar").value;
          const r = gerarFechamento(S.modalidade, dez, S.jFechamento, S.garantia);
          jogos = r.bilhetes;
          extra = `<div class="kpis" style="margin-top:12px">
            <div class="kpi"><div class="rot">garantia verificada</div>
              <div class="val">${r.garantiaVerificada}</div>
              <div class="sub">se ${S.jFechamento} das suas saírem</div></div>
            <div class="kpi"><div class="rot">custo</div>
              <div class="val" style="font-size:1.05rem">${brl(jogos.length*c.preco)}</div>
              <div class="sub">${jogos.length} jogos, volante inteiro: ${inf(combinacoes(dez.length,c.k))}</div></div>
          </div>`;
        } else {
          jogos = gerarPor(S.metodo, S.modalidade, S.quantidade, t);
        }

        S.ultimoLote = jogos.map((dez,i)=>({
          id: `${Date.now().toString(36)}-${i}`, dezenas: dez,
          modalidade: S.modalidade, metodo: S.metodo, data: hoje(),
          lote: `L${Date.now().toString(36)}`, conferencias: []
        }));
        const loteId = S.ultimoLote[0].lote;
        S.ultimoLote.forEach(j => j.lote = loteId);

        saida.innerHTML = extra + S.ultimoLote.map(j=>`
          <div class="ficha">
            <div class="topo"><span class="id">${esc(nomeDoMetodo(j.metodo))}</span>
              <span class="selo">${j.dezenas.length} dezenas</span></div>
            <div class="dezenas">${j.dezenas.map(d=>`<span class="dz marcada">${pad(d)}</span>`).join("")}</div>
          </div>`).join("") + `
          <button class="acao" id="g-salvar" style="margin-top:6px">Salvar ${S.ultimoLote.length} jogo${S.ultimoLote.length>1?"s":""}</button>`;

        $("#g-salvar").onclick = () => {
          S.jogos = S.jogos.concat(S.ultimoLote);
          Guardar.gravar("jogos", S.jogos);
          irParaTela("jogos");
        };
      }catch(e){
        saida.innerHTML = `<div class="nota atencao">${esc(e.message)}</div>`;
      }
      go.disabled = false;
      go.textContent = `Gerar ${S.quantidade} jogo${S.quantidade>1?"s":""}`;
    }, 20);
  };

  if($("#b-rep")) $("#b-rep").onchange = e => { S.bancadaRep = Number(e.target.value); };
  if($("#b-qtd")) $("#b-qtd").onchange = e => { S.bancadaQtd = Number(e.target.value); };
  if($("#b-go")) $("#b-go").onclick = () => {
    const go = $("#b-go"), saida = $("#b-saida");
    const rotulo = go.textContent;
    go.disabled = true; go.textContent = "testando…";

    const todos = S.resultados.filter(r => r.modalidade === S.modalidade);
    /* TETO nos concursos testados. Sem ele, com o histórico completo carregado
       a bancada roda 5 métodos × 40 lotes × 3 jogos em CADA um dos milhares de
       concursos — mais de um milhão de gerações, minutos de tela travada. Foi
       exatamente o que aconteceu.

       Os mais recentes, porque a bancada mede se um método se distingue do
       acaso, e para isso a amostra recente serve tanto quanto a antiga — com a
       vantagem de refletir o volante e os preços de hoje. */
    const TETO_ALVOS = S.bancadaAlvos || 10;
    const alvos = todos.slice(-TETO_ALVOS);
    const opcoes = {repeticoes:S.bancadaRep, quantos:S.bancadaQtd};
    /* +1 pelo recorte agregado, que roda depois dos individuais. */
    const total = alvos.length + (alvos.length > 1 ? 1 : 0);

    saida.innerHTML = barraProgresso(0, total, "testando os métodos");

    /* Cada alvo é conferido com o concurso ANTERIOR como referência do
       "evita o concurso anterior" — nunca com ele próprio. */
    const brutos = [];
    emFatias(alvos,
      (r, i) => {
        const bruto = bancada(S.modalidade, r.dezenas,
          Object.assign({}, opcoes, {evitar: i>0 ? alvos[i-1].dezenas : null}));
        brutos.push(bruto);
        return tabelaBancada(bruto,
          `concurso ${r.concurso} — ${r.dezenas.map(pad).join(" ")}`
            + (i>0 ? "" : " (sem concurso anterior registrado)"), true);
      },
      (feitos) => { saida.innerHTML = barraProgresso(feitos, total, "testando os métodos"); },
      (partes) => {
        const finalizar = (agregado) => {
          const aviso = todos.length > alvos.length
            ? `<div class="nota">Testado nos <strong>${alvos.length} concursos mais
               recentes</strong>, de ${todos.length} no app. O teto existe porque a
               bancada gera ${inf(opcoes.repeticoes * opcoes.quantos * 5)} jogos por
               concurso — rodar em tudo levaria minutos de tela parada, sem melhorar a
               leitura.</div>`
            : "";
          saida.innerHTML = aviso + (agregado ? agregado : "") +
            partes.filter(p => typeof p === "string").join("");
          go.disabled = false; go.textContent = rotulo;
        };
        if(alvos.length > 1){
          saida.innerHTML = barraProgresso(alvos.length, total, "juntando os concursos");
          setTimeout(() => {
            let agregado = "";
            try{
              agregado = tabelaBancada(
                bancadaAgregada(S.modalidade, alvos, opcoes, brutos),
                `os ${alvos.length} concursos juntos`);
            }catch(e){ agregado = `<div class="nota atencao">${esc(e.message)}</div>`; }
            finalizar(agregado);
          }, 0);
        } else finalizar("");
      });
  };

  document.querySelectorAll("[data-apagar]").forEach(b => b.onclick = () => {
    if(!confirm("Apagar este lote de jogos?")) return;
    S.jogos = S.jogos.filter(j => j.lote !== b.dataset.apagar);
    Guardar.gravar("jogos", S.jogos); pintar();
  });
  document.querySelectorAll("[data-copiar]").forEach(b => b.onclick = async () => {
    const texto = S.jogos.filter(j=>j.lote===b.dataset.copiar)
      .map(j => j.dezenas.map(pad).join(" ")).join("\n");
    try{ await navigator.clipboard.writeText(texto); b.textContent = "copiado"; }
    catch(e){ b.textContent = "não deu para copiar"; }
    setTimeout(()=> b.textContent = "Copiar lote", 1600);
  });


  const cgo = $("#c-go");
  if(cgo) cgo.onclick = () => {
    const saida = $("#c-saida");
    const c = MODALIDADES[S.modalidade];
    const dezenas = ($("#c-dez").value||"").split(/[\s,;-]+/).filter(Boolean).map(Number);
    const concurso = $("#c-num").value.trim();
    const data = $("#c-data").value;
    if(dezenas.length !== c.k){
      saida.innerHTML = `<div class="nota atencao">A ${esc(c.nome)} sorteia ${c.k} dezenas;
        você digitou ${dezenas.length}.</div>`; return;
    }
    if(new Set(dezenas).size !== dezenas.length){
      saida.innerHTML = `<div class="nota atencao">Há dezenas repetidas no resultado.</div>`; return;
    }
    const fora = dezenas.filter(d => d < c.base || d > c.N + c.base - 1);
    if(fora.length){
      saida.innerHTML = `<div class="nota atencao">Fora do intervalo permitido: ${fora.join(", ")}.</div>`;
      return;
    }
    if(!concurso){
      saida.innerHTML = `<div class="nota atencao">Informe o número do concurso.</div>`; return;
    }

    const alvo = S.jogos.filter(j => j.modalidade === S.modalidade);
    if(!alvo.length){
      saida.innerHTML = `<div class="nota atencao">Nenhum jogo salvo desta modalidade.</div>`;
      return;
    }
    let soma = 0, somaEsperado = 0;
    alvo.forEach(j=>{
      j.conferencias = (j.conferencias||[]).filter(cf => cf.concurso !== concurso);
      const acertos = j.dezenas.filter(d => dezenas.includes(d)).length;
      j.conferencias.push({concurso, data, dezenas, acertos});
      soma += acertos; somaEsperado += esperadoAcertos(j.modalidade, j.dezenas.length);
    });
    /* Se este concurso ja tinha sido trazido pela busca, ele carrega rateio e
       cidades. Substituir sem olhar apagaria essa informacao e transformaria um
       "3 ganhadores em Belo Horizonte" num "nao informado" — perda silenciosa
       causada por conferir a mao um resultado que o app ja conhecia. */
    const anterior = S.resultados.find(r =>
      r.concurso === concurso && r.modalidade === S.modalidade);
    S.resultados = S.resultados.filter(r => !(r.concurso===concurso && r.modalidade===S.modalidade));
    S.resultados.push(Object.assign({}, anterior || {},
      {concurso, data, dezenas, modalidade:S.modalidade}));
    Guardar.gravar("jogos", S.jogos); Guardar.gravar("resultados", S.resultados);

    const media = soma/alvo.length, esperado = somaEsperado/alvo.length;
    const dp = desvioAcertos(S.modalidade, alvo[0].dezenas.length)/Math.sqrt(alvo.length);
    /* Era `premiou`: quantos jogos caíram numa faixa. Virou "melhor resultado",
       porque a conferência conta coincidência e não prêmio. */
    const melhorAcerto = alvo.reduce((m, j) =>
      Math.max(m, j.conferencias[j.conferencias.length-1].acertos), 0);

    const doConcurso = S.resultados.find(r =>
      r.concurso === concurso && r.modalidade === S.modalidade) || {};
    saida.innerHTML = `<div class="carta ${ganhadoresDoConcurso(doConcurso).estado}">
      <h3>Concurso ${esc(concurso)} — ${alvo.length} jogo${alvo.length>1?"s":""} conferido${alvo.length>1?"s":""}</h3>
      ${seloGanhadores(doConcurso)}
      ${/* O resultado sai na cartela, e não em chips: é o mesmo objeto que a
             pessoa marcou, agora com o sorteio impresso. Quando há um jogo só,
             a cartela mostra as duas camadas — marcação e sorteio — e o acerto
             é a sobreposição. Com vários jogos seria ambíguo de quem é a
             marcação, então aí a cartela mostra apenas o sorteio, e cada jogo
             tem a sua própria cartela em Meus jogos. */
        alvo.length === 1
          ? cartela(S.modalidade, alvo[0].dezenas,
              {sorteadas:dezenas, selo:`concurso ${concurso}`}) + legendaCartela
          : cartela(S.modalidade, [], {sorteadas:dezenas,
              selo:`concurso ${concurso}`,
              rodape:`<div class="pe"><span>resultado sorteado</span>
                <span>${alvo.length} jogos conferidos — veja cada cartela em Meus jogos</span></div>`})}
      <div class="kpis">
        <div class="kpi"><div class="rot">coincidências médias</div><div class="val">${nf(media,2)}</div>
          <div class="sub">acaso: ${nf(esperado,2)}</div></div>
        <div class="kpi"><div class="rot">melhor resultado</div>
          <div class="val">${melhorAcerto}</div><div class="sub">de ${alvo.length} jogo${alvo.length>1?"s":""}</div></div>
      </div>
      ${faixaAcaso(media, esperado, Math.max(dp,0.05))}
    </div>
    ${alvo.map(j=>ficha(j)).join("")}`;
  };

  const tema = $("#btn-tema");
  if(tema) tema.onclick = () => {
    S.tema = S.tema === "claro" ? "escuro" : "claro";
    document.documentElement.dataset.tema = S.tema;
    Guardar.gravar("tema", S.tema);
  };
}

/* ============================ navegação ============================ */
/* ============================ navegação ============================
   Duas camadas, e não uma barra com nove ícones. A barra inferior tem cinco
   seções — o limite prático antes de os alvos ficarem pequenos demais para o
   dedo — e cada seção abre suas telas num controle segmentado. Sem isso, cada
   tela nova encolheria todas as outras.

   Cada tela declara também um subtítulo: o título sozinho ("Bancada") não diz
   o que a tela faz, e a explicação ficava perdida no meio do conteúdo.      */
/* As cinco rotas do mockup: Início · Análise · Experimentos · Resultados · Mais.

   O mapeamento preserva TODAS as telas que já existiam — nenhuma ficou sem
   porta. Foi a única regra que me impus aqui: reorganizar navegação é onde
   recurso some calado, e este app já perdeu função assim antes.

   Gerar e a bancada foram para "Experimentos" porque é o que elas são: montar
   combinações e testar métodos contra o sorteio. Meus jogos e a teimosinha
   foram para "Mais" junto com o Entender — são o que a pessoa consulta, não o
   que ela faz todo dia. */
const SECOES = [
  {id:"inicio", nome:"Início",
   icone:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
   telas:[
     {id:"inicio", nome:"Início", titulo:"Sorte 2",
      sub:"Laboratório Estatístico. O motor de pesquisa, seus jogos e os concursos."}
   ]},
  {id:"analise", nome:"Análise",
   icone:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
   telas:[
     {id:"pesquisa", nome:"IA Adaptativa", titulo:"Motor de pesquisa",
      sub:"Cria hipóteses sozinho, testa, descarta as ruins e cruza as que sobram. É um laboratório: não produz dezenas para apostar."},
     {id:"aprendizado", nome:"Aprendizado", titulo:"Aprendizado por modalidade",
      sub:"Treina um modelo em cada modalidade separadamente e mede, fora da amostra, se ele aprendeu algo."},
     {id:"placar", nome:"Placar", titulo:"Placar",
      sub:"Seu resultado acumulado, comparado com o que o acaso teria feito com o mesmo dinheiro."},
     {id:"estatisticas", nome:"Estatísticas", titulo:"Estatísticas do histórico",
      sub:"O retrato do que já saiu, sempre ao lado do que o acaso produziria. Descreve o passado; não prevê o próximo."}
   ]},
  /* "Jogos" ocupa o terceiro lugar da barra, como no mockup. Aqui moram as
     telas que giram em torno do que a pessoa salvou: os jogos, a conferência
     deles e a teimosinha. */
  {id:"jogos", nome:"Jogos",
   icone:'<rect x="3.5" y="4" width="17" height="17" rx="2.5"/><path d="M8 9.5h8M8 14h5"/>',
   telas:[
     {id:"jogos", nome:"Jogos Salvos", titulo:"Meus Jogos",
      sub:"Tudo o que você salvou, conferido automaticamente contra os resultados que o app conhece."},
     {id:"conferir", nome:"Conferência", titulo:"Conferir",
      sub:"O último sorteio que o app conhece, comparado com os seus jogos salvos. A conferência é automática."},
     {id:"teimosinha", nome:"Teimosinha", titulo:"Teimosinha",
      sub:"Repete o mesmo jogo por vários concursos seguidos. O app acompanha o custo total e confere cada concurso sozinho."}
   ]},
  {id:"resultados", nome:"Resultados",
   icone:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v3M16 3v3"/>',
   telas:[
     {id:"resultados", nome:"Concursos", titulo:"Resultados",
      sub:"Últimos concursos"}
   ]},
  /* "Mais" recolhe o que saiu da barra: montar jogos, a bancada e o Entender.
     Nenhuma tela ficou sem porta — é a regra que a bateria de interface cobra
     a cada push, e reorganizar navegação é exatamente onde recurso some. */
  {id:"mais", nome:"Mais",
   icone:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
   telas:[
     {id:"gerar", nome:"Gerar", titulo:"Gerar jogos",
      sub:"Monta combinações válidas por método. Todos têm a mesma chance de acerto — o que muda é com quantas pessoas você dividiria."},
     {id:"montar", nome:"Montar", titulo:"Montar à mão",
      sub:"Marque as dezenas que quiser. O app mostra as características do jogo e como elas se comparam ao esperado do acaso."},
     {id:"bancada", nome:"Bancada", titulo:"Bancada de testes",
      sub:"Roda todos os métodos contra o mesmo sorteio e mede se algum se distingue do acaso."},
     {id:"entender", nome:"Entender", titulo:"Entender",
      sub:"O que este app faz, o que ele não faz, e por quê."}
   ]}
];


/* ==================== voltar ====================

   O app não tinha nenhum tratamento de "voltar". No APK isso significa que o
   botão do Android FECHAVA o app: quem entrasse em Meus jogos por um atalho da
   tela inicial e apertasse voltar era jogado para fora, perdendo o lugar.

   A pilha guarda de onde se veio, e só quando "de onde" faz sentido:

   * Atalho ou salto interno (`irParaTela`) EMPILHA — foi um mergulho, e há para
     onde voltar.
   * Barra inferior e abas do segmento LIMPAM — são movimentos laterais entre
     seções irmãs, e voltar de um deles não quer dizer nada.

   Por isso a seta aparece e some: uma seta sempre visível que às vezes não tem
   destino é pior do que não ter seta. Aqui, se ela está na tela, ela leva a
   algum lugar de onde a pessoa de fato veio.                              */

function irParaTela(id, opcoes){
  const empilhar = !(opcoes && opcoes.lateral);
  if(empilhar && id !== S.tela){
    S.pilha = (S.pilha || []).concat([S.tela]);
    /* Teto para o caso de alguém circular entre duas telas por muito tempo:
       a pilha não pode virar um histórico infinito guardado em memória. */
    if(S.pilha.length > 20) S.pilha = S.pilha.slice(-20);
  } else if(!empilhar){
    S.pilha = [];
  }
  S.tela = id;
  window.scrollTo(0, 0);
  pintar();
}

function podeVoltar(){ return !!(S.pilha && S.pilha.length); }

function voltar(){
  if(!podeVoltar()) return false;
  S.tela = S.pilha.pop();
  window.scrollTo(0, 0);
  pintar();
  return true;
}

/* O botão de voltar do Android, que até aqui não era tratado — e portanto
   fechava o app de qualquer tela.

   A ordem importa e é a que o sistema ensina em todo app Android:

   1. folha de atividades aberta -> fecha a folha
   2. há para onde voltar        -> volta uma tela
   3. nada disso                 -> aí sim sai do app

   Sair na primeira tela é comportamento correto e deliberado: prender a pessoa
   dentro do app é o defeito oposto, e mais irritante. */
function ligarBotaoVoltarDoAndroid(){
  let App = null;
  try{
    const c = (typeof Capacitor !== "undefined") ? Capacitor : null;
    App = (c && c.isNativePlatform && c.isNativePlatform() && c.Plugins) ? c.Plugins.App : null;
  }catch(e){ return false; }
  if(!App || typeof App.addListener !== "function") return false;
  try{
    App.addListener("backButton", () => {
      /* Qualquer camada sobreposta fecha primeiro — folha de atividades ou
         gaveta. Só depois o voltar mexe na navegação. */
      for(const id of ["#folha-avisos", "#gaveta"]){
        const alvo = $(id);
        if(alvo && alvo.dataset.aberta === "1"){ alvo.dataset.aberta = "0"; return; }
      }
      if(voltar()) return;
      if(typeof App.exitApp === "function") App.exitApp();
    });
    return true;
  }catch(e){ return false; }
}

const secaoAtual = () => SECOES.find(s => s.telas.some(t => t.id === S.tela)) || SECOES[0];
const telaAtual = () => secaoAtual().telas.find(t => t.id === S.tela) || secaoAtual().telas[0];

function navegacao(){
  const sec = secaoAtual();
  $("#abas").innerHTML = SECOES.map(s=>`
    <button data-secao="${s.id}" ${s.id===sec.id?'aria-current="page"':""}>
      <svg viewBox="0 0 24 24">${s.icone}</svg>${esc(s.nome)}</button>`).join("");
  document.querySelectorAll("[data-secao]").forEach(b => b.onclick = () => {
    const s = SECOES.find(x => x.id === b.dataset.secao);
    /* Entrar numa seção leva à primeira tela dela, salvo quando já se está
       nela — aí o clique é um "voltar ao topo", não uma troca de tela.
       Em qualquer dos casos é movimento LATERAL: zera a pilha. */
    irParaTela(s.id !== sec.id ? s.telas[0].id : S.tela, {lateral:true});
  });
}

/* A modalidade saiu da trilha fixa no topo e passou a viver em dois lugares:
   a gaveta do ☰ (sempre disponível) e os chips da tela Resultados, onde o
   mockup os desenha. É a MESMA escolha global — trocar num lugar troca no
   outro, porque `data-mod` é lido por um só tratador. */
function trocarModalidade(mod){
  if(!MODALIDADES[mod] || mod === S.modalidade) return;
  S.modalidade = mod; S.tamanho = null; REFERENCIA = {};
  Guardar.gravar("modalidade", S.modalidade);
  const g = $("#gaveta"); if(g) g.dataset.aberta = "0";
  pintar();
}

function trilhaModalidade(){
  const gav = $("#gaveta-mods");
  if(gav) gav.innerHTML = Object.entries(MODALIDADES).map(([k,v])=>
    `<button data-mod="${k}" aria-pressed="${k===S.modalidade}">${esc(v.nome)}</button>`).join("");
  document.querySelectorAll("[data-mod]").forEach(b => b.onclick = () =>
    trocarModalidade(b.dataset.mod));
}

function pintar(){
  const sec = secaoAtual(), tela = telaAtual();
  /* O recado da busca vale para a visita atual à tela. Sair dela o descarta,
     senão reaparece dias depois falando de uma conferência esquecida. */
  if(tela.id !== "conferir") S.avisoConferir = null;
  if(tela.id !== "jogos") S.avisoJogos = null;
  const segmento = sec.telas.length < 2 ? "" :
    `<div class="segmento" role="tablist">${sec.telas.map(t=>
      `<button role="tab" data-tela="${t.id}" aria-selected="${t.id===tela.id}">
        ${esc(t.nome)}</button>`).join("")}</div>`;
  /* O cartão do próximo concurso só aparece onde é contexto para a ação: ao
     montar jogo, ao olhar os jogos e ao conferir. Em Estatísticas ou Entender
     ele seria enfeite roubando o topo da tela. */
  const comProximo = ["gerar","montar","jogos","teimosinha","conferir","resultados"];
  /* Com seta, o título vai para o centro — é o cabeçalho de subtela do mockup.
     Sem seta, ele fica à esquerda como sempre esteve. A seta ganha rótulo
     dizendo PARA ONDE volta: "voltar" sozinho obriga a lembrar de onde se veio,
     e quem chega por notificação não veio de lugar nenhum que se lembre. */
  const anterior = podeVoltar() ? S.pilha[S.pilha.length - 1] : null;
  const nomeAnterior = anterior
    ? ((SECOES.flatMap(s => s.telas).find(t => t.id === anterior) || {}).titulo || "")
    : "";
  const cabecalho = podeVoltar()
    ? `<div class="titulo com-volta">
         <button class="voltar" id="voltar" aria-label="Voltar para ${esc(nomeAnterior)}">
           <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
         </button>
         <h1>${esc(tela.titulo)}</h1>
         <p>${esc(tela.sub)}</p>
       </div>`
    : `<div class="titulo"><h1>${esc(tela.titulo)}</h1><p>${esc(tela.sub)}</p></div>`;

  $("#tela").innerHTML = segmento + cabecalho +
    (comProximo.includes(tela.id) ? cartaoProximo(S.modalidade) : "") +
    T[tela.id]() +
    `<div class="aviso-fixo">Nenhum método aumenta a chance de acertar.<br>
     Loteria é gasto de entretenimento, não investimento.</div>`;
  /* Abas do segmento: telas irmãs da mesma seção. Lateral, como a barra. */
  document.querySelectorAll("[data-tela]").forEach(b => b.onclick = () => {
    irParaTela(b.dataset.tela, {lateral:true});
  });
  const seta = $("#voltar");
  if(seta) seta.onclick = () => voltar();
  navegacao();
  trilhaModalidade();
  pintarContaAvisos();
  acoes();
}

async function carregarCalibracao(){
  try{
    const r = await fetch("pesos.json", {cache:"no-cache"});
    if(!r.ok) return;
    const c = await r.json();
    if(c && c.pesos_app) CALIBRACAO = c;
  }catch(e){ /* sem arquivo: seguem as hipóteses declaradas */ }
}

(function iniciar(){
  S.jogos = Guardar.ler("jogos", []);
  S.resultados = Guardar.ler("resultados", []);
  S.tema = Guardar.ler("tema", "escuro");
  S.avisos = Guardar.ler("avisos", []);
  S.teimosinhas = Guardar.ler("teimosinhas", []);
  S.marcadas = Guardar.ler("marcadas", {});
  S.aprendizado = Guardar.ler("aprendizado", {});
  S.autoAnalise = Guardar.ler("autoAnalise", true);
  S.calibracao = Guardar.ler("calibracao", {});
  S.buscaAutomatica = Guardar.ler("buscaAutomatica", true);
  S.avisarSorteio = Guardar.ler("avisarSorteio", true);
  S.pesquisaAdaptativa = Guardar.ler("pesquisaAdaptativa", {});
  S.pesquisaAutomatica = Guardar.ler("pesquisaAutomatica", true);
  S.bancadaAlvos = Guardar.ler("bancadaAlvos", 10);
  S.ultimaBusca = Guardar.ler("ultimaBusca", {});
  S.modalidade = Guardar.ler("modalidade", S.modalidade);
  document.documentElement.dataset.tema = S.tema;
  /* A pilha de navegação NÃO é lida do armazenamento, de propósito: abrir o app
     e encontrar uma seta apontando para uma tela da semana passada não é
     memória útil, é confusão. Cada abertura começa na raiz. */
  S.pilha = [];
  /* Conferir na abertura: quem digitou um resultado e fechou o app antes de
     conferir os jogos encontra tudo conferido ao voltar. */
  conferenciaAutomatica();
  pintar();
  ligarBotaoVoltarDoAndroid();
  ligarToqueNaNotificacao();
  /* Análises pendentes na abertura. Sem isto, quem já tinha histórico ficaria
     esperando o próximo concurso para ver a primeira análise — e quem fechou o
     app no meio de uma análise nunca a veria terminar. Roda depois do pintar()
     para a tela aparecer primeiro; o processamento é fatiado e não trava. */
  if(S.autoAnalise !== false) analisarPendentes();
  /* Busca diária em segundo plano. Não bloqueia a abertura e não avisa quando
     falha: sem sinal é o caso comum, e um aviso a cada abertura offline
     treinaria a pessoa a ignorar o sino. */
  buscaDiaria().then(r => { if(r.novos) pintar(); }).catch(()=>{});

  /* Sino e folha de avisos. Ficam fora de pintar() porque vivem no cabeçalho,
     que não é redesenhado a cada troca de tela. */
  const folha = $("#folha-avisos");
  $("#btn-avisos").onclick = () => {
    /* Abrir ANTES de desenhar. A folha fica em display:none enquanto fechada, e
       elemento escondido mede zero — a faixa de chips decide se precisa de
       rolagem comparando larguras, e com tudo zerado ela decidia sempre que
       cabia. Ordem invertida, medida certa. */
    folha.dataset.aberta = "1";
    pintarAvisos();
  };
  folha.addEventListener("click", e => {
    if(!e.target.closest("[data-fechar]")) return;
    folha.dataset.aberta = "0";
    /* Fechar marca como lido: o aviso já foi mostrado, e manter o contador
       aceso depois disso treinaria a pessoa a ignorá-lo. */
    S.avisos.forEach(a => a.lido = true);
    Guardar.gravar("avisos", S.avisos);
    pintarContaAvisos();
  });
  /* Gaveta do ☰. Mesmo par abrir/fechar da folha; a diferença é só de onde ela
     entra na tela. Fechar não marca nada como lido — não há nada para ler. */
  const gaveta = $("#gaveta"), botaoMenu = $("#btn-menu");
  if(gaveta && botaoMenu){
    botaoMenu.onclick = () => {
      gaveta.dataset.aberta = "1";
      botaoMenu.setAttribute("aria-expanded", "true");
      trilhaModalidade();
    };
    gaveta.addEventListener("click", e => {
      if(!e.target.closest("[data-fechar]")) return;
      gaveta.dataset.aberta = "0";
      botaoMenu.setAttribute("aria-expanded", "false");
    });
  }

  document.addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    /* Uma só tecla, duas camadas: fecha a que estiver aberta, na ordem em que
       elas se sobrepõem. Sem isto o Escape fechava só os avisos. */
    for(const alvo of [folha, gaveta]){
      if(alvo && alvo.dataset.aberta === "1"){
        alvo.querySelector("[data-fechar]").click();
        return;
      }
    }
  });
  carregarCalibracao().then(()=>{ if(CALIBRACAO && S.tela==="gerar") pintar(); });
  /* O try/catch e a checagem de objeto não são zelo excessivo: um navegador em
     que "serviceWorker" existe na chave mas vem indefinido — modo privativo,
     WebView restrita — fazia esta linha lançar, e a exceção abortava o RESTO
     do iniciar(), deixando o app pela metade sem nenhum sintoma claro. O
     service worker é acessório; nada abaixo dele pode depender de ele existir. */
  if("serviceWorker" in navigator && navigator.serviceWorker) try{
    navigator.serviceWorker.register("sw.js").then(reg => {
      /* Avisa quando uma versão nova terminou de baixar. Sem isto, a pessoa
         só veria a atualização na PRÓXIMA abertura — e foi exatamente assim
         que o app ficou congelado numa versão antiga sem ninguém entender por
         quê. */
      reg.addEventListener("updatefound", () => {
        const novo = reg.installing;
        if(!novo) return;
        novo.addEventListener("statechange", () => {
          if(novo.state === "installed" && navigator.serviceWorker.controller){
            avisar("atualizacao", "Versão nova disponível",
              "Toque para recarregar e usar a versão mais recente do app.",
              `versao:${Date.now()}`);
            pintarContaAvisos();
          }
        });
      });
      reg.update().catch(()=>{});
    }).catch(()=>{});

    /* Quando o service worker novo assume, recarrega uma única vez. O
       controle da flag evita o laço infinito clássico: sem ela, cada troca
       dispara um reload que dispara outra troca. */
    let jaRecarregou = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if(jaRecarregou) return;
      jaRecarregou = true;
      location.reload();
    });
  }catch(e){ /* sem service worker: o app funciona igual, só não guarda casca */ }
})();
</script>
