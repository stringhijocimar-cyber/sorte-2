                   : `<span class="selo">pronta</span>`)
            : `faltam ${MINIMO_CONCURSOS - e.n}`}</td>
          <td>${res ? nf(res.auc,4) : "—"}</td>
          <td>${res ? nf(res.p,3) : "—"}</td></tr>`;
      }).join("")}
    </table></div>
  </div>`;
};

/* Tela do motor de pesquisa.

   Uma regra de desenho manda em tudo aqui: NENHUMA dezena aparece. O motor
   produz hipóteses sobre estrutura, e mostrar "as dezenas que a hipótese
   melhor pontua" transformaria um experimento em aposta com um olhar. Também
   não há botão de copiar nem de salvar, pelo mesmo motivo — e há um teste que
   reprova se algum aparecer. */
/* Anel de geração e gráfico de evolução — as duas peças do mockup que contam a
   história da busca sem exigir leitura de tabela.

   Ambos são SVG desenhado à mão, sem biblioteca: uma dependência aqui
   significaria o app não abrir sem internet, que é a coisa que ele mais
   garante. */

function anelGeracao(geracao, fracao){
  const r = 46, circ = 2 * Math.PI * r;
  const cheio = Math.max(0, Math.min(1, fracao || 0));
  return `<svg viewBox="0 0 120 120" width="126" height="126" role="img"
    aria-label="geração ${esc(String(geracao))}">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--trama)" stroke-width="10"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--acaso)" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${(circ*cheio).toFixed(1)} ${circ.toFixed(1)}"
      transform="rotate(-90 60 60)"/>
    <text x="60" y="58" text-anchor="middle" fill="var(--tinta)"
      font-family="var(--mono)" font-size="20" font-weight="700">G${esc(String(geracao))}</text>
    <text x="60" y="76" text-anchor="middle" fill="var(--secundaria)"
      font-family="var(--sans)" font-size="10" letter-spacing="1">geração</text>
  </svg>`;
}

/* AUC do melhor de cada geração, contra a linha do acaso em 0,5.

   O eixo é apertado de propósito — de 0,45 a 0,55 — porque é nessa faixa que
   tudo acontece: num eixo de 0 a 1 as gerações viram uma reta e o gráfico não
   diz nada. A linha tracejada em 0,5 é a referência que dá sentido ao resto. */
/* `serie` escolhe o que a linha desenha: "auc" (padrão) ou "aptidao". A escala
   muda junto — aptidão vive perto de zero e AUC perto de 0,5, e usar o mesmo
   eixo para as duas deixaria uma delas colada numa borda. */
function graficoEvolucao(historico, serie){
  const usaAptidao = serie === "aptidao";
  const pontos = (historico || []).map(l => ({
    g: l.geracao,
    auc: usaAptidao
      ? (Number.isFinite(l.melhorAptidao) ? l.melhorAptidao : 0)
      : ((l.aucPorRecorte && l.aucPorRecorte.length)
          ? l.aucPorRecorte.reduce((a,b)=>a+b,0) / l.aucPorRecorte.length : 0.5),
  }));
  if(pontos.length < 2) return `<div class="nota">O gráfico aparece a partir da
    segunda geração — com um ponto só não há evolução para mostrar.</div>`;

  const L = 300, A = 132, mx = 34, my = 14;
  /* Na aptidão o eixo se ajusta aos dados, com um mínimo de faixa para uma
     série quase plana não virar serra por causa de ruído na terceira casa. */
  let baixo = 0.45, alto = 0.55;
  if(usaAptidao){
    const vs = pontos.map(p => p.auc);
    const lo = Math.min(...vs), hi = Math.max(...vs);
    const folga = Math.max((hi - lo) * 0.25, 0.004);
    baixo = lo - folga; alto = hi + folga;
  }
  const px = i => mx + (L - mx - 8) * (pontos.length === 1 ? 0 : i / (pontos.length - 1));
  const py = v => my + (A - my*2) * (1 - (Math.max(baixo, Math.min(alto, v)) - baixo) / (alto - baixo));
  const linha = pontos.map((p,i)=>`${i?"L":"M"}${px(i).toFixed(1)},${py(p.auc).toFixed(1)}`).join("");
  const area = `${linha}L${px(pontos.length-1).toFixed(1)},${py(baixo)}L${px(0).toFixed(1)},${py(baixo)}Z`;

  return `<svg viewBox="0 0 ${L} ${A}" width="100%" height="${A}" role="img"
    aria-label="AUC do melhor de cada geração, ${pontos.length} gerações">
    <defs><linearGradient id="ev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--acaso)" stop-opacity=".22"/>
      <stop offset="1" stop-color="var(--acaso)" stop-opacity="0"/>
    </linearGradient></defs>
    ${/* As marcas seguem a escala. Deixá-las fixas em 0,45/0,50/0,55 com o eixo
          da aptidão — que vive perto de zero — imprimiria três rótulos fora do
          desenho e uma linha tracejada em lugar nenhum. A tracejada só aparece
          onde o "não distingue nada" de fato cai: 0,5 no AUC, 0 na aptidão. */""}
    ${[baixo, (baixo+alto)/2, alto].map(v=>{
      const neutro = usaAptidao ? 0 : 0.5;
      const eNeutro = Math.abs(v - neutro) < (alto - baixo) * 0.02;
      return `
      <line x1="${mx}" y1="${py(v)}" x2="${L-8}" y2="${py(v)}"
        stroke="var(--linha)" stroke-width="1" ${eNeutro?'stroke-dasharray="4 4"':""}/>
      <text x="${mx-6}" y="${py(v)+3.5}" text-anchor="end" fill="var(--secundaria)"
        font-family="var(--mono)" font-size="9">${nf(v, usaAptidao ? 3 : 2)}</text>`;
    }).join("")}
    ${(() => {
      /* A linha do neutro, quando ela cai dentro da faixa mas não coincide com
         nenhuma das três marcas — é a referência que dá sentido ao gráfico. */
      const neutro = usaAptidao ? 0 : 0.5;
      if(neutro < baixo || neutro > alto) return "";
      return `<line x1="${mx}" y1="${py(neutro)}" x2="${L-8}" y2="${py(neutro)}"
        stroke="var(--secundaria)" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>`;
    })()}
    <path d="${area}" fill="url(#ev)"/>
    <path d="${linha}" fill="none" stroke="var(--acaso)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${pontos.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(p.auc).toFixed(1)}" r="${
      i===pontos.length-1?3.5:2}" fill="var(--acaso)"/>`).join("")}
    <text x="${L-8}" y="${A-2}" text-anchor="end" fill="var(--secundaria)"
      font-family="var(--sans)" font-size="9">gerações</text>
  </svg>`;
}

/* Uma linha de traço: rótulo, barra a partir do centro, valor. O centro é
   0,5 — que é "não distingue nada" — então a barra cresce para a direita
   quando a hipótese separa a favor e para a esquerda quando separa ao
   contrário. Ler quatro recortes vira um relance em vez de uma tabela. */
function tracoAuc(rotulo, valor, escala){
  const desvio = valor - 0.5;
  const largura = Math.min(50, Math.abs(desvio) / (escala || 0.06) * 50);
  const negativo = desvio < 0;
  return `<div class="pq-traco ${negativo?"negativo":""}">
    <span>${esc(rotulo)}</span>
    <i style="--w:${largura.toFixed(1)}%;--dx:${negativo?"-100%":"0"}"></i>
    <b>${nf(valor,4)}</b></div>`;
}

T.pesquisa = () => {
  const m = S.modalidade;
  const c = MODALIDADES[m];
  const mem = S.pesquisaAdaptativa[m];
  const hist = historicoDe(m);

  const mem0 = S.pesquisaAdaptativa[m];
  const cabeca = `
  <div class="pq-hero">
    <div>
      <span class="pq-selo">laboratório estatístico</span>
      <h2 style="margin-top:8px">${mem0 && mem0.geracao
        ? `${inf(mem0.hipotesesTestadas||0)} hipóteses testadas`
        : "Nenhuma hipótese testada ainda"}</h2>
      <p>${mem0 && mem0.geracao
        ? `${inf(mem0.geracao)} geraç${mem0.geracao === 1 ? "ão" : "ões"} na ${esc(c.nome)}. O motor inventa, mede e
           descarta sozinho — e o que ele encontra quase sempre é acaso.`
        : `O motor cria hipóteses sobre os sorteios, testa cada uma contra o acaso e
           descarta as que não se sustentam.`}</p>
    </div>
    ${mem0 && mem0.geracao
      ? anelGeracao(mem0.geracao, ((mem0.geracao % 12) + 1) / 12)
      : `<div class="pq-orbe" aria-hidden="true">—</div>`}
  </div>

  <div class="nota atencao" style="margin-top:12px"><strong>Isto é um laboratório, não um gerador de jogos.</strong>
    O motor inventa hipóteses sobre os sorteios e as testa contra si mesmas e contra o
    acaso. Ele <strong>não</strong> prevê resultado, <strong>não</strong> muda a chance de
    nenhuma dezena e <strong>não</strong> produz números para apostar — por isso esta tela
    não tem onde copiar ou salvar nada. O que ela entrega é evidência: quantas hipóteses
    foram testadas e quais sobreviveram.</div>`;

  if(hist.length < MINIMO_PESQUISA)
    return cabeca + `<div class="vazio">A pesquisa precisa de ${MINIMO_PESQUISA}
      concursos da ${esc(c.nome)} e há ${hist.length}.<br>
      Faltam ${MINIMO_PESQUISA - hist.length}. Traga histórico em
      <strong>Conferir › Resultados</strong>.</div>`;

  const controles = `
  <div class="carta">
    <div class="linha2">
      <label class="campo"><label>gerações por rodada</label>
        <select id="pq-n">${[1,5,20,50].map(v =>
          `<option value="${v}" ${v===5?"selected":""}>${v}</option>`).join("")}</select></label>
      <label class="campo"><label>modalidade</label>
        <input value="${esc(c.nome)}" disabled></label>
    </div>
    <button class="acao" id="pq-go">Evoluir e julgar</button>
    <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;
      border:1px solid var(--linha);border-radius:12px;margin-top:10px;cursor:pointer">
      <input type="checkbox" id="pq-auto" ${S.pesquisaAutomatica!==false?"checked":""}
        style="width:20px;height:20px;flex:none;accent-color:var(--acaso)">
      <span style="flex:1;font-size:.86rem"><b>Evoluir sozinho a cada concurso novo</b>
        <span style="display:block;font-size:.76rem;color:var(--secundaria)">
          Uma geração por modalidade, quando entra resultado. A memória é
          separada por loteria.</span></span>
    </label>
    <div id="pq-saida"></div>
  </div>`;

  if(!mem || !mem.geracao)
    return cabeca + controles + `<div class="vazio">Nenhuma geração ainda na
      ${esc(c.nome)}.<br>Toque em <strong>Evoluir e julgar</strong> para começar.</div>`;

  const conc = mem.conclusao;
  const linhasHist = (mem.historico || []).slice(-12).reverse();

  /* Sem faixa de KPIs: o hero já diz gerações e hipóteses, e o cartão do
     veredito repete os dois com a validação junto. Três lugares para o mesmo
     número é ruído, não reforço. */
  const painel = "";

  const campeao = mem.campeaoDev ? `
  <div class="carta" style="margin-top:12px">
    <div class="rot" style="font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;
      color:var(--secundaria)">a hipótese que lidera a busca</div>
    <p style="margin:8px 0 0;font-size:.9rem;line-height:1.5">
      ${esc(descreverHipotese(mem.campeaoDev.genes))}</p>
    <p style="margin:8px 0 6px;font-size:.78rem;color:var(--secundaria)">
      Surgiu por <strong>${esc(mem.campeaoDev.origem)}</strong>.</p>
    <div class="pq-eixo"><span>recorte</span><span>← contra · 0,5 · a favor →</span><span>auc</span></div>
    ${(mem.campeaoDev.aucPorRecorte||[]).map((a,i)=>tracoAuc(`janela ${i+1}`, a)).join("")}
    ${conc ? tracoAuc("validação", conc.aucValidacao) : ""}
    <p style="margin:8px 0 0;font-size:.78rem;color:var(--secundaria)">
      AUC 0,5 quer dizer que a hipótese não distingue nada. As janelas são de dentro da
      busca; a validação é o recorte que ela nunca viu — e é só esse que conta.</p>
  </div>` : "";

  /* "Geração atual" e "Desempenho geral", com os rótulos e a disposição do
     mockup: o anel à esquerda, o funil da geração à direita, e embaixo os
     quatro números de fora da amostra.

     O funil é a peça que explica o motor sem texto: 8.640 testadas → 320
     passaram do primeiro filtro → 18 sobreviveram ao walk-forward → 0 com
     evidência robusta. É a mesma história que o veredito conta em palavras,
     mas em quatro linhas que se lê de relance — e o zero no fim é o ponto. */
  const funil = `<section class="carta" style="margin-top:12px">
    <div class="panel-title"><h3>Geração atual</h3>
      <span>${mem.quando ? `Atualizado ${esc(new Date(mem.quando)
        .toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric",
                                  hour:"2-digit", minute:"2-digit"}))}` : "ainda não julgada"}</span></div>
    <div class="geracao-linha">
      ${anelGeracao(mem.geracao || 0, (((mem.geracao || 0) % 12) + 1) / 12)}
      ${/* Cada linha é um número medido, não um enchimento de layout. Escrevi
            este bloco uma vez com um campo inventado ("passaram do 1º filtro")
            e um campo que era array contado como número; os dois teriam
            aparecido na tela como fato. Agora os dois do meio são gravados
            pela própria geração, onde os escores existem. */""}
      <div class="funil">
        <div><span>Estratégias testadas</span><b>${inf(mem.hipotesesTestadas || 0)}</b></div>
        <div><span>Acima do acaso no pior recorte</span><b>${inf(mem.acimaDoAcaso || 0)}</b></div>
        <div><span>Mesmo sentido em todos</span><b>${inf(mem.mesmoSentido || 0)}</b></div>
        <div><span>Evidência robusta</span>
          <b class="${conc && conc.sobreviveu ? "teal" : "red"}">${conc && conc.sobreviveu ? 1 : 0}</b></div>
      </div>
    </div>
    <div class="nota">A IA testa milhares de estratégias automaticamente. Apenas
    hipóteses com evidência estatística consistente permanecem.</div>
  </section>`;

  const desempenho = !conc ? "" : `<section class="carta" style="margin-top:12px">
    <div class="panel-title"><h3>Desempenho geral</h3><span>fora da amostra</span></div>
    <div class="kpi-grid">
      <div class="mini-card"><strong>${nf(conc.aucValidacao,3)}</strong>
        <small>AUC médio<br>(vs 0,500 aleatório)</small></div>
      <div class="mini-card"><strong>${nf(conc.p,3)}</strong>
        <small>p-value mínimo<br>(correção Holm)</small></div>
      <div class="mini-card"><strong>${nf(Math.max(0,Math.min(1,1-conc.degradacao))*100,0)}%</strong>
        <small>Estabilidade<br>(média)</small></div>
      <div class="mini-card"><strong>${inf((mem.populacao || []).length)}</strong>
        <small>Estratégias ativas<br>(desta geração)</small></div>
    </div>
  </section>`;

  const julgamento = funil + (!conc ? `<div class="nota" style="margin-top:12px">A população
    mudou desde o último julgamento. Toque em <strong>Evoluir e julgar</strong> para medir
    o campeão nos concursos que a busca nunca viu.</div>` : desempenho + `
  <div class="carta" style="margin-top:12px">
    <h3 style="margin:0 0 8px">Julgamento fora da amostra</h3>
    <div class="rolagem"><table>
      <tbody>
        <tr><td>AUC na validação</td><td class="num" style="text-align:right"><b>${nf(conc.aucValidacao,4)}</b></td></tr>
        <tr><td>afastamento de 0,5</td><td style="text-align:right">${nf(conc.afastamento,4)}</td></tr>
        <tr><td>percentil na nuvem de hipóteses aleatórias</td>
            <td style="text-align:right">${nf(conc.percentilNaNuvem*100,0)}%</td></tr>
        <tr><td>p-valor por permutação</td><td style="text-align:right">${nf(conc.p,4)}</td></tr>
        <tr><td>limiar honesto (0,05 ÷ ${inf(conc.familia)} hipóteses)</td>
            <td style="text-align:right">${conc.limiar < 0.0001
              ? conc.limiar.toExponential(1).replace(".",",") : nf(conc.limiar,5)}</td></tr>
        <tr><td>mesmo sentido em todos os recortes</td>
            <td style="text-align:right">${conc.mesmoLado ? "sim" : "não"}</td></tr>
        <tr><td>quanto do efeito sumiu fora da amostra</td>
            <td style="text-align:right">${nf(Math.max(0,Math.min(1,conc.degradacao))*100,0)}%</td></tr>
      </tbody>
    </table></div>
  </div>
  <div class="pq-veredito ${conc.sobreviveu?"sinal":"acaso"}">
    <span class="pq-selo">${conc.sobreviveu ? "achado a conferir" : "compatível com o acaso"}</span>
    <h3>${conc.sobreviveu
      ? "Uma hipótese passou do limiar"
      : "Nenhuma hipótese sobreviveu"}</h3>
    <p>${vereditoPesquisa(conc, {manchete:false})}</p>
    <div class="pq-inline">
      <span>hipóteses <b>${inf(conc.familia)}</b></span>
      <span>gerações <b>${inf(conc.geracao)}</b></span>
      <span>validação <b>${inf(mem.concursosValidacao||0)} concursos</b></span>
      <span>sumiu fora da amostra <b>${nf(Math.max(0,Math.min(1,conc.degradacao))*100,0)}%</b></span>
    </div>
  </div>`);

  /* Alternador do mockup. As duas opções são medidas que EXISTEM por geração:
     o AUC do campeão nos recortes de desenvolvimento e a aptidão, que é o que
     a busca de fato otimiza. O desenho trazia "p-value mínimo" como segunda
     opção — o p-valor sai do julgamento e existe uma vez, não por geração;
     desenhar uma linha dele seria inventar uma série. */
  const serie = S.serieEvolucao === "aptidao" ? "aptidao" : "auc";
  const alternador = `<div class="segmento" role="tablist" style="margin-top:12px">
    <button role="tab" data-serie="auc" aria-selected="${serie==="auc"}"
      >AUC (desenvolvimento)</button>
    <button role="tab" data-serie="aptidao" aria-selected="${serie==="aptidao"}"
      >Aptidão do melhor</button>
  </div>`;

  const grafico = (mem.historico || []).length >= 2 ? alternador + `
  <div class="carta" style="margin-top:10px">
    <div class="contador"><span>evolução da busca</span>
      <b style="font-family:var(--mono);font-size:.78rem">${
        serie === "auc" ? "AUC do melhor, por geração" : "aptidão do melhor, por geração"}</b></div>
    ${graficoEvolucao(mem.historico, serie)}
    <div class="nota">${serie === "auc"
      ? `A linha tracejada é 0,5 — "não distingue nada". Isto é medido DENTRO do que a
         busca já viu; o que decide é o julgamento fora da amostra, na Visão Geral.`
      : `Aptidão é o afastamento de 0,5 no <em>pior</em> recorte, menos a punição por
         complexidade. Subir aqui é esperado: a busca sempre encontra algo que parece
         melhor no próprio recorte em que procurou.`}</div>
  </div>` : "";

  /* "Histórico de gerações" do mockup: uma linha por geração, a mais recente
     marcada como Atual. Cada coluna é medida por geração — nenhuma delas é o
     julgamento fora da amostra, que roda uma vez e mora na Visão Geral. */
  const tabela = linhasHist.length ? `
  <div class="carta" style="margin-top:12px">
    <div class="panel-title"><h3>Histórico de gerações</h3>
      <span>${inf(linhasHist.length)} registradas</span></div>
    <div class="geracoes">${linhasHist.slice().reverse().map((l, i) => `
      <div class="linha-ger ${i === 0 ? "atual" : ""}">
        <span class="ger"><b>Geração ${inf(l.geracao)}</b>${i === 0 ? "<small>Atual</small>" : ""}</span>
        <span class="med">AUC dev<br><b>${nf(l.aucMelhor != null ? l.aucMelhor : 0.5, 3)}</b></span>
        <span class="med">acima do acaso<br><b>${inf(l.acimaDoAcaso != null ? l.acimaDoAcaso : 0)}</b></span>
        <span class="med">mesmo sentido<br><b>${inf(l.mesmoSentido != null ? l.mesmoSentido : 0)}</b></span>
      </div>`).join("")}</div>
    <div class="nota">Tudo aqui é medido <strong>dentro</strong> do que a busca já viu.
    Subir nesta tabela é esperado: a busca sempre encontra algo que parece melhor no
    próprio recorte em que procurou. O AUC fora da amostra e o p-valor saem do
    julgamento, na aba <strong>Visão Geral</strong> — e são eles que decidem.</div>
  </div>` : "";

  /* Abas internas do mockup: Visão Geral · Evolução · Estratégias · Detalhes.
     O conteúdo já existia todo — o que muda é que ele deixa de ser uma rolagem
     única e passa a caber numa tela de celular sem exigir dez arrastadas. */
  const aba = S.abaPesquisa || "geral";
  const abas = [
    {id:"geral", nome:"Visão Geral"},
    {id:"evolucao", nome:"Evolução"},
    {id:"estrategias", nome:"Estratégias"},
    {id:"detalhes", nome:"Detalhes"},
  ];
  const barra = `<div class="analysis-tabs">${abas.map(a =>
    `<button data-aba-pq="${a.id}" class="${a===abas.find(x=>x.id===aba)?"active":""}"
      >${esc(a.nome)}</button>`).join("")}</div>`;

  const detalhes = `<div class="carta" style="margin-top:12px">
    <h3 style="margin:0 0 8px">Como a busca está configurada</h3>
    <div class="rolagem"><table><tbody>
      <tr><td>população por geração</td><td style="text-align:right">${inf(POPULACAO_PESQUISA)}</td></tr>
      <tr><td>imigrantes por geração</td><td style="text-align:right">${inf(IMIGRANTES_POR_GERACAO)}</td></tr>
      <tr><td>elite preservada</td><td style="text-align:right">${inf(ELITE_PESQUISA)}</td></tr>
      <tr><td>genes por hipótese, no máximo</td><td style="text-align:right">${inf(MAX_GENES)}</td></tr>
      <tr><td>primitivos disponíveis</td><td style="text-align:right">${inf(PRIMITIVOS.length)}</td></tr>
      <tr><td>recortes de walk-forward</td><td style="text-align:right">${inf(RECORTES_PESQUISA)}</td></tr>
      <tr><td>concursos usados</td><td style="text-align:right">${inf(mem.concursosUsados||0)}</td></tr>
      <tr><td>desenvolvimento / validação</td><td style="text-align:right">${
        inf(mem.concursosDesenvolvimento||0)} / ${inf(mem.concursosValidacao||0)}</td></tr>
    </tbody></table></div>
    <div class="nota">Os 300 concursos mais recentes. Com o histórico inteiro cada
    geração varreria 170 mil linhas num celular, e o motor deixaria de rodar sozinho
    por ser insuportável.</div>
  </div>`;

  const corpo = aba === "evolucao" ? (grafico + tabela)
              : aba === "estrategias" ? campeao
              : aba === "detalhes" ? detalhes
              : julgamento;

  return cabeca + controles + barra + corpo;
};

T.resultados = () => {
  const meus = S.resultados.filter(r => r.modalidade === S.modalidade)
    .slice().sort((a,b)=> b.concurso - a.concurso);
  const c = MODALIDADES[S.modalidade];
  const temServico = !!SLUG_CAIXA[S.modalidade];

  /* O mockup abre esta tela com os CONCURSOS: chips de modalidade e os cartões
     com as bolas. Os controles de busca e os ajustes automáticos vinham antes
     e empurravam a lista para fora da primeira tela — quem entra em
     "Resultados" quer ver resultado, não configurar como buscá-los. Eles
     continuam aqui, recolhidos num <details> no fim. */
  const chips = `<div class="chips chips-mod" role="group" aria-label="Modalidade">
    ${Object.entries(MODALIDADES).map(([k,v]) =>
      `<button class="chip" data-mod="${k}" aria-pressed="${k===S.modalidade}"
        >${esc(v.nome)}</button>`).join("")}</div>`;

  const cartoes = !meus.length
    ? `<div class="vazio">Nenhum resultado desta modalidade ainda.<br>
        Sem histórico, a bancada e o placar não têm o que medir.</div>`
    : `<div class="concursos">${meus.slice(0,40).map(r => `
        <article class="concurso ${ganhadoresDoConcurso(r).estado}"
          data-abrir-concurso="${esc(r.concurso)}">
          <div class="concurso-topo">
            <b>Concurso ${esc(r.concurso)}</b>
            <time>${esc(r.data || "sem data")}</time>
          </div>
          <div class="bolas">${r.dezenas.map(d => `<i class="bola">${pad(d)}</i>`).join("")}</div>
          ${/* O selo fica SEMPRE visível, e não só com o cartão expandido. A cor
                do cartão — verde para com ganhador, âmbar para acumulado — não
                pode ser a única pista: quem não distingue as duas precisa da
                mesma informação por escrito. Foi a bateria que pegou isto
                quando tentei escondê-lo atrás do toque. */""}
          <div class="concurso-detalhe">${seloGanhadores(r, {cidades:false})}
            <span class="pilula ${r.origem==="caixa"?"oficial":"manual"}"
              >${esc(r.origem || "manual")}</span></div>
          <span class="chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
        </article>`).join("")}</div>
      ${meus.length > 40 ? `<div class="pe">mostrando os 40 mais recentes</div>` : ""}`;

  return chips + `<div class="acoes-topo">
      <button class="acao mini" id="r-caixa" ${temServico?"":"disabled"}>
        atualizar${temServico?"":" (sem serviço)"}</button>
    </div>
    <div id="r-saida"></div>` + cartoes + `
  <details class="ajustes">
    <summary>Trazer resultados e ajustes</summary>
    <div class="carta">
    <!-- "buscar último na Caixa" saiu daqui: virou o botão "atualizar" lá em
         cima, junto dos concursos. Deixar os dois seria id repetido no
         documento, e o seletor liga só o primeiro — um deles ficaria mudo, sem
         nenhum sintoma além de "não faz nada quando eu clico".
         (Sem crase neste comentário: ele mora dentro de um template literal,
         e a crase fecharia o literal no meio do HTML.) -->
    <div class="botoes" style="margin:10px 0">
      <button class="acao contorno mini" id="r-varios" ${temServico?"":"disabled"}>buscar os 20 últimos</button>
      <button class="acao contorno mini" id="r-tudo" ${temServico?"":"disabled"}>histórico completo</button>
    </div>
    <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;
      border:1px solid var(--linha);border-radius:12px;margin-bottom:10px;cursor:pointer">
      <input type="checkbox" id="r-auto" ${S.buscaAutomatica!==false?"checked":""}
        style="width:20px;height:20px;flex:none;accent-color:var(--acaso)">
      <span style="flex:1;font-size:.86rem"><b>Buscar o último concurso sozinho</b>
        <span style="display:block;font-size:.76rem;color:var(--secundaria)">
          Uma vez a cada 12 horas, ao abrir o app, só nas modalidades que você já
          acompanha. Falha em silêncio quando não há sinal.</span></span>
    </label>
    <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;
      border:1px solid var(--linha);border-radius:12px;margin-bottom:10px;cursor:pointer">
      <input type="checkbox" id="r-avisar" ${S.avisarSorteio!==false?"checked":""}
        style="width:20px;height:20px;flex:none;accent-color:var(--acaso)">
      <span style="flex:1;font-size:.86rem"><b>Avisar no celular quando sair sorteio</b>
        <span style="display:block;font-size:.76rem;color:var(--secundaria)">
          Um alarme do próprio aparelho, marcado para 90 minutos depois de cada
          sorteio das loterias em que você tem jogo — toca com o app fechado.
          Quando o resultado entra, o app confere os seus jogos e avisa o que
          encontrou, com o número de dezenas que coincidiram.</span></span>
    ${/* A frase anterior prometia dizer o valor do prêmio. Nunca foi verdade: o
          aviso sempre trouxe a contagem de dezenas. Descrição que promete mais
          do que o recurso entrega é a forma mais barata de perder a confiança.

          Nota sobre a FORMA deste comentário: ele é `${/*…*\/""}` e não um
          comentário HTML. Comentário HTML dentro do template vai para a saída,
          e as varreduras de vocabulário leem a saída — foi assim que a minha
          própria explicação derrubou o teste duas vezes seguidas. Explicação
          fica em comentário de JavaScript, que não é emitido. */""}
    </label>
    <div id="r-avisos-estado"></div>

    <div class="nota atencao"><strong>A busca online tenta ${FONTES.length} fontes em
      sequência</strong> — a da Caixa primeiro, depois um espelho e um proxy de CORS. Ela
      existe porque o serviço oficial não autoriza chamadas de outra origem: no navegador
      o pedido é bloqueado antes de sair (<em>Failed to fetch</em>), enquanto dentro do
      APK passa pela camada nativa e funciona.
      <span style="display:block;margin-top:6px">Nenhuma das fontes pôde ser testada por
      mim: a rede onde este código foi escrito bloqueia todos esses domínios. O que está
      testado é a conversão de cada formato. A colagem abaixo não depende de rede e é a
      via garantida.</span></div>
    <label class="campo"><label>colar resultados</label>
      <textarea id="r-texto" rows="4" placeholder="${esc(
        `Um concurso por linha: 3421; 21/06/2025; ${Array.from({length:c.k},(_,i)=>pad(i+c.base)).join(" ")}`)}"
        style="width:100%;padding:11px 12px;background:var(--fundo);
        border:1px solid var(--linha);border-radius:11px;font-family:var(--mono);
        font-size:.82rem"></textarea></label>
    <button class="acao mini" id="r-colar">importar o que está colado</button>
    <div id="r-saida"></div>
  </div>
  <div class="carta">
    <h2>${esc(c.nome)} — ${meus.length} concurso${meus.length===1?"":"s"} no app</h2>
    ${!meus.length ? "" : (()=>{
      /* O tamanho do buraco, dito de frente. Sem isto, quem vê muitos "não
         informado" conclui que o app está quebrado, quando o que falta é o
         rateio daqueles concursos. */
      const cob = coberturaDeGanhadores(S.modalidade);
      if(cob.com === cob.total)
        return `<div class="nota">Todos os ${inf(cob.total)} concursos trazem a
          informação de ganhadores.</div>`;
      return `<div class="nota">Ganhadores conhecidos em <strong>${inf(cob.com)} de
        ${inf(cob.total)}</strong> concursos (${nf(cob.fracao*100,0)}%). Os demais
        entraram sem o rateio — <em>ganhadores não informados</em> quer dizer que o
        app não sabe, e não que não houve ganhador. Buscar o histórico de novo
        preenche o que faltar.</div>`;
    })()}
  </div></details>`;
};

T.teimosinha = () => {
  const c = MODALIDADES[S.modalidade];
  const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
  const minhas = (S.teimosinhas||[]).filter(t => t.modalidade === S.modalidade);
  const podeCriar = dez.length >= c.min && dez.length <= c.max;
  const ultimo = ultimoResultado(S.modalidade);
  return `<div class="carta">
    <h2>criar teimosinha</h2>
    <p style="font-size:.85rem;color:var(--secundaria);margin:6px 0 10px">
      Usa as dezenas marcadas na tela <strong>Manual</strong>${
        dez.length ? `: ${dez.map(pad).join(" ")}` : " — nenhuma marcada ainda"}.</p>
    <div class="linha2">
      <label class="campo"><label>a partir do concurso</label>
        <input id="t-de" type="number" inputmode="numeric"
          value="${ultimo ? ultimo.concurso + 1 : ""}" placeholder="ex.: 3422"></label>
      <label class="campo"><label>concursos seguidos</label>
        <select id="t-n">${[2,3,4,5,6,7,8,9].map(v=>
          `<option value="${v}">${v}</option>`).join("")}</select></label>
    </div>
    <button class="acao mini" id="t-criar" ${podeCriar?"":"disabled"}>criar teimosinha</button>
    <div class="nota">O custo é multiplicado pelo número de concursos e sai inteiro no ato,
      como na lotérica. Repetir o mesmo jogo não muda a chance de nenhum sorteio: cada
      concurso é independente do anterior.</div>
    <div id="t-saida"></div>
  </div>
  ${!minhas.length ? `<div class="vazio">Nenhuma teimosinha nesta modalidade.</div>`
    : minhas.map(t=>{
        const conf = t.conferencias || [];
        const fim = t.deConcurso + t.concursos - 1;
        const restam = Math.max(0, t.concursos - conf.length);
        const melhor = conf.length ? Math.max(...conf.map(x=>x.acertos)) : null;
        return `<div class="carta">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
            <h3>Concursos ${t.deConcurso}–${fim}</h3>
            <span class="selo ${restam?"seu":"ok"}">${restam?`${restam} por sair`:"encerrada"}</span>
          </div>
          ${cartela(t.modalidade, t.dezenas, {
            sorteadas: conf.length ? conf[conf.length-1].dezenas : null,
            selo:`${t.dezenas.length} dezenas`})}
          <div class="kpis">
            <div class="kpi"><div class="rot">custo total</div>
              <div class="val" style="font-size:1.15rem">${brl(t.custo)}</div>
              <div class="sub">${t.concursos} concursos</div></div>
            <div class="kpi"><div class="rot">melhor resultado</div>
              <div class="val">${melhor === null ? "—" : melhor}</div>
              <div class="sub">${conf.length} conferido${conf.length===1?"":"s"}</div></div>
          </div>
          ${/* A coluna "faixa" saiu daqui pelo mesmo motivo que saiu da ficha e
                do painel: a teimosinha é jogo salvo como qualquer outro, e a
                conferência dela conta coincidência, não prêmio. Esta tabela e a
                do resultado da conferência à mão passaram batido na primeira
                varredura — o teste que veio junto agora percorre TODAS as telas
                atrás do carimbo, em vez de conferir duas de cor. */""}
          ${conf.length ? `<div class="rolagem"><table>
            <tr><th>concurso</th><th>coincidências</th></tr>
            ${conf.slice().sort((a,b)=>a.concurso-b.concurso).map(x=>`<tr>
              <td>${esc(x.concurso)}</td><td>${x.acertos}</td></tr>`).join("")}
          </table></div>` : `<div class="pe">Nenhum dos concursos entrou no histórico ainda.</div>`}
          <div class="botoes" style="margin-top:10px">
            <button class="acao perigo mini" data-apagar-teimosinha="${esc(t.id)}">apagar</button>
          </div>
        </div>`;
      }).join("")}`;
};

/* ============================ ações ============================ */
function acoesNovas(){
  /* --- volante manual --- */
  document.querySelectorAll("#volante [data-casa]").forEach(b => b.onclick = () => {
    const d = +b.dataset.casa, c = MODALIDADES[S.modalidade];
    const atual = marcadasDe(S.modalidade).slice();
    const i = atual.indexOf(d);
    if(i >= 0) atual.splice(i, 1);
    else if(atual.length >= c.max) return;      // teto da modalidade, sem aviso ruidoso
    else atual.push(d);
    S.marcadas[S.modalidade] = atual;
    Guardar.gravar("marcadas", S.marcadas);
    pintar();
  });

  const compl = $("#m-completar");
  if(compl) compl.onclick = () => {
    const c = MODALIDADES[S.modalidade];
    const atual = new Set(marcadasDe(S.modalidade));
    const faltam = Math.max(0, c.min - atual.size);
    const livres = universo(S.modalidade).filter(d => !atual.has(d));
    embaralhar(livres).slice(0, faltam).forEach(d => atual.add(d));
    S.marcadas[S.modalidade] = [...atual].sort((a,b)=>a-b);
    Guardar.gravar("marcadas", S.marcadas); pintar();
  };

  const limpar = $("#m-limpar");
  if(limpar) limpar.onclick = () => {
    S.marcadas[S.modalidade] = [];
    Guardar.gravar("marcadas", S.marcadas); pintar();
  };

  const salvar = $("#m-salvar");
  if(salvar) salvar.onclick = () => {
    const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
    /* Campo vazio vira ausência, e não zero: `Number("")` é 0, e um alvo 0
       casaria com concurso nenhum e mandaria o jogo para "fora deste concurso"
       para sempre — sem que ninguém tivesse digitado nada. */
    const bruto = ($("#m-concurso") || {}).value;
    const alvo = parseInt(bruto, 10);
    const jogo = {
      id:`${Date.now().toString(36)}-m`, dezenas:dez, modalidade:S.modalidade,
      metodo:"manual", data:hoje(), lote:`M${Date.now().toString(36)}`, conferencias:[]
    };
    if(Number.isFinite(alvo) && alvo > 0) jogo.concursoAlvo = alvo;
    S.jogos.push(jogo);
    Guardar.gravar("jogos", S.jogos);
    conferenciaAutomatica();
    irParaTela("jogos");
  };

  /* --- resultados --- */
  const colar = $("#r-colar");
  if(colar) colar.onclick = () => {
    const saida = $("#r-saida");
    try{
      const novos = lerColagem($("#r-texto").value, S.modalidade);
      const n = guardarResultados(novos);
      const r = aoMudarHistorico(n, "colado");
      saida.innerHTML = `<div class="nota"><strong>${n} concurso${n===1?"":"s"} novo${n===1?"":"s"}</strong>
        de ${novos.length} lido${novos.length===1?"":"s"}. ${r.novas} conferência${r.novas===1?"":"s"}
        automática${r.novas===1?"":"s"}.</div>`;
      setTimeout(pintar, 900);
    }catch(e){
      saida.innerHTML = `<div class="nota atencao">Não importei: ${esc(e.message)}.</div>`;
    }
  };

  const buscar = async (quantos) => {
    const saida = $("#r-saida");
    saida.innerHTML = `<div class="nota"><span class="girando"></span>consultando o serviço da Caixa…</div>`;
    try{
      const ultimo = await buscarNaCaixa(S.modalidade, null);
      const lote = [ultimo];
      for(let i = 1; i < quantos; i++){
        const n = ultimo.concurso - i;
        if(n < 1) break;
        try{ lote.push(await buscarNaCaixa(S.modalidade, n)); }
        catch(e){ break; }   // para no primeiro que falhar; o que veio já vale
      }
      const n = guardarResultados(lote);
      const nome = (FONTES.find(f => f.id === lote[0].fonte) || {}).nome || "fonte desconhecida";
      const r = aoMudarHistorico(n, nome);
      const resumo = resumoGanhadores(lote);
      saida.innerHTML = `<div class="nota"><strong>${lote.length} concurso${lote.length===1?"":"s"}
        recebido${lote.length===1?"":"s"}</strong>, ${n} novo${n===1?"":"s"}.
        ${r.novas} conferência${r.novas===1?"":"s"} automática${r.novas===1?"":"s"}.
        ${resumo.texto ? `<span style="display:block;margin-top:6px">${resumo.texto}.</span>` : ""}
        <span style="display:block;margin-top:4px;font-size:.9em">Fonte: ${esc(nome)}.</span></div>`;
      setTimeout(pintar, 900);
    }catch(e){
      saida.innerHTML = `<div class="nota atencao">
        <strong>Nenhuma fonte respondeu.</strong>
        <span style="display:block;margin-top:6px;font-family:var(--mono);font-size:.76rem"
          >${esc(e.message)}</span>
        <span style="display:block;margin-top:8px">Se aparece <em>Failed to fetch</em> em
        todas, o navegador está bloqueando por CORS — os serviços de loteria não autorizam
        chamadas de outra origem. Dentro do APK a requisição passa pela camada nativa e
        funciona. Enquanto isso, a colagem abaixo não depende de rede.</span></div>`;
    }
  };
  if($("#r-caixa")) $("#r-caixa").onclick = () => buscar(1);
  if($("#r-varios")) $("#r-varios").onclick = () => buscar(20);

  const tudo = $("#r-tudo");
  if(tudo) tudo.onclick = async () => {
    const saida = $("#r-saida");
    tudo.disabled = true;
    /* Teto de 1200 concursos por vez. Sem teto, a Lotofácil pediria mais de
       três mil requisições de uma vez — o serviço recusaria no meio e a pessoa
       ficaria olhando uma barra parada. Com teto, ela roda de novo e continua. */
    const TETO = 1200;
    try{
      const lote = await buscarHistorico(S.modalidade, TETO, (feitos, alvo, n) => {
        saida.innerHTML = `<div class="nota"><span class="girando"></span>
          ${feitos} concursos recebidos… (buscando o ${n})</div>`;
      });
      const novos = guardarResultados(lote);
      const r = aoMudarHistorico(novos, "histórico completo");
      /* O teto só vale para o caminho lento, que busca concurso a concurso.
         Quando o arquivo do repositório responde, ele traz o histórico inteiro
         numa requisição — e avisar "o teto foi atingido, rode de novo" ali é
         mentira exatamente no momento em que tudo deu certo. */
      const veioDoRepositorio = lote[0] && lote[0].origem === "repositorio";
      saida.innerHTML = `<div class="nota"><strong>${lote.length} concursos recebidos</strong>,
        ${novos} novo${novos===1?"":"s"}. ${r.novas} conferência${r.novas===1?"":"s"}
        automática${r.novas===1?"":"s"}.${
          veioDoRepositorio
            ? " Histórico completo, direto do repositório do app."
            : (lote.length >= TETO
              ? " O teto de " + TETO + " foi atingido — rode de novo para continuar de onde parou."
              : "")}</div>`;
      setTimeout(pintar, 1200);
    }catch(e){
      saida.innerHTML = `<div class="nota atencao">A busca falhou: ${esc(e.message)}.
        Use a colagem abaixo — ela não depende de rede.</div>`;
      tudo.disabled = false;
    }
  };

  const rauto = $("#r-auto");
  if(rauto) rauto.onchange = e => {
    S.buscaAutomatica = e.target.checked;
    Guardar.gravar("buscaAutomatica", S.buscaAutomatica);
  };

  const ravisar = $("#r-avisar");
  const estadoAvisos = $("#r-avisos-estado");
  const contarLembretes = async () => {
    if(!estadoAvisos) return;
    if(S.avisarSorteio === false){
      estadoAvisos.innerHTML = `<div class="nota">Avisos desligados. O sino no
        cabeçalho continua registrando tudo.</div>`;
      return;
    }
    const via = Avisos.disponivel();
    if(via === "indisponivel"){
      estadoAvisos.innerHTML = `<div class="nota atencao">Este navegador não tem
        notificação. Dentro do app instalado no celular funciona; aqui, o sino
        do cabeçalho é a via.</div>`;
      return;
    }
    if(via === "navegador"){
      estadoAvisos.innerHTML = `<div class="nota">Fora do app instalado, o aviso
        só aparece com esta aba aberta. <strong>No APK</strong> o alarme é do
        próprio Android e toca com o app fechado.</div>`;
      return;
    }
    const pend = await Avisos.pendentes();
    const meus = pend.filter(n => n.title && /concurso/i.test(n.title));
    estadoAvisos.innerHTML = meus.length
      ? `<div class="nota"><strong>${meus.length} lembrete${meus.length>1?"s":""}
          agendado${meus.length>1?"s":""}</strong>: ${esc(meus.map(n=>n.title).join(" · "))}.</div>`
      : `<div class="nota">Nenhum lembrete agendado ainda. Ele é marcado quando o
          app traz um resultado com a data do próximo sorteio, nas loterias em
          que você tem jogo salvo.</div>`;
  };

  if(ravisar) ravisar.onchange = async e => {
    S.avisarSorteio = e.target.checked;
    Guardar.gravar("avisarSorteio", S.avisarSorteio);
    if(S.avisarSorteio){
      const p = await pedirPermissaoDeAviso();
      if(p !== "granted"){
        estadoAvisos.innerHTML = `<div class="nota atencao">O sistema não
          autorizou (${esc(String(p))}). Sem autorização o Android descarta o
          aviso em silêncio — libere em Ajustes › Notificações.</div>`;
        return;
      }
      await reagendarLembretes();
    } else {
      /* Desligar cancela o que já estava marcado. Deixar alarmes para trás
         faria o app avisar depois de a pessoa ter pedido para parar. */
      const mods = [...new Set(S.jogos.map(j => j.modalidade))];
      const chaves = [];
      mods.forEach(m => {
        const u = ultimoResultado(m);
        if(u) chaves.push(`sorteio:${m}:${u.concursoProximo || (Number(u.concurso)+1)}`);
      });
      await Avisos.cancelar(chaves);
    }
    contarLembretes();
  };
  contarLembretes();

  /* --- buscar as dezenas de UM concurso, para o formulário à mão ---
     Recebia um modo ("este" ou "ultimo"); o "ultimo" ficou sem chamador quando
     o painel do topo assumiu essa função, e parâmetro sem chamador é armadilha
     — dá a impressão de haver dois caminhos vivos quando só há um. */
  const preencher = async () => {
    const alvo = $("#c-busca");
    const num = $("#c-num");
    const concurso = parseInt(num.value, 10);
    if(!Number.isFinite(concurso)){
      alvo.innerHTML = `<div class="nota atencao">Informe o número do concurso primeiro.
        Para o mais recente, use o botão do painel lá em cima.</div>`;
      return;
    }
    alvo.innerHTML = `<div class="nota"><span class="girando"></span>buscando…</div>`;
    try{
      const r = await buscarNaCaixa(S.modalidade, concurso);
      num.value = r.concurso;
      $("#c-dez").value = r.dezenas.map(pad).join(" ");
      const dt = $("#c-data"); if(dt && r.data) dt.value = r.data;
      /* Guarda o resultado inteiro, com rateio e cidades — a conferência
         manual usaria só as dezenas e jogaria fora o resto. */
      guardarResultados([r]);
      const nome = (FONTES.find(f => f.id === r.fonte) || {}).nome || "fonte desconhecida";
      /* O resultado buscado ja diz, na hora, se teve ganhador. Era a pergunta
         que o usuario fazia logo depois de ver as dezenas, e que obrigava a ir
         ate a tela de Resultados para responder. */
      alvo.innerHTML = `<div class="nota ${ganhadoresDoConcurso(r).estado}"
        ><strong>Concurso ${esc(r.concurso)}</strong>
        preenchido. Fonte: ${esc(nome)}. Toque em conferir.
        ${seloGanhadores(r)}</div>`;
    }catch(e){
      alvo.innerHTML = `<div class="nota atencao"><strong>Nenhuma fonte respondeu.</strong>
        <span style="display:block;margin-top:6px;font-family:var(--mono);font-size:.76rem"
          >${esc(e.message)}</span>
        <span style="display:block;margin-top:8px">Digite o resultado abaixo — funciona
        sempre, e é a via que não depende de rede.</span></div>`;
    }
  };
  if($("#c-buscar")) $("#c-buscar").onclick = () => preencher();

  /* --- atualizar o painel do último concurso ---
     Busca, guarda, deixa `aoMudarHistorico` conferir os jogos e repinta. O
     retorno diz qual dos três casos aconteceu, porque "nada mudou" e "veio
     concurso novo" precisam de respostas diferentes: um botão que responde a
     mesma coisa sempre ensina a pessoa a desconfiar dele. */
  const atualizar = $("#c-atualizar");
  if(atualizar) atualizar.onclick = async () => {
    const aviso = $("#c-atualizando");
    const antes = ultimoResultado(S.modalidade);
    atualizar.disabled = true;
    aviso.innerHTML = `<div class="nota"><span class="girando"></span>procurando o
      concurso mais recente…</div>`;
    try{
      const r = await buscarNaCaixa(S.modalidade, null);
      const inseridos = guardarResultados([r]);
      /* Mesmo sem concurso novo, a conferência roda: o resultado pode ter
         chegado antes sem rateio, ou um jogo salvo depois pode nunca ter sido
         confrontado com ele. */
      const conf = aoMudarHistorico(inseridos, "busca do último concurso");
      if(inseridos){
        S.avisoConferir = {modalidade:S.modalidade, tipo:"ok", texto:
          `Concurso ${r.concurso} é novo por aqui. ` +
          (conf.novas ? `${conf.novas} conferência${conf.novas===1?"":"s"} feita${conf.novas===1?"":"s"}.`
                      : "Nenhum jogo salvo cobria ele.")};
      } else if(conf.novas){
        S.avisoConferir = {modalidade:S.modalidade, tipo:"ok", texto:
          `O concurso ${r.concurso} já era conhecido, e ${conf.novas} conferência${conf.novas===1?"":"s"} nova${conf.novas===1?"":"s"} saiu daí.`};
      } else {
        S.avisoConferir = {modalidade:S.modalidade, tipo:"ok", texto: antes && antes.concurso === r.concurso
          ? `Já estava atualizado: ${r.concurso} continua sendo o último.`
          : `Nada novo veio da busca.`};
      }
    }catch(e){
      S.avisoConferir = {modalidade:S.modalidade, tipo:"atencao", texto:
        `Nenhuma fonte respondeu (${e.message}). Dá para digitar o resultado à mão abaixo.`};
    }
    pintar();
  };

  /* --- teimosinha --- */
  const criar = $("#t-criar");
  if(criar) criar.onclick = () => {
    const c = MODALIDADES[S.modalidade];
    const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
    const de = parseInt($("#t-de").value, 10), n = +$("#t-n").value;
    const saida = $("#t-saida");
    if(!Number.isFinite(de) || de < 1){
      saida.innerHTML = `<div class="nota atencao">Informe o concurso inicial.</div>`; return;
    }
    S.teimosinhas = S.teimosinhas || [];
    S.teimosinhas.push({
      id:`${Date.now().toString(36)}-t`, dezenas:dez, modalidade:S.modalidade,
      metodo:"teimosinha", data:hoje(), deConcurso:de, concursos:n,
      custo: combinacoes(dez.length, c.k) * c.preco * n, conferencias:[]
    });
    Guardar.gravar("teimosinhas", S.teimosinhas);
    conferenciaAutomatica(); pintar();
  };
  document.querySelectorAll("[data-apagar-teimosinha]").forEach(b => b.onclick = () => {
    S.teimosinhas = (S.teimosinhas||[]).filter(t => t.id !== b.dataset.apagarTeimosinha);
    Guardar.gravar("teimosinhas", S.teimosinhas); pintar();
  });

  /* --- aprendizado --- */
  const treinar = $("#ap-treinar");
  if(treinar) treinar.onclick = () => {
    const saida = $("#ap-saida");
    treinar.disabled = true;
    treinar.innerHTML = `<span class="girando"></span>treinando…`;
    /* setTimeout para o navegador pintar o estado "treinando" antes de o laço
       bloquear a linha principal. Sem isso o botão só muda depois de acabar. */
    setTimeout(()=>{
      try{
        const r = aprender(S.modalidade);
        r.assinatura = assinaturaHistorico(S.modalidade);
        r.quando = new Date().toISOString();
        r.automatica = false;
        S.aprendizado[S.modalidade] = r;
        aplicarCorrecao(S.aprendizado);
        Guardar.gravar("aprendizado", S.aprendizado);
        pintar();
      }catch(e){
        saida.innerHTML = `<div class="nota atencao">O treino falhou: ${esc(e.message)}.</div>`;
        treinar.disabled = false; treinar.textContent = "treinar e medir fora da amostra";
      }
    }, 30);
  };

  document.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => {
    S.tipoEstatistica = b.dataset.tipo; window.scrollTo(0,0); pintar();
  });
  document.querySelectorAll("[data-ordem]").forEach(b => b.onclick = () => {
    S.ordemEstatistica = b.dataset.ordem; pintar();
  });

  const balvos = $("#b-alvos");
  if(balvos) balvos.onchange = e => {
    S.bancadaAlvos = +e.target.value;
    Guardar.gravar("bancadaAlvos", S.bancadaAlvos);
  };

  const auto = $("#ap-auto");
  if(auto) auto.onchange = e => {
    S.autoAnalise = e.target.checked;
    Guardar.gravar("autoAnalise", S.autoAnalise);
    /* Ligar já processa a fila pendente: esperar o próximo concurso deixaria
       a pessoa com a caixa marcada e nenhuma análise à vista.

       Evite aqui o vocabulário de dezena "em atraso", mesmo em comentário e
       mesmo falando de outra coisa: a trava do testar-motor.mjs procura por
       substring, sem olhar contexto. A cegueira é proposital — é a frase da
       falácia do apostador, e sai mais barato não escrevê-la nunca do que
       ensinar a trava a distinguir sentidos. */
    if(S.autoAnalise) analisarPendentes();
  };

  /* --- abrir um jogo salvo na cartela --- */
  document.querySelectorAll("[data-abrir-jogo]").forEach(b => b.onclick = () => {
    S.jogoAberto = S.jogoAberto === b.dataset.abrirJogo ? null : b.dataset.abrirJogo;
    pintar();
  });

  /* --- conferir os jogos salvos, sob demanda ---
     A conferência já roda sozinha a cada concurso novo, então este botão quase
     sempre não tem o que fazer. Ele existe porque "automático e invisível" é
     indistinguível de "não funciona": a pessoa precisa de um gesto que devolva
     uma resposta. Quando não há nada novo, ele diz isso — em vez de fingir
     trabalho para parecer útil. */
  const conferirJogos = $("#j-conferir");
  if(conferirJogos) conferirJogos.onclick = () => {
    const antes = ultimoResultado(S.modalidade);
    const r = conferenciaAutomatica();
    const cmp = jogosContraConcurso(antes);
    const nome = MODALIDADES[S.modalidade].nome;
    const detalhe = !antes
      ? `${nome} · nenhum concurso guardado para comparar.`
      : `${nome} · ${inf(cmp.conferidos.length)} ` +
        `${cmp.conferidos.length === 1 ? "jogo comparado" : "jogos comparados"} ` +
        `com o concurso ${antes.concurso}.`;
    /* A chave leva o instante: conferir de novo é um ato novo da pessoa, e
       deve aparecer na lista. As chaves de prêmio é que são idempotentes. */
    /* Tipo "conferencia", e não "sistema": o filtro da central separa por
       assunto, e um item chamado "Conferência concluída" que só aparece em
       Sistema é o tipo de detalhe que faz a pessoa achar que o filtro não
       funciona. */
    avisar("conferencia", "Conferência concluída", detalhe, `conf:${Date.now()}`);
    S.avisoJogos = {modalidade:S.modalidade, texto: r.novas
      ? `${inf(r.novas)} ${r.novas === 1 ? "conferência nova" : "conferências novas"}. ${detalhe}`
      : `Nada de novo para conferir. ${detalhe}`};
    pintar();
  };
}

function acoes(){
  acoesNovas();
  const tam = $("#g-tam");
  if(tam) tam.onchange = e => { S.tamanho = +e.target.value; REFERENCIA = {}; pintar(); };
  const qtd = $("#g-qtd");

  document.querySelectorAll("[data-metodo]").forEach(el=>{
    const escolher = () => {
      if(el.dataset.metodo==="fechamento" && S.modalidade!=="lotofacil") return;
