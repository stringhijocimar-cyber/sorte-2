    blocos.push(rotulos.map((_, i) => i));
  }
  for(let r = 0; r < repeticoes; r++){
    for(const bloco of blocos){
      for(let i = bloco.length - 1; i > 0; i--){
        const j = Math.floor(rnd() * (i+1));
        const a = bloco[i], b = bloco[j];
        const t = copia[a]; copia[a] = copia[b]; copia[b] = t;
      }
    }
    nulos.push(auc(escores, copia));
  }
  nulos.sort((a,b)=>a-b);
  return nulos;
}

/* Gerador determinístico para o teste de permutação. Existe porque a primeira
   versão usava Math.random: o mesmo histórico produzia p-valores diferentes a
   cada execução, e o veredito podia mudar de "sem sinal" para "revisar" sem
   nenhum dado novo. Um teste desta bateria pegou isso falhando de forma
   intermitente. Resultado que não se repete não pode ser auditado. */
function geradorSemeado(semente){
  let x = semente >>> 0;
  return () => {
    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17;
    x ^= x << 5;  x >>>= 0;
    return x / 4294967296;
  };
}

function aprender(modalidade, opcoes){
  const o = Object.assign({permutacoes:200, semente:20260730}, opcoes||{});
  const d = dadosAprendizado(modalidade);
  if(d.erro) return d;

  const modelo = treinarLogistica(d.X, d.y, d.treino);
  const escoresTeste = d.teste.map(i => modelo.prever(d.X[i]));
  const rotulosTeste = d.teste.map(i => d.y[i]);
  const a = auc(escoresTeste, rotulosTeste);
  const perda = logLoss(escoresTeste, rotulosTeste);

  /* Referência: prever sempre a taxa-base do treino. Um modelo que não bate
     isto não aprendeu nada de útil, ainda que a perda pareça pequena. */
  const taxaBase = d.treino.reduce((s,i)=> s + d.y[i], 0) / d.treino.length;
  const perdaBase = logLoss(rotulosTeste.map(()=>taxaBase), rotulosTeste);

  const nulos = permutarAuc(escoresTeste, rotulosTeste, o.permutacoes,
                            geradorSemeado(o.semente),
                            d.teste.map(i => d.concursoDe[i]));
  /* p-valor bilateral por Monte Carlo, com a correção (r+1)/(m+1): sem ela um
     p-valor de exatamente zero seria reportado, e zero é impossível de medir
     com um número finito de permutações. */
  const acima = nulos.filter(x => x >= a).length;
  const abaixo = nulos.filter(x => x <= a).length;
  const m = nulos.length;
  const p = Math.min(1, 2 * Math.min((acima+1)/(m+1), (abaixo+1)/(m+1)));
  const faixa = [nulos[Math.floor(m*0.025)], nulos[Math.floor(m*0.975)]];

  return {
    modalidade, auc:a, perda, perdaBase, taxaBase, p, faixaAcaso:faixa,
    semente:o.semente, permutacoes:o.permutacoes,
    nConcursos:d.nConcursos, concursosTreino:d.concursosTreino,
    concursosTeste:d.concursosTeste, nLinhasTeste:d.teste.length,
    pesos: modelo.w.map((v,i)=>({nome:NOMES_ATRIBUTOS[i], peso:v})),
    /* `foraDaFaixa` é o achado bruto de UMA modalidade. `aprendeu` é a
       decisão final, e ela depende de quantas modalidades foram testadas —
       ver aplicarCorrecao(). Com uma modalidade só, as duas coincidem. */
    foraDaFaixa: p < 0.05 && (a < faixa[0] || a > faixa[1]),
    aprendeu: p < 0.05 && (a < faixa[0] || a > faixa[1]),
    familia: 1, limiteAplicado: 0.05
  };
}

/* Correção de Holm-Bonferroni entre as modalidades analisadas.

   Sem isto o app grita lobo, e não é teoria: medi. Com históricos puramente
   aleatórios, cada modalidade acusa sinal em cerca de 10% das vezes — o dobro
   do nominal de 5%. Rodando as 8 modalidades a cada concurso, a chance de pelo
   menos uma acusar por acaso é 1 − 0,90^8 ≈ 57%. Mais da metade dos concursos
   produziria um alarme falso, e um alarme que toca à toa ensina a pessoa a
   ignorar o alarme.

   Holm em vez de Bonferroni puro: mesma garantia contra o falso positivo, e
   menos cego para um efeito real, porque o limiar afrouxa conforme os achados
   mais fortes são aceitos. O procedimento é passo a passo — ao primeiro
   p-valor que não passa, todos os maiores são rejeitados junto, e é isso que
   preserva a garantia.

   Com uma modalidade só, m = 1 e nada muda: o limiar continua 0,05.          */
function aplicarCorrecao(mapa, alfa=0.05){
  const chaves = Object.keys(mapa).filter(k => mapa[k] && typeof mapa[k].p === "number");
  const m = chaves.length;
  if(!m) return mapa;

  const ordenadas = chaves.slice().sort((x, y) => mapa[x].p - mapa[y].p);
  let aindaRejeita = true;
  ordenadas.forEach((k, i) => {
    const limite = alfa / (m - i);
    const r = mapa[k];
    if(aindaRejeita && r.p <= limite && r.foraDaFaixa){
      r.aprendeu = true;
    } else {
      /* A partir do primeiro que não passa, nenhum dos maiores passa. É o
         passo que dá a garantia — aceitar um p-valor maior depois de rejeitar
         um menor quebraria o procedimento. */
      aindaRejeita = false;
      r.aprendeu = false;
    }
    r.familia = m;
    r.limiteAplicado = limite;
  });
  return mapa;
}

/* ============================================================================
   MOTOR AUTÔNOMO DE PESQUISA ESTATÍSTICA ADAPTATIVA
   ============================================================================

   O que é: um laboratório que inventa hipóteses sobre os sorteios, testa cada
   uma com rigor, descarta as que não se sustentam, cruza e muta as que
   sobrevivem, e injeta hipóteses novas a cada geração. Roda sozinho quando
   entra concurso novo, e guarda memória separada por modalidade.

   O que NÃO é, e isto não é ressalva de rodapé — é o desenho do módulo:

     * não prevê sorteio;
     * não aumenta probabilidade de acerto de nada;
     * não produz dezenas para apostar, e por isso esta tela não tem botão de
       copiar nem de salvar. Uma hipótese experimental transformada em aposta
       com um toque seria a mentira mais fácil de contar aqui;
     * o que ele entrega é EVIDÊNCIA: quantas hipóteses foram testadas, qual
       sobreviveu, e — quase sempre — que nenhuma sobreviveu.

   Por que um buscador evolutivo precisa de mais rigor, e não de menos:

   Uma busca que testa milhares de hipóteses SEMPRE acha uma com AUC 0,58 em
   algum recorte. Isso não é descoberta, é dragagem de dados: com 5.000
   hipóteses, esperar que a melhor pareça boa é o mesmo que esperar que alguém
   ganhe na loteria — alguém ganha. Três mecanismos existem contra isso, e são
   a parte mais importante deste código:

   1. SEPARAÇÃO ESTRITA. A evolução inteira acontece nos primeiros 70% dos
      concursos. Os 30% finais são território proibido durante a busca, e o
      campeão só é medido lá UMA vez, no fim. Sem isso a evolução simplesmente
      decora o conjunto de validação.

   2. FAMÍLIA REAL. O limiar não é 0,05: é 0,05 dividido pelo número de
      hipóteses DISTINTAS já testadas, acumulado ao longo das gerações. Testar
      3.000 hipóteses e reportar p = 0,01 da melhor não significa nada; o
      limiar honesto ali é 0,0000167.

   3. NULO CONSTRUÍDO IGUAL. A nuvem de comparação não é teoria: é uma
      população de hipóteses aleatórias, com a mesma estrutura e o mesmo
      tamanho, medida no mesmo recorte de validação. Se o campeão não se
      destaca dessa nuvem, ele é a nuvem.

   O resultado esperado com sorteios honestos é "nada sobreviveu". Um motor que
   nunca acha nada poderia estar quebrado, então há um teste que alimenta um
   sorteio deliberadamente viciado e exige que ele ACHE — é assim que se sabe
   que o silêncio dele significa alguma coisa.                                */

/* Teto de concursos usados na pesquisa. Não é economia de rigor: com o
   histórico inteiro cada geração varreria 170 mil linhas num celular, e o
   motor deixaria de rodar sozinho por ser insuportável. Os mais recentes,
   porque refletem o volante e o calendário de hoje. */
const TETO_PESQUISA = 300;
const POPULACAO_PESQUISA = 36;
const RECORTES_PESQUISA = 4;     /* janelas de walk-forward no desenvolvimento */
const IMIGRANTES_POR_GERACAO = 6;
const ELITE_PESQUISA = 4;
const MAX_GENES = 5;
const MINIMO_PESQUISA = 80;      /* concursos mínimos para a pesquisa fazer sentido */
const HISTORICO_GERACOES = 40;   /* gerações guardadas por modalidade */

/* Os primitivos com que as hipóteses são construídas. Cada um é uma pergunta
   sobre uma dezena, respondida SÓ com os concursos anteriores. O nome importa:
   uma hipótese que não se consegue ler em português não se consegue conferir,
   e uma hipótese que não se confere não é evidência de nada. */
const PRIMITIVOS = [
  {id:"freqCurta",   nome:"saiu muito nos últimos 10"},
  {id:"freqMedia",   nome:"saiu muito nos últimos 25"},
  {id:"freqLonga",   nome:"saiu muito nos últimos 50"},
  {id:"ausencia",    nome:"há quantos concursos não aparece"},
  {id:"noAnterior",  nome:"apareceu no concurso anterior"},
  {id:"nosDois",     nome:"apareceu em algum dos dois anteriores"},
  {id:"posicao",     nome:"posição no volante"},
  {id:"paridade",    nome:"é par"},
  {id:"primo",       nome:"é primo"},
  {id:"fibonacci",   nome:"está na sequência de Fibonacci"},
  {id:"terminacao",  nome:"terminação da dezena"},
  {id:"linha",       nome:"linha no volante"},
  {id:"coluna",      nome:"coluna no volante"},
  {id:"vizinhanca",  nome:"vizinha de dezena do concurso anterior"},
];

/* As transformações que uma hipótese pode aplicar a um primitivo. Existem para
   que o motor possa expressar ideias não lineares — "só importa quando é
   alto", "importa ao contrário" — sem virar uma rede neural que ninguém lê. */
const TRANSFORMACOES = {
  linear:    {nome:"direto",            f:v => v},
  inversa:   {nome:"ao contrário",      f:v => 1 - v},
  quadratica:{nome:"reforçando o alto", f:v => v * v},
  degrau:    {nome:"só acima da média", f:v => v > 0.5 ? 1 : 0},
};
const IDS_TRANSFORMACAO = Object.keys(TRANSFORMACOES);

/* Matriz de primitivos de UMA modalidade, calculada uma vez e reaproveitada
   por todas as hipóteses de todas as gerações. Sem este cache, cada geração
   recalcularia as mesmas dezenas de milhares de linhas — e o motor levaria
   minutos por geração em vez de segundos. */
const CACHE_PESQUISA = {};

/* Impressão digital do CONTEÚDO, e não só do tamanho.

   `assinaturaHistorico` devolve "quantos:último concurso", o que basta para
   saber que entrou concurso novo. Não basta para um cache: dois históricos
   diferentes com a mesma quantidade e o mesmo último número colidem, e o motor
   devolve a matriz do primeiro para o segundo — em silêncio, com números que
   parecem legítimos. Foi exatamente o que aconteceu ao testar o motor contra um
   sorteio viciado: ele respondeu, com cinco casas de precisão, o resultado do
   sorteio honesto que rodara antes. */
function digitalDoHistorico(hist){
  let x = 2166136261;
  for(const r of hist){
    x ^= Number(r.concurso) | 0; x = Math.imul(x, 16777619);
    for(const d of r.dezenas){ x ^= d; x = Math.imul(x, 16777619); }
  }
  return (x >>> 0).toString(36);
}

function matrizDePesquisa(modalidade){
  const assinatura = assinaturaHistorico(modalidade)
    + ":" + digitalDoHistorico(historicoDe(modalidade));
  const guardado = CACHE_PESQUISA[modalidade];
  if(guardado && guardado.assinatura === assinatura) return guardado;

  const c = MODALIDADES[modalidade];
  const todos = historicoDe(modalidade);
  if(todos.length < MINIMO_PESQUISA)
    return {erro:`faltam ${MINIMO_PESQUISA - todos.length} concursos para a pesquisa`,
            tem:todos.length, precisa:MINIMO_PESQUISA};

  /* Os JANELA_LONGA primeiros servem de aquecimento: são lidos para calcular
     as características e nunca viram alvo, porque para eles não há passado
     suficiente. */
  const hist = todos.slice(-(TETO_PESQUISA + JANELA_LONGA));
  const primos = new Set();
  for(let d = 2; d <= c.N + c.base; d++) if(ehPrimo(d)) primos.add(d);
  const fib = fibonacciAte(c.N + c.base - 1);
  const cols = GRADE[modalidade] || 10;
  const linhas = Math.max(1, Math.ceil(c.N / cols));

  const X = [], y = [], concursoDe = [];
  for(let i = JANELA_LONGA; i < hist.length; i++){
    const anteriores = hist.slice(0, i);
    const n = anteriores.length;
    const curta = anteriores.slice(-JANELA_CURTA);
    const media = anteriores.slice(-25);
    const longa = anteriores.slice(-JANELA_LONGA);
    const ultimo = new Set(anteriores[n-1].dezenas);
    const penultimo = n > 1 ? new Set(anteriores[n-2].dezenas) : new Set();
    const vizinhas = new Set();
    ultimo.forEach(v => { vizinhas.add(v-1); vizinhas.add(v+1); });
    const sorteadas = new Set(hist[i].dezenas);
    const intervalo = c.N / c.k;

    for(let d = c.base; d <= c.N + c.base - 1; d++){
      let ausencia = anteriores.length;
      for(let j = n - 1; j >= 0; j--)
        if(anteriores[j].dezenas.includes(d)){ ausencia = n - 1 - j; break; }
      const p = d - c.base;
      const conta = lista => {
        let s = 0;
        for(const r of lista) if(r.dezenas.includes(d)) s++;
        return lista.length ? s / lista.length : 0;
      };
      X.push([
        conta(curta), conta(media), conta(longa),
        Math.min(1, ausencia / (intervalo * 3)),
        ultimo.has(d) ? 1 : 0,
        (ultimo.has(d) || penultimo.has(d)) ? 1 : 0,
        p / Math.max(1, c.N - 1),
        d % 2 === 0 ? 1 : 0,
        primos.has(d) ? 1 : 0,
        fib.has(d) ? 1 : 0,
        (d % 10) / 9,
        Math.floor(p / cols) / Math.max(1, linhas - 1),
        (p % cols) / Math.max(1, cols - 1),
        vizinhas.has(d) ? 1 : 0,
      ]);
      y.push(sorteadas.has(d) ? 1 : 0);
      concursoDe.push(i);
    }
  }

  /* Corte por CONCURSO, nunca no meio de um: as linhas de um mesmo concurso
     são dependentes, e partir um concurso ao meio deixa a busca ver parte do
     alvo que ela deveria estar tentando acertar. */
  const primeiro = concursoDe[0], ultimo = concursoDe[concursoDe.length - 1];
  const corte = primeiro + Math.floor((ultimo - primeiro + 1) * 0.7);
  const desenvolvimento = [], validacao = [];
  concursoDe.forEach((ci, k) => (ci < corte ? desenvolvimento : validacao).push(k));

  /* Recortes de walk-forward DENTRO do desenvolvimento. Uma hipótese boa é a
     que funciona em todos, e não a que funciona em um. */
  const concursosDev = [...new Set(desenvolvimento.map(k => concursoDe[k]))];
  const porRecorte = [];
  const tamanho = Math.max(1, Math.floor(concursosDev.length / RECORTES_PESQUISA));
  for(let r = 0; r < RECORTES_PESQUISA; r++){
    const ini = concursosDev[r * tamanho];
    const fim = r === RECORTES_PESQUISA - 1
      ? concursosDev[concursosDev.length - 1]
      : concursosDev[(r + 1) * tamanho - 1];
    porRecorte.push(desenvolvimento.filter(k => concursoDe[k] >= ini && concursoDe[k] <= fim));
  }

  const pronto = {assinatura, X, y, concursoDe, desenvolvimento, validacao,
    recortes: porRecorte.filter(r => r.length),
    nConcursos: todos.length, concursosUsados: hist.length - JANELA_LONGA,
    concursosDesenvolvimento: corte - primeiro,
    concursosValidacao: ultimo - corte + 1, modalidade};
  CACHE_PESQUISA[modalidade] = pronto;
  return pronto;
}

/* ---------------------------- as hipóteses ---------------------------- */

function hipoteseAleatoria(rnd, geracao, origem){
  const quantos = 1 + Math.floor(rnd() * MAX_GENES);
  const usados = new Set();
  const genes = [];
  for(let i = 0; i < quantos; i++){
    const idx = Math.floor(rnd() * PRIMITIVOS.length);
    if(usados.has(idx)) continue;
    usados.add(idx);
    genes.push({
      primitivo: idx,
      peso: (rnd() * 2 - 1) * 2,
      transformacao: IDS_TRANSFORMACAO[Math.floor(rnd() * IDS_TRANSFORMACAO.length)],
    });
  }
  return {genes, origem: origem || "aleatória", nascimento: geracao};
}

/* Escore de uma hipótese para uma linha da matriz. Somatório simples e legível:
   o objetivo aqui não é capacidade de ajuste, é poder dizer em português o que
   a hipótese afirma. */
function escoreDaHipotese(h, linha){
  let s = 0;
  for(const g of h.genes){
    const v = linha[g.primitivo];
    s += g.peso * TRANSFORMACOES[g.transformacao].f(v);
  }
  return s;
}

function avaliarHipotese(h, dados, indices){
  const escores = new Array(indices.length);
  const rotulos = new Array(indices.length);
  for(let i = 0; i < indices.length; i++){
    escores[i] = escoreDaHipotese(h, dados.X[indices[i]]);
    rotulos[i] = dados.y[indices[i]];
  }
  return auc(escores, rotulos);
}

/* Aptidão: o PIOR recorte, e não a média.

   Com a média, uma hipótese que acerta muito num recorte e erra nos outros
   ganha da que é consistente — e é exatamente a primeira que não se sustenta
   fora da amostra. Usar o pior recorte é exigir que funcione sempre, que é o
   que "robusto" quer dizer. O afastamento de 0,5 é o que interessa: uma
   hipótese que separa ao contrário separa igual, e o sinal dela é só uma
   convenção. */
function aptidao(h, dados){
  const porRecorte = dados.recortes.map(r => avaliarHipotese(h, dados, r));
  const afastamentos = porRecorte.map(a => Math.abs(a - 0.5));
  const pior = Math.min(...afastamentos);
  /* Punição por complexidade: entre duas hipóteses que explicam igual, a mais
     simples é a que tem chance de não ser coincidência. */
  const punicao = 0.0015 * h.genes.length;
  return {valor: pior - punicao, porRecorte, pior};
}

/* --------------------------- os operadores --------------------------- */

function cruzar(a, b, rnd, geracao){
  const genes = [];
  const vistos = new Set();
  const juntos = a.genes.concat(b.genes);
  for(const g of juntos){
    if(rnd() < 0.5) continue;
    if(vistos.has(g.primitivo)) continue;
    vistos.add(g.primitivo);
    genes.push({...g});
    if(genes.length >= MAX_GENES) break;
  }
  if(!genes.length) genes.push({...juntos[Math.floor(rnd() * juntos.length)]});
  return {genes, origem:"cruzamento", nascimento: geracao};
}

function mutar(h, rnd, geracao){
  const genes = h.genes.map(g => ({...g}));
  const sorte = rnd();
  if(sorte < 0.45 && genes.length){
    /* Ajuste fino de um peso. */
    const g = genes[Math.floor(rnd() * genes.length)];
    g.peso += (rnd() * 2 - 1) * 0.8;
  } else if(sorte < 0.65 && genes.length){
    const g = genes[Math.floor(rnd() * genes.length)];
    g.transformacao = IDS_TRANSFORMACAO[Math.floor(rnd() * IDS_TRANSFORMACAO.length)];
  } else if(sorte < 0.85 && genes.length < MAX_GENES){
    const idx = Math.floor(rnd() * PRIMITIVOS.length);
    if(!genes.some(g => g.primitivo === idx))
      genes.push({primitivo: idx, peso:(rnd() * 2 - 1) * 2,
        transformacao: IDS_TRANSFORMACAO[Math.floor(rnd() * IDS_TRANSFORMACAO.length)]});
  } else if(genes.length > 1){
    genes.splice(Math.floor(rnd() * genes.length), 1);
  }
  return {genes, origem:"mutação", nascimento: geracao};
}

function chaveDaHipotese(h){
  return h.genes.slice().sort((a,b)=> a.primitivo - b.primitivo)
    .map(g => `${g.primitivo}:${g.transformacao}:${g.peso.toFixed(2)}`).join("|");
}

/* --------------------------- uma geração --------------------------- */

/* Uma geração completa: avalia a população no desenvolvimento, guarda os
   melhores, cruza, muta e traz imigrantes novos. A validação NÃO é tocada
   aqui — só em `concluirPesquisa`. */
function rodarGeracao(modalidade, opcoes){
  const o = Object.assign({semente:null}, opcoes || {});
  const dados = matrizDePesquisa(modalidade);
  if(dados.erro) return dados;

  const memoria = S.pesquisaAdaptativa[modalidade] || {
    geracao: 0, populacao: [], historico: [], hipotesesTestadas: 0, vistas: [],
  };
  const geracao = memoria.geracao + 1;
  /* Semente derivada da geração: reprodutível, e ainda assim diferente a cada
     geração. Semente fixa daria a mesma população para sempre. */
  const rnd = geradorSemeado(o.semente != null ? o.semente : (20260808 + geracao * 7919));

  let populacao = (memoria.populacao || []).slice();
  while(populacao.length < POPULACAO_PESQUISA)
    populacao.push(hipoteseAleatoria(rnd, geracao, "aleatória"));

  const vistas = new Set(memoria.vistas || []);
  let novas = 0;
  const avaliadas = populacao.map(h => {
    const chave = chaveDaHipotese(h);
    if(!vistas.has(chave)){ vistas.add(chave); novas++; }
    const ap = aptidao(h, dados);
    return {h, ...ap, chave};
  });
  avaliadas.sort((a, b) => b.valor - a.valor);

  /* Dois números do funil da tela, medidos aqui porque é aqui que existem.
     Não são enfeite: são os dois degraus entre "testei" e "sobreviveu", e sem
     eles a tela teria de inventá-los — coisa que ela, mais do que qualquer
     outra deste app, não pode fazer.

     * acimaDoAcaso: aptidão positiva, ou seja, o PIOR recorte de walk-forward
       ainda ficou acima de 0,5 depois da punição por complexidade.
     * mesmoSentido: todos os recortes apontaram para o mesmo lado. Uma
       hipótese que acerta num recorte e erra no outro não descreve nada — ela
       só encontrou dois acasos com sinais trocados. */
  const acimaDoAcaso = avaliadas.filter(x => x.valor > 0).length;
  const mesmoSentido = avaliadas.filter(x =>
    Array.isArray(x.porRecorte) && x.porRecorte.length > 0 &&
    (x.porRecorte.every(v => v >= 0.5) || x.porRecorte.every(v => v <= 0.5))).length;

  const elite = avaliadas.slice(0, ELITE_PESQUISA).map(x => x.h);
  const descartadas = avaliadas.length - elite.length;

  /* Torneio: dois sorteados, o melhor vence. Simples, e não deixa a população
     inteira virar cópia do campeão em três gerações. */
  const torneio = () => {
    const a = avaliadas[Math.floor(rnd() * avaliadas.length)];
    const b = avaliadas[Math.floor(rnd() * avaliadas.length)];
    return (a.valor >= b.valor ? a : b).h;
  };

  const proxima = elite.slice();
  while(proxima.length < POPULACAO_PESQUISA - IMIGRANTES_POR_GERACAO){
    const filho = rnd() < 0.6 ? cruzar(torneio(), torneio(), rnd, geracao)
                              : mutar(torneio(), rnd, geracao);
    proxima.push(filho);
  }
  /* Imigrantes: hipóteses completamente novas, sem parentesco com nada que já
     existe. Sem elas a busca converge para o primeiro vale que encontrar e
     nunca mais sai de lá. */
  for(let i = 0; i < IMIGRANTES_POR_GERACAO; i++)
    proxima.push(hipoteseAleatoria(rnd, geracao, "imigrante"));

  const melhor = avaliadas[0];
  const mediana = avaliadas[Math.floor(avaliadas.length / 2)].valor;

  const linhaHistorico = {
    geracao, melhorAptidao: melhor.valor, medianaAptidao: mediana,
    aucPorRecorte: melhor.porRecorte, descartadas,
    genes: melhor.h.genes.length, origem: melhor.h.origem,
    /* O funil desta geração fica na linha do histórico também, e não só na
       memória atual: a tabela do mockup mostra uma linha POR GERAÇÃO, e sem
       isto ela só saberia falar da última. */
    acimaDoAcaso, mesmoSentido,
    /* AUC médio do campeão nos recortes de DESENVOLVIMENTO. É o que existe por
       geração — o AUC fora da amostra e o p-valor saem do julgamento, que roda
       uma vez e aparece na Visão Geral. Confundir os dois seria vender medida
       de treino como medida de teste. */
    aucMelhor: melhor.porRecorte && melhor.porRecorte.length
      ? melhor.porRecorte.reduce((s,v) => s+v, 0) / melhor.porRecorte.length : 0.5,
  };
  const historico = (memoria.historico || []).concat([linhaHistorico])
    .slice(-HISTORICO_GERACOES);

  S.pesquisaAdaptativa[modalidade] = {
    geracao, populacao: proxima, historico,
    hipotesesTestadas: (memoria.hipotesesTestadas || 0) + novas,
    /* O funil desta geração. Fica na memória porque a tela precisa dele e a
       tela não tem como recalculá-lo: os escores morrem no fim desta função. */
    acimaDoAcaso, mesmoSentido, avaliadas: avaliadas.length,
    vistas: [...vistas].slice(-4000),
    campeaoDev: {genes: melhor.h.genes, origem: melhor.h.origem,
                 aptidao: melhor.valor, aucPorRecorte: melhor.porRecorte},
    /* Duas assinaturas, e a distinção importa: a CURTA ("quantos:último")
       decide se a pesquisa está atrasada em relação ao histórico, e a LONGA
       (com impressão digital do conteúdo) é a chave do cache da matriz.
       Guardar só a longa aqui fazia `pesquisasPendentes` nunca reconhecer a
       modalidade como em dia — ela voltava à fila a cada chamada e o motor
       re-evoluía para sempre, gastando bateria sem nada novo para aprender.
       Um teste pegou isso. */
    assinatura: assinaturaHistorico(modalidade),
    assinaturaMatriz: dados.assinatura,
    quando: new Date().toISOString(),
    concursosUsados: dados.concursosUsados,
    concursosDesenvolvimento: dados.concursosDesenvolvimento,
    concursosValidacao: dados.concursosValidacao,
    conclusao: null,   /* invalidada: a população mudou */
  };
  return S.pesquisaAdaptativa[modalidade];
}

/* ------------------- o julgamento, fora da amostra ------------------- */

/* Mede o campeão na validação — o recorte que a evolução nunca viu — contra
   uma nuvem de hipóteses aleatórias medidas no mesmo lugar, e contra o teste
   de permutação. Só aqui a validação é tocada, e só uma vez. */
function concluirPesquisa(modalidade, opcoes){
  const o = Object.assign({permutacoes:200, semente:20260808, nulos:120}, opcoes || {});
  const memoria = S.pesquisaAdaptativa[modalidade];
  if(!memoria || !memoria.campeaoDev)
    return {erro:"nenhuma geração rodou ainda nesta modalidade"};
  const dados = matrizDePesquisa(modalidade);
  if(dados.erro) return dados;

  const campeao = {genes: memoria.campeaoDev.genes, origem: memoria.campeaoDev.origem};
  const aucValidacao = avaliarHipotese(campeao, dados, dados.validacao);

  /* A nuvem do acaso: hipóteses aleatórias com a MESMA estrutura, medidas na
     MESMA validação. Comparar com 0,5 teórico esconderia que a própria forma
     da hipótese já produz algum afastamento. */
  const rndNulo = geradorSemeado(o.semente + 12345);
  const nulos = [];
  for(let i = 0; i < o.nulos; i++)
    nulos.push(Math.abs(avaliarHipotese(
      hipoteseAleatoria(rndNulo, 0, "nulo"), dados, dados.validacao) - 0.5));
  nulos.sort((a, b) => a - b);
  const afastamento = Math.abs(aucValidacao - 0.5);
  const percentilNaNuvem = nulos.filter(x => x <= afastamento).length / nulos.length;

  /* Permutação: embaralha os rótulos DENTRO de cada concurso. Embaralhar
     livremente geraria concursos impossíveis, com quantidade errada de dezenas
     sorteadas, e alargaria o nulo indevidamente. */
  const escores = dados.validacao.map(i => escoreDaHipotese(campeao, dados.X[i]));
  const rotulos = dados.validacao.map(i => dados.y[i]);
  const grupos = dados.validacao.map(i => dados.concursoDe[i]);
  const nulosPerm = permutarAuc(escores, rotulos, o.permutacoes,
                                geradorSemeado(o.semente), grupos);
  const acima = nulosPerm.filter(x => x >= aucValidacao).length;
  const abaixo = nulosPerm.filter(x => x <= aucValidacao).length;
  const m = nulosPerm.length;
  const pEmpirico = Math.min(1, 2 * Math.min((acima + 1) / (m + 1), (abaixo + 1) / (m + 1)));

  /* O p empírico tem PISO: com 200 permutações o menor valor possível é
     2/201 = 0,00995. E o limiar honesto de uma busca com centenas de hipóteses
     fica em 1e-4 — abaixo do piso. Do jeito ingênuo, o motor nunca poderia
     declarar achado nenhum, nem um verdadeiro: medi isso contra um sorteio
     deliberadamente viciado, onde ele encontrou AUC 0,737 e mesmo assim
     reprovou, porque o p não tinha como descer.

     A saída não é afrouxar o limiar — é medir o p com resolução suficiente. As
     permutações são usadas para estimar a MÉDIA e o DESVIO do nulo, mantendo a
     dependência dentro de cada concurso, e o p sai da cauda normal desse nulo.
     A estatística de Mann-Whitney sobre milhares de linhas é aproximadamente
     normal, então isto não é um atalho: é a forma padrão de obter resolução
     além do número de permutações. O p empírico continua sendo reportado ao
     lado, e há um teste que exige que os dois concordem quando o empírico está
     longe do piso — se um dia divergirem ali, a suposição de normalidade caiu
     e este número precisa ser revisto. */
  const mediaNulo = nulosPerm.reduce((a, b) => a + b, 0) / m;
  const varNulo = nulosPerm.reduce((a, b) => a + (b - mediaNulo) ** 2, 0) / Math.max(1, m - 1);
  const dpNulo = Math.sqrt(varNulo);
  const z = dpNulo > 0 ? (aucValidacao - mediaNulo) / dpNulo : 0;
  const p = dpNulo > 0 ? Math.min(1, 2 * caudaNormal(Math.abs(z))) : 1;

  /* O limiar honesto. Testar N hipóteses e julgar a melhor com 0,05 é dragagem
     de dados: a cada 20 hipóteses, uma passa por acaso. O divisor é o número de
     hipóteses DISTINTAS já testadas nesta modalidade, acumulado desde a
     primeira geração — porque foi essa a busca inteira que produziu o campeão,
     e não só a última geração. */
  const familia = Math.max(1, memoria.hipotesesTestadas);
  const limiar = 0.05 / familia;
  const sobreviveu = p <= limiar;

  /* Estabilidade: o campeão se comporta igual nos recortes de desenvolvimento?
     Um campeão que só funciona num recorte é ruído com sorte. */
  const porRecorte = memoria.campeaoDev.aucPorRecorte || [];
  const mesmoLado = porRecorte.length
    ? porRecorte.every(a => a >= 0.5) || porRecorte.every(a => a <= 0.5)
    : false;
  const amplitude = porRecorte.length
    ? Math.max(...porRecorte) - Math.min(...porRecorte) : 1;

  /* Degradação: quanto do afastamento medido no desenvolvimento sobreviveu na
     validação. É o número que mais desmancha resultado de busca evolutiva. */
  const afastamentoDev = memoria.campeaoDev.aucPorRecorte && memoria.campeaoDev.aucPorRecorte.length
    ? Math.min(...memoria.campeaoDev.aucPorRecorte.map(a => Math.abs(a - 0.5))) : 0;
  const degradacao = afastamentoDev > 0 ? 1 - (afastamento / afastamentoDev) : 1;

  const conclusao = {
    aucValidacao, afastamento, p, pEmpirico, z, mediaNulo, dpNulo,
    limiar, familia, sobreviveu,
    percentilNaNuvem, nulosNuvem: o.nulos, permutacoes: o.permutacoes,
    mesmoLado, amplitudeRecortes: amplitude, degradacao, afastamentoDev,
    aucPorRecorte: porRecorte, genes: campeao.genes, origem: campeao.origem,
    geracao: memoria.geracao, quando: new Date().toISOString(),
    assinatura: assinaturaHistorico(modalidade),
  };
  S.pesquisaAdaptativa[modalidade].conclusao = conclusao;
  return conclusao;
}

/* Uma hipótese dita em português. Sem isto o motor entrega uma lista de pesos,
   e uma afirmação que não se consegue ler não se consegue contestar. */
function descreverHipotese(entrada){
  /* Aceita tanto a lista de genes quanto a hipótese inteira. A primeira versão
     só aceitava a lista e devolvia "hipótese vazia" — em silêncio — quando
     recebia o objeto: um engano de uma linha que teria acabado impresso na
     tela como se fosse um resultado. */
  const genes = Array.isArray(entrada) ? entrada : (entrada && entrada.genes);
  if(!genes || !genes.length) return "hipótese vazia";
  return genes.slice()
    .sort((a, b) => Math.abs(b.peso) - Math.abs(a.peso))
    .map(g => {
      const prim = PRIMITIVOS[g.primitivo];
      const tr = TRANSFORMACOES[g.transformacao];
      const sentido = g.peso >= 0 ? "a favor" : "contra";
      return `${prim.nome} (${tr.nome}, ${sentido}, peso ${nf(Math.abs(g.peso), 2)})`;
    }).join(" · ");
}

/* `manchete` diz se a frase de abertura entra no texto. O cartão da tela já
   mostra essa frase como título; repeti-la no parágrafo logo abaixo era dizer a
   mesma coisa duas vezes seguidas. Quem chama sem opção continua recebendo o
   texto inteiro, que é como os testes e qualquer outro uso esperam. */
function vereditoPesquisa(c, opcoes){
  const o = Object.assign({manchete:true}, opcoes || {});
  if(!c || c.erro) return esc((c && c.erro) || "sem conclusão");
  if(!c.sobreviveu){
    return `${o.manchete ? "<strong>Nenhuma hipótese sobreviveu.</strong> " : ""}A melhor de
      ${inf(c.familia)} hipótese${c.familia > 1 ? "s" : ""} testada${c.familia > 1 ? "s" : ""}
      chegou a p = ${nf(c.p, 4)}, e o limiar honesto para uma busca desse tamanho é
      ${c.limiar < 0.0001 ? c.limiar.toExponential(1).replace(".", ",") : nf(c.limiar, 5)}
      — 0,05 dividido pelo número de hipóteses testadas. Este é o resultado
      esperado de sorteios independentes, e é o resultado que o motor vem
      encontrando.`;
  }
  return `${o.manchete ? "<strong>Uma hipótese sobreviveu à correção.</strong> " : ""}p = ${nf(c.p, 5)} contra o
    limiar ${c.limiar.toExponential(1).replace(".", ",")}, medida nos concursos que a busca
    nunca viu. Isso <strong>não</strong> quer dizer que ela preveja sorteio, e
    <strong>não</strong> vira aposta: quer dizer que vale repetir com mais concursos e ver
    se continua de pé. Um achado que não se repete é uma coincidência que se
    conheceu tarde demais.`;
}

function vereditoAprendizado(r){
  const correcao = (r.familia > 1)
    ? ` O limiar aplicado foi ${nf(r.limiteAplicado,4)}, e não 0,05, porque
        ${r.familia} modalidades foram testadas: com vários testes ao mesmo tempo,
        parte dos achados é falsa por construção, e a correção de Holm compensa
        isso.`
    : "";
  if(!r.aprendeu){
    const quaseLa = r.foraDaFaixa
      ? ` O AUC saiu fora da faixa do acaso, mas <strong>não sobreviveu à correção
          para múltiplos testes</strong> — que é exatamente o tipo de achado que
          desaparece quando se olha com honestidade.${correcao}`
      : "";
    return `O modelo <strong>não distingue</strong> dezena sorteada de não sorteada
      melhor que o acaso: AUC ${nf(r.auc,4)}, faixa do embaralhamento
      ${nf(r.faixaAcaso[0],4)} a ${nf(r.faixaAcaso[1],4)}, p = ${nf(r.p,3)}.${quaseLa}
      <strong>Este é o resultado esperado.</strong> Sorteios honestos são eventos
      independentes: não há o que aprender no histórico, e um modelo que
      afirmasse o contrário estaria descrevendo ruído.`;
  }
  return `O AUC de ${nf(r.auc,4)} caiu <strong>fora</strong> da faixa do acaso
    (${nf(r.faixaAcaso[0],4)} a ${nf(r.faixaAcaso[1],4)}), p = ${nf(r.p,3)}, e
    sobreviveu à correção para múltiplos testes.${correcao}
    Ainda assim, isto <strong>não</strong> é prova de sinal: com poucos concursos
    um desvio assim aparece por variância amostral. O caminho é repetir com mais
    concursos e ver se sobrevive — não é apostar nisso.`;
}


/* ==================== tela de estatísticas ==================== */

const TIPOS_ESTATISTICA = [
  {id:"dezenas",   nome:"Dezenas"},
  {id:"paridade",  nome:"Pares e ímpares"},
  {id:"primos",    nome:"Primos"},
  {id:"fibonacci", nome:"Fibonacci"},
  {id:"repeticoes",nome:"Repetições"},
  {id:"sequencia", nome:"Sequências"},
  {id:"soma",      nome:"Soma"},
  {id:"grade",     nome:"Linhas e colunas"},
  {id:"ciclos",    nome:"Ciclos"}
];

/* Barra que situa um valor observado contra o esperado. É a peça que faz esta
   tela ser diferente de uma tabela de dezena "em alta": o número sozinho não
   diz nada, o número ao lado da faixa do acaso diz tudo. */
function barraContra(observado, esperado, dp, rotulo){
  const dentro = dp > 0 ? Math.abs(observado - esperado) <= 2*dp : true;
  return `<div class="carta" style="margin-bottom:10px">
    <div class="kpis" style="margin-bottom:8px">
      <div class="kpi"><div class="rot">${esc(rotulo)} observado</div>
        <div class="val">${nf(observado, 2)}</div></div>
      <div class="kpi"><div class="rot">o acaso daria</div>
        <div class="val">${nf(esperado, 2)}</div>
        <div class="sub">± ${nf(2*dp, 2)}</div></div>
    </div>
    ${faixaAcaso(observado, esperado, Math.max(dp, 1e-9))}
    <div class="nota ${dentro?"":"atencao"}" style="margin-bottom:0">
      ${dentro
        ? "Dentro do que o acaso produz. Nada aqui indica tendência."
        : "Fora de dois desvios. Com muitos concursos e muitas estatísticas, alguns desvios assim aparecem por construção — não é sinal."}
    </div>
  </div>`;
}

function tabelaDezenas(e, modalidade){
  const c = MODALIDADES[modalidade];
  const ordem = S.ordemEstatistica || "vezes";
  const linhas = e.linhas.slice().sort((a,b) =>
    ordem === "dezena" ? a.dezena - b.dezena :
    ordem === "ausencia" ? b.ausencia - a.ausencia :
    b.vezes - a.vezes);
  return `<div class="segmento" role="tablist" style="margin-bottom:10px">
      ${[["vezes","Mais sorteadas"],["ausencia","Sem sair há mais tempo"],
         ["dezena","Ordem numérica"]].map(([k,n])=>
        `<button role="tab" data-ordem="${k}" aria-selected="${ordem===k}">${n}</button>`).join("")}
    </div>
    <div class="grade-freq" style="margin-bottom:12px">
      ${linhas.map(l=>{
        const alt = e.linhas.reduce((m,x)=> Math.max(m, x.vezes), 1);
        const h = Math.max(1, Math.round(26 * l.vezes / alt));
        return `<div class="cel ${l.fora?"fora":""}" title="${l.dezena}: ${l.vezes} vezes">
          <div class="n">${pad(l.dezena)}</div>
          <div class="b"><i style="height:${h}px"></i></div>
          <div class="c">${l.vezes}</div></div>`;
      }).join("")}
    </div>
    <div class="rolagem"><table>
      <thead><tr><th>dezena</th><th>saiu</th><th>sem sair há</th>
        <th>vs. acaso</th></tr></thead>
      <tbody>${linhas.map(l=>`<tr>
        <td>${pad(l.dezena)}</td><td>${l.vezes}</td>
        <td>${l.ausencia} concurso${l.ausencia===1?"":"s"}</td>
        <td style="color:${l.fora?"var(--alerta)":"var(--secundaria)"}">${
          l.z>=0?"+":""}${nf(l.z,2)} dp</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="nota">Em ${e.n} concursos, o acaso faria cada dezena sair
      <strong>${nf(e.esperado,1)}</strong> vezes, oscilando ± ${nf(2*e.dp,1)}.
      ${e.linhas.filter(l=>l.fora).length === 0
        ? "<strong>Nenhuma dezena está fora dessa faixa.</strong> É o retrato de um sorteio honesto."
        : `${e.linhas.filter(l=>l.fora).length} dezena(s) fora de dois desvios — com ${c.N} dezenas testadas, esperam-se cerca de ${nf(c.N*0.045,1)} por acaso.`}
    </div>
    <div class="nota atencao">A coluna "sem sair há" descreve o passado e
      <strong>não</strong> torna a dezena mais nem menos provável no próximo
      concurso. Cada sorteio é independente: as bolas não sabem quando saíram
      pela última vez. O intervalo médio entre aparições é de
      ${nf(e.ausenciaMedia,1)} concursos, e vê-lo ser respeitado no longo prazo é
      consequência do acaso, não de compensação.</div>`;
}

T.estatisticas = () => {
  const c = MODALIDADES[S.modalidade];
  const hist = historicoDe(S.modalidade);
  const tipo = S.tipoEstatistica || "dezenas";

  if(hist.length < 5) return `<div class="vazio">
    Só ${hist.length} concurso${hist.length===1?"":"s"} de ${esc(c.nome)} no app.<br>
    Traga histórico em <strong>Conferir › Resultados</strong> — sem concursos não
    há estatística, e com poucos qualquer número engana.</div>`;

  const seletor = `<div class="trilha" style="margin:0 -16px 12px;padding:0 16px 2px">
    ${TIPOS_ESTATISTICA.map(t=>
      `<button data-tipo="${t.id}" aria-pressed="${t.id===tipo}">${esc(t.nome)}</button>`).join("")}
  </div>`;

  let corpo = "";
  if(tipo === "dezenas"){
    corpo = tabelaDezenas(porDezena(S.modalidade), S.modalidade);
  } else if(tipo === "paridade"){
    const par = contagemPorConcurso(S.modalidade, d => d % 2 === 0);
    const imp = contagemPorConcurso(S.modalidade, d => d % 2 !== 0);
    corpo = barraContra(par.media, par.esperado, par.dpMedia, "pares por concurso") +
      barraContra(imp.media, imp.esperado, imp.dpMedia, "ímpares por concurso") +
      `<div class="carta"><h2>distribuição de pares por concurso</h2>
        ${histograma(par.dist, par.n)}</div>
      <div class="nota">Equilíbrio entre pares e ímpares é o padrão mais comum
        <em>porque há mais combinações equilibradas do que desequilibradas</em> —
        não porque o sorteio prefira equilíbrio. Marcar 6 pares na Mega-Sena tem
        exatamente a mesma chance de qualquer outra combinação específica; o que
        é raro é o <strong>conjunto</strong> das combinações só-pares, não cada
        uma delas.</div>`;
  } else if(tipo === "primos" || tipo === "fibonacci"){
    const c2 = MODALIDADES[S.modalidade];
    const conj = tipo === "primos"
      ? (() => { const p = new Set(); for(let d=2; d<=c2.N+c2.base-1; d++){
            let ok = d > 1; for(let i=2; i*i<=d; i++) if(d%i===0){ ok=false; break; }
            if(ok) p.add(d); } return p; })()
      : fibonacciAte(c2.N + c2.base - 1);
    const r = contagemPorConcurso(S.modalidade, d => conj.has(d));
    corpo = barraContra(r.media, r.esperado, r.dpMedia,
        `${tipo === "primos" ? "primos" : "Fibonacci"} por concurso`) +
      `<div class="carta"><h2>quais são</h2>
        <div class="dezenas">${[...conj].sort((a,b)=>a-b)
          .map(d=>`<span class="dz">${pad(d)}</span>`).join("")}</div>
        <div class="pe" style="border:0;padding-left:0">
          <span>${r.quantosNoUniverso} de ${c2.N} dezenas</span>
          <span>${nf(100*r.quantosNoUniverso/c2.N,1)}% do volante</span></div></div>
      <div class="carta"><h2>distribuição por concurso</h2>${histograma(r.dist, r.n)}</div>`;
  } else if(tipo === "repeticoes"){
    const r = repeticoesAnterior(S.modalidade);
    corpo = barraContra(r.media, r.esperado, r.dpMedia, "repetidas do concurso anterior") +
      `<div class="carta"><h2>quantas se repetem</h2>${histograma(r.dist, r.n)}</div>
      <div class="nota">Repetição do concurso anterior acontece o tempo todo, e o
        número médio é previsível: ${nf(r.esperado,2)} dezenas em
        ${c.k}. Evitar as dezenas que acabaram de sair <strong>não</strong>
        aumenta sua chance — mas muita gente as repete, então evitá-las muda com
        quantas pessoas você dividiria o prêmio.</div>`;
  } else if(tipo === "sequencia"){
    const r = sequencias(S.modalidade);
    corpo = barraContra(r.media, r.esperado, Math.max(r.esperado/Math.sqrt(r.n),1e-9),
        "pares consecutivos por concurso") +
      `<div class="carta">
        <div class="kpis" style="margin:0">
          <div class="kpi"><div class="rot">concursos com sequência</div>
            <div class="val">${nf(100*r.fracaoComSequencia,1)}%</div>
            <div class="sub">${r.comSequencia} de ${r.n}</div></div>
          <div class="kpi"><div class="rot">pares consecutivos</div>
            <div class="val">${nf(r.media,2)}</div>
            <div class="sub">por concurso</div></div>
        </div></div>
      <div class="nota">Sequências como 14-15 saem com frequência, e a maioria
        das pessoas evita marcá-las por achar que "não parece sorteio". Isso as
        torna combinações com <strong>menos gente dividindo</strong> — a chance
        de acertar continua a mesma.</div>`;
  } else if(tipo === "soma"){
    const r = somaDasDezenas(S.modalidade);
    corpo = barraContra(r.media, r.esperado, r.dpMedia, "soma média das dezenas") +
      `<div class="carta">
        <div class="kpis" style="margin:0">
          <div class="kpi"><div class="rot">menor soma</div>
            <div class="val">${inf(r.minimo)}</div></div>
          <div class="kpi"><div class="rot">maior soma</div>
            <div class="val">${inf(r.maximo)}</div></div>
          <div class="kpi"><div class="rot">mediana</div>
            <div class="val">${inf(r.mediana)}</div></div>
          <div class="kpi"><div class="rot">desvio de um concurso</div>
            <div class="val" style="font-size:1.15rem">${nf(r.dpUm,1)}</div></div>
        </div></div>
      <div class="nota">A soma se concentra no meio pelo mesmo motivo que a
        paridade se equilibra: <strong>há mais combinações com soma média</strong>.
        Escolher uma soma central não melhora sua chance — cada combinação
        específica continua igualmente provável.</div>`;
  } else if(tipo === "grade"){
    const r = linhasEColunas(S.modalidade);
    const bloco = (titulo, dados, prefixo) => `<div class="carta">
      <h2>${titulo}</h2>
      <div class="rolagem"><table>
        <thead><tr><th>${prefixo}</th><th>dezenas</th><th>saiu</th><th>acaso</th>
          <th>diferença</th></tr></thead>
        <tbody>${dados.map(x=>{
          const dif = x.vezes - x.esperado;
          const dp = Math.sqrt(x.esperado) || 1;
          return `<tr><td>${x.i + 1}</td><td>${x.tamanho}</td><td>${inf(x.vezes)}</td>
            <td>${nf(x.esperado,0)}</td>
            <td style="color:${Math.abs(dif)>2*dp?"var(--alerta)":"var(--secundaria)"}">${
              dif>=0?"+":""}${nf(dif,0)}</td></tr>`;
        }).join("")}</tbody></table></div></div>`;
    corpo = bloco("por linha do volante", r.porLinha, "linha") +
      bloco("por coluna do volante", r.porColuna, "coluna") +
      `<div class="nota">Desenhos no volante — linha cheia, coluna cheia, diagonal —
        são muito marcados por gente que aposta. Evitá-los não muda sua chance de
        acertar; muda o rateio.</div>`;
  } else if(tipo === "ciclos"){
    const r = ciclos(S.modalidade);
    corpo = `<div class="carta">
      <div class="kpis" style="margin:0">
        <div class="kpi"><div class="rot">ciclos fechados</div>
          <div class="val">${r.fechados.length}</div>
          <div class="sub">em ${r.n} concursos</div></div>
        <div class="kpi"><div class="rot">duração média</div>
          <div class="val">${r.media === null ? "—" : nf(r.media,1)}</div>
          <div class="sub">acaso: ${nf(r.esperado,1)}</div></div>
        <div class="kpi"><div class="rot">ciclo em aberto</div>
          <div class="val" style="font-size:1.15rem">${r.emAberto}/${c.N}</div>
          <div class="sub">dezenas já vistas</div></div>
        <div class="kpi"><div class="rot">faltam</div>
          <div class="val" style="font-size:1.15rem">${r.faltam}</div>
          <div class="sub">para fechar</div></div>
      </div></div>
      ${r.fechados.length ? `<div class="carta"><h2>duração de cada ciclo</h2>
        <div class="rolagem"><table><thead><tr><th>ciclo</th><th>concursos</th></tr></thead>
        <tbody>${r.fechados.map((v,i)=>`<tr><td>${i+1}</td><td>${v}</td></tr>`).join("")}
        </tbody></table></div></div>` : ""}
      <div class="nota atencao">Um ciclo é fechado quando todas as ${c.N} dezenas
        já saíram ao menos uma vez. É uma curiosidade do passado. As dezenas que
        <strong>faltam</strong> para fechar o ciclo <strong>não</strong> têm
        prioridade nenhuma no próximo sorteio — a urna não sabe que elas estão
        faltando. O valor esperado de ${nf(r.esperado,1)} concursos vem do
        problema do colecionador de figurinhas, e o acaso o cumpre sozinho.</div>`;
  }

  return seletor + corpo +
    `<div class="nota">Base: <strong>${hist.length} concursos</strong> de
      ${esc(c.nome)}, do ${hist[0].concurso} ao ${hist[hist.length-1].concurso}.
      Toda estatística acima descreve o que já saiu. Nenhuma delas muda a
      probabilidade do próximo sorteio.</div>`;
};

/* Histograma simples de um dicionário valor -> contagem. */
function histograma(dist, total){
  const chaves = Object.keys(dist).map(Number).sort((a,b)=>a-b);
  const maior = Math.max(...chaves.map(k => dist[k]));
  return `<div style="display:flex;flex-direction:column;gap:4px;margin-top:8px">
    ${chaves.map(k=>{
      const pct = 100 * dist[k] / total;
      return `<div style="display:flex;align-items:center;gap:8px">
        <span class="num" style="width:2ch;text-align:right;font-size:.78rem">${k}</span>
        <span style="flex:1;height:14px;background:var(--trama);border-radius:7px;overflow:hidden">
          <i style="display:block;height:100%;width:${100*dist[k]/maior}%;
            background:var(--acaso);border-radius:7px"></i></span>
        <span class="num" style="width:6ch;font-size:.7rem;color:var(--secundaria)"
          >${nf(pct,1)}%</span></div>`;
    }).join("")}</div>`;
}

/* ==================== telas novas ==================== */

const marcadasDe = m => S.marcadas[m] || [];

T.montar = () => {
  const c = MODALIDADES[S.modalidade];
  const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
  const valido = dez.length >= c.min && dez.length <= c.max;
  const cobertas = valido ? combinacoes(dez.length, c.k) : 0;
  const custo = cobertas * c.preco;
  const obs = dez.length >= c.k ? observacoes(dez, S.modalidade) : [];
  const ultimo = ultimoResultado(S.modalidade);

  return cartela(S.modalidade, dez, {interativa:true,
      selo:`${dez.length} de ${c.min}${c.max>c.min?`–${c.max}`:""}`,
      rodape:`<div class="pe">
        <span>${dez.length < c.min
          ? `faltam ${c.min - dez.length}`
          : dez.length > c.max ? `${dez.length - c.max} a mais` : "aposta válida"}</span>
        <span>${valido ? brl(custo) : "—"}</span></div>`}) +
    `<div class="contador">
      <span>marcadas <b>${dez.length}</b> de ${c.min}${c.max>c.min?` a ${c.max}`:""}</span>
      <span>${valido ? `${inf(cobertas)} aposta${cobertas>1?"s":""} simples` : "aposta incompleta"}</span>
    </div>
    <!-- Concurso opcional. É aqui que ele faz sentido, e não nas outras duas
         formas de salvar: a cartela é onde alguém transcreve um bilhete que já
         tem na mão, e quem tem o bilhete sabe o número do concurso. Nos jogos
         gerados pelo app não existe bilhete nenhum, e um campo pedindo concurso
         ali sugeriria que existe. -->
    <label class="campo" style="margin-bottom:10px"><label>concurso (opcional)</label>
      <input id="m-concurso" type="number" inputmode="numeric"
        placeholder="vazio = compara com os concursos a partir de hoje"></label>
    <div class="botoes" style="margin-bottom:12px">
      <button class="acao mini" id="m-salvar" ${valido?"":"disabled"}>salvar jogo</button>
      <button class="acao contorno mini" id="m-completar">completar ao acaso</button>
      <button class="acao contorno mini" id="m-limpar" ${dez.length?"":"disabled"}>limpar</button>
    </div>
    ${dez.length < c.k ? "" : (() => {
      const g = preverGanhadores(dez, S.modalidade);
      if(!g || !g.util) return "";
      const p = proximoConcurso(S.modalidade);
      const premio = p && p.estimativa ? p.estimativa : null;
      const esperado = premio !== null ? premio / (1 + g.ganhadores) : null;
      const esperadoTipico = (premio !== null && g.mediana !== null)
        ? premio / (1 + g.mediana) : null;
      const melhor = g.razao !== null && g.razao < 1;
      return `<div class="carta">
        <h2>com quantas pessoas você dividiria</h2>
        <div class="kpis">
          <div class="kpi"><div class="rot">ganhadores estimados</div>
            <div class="val">${nf(g.ganhadores, 1)}</div>
            <div class="sub">se esta combinação sair</div></div>
          <div class="kpi"><div class="rot">típico nesta loteria</div>
            <div class="val">${g.mediana === null ? "—" : inf(g.mediana)}</div>
            <div class="sub">mediana do histórico</div></div>
          ${esperado === null ? "" : `
          <div class="kpi"><div class="rot">seu prêmio esperado</div>
            <div class="val" style="font-size:1.05rem;color:${
              melhor?"var(--acaso)":"var(--tinta)"}">${brl(esperado)}</div>
            <div class="sub">de ${brl(premio)} estimados</div></div>
          <div class="kpi"><div class="rot">com jogo típico</div>
            <div class="val" style="font-size:1.05rem">${brl(esperadoTipico)}</div>
            <div class="sub">diferença: ${brl(esperado - esperadoTipico)}</div></div>`}
        </div>
        <div class="nota ${melhor?"":"atencao"}">
          ${melhor
            ? `Este jogo é <strong>menos disputado que o típico</strong> — cerca de
               ${nf(100*(1-g.razao),0)}% menos gente marcaria algo assim. É a única
               vantagem matematicamente real numa loteria honesta.`
            : `Este jogo é <strong>mais disputado que o típico</strong>: cerca de
               ${nf(100*(g.razao-1),0)}% mais gente marcaria algo assim, então
               sobraria menos para você.`}
        </div>
        <div class="nota atencao"><strong>Isto não muda sua chance de acertar.</strong>
          Ela é 1 em ${inf(combinacoes(c.N, c.k))} para qualquer combinação, sempre.
          O que muda é quanto sobra <em>se</em> você acertar.

          <span style="display:block;margin-top:6px">E por que esta previsão é
          honesta enquanto prever dezena não é: aqui não se prevê o sorteio, e sim
          <strong>comportamento humano</strong> — as pessoas repetem data de
          nascimento e desenho no volante concurso após concurso, e os ganhadores
          publicados registram isso. Modelo ajustado com ${inf(g.n)} concursos,
          R² ${nf(g.r2, 3)}.</span></div>
      </div>`;
    })()}
    ${dez.length < c.k ? "" : (() => {
      const r = retrospectiva(dez, S.modalidade);
      if(r.erro) return "";
      const media = Object.entries(r.distribuicao)
        .reduce((a,[k,v]) => a + Number(k)*v, 0) / r.n;
      const chaves = Object.keys(r.distribuicao).map(Number).sort((a,b)=>b-a);
      return `<div class="carta">
        <h2>se você tivesse jogado isto sempre</h2>
        <p style="font-size:.85rem;color:var(--secundaria);margin:6px 0 10px">
          Concursos ${r.de} a ${r.ate}, com o preço de hoje.</p>
        <div class="kpis">
          <div class="kpi"><div class="rot">teria custado</div>
            <div class="val" style="font-size:1.15rem">${brl(r.custo)}</div>
            <div class="sub">${inf(r.n)} concursos × ${brl(r.custoPorConcurso)}</div></div>
          <div class="kpi"><div class="rot">teria voltado</div>
            <div class="val" style="font-size:1.15rem">${brl(r.retorno)}</div>
            <div class="sub">${r.premiados} vez${r.premiados===1?"":"es"} em faixa</div></div>
          <div class="kpi"><div class="rot">resultado</div>
            <div class="val" style="font-size:1.15rem;color:${
              r.liquido>=0?"var(--acaso)":"var(--alerta)"}">${brl(r.liquido)}</div>
            <div class="sub">ROI ${nf(100*r.roi,1)}%</div></div>
          <div class="kpi"><div class="rot">acertos médios</div>
            <div class="val">${nf(media,2)}</div>
            <div class="sub">acaso: ${nf(r.esperado,2)}</div></div>
        </div>
        <h2 style="margin:14px 0 6px">quantas vezes deu cada resultado</h2>
        ${histograma(Object.fromEntries(chaves.map(k=>[k, r.distribuicao[k]])), r.n)}
        ${r.melhor ? `<div class="nota">Melhor momento: concurso
          ${esc(r.melhor.concurso)}, ${r.melhor.acertos} acertos,
          <strong>${brl(r.melhor.premio)}</strong>.</div>` : ""}
        ${r.semRateio ? `<div class="nota atencao">${r.semRateio} concurso${
          r.semRateio===1?"":"s"} em faixa de prêmio ${r.semRateio===1?"ficou":"ficaram"}

          inventar.</div>` : ""}
        <div class="nota atencao"><strong>Isto é o passado, e o passado não se
          repete.</strong> Este extrato não diz o que o jogo fará: diz o que
          teria feito, o que é uma pergunta diferente. Nenhuma combinação tem
          desempenho futuro previsível — todas têm a mesma chance. O valor deste
          número é outro: ele mostra o <strong>custo real</strong> de jogar
          sempre, que é a única parte da conta que não depende de sorte.</div>
      </div>`;
    })()}
    ${dez.length < c.k ? "" : (() => {
      const perfil = perfilDoJogo(dez, S.modalidade);
      if(perfil.erro) return `<div class="carta"><h2>análise das dezenas</h2>
        <div class="nota atencao">Faltam ${esc(perfil.erro.replace(/^faltam /,""))}
          para comparar este jogo com o histórico. Traga concursos em
          <strong>Conferir › Resultados</strong>.</div></div>`;
      const geral = lerTipicidade(perfil.tipicidade);
      return `<div class="carta">
        <h2>análise das dezenas</h2>
        <div class="rolagem" style="margin-top:8px"><table>
          <thead><tr><th>característica</th><th>seu jogo</th><th>concursos</th>
            <th>veredito</th></tr></thead>
          <tbody>${perfil.linhas.map(l=>{
            const t = lerTipicidade(l.fracao);
            return `<tr>
              <td>${esc(l.nome)}${l.detalhe?`<br><span style="font-size:.9em;color:var(--secundaria)">${esc(l.detalhe)}</span>`:""}</td>
              <td>${esc(String(l.valor))}</td>
              <td>${nf(100*l.fracao,1)}%<br>
                <span style="font-size:.9em;color:var(--secundaria)">${l.concursos} de ${perfil.n}</span></td>
              <td style="color:${t.cor}">${t.rotulo}</td></tr>`;
          }).join("")}</tbody>
        </table></div>
        <div class="nota atencao"><strong>Cuidado com a leitura invertida.</strong>
          Existe app que pinta de verde "ótimo" a configuração mais comum. É o
          contrário: toda combinação válida tem <strong>exatamente a mesma
          chance</strong> — 1 em ${inf(combinacoes(c.N, c.k))} aqui. O que a
          configuração comum indica é que <strong>muita gente marca parecido com
          você</strong>, e isso só piora o quanto sobraria se você acertasse.
          Nesta tabela, "raro" é a coluna a favor do seu bolso, não contra.</div>
        <div class="nota">No conjunto, este jogo é <strong style="color:${geral.cor}">${
          geral.rotulo}</strong> — ${esc(geral.leitura)}.</div>
      </div>`;
    })()}
    ${dez.length >= c.k ? `<div class="carta">
      <h2>como este jogo se parece</h2>
      <ul style="margin:8px 0 0;padding-left:1.15em;font-size:.88rem">
        ${obs.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
      <div class="nota">Isto descreve a <strong>forma</strong> do jogo, não a chance dele.
        Todas as combinações válidas têm exatamente a mesma probabilidade. O que a forma
        muda é quanta gente costuma marcar algo parecido — e portanto com quantas pessoas
        você dividiria, se acertasse.</div>
    </div>` : ""}
    ${ultimo && dez.length ? `<div class="carta">
      <h2>contra o último concurso conhecido</h2>
      <p style="font-size:.85rem;color:var(--secundaria);margin:6px 0 10px">
        Concurso ${esc(ultimo.concurso)}. Isto é um teste retrospectivo: não diz nada
        sobre o próximo sorteio.</p>
      ${cartela(S.modalidade, dez, {sorteadas:ultimo.dezenas,
        selo:`concurso ${ultimo.concurso}`})}
      ${legendaCartela}
    </div>` : ""}
    <div id="m-saida"></div>`;
};

T.aprendizado = () => {

  }));
  const d = dadosAprendizado(S.modalidade);

  return `<div class="carta">
    <h2>${esc(c.nome)}</h2>
    <div class="nota"><strong>Um modelo por modalidade, treinado e medido

      <span style="flex:1;font-size:.88rem">

        <span style="display:block;font-size:.78rem;color:var(--secundaria)">
          Retreina só as modalidades que receberam concurso, e avisa quando fica
          pronta. Desligado, a análise só roda no botão.</span></span>
    </label>
    ${d.erro
      ? `<div class="nota atencao">Não dá para treinar ainda: ${esc(d.erro)}.
          Há ${d.tem} concurso${d.tem===1?"":"s"} desta modalidade no app e são

          <strong>Conferir › Resultados</strong>.</div>`
      : `<div class="kpis">
          <div class="kpi"><div class="rot">concursos</div>
            <div class="val">${d.nConcursos}</div><div class="sub">no app</div></div>
          <div class="kpi"><div class="rot">divisão temporal</div>
            <div class="val" style="font-size:1.05rem">${d.concursosTreino} / ${d.concursosTeste}</div>
            <div class="sub">treino / teste</div></div>
        </div>
        <div class="pe" style="border:0;padding-left:0">
          <span>os ${JANELA_LONGA} primeiros concursos não entram na conta</span>
          <span>viram as características dos seguintes</span></div>
        <p style="font-size:.82rem;color:var(--secundaria);margin:0 0 12px">
          ${d.nConcursos} concursos no app − ${JANELA_LONGA} de aquecimento =
          ${d.concursosTreino + d.concursosTeste} usados. Um concurso só pode ser
          previsto depois de existir passado suficiente para descrever cada dezena.</p>
        <button class="acao" id="ap-treinar">treinar e medir fora da amostra</button>
        <div class="nota">O modelo é treinado nos concursos antigos e medido nos
          recentes, que ele nunca viu. As características de cada concurso usam
          apenas os concursos anteriores a ele — usar o próprio vazaria a resposta e
          produziria um resultado excelente e falso.</div>`}
    <div id="ap-saida">${!r ? "" : `
      <div class="kpis">
        <div class="kpi"><div class="rot">AUC fora da amostra</div>
          <div class="val">${nf(r.auc,4)}</div>
          <div class="sub">acaso: 0,5000</div></div>
        <div class="kpi"><div class="rot">p-valor</div>
          <div class="val">${nf(r.p,3)}</div>
          <div class="sub">${r.aprendeu?"fora":"dentro"} da faixa do acaso</div></div>
        <div class="kpi"><div class="rot">perda do modelo</div>
          <div class="val" style="font-size:1.15rem">${nf(r.perda,4)}</div>

          <div class="val" style="font-size:1.15rem">${inf(r.nLinhasTeste)}</div>
          <div class="sub">dezena × concurso</div></div>

      ${faixaAcaso(r.auc, 0.5, Math.max((r.faixaAcaso[1]-r.faixaAcaso[0])/4, 0.001))}

      <div class="nota">Os pesos ficam à vista de propósito: um modelo cujos

        algo — significa que o gradiente parou ali com os dados de treino.</div>
      <div class="nota atencao">Limitação declarada: o teste de permutação embaralha
        os rótulos do teste e recalcula o AUC, sem retreinar o modelo a cada
        permutação. Retreinar seria mais forte e levaria minutos no aparelho.
        O embaralhamento respeita a estrutura do sorteio: acontece dentro de cada
        concurso, para que cada sorteio permutado continue tendo exatamente
        ${c.k} dezenas — embaralhar livremente geraria sorteios impossíveis e
        estreitaria a faixa do acaso.</div>
      <div class="pe" style="border:0;padding-left:0">
        <span>${r.permutacoes} permutações · semente ${r.semente}</span>
        <span>rodar de novo dá o mesmo resultado</span></div>
      ${!r.quando ? "" : `<div class="pe" style="border:0;padding-left:0;padding-top:0">
        <span>análise ${r.automatica?"automática":"manual"} de
          ${esc(new Date(r.quando).toLocaleString("pt-BR"))}</span>
        <span>${esc(r.assinatura||"")} concursos:último</span></div>`}`}
    </div>
  </div>
  <div class="carta">
    <h2>histórico disponível por modalidade</h2>
    <p style="font-size:.85rem;color:var(--secundaria);margin:6px 0 10px">
      Cada modalidade é analisada por conta própria, e só entra na análise com pelo

      variância amostral com cara de descoberta.</p>
    <div class="rolagem"><table>
      <tr><th>modalidade</th><th>concursos</th><th>situação</th><th>AUC</th><th>p</th></tr>
      ${estoque.map(e=>{
        const res = S.aprendizado && S.aprendizado[e.id];
        return `<tr>
          <td>${esc(e.nome)}</td><td>${e.n}</td>
          <td>${e.n >= MINIMO_CONCURSOS
            ? (res ? `<span class="selo ${res.aprendeu?"seu":"ok"}"
