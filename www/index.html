T.teimosinha = () => {
  const c = MODALIDADES[S.modalidade];
  const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
  const minhas = (S.teimosinhas||[]).filter(t => t.modalidade === S.modalidade);
  const podeCriar = dez.length >= c.min && dez.length <= c.max;
  const ultimo = ultimoResultado(S.modalidade);
  return `<div class="carta">
    <h2>criar teimosinha</h2>
    <p style="font-size:.85rem;color:var(--secundaria);margin:6px 0 10px">
      Usa as dezenas marcadas na tela <strong>Manual</strong>${
        dez.length ? `: ${dez.map(pad).join(" ")}` : " — nenhuma marcada ainda"}.</p>
    <div class="linha2">
      <label class="campo"><label>a partir do concurso</label>
        <input id="t-de" type="number" inputmode="numeric"
          value="${ultimo ? ultimo.concurso + 1 : ""}" placeholder="ex.: 3422"></label>
      <label class="campo"><label>concursos seguidos</label>
        <select id="t-n">${[2,3,4,5,6,7,8,9].map(v=>
          `<option value="${v}">${v}</option>`).join("")}</select></label>
    </div>
    <button class="acao mini" id="t-criar" ${podeCriar?"":"disabled"}>criar teimosinha</button>
    <div class="nota">O custo é multiplicado pelo número de concursos e sai inteiro no ato,
      como na lotérica. Repetir o mesmo jogo não muda a chance de nenhum sorteio: cada
      concurso é independente do anterior.</div>
    <div id="t-saida"></div>
  </div>
  ${!minhas.length ? `<div class="vazio">Nenhuma teimosinha nesta modalidade.</div>`
    : minhas.map(t=>{
        const conf = t.conferencias || [];
        const fim = t.deConcurso + t.concursos - 1;
        const restam = Math.max(0, t.concursos - conf.length);
        const melhor = conf.length ? Math.max(...conf.map(x=>x.acertos)) : null;
        return `<div class="carta">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
            <h3>Concursos ${t.deConcurso}–${fim}</h3>
            <span class="selo ${restam?"seu":"ok"}">${restam?`${restam} por sair`:"encerrada"}</span>
          </div>
          ${cartela(t.modalidade, t.dezenas, {
            sorteadas: conf.length ? conf[conf.length-1].dezenas : null,
            selo:`${t.dezenas.length} dezenas`})}
          <div class="kpis">
            <div class="kpi"><div class="rot">custo total</div>
              <div class="val" style="font-size:1.15rem">${brl(t.custo)}</div>
              <div class="sub">${t.concursos} concursos</div></div>
            <div class="kpi"><div class="rot">melhor acerto</div>
              <div class="val">${melhor === null ? "—" : melhor}</div>
              <div class="sub">${conf.length} conferido${conf.length===1?"":"s"}</div></div>
          </div>
          ${conf.length ? `<div class="rolagem"><table>
            <tr><th>concurso</th><th>acertos</th><th>faixa</th></tr>
            ${conf.slice().sort((a,b)=>a.concurso-b.concurso).map(x=>`<tr>
              <td>${esc(x.concurso)}</td><td>${x.acertos}</td>
              <td>${faixaAtingida(t.modalidade, x.acertos) !== null
                ? `<span class="selo ok">prêmio</span>` : "—"}</td></tr>`).join("")}
          </table></div>` : `<div class="pe">Nenhum dos concursos entrou no histórico ainda.</div>`}
          <div class="botoes" style="margin-top:10px">
            <button class="acao perigo mini" data-apagar-teimosinha="${esc(t.id)}">apagar</button>
          </div>
        </div>`;
      }).join("")}`;
};

/* ============================ ações ============================ */
function acoesNovas(){
  /* --- volante manual --- */
  document.querySelectorAll("#volante [data-casa]").forEach(b => b.onclick = () => {
    const d = +b.dataset.casa, c = MODALIDADES[S.modalidade];
    const atual = marcadasDe(S.modalidade).slice();
    const i = atual.indexOf(d);
    if(i >= 0) atual.splice(i, 1);
    else if(atual.length >= c.max) return;      // teto da modalidade, sem aviso ruidoso
    else atual.push(d);
    S.marcadas[S.modalidade] = atual;
    Guardar.gravar("marcadas", S.marcadas);
    pintar();
  });

  const compl = $("#m-completar");
  if(compl) compl.onclick = () => {
    const c = MODALIDADES[S.modalidade];
    const atual = new Set(marcadasDe(S.modalidade));
    const faltam = Math.max(0, c.min - atual.size);
    const livres = universo(S.modalidade).filter(d => !atual.has(d));
    embaralhar(livres).slice(0, faltam).forEach(d => atual.add(d));
    S.marcadas[S.modalidade] = [...atual].sort((a,b)=>a-b);
    Guardar.gravar("marcadas", S.marcadas); pintar();
  };

  const limpar = $("#m-limpar");
  if(limpar) limpar.onclick = () => {
    S.marcadas[S.modalidade] = [];
    Guardar.gravar("marcadas", S.marcadas); pintar();
  };

  const salvar = $("#m-salvar");
  if(salvar) salvar.onclick = () => {
    const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
    S.jogos.push({
      id:`${Date.now().toString(36)}-m`, dezenas:dez, modalidade:S.modalidade,
      metodo:"manual", data:hoje(), lote:`M${Date.now().toString(36)}`, conferencias:[]
    });
    Guardar.gravar("jogos", S.jogos);
    conferenciaAutomatica();
    S.tela = "jogos"; pintar();
  };

  /* --- resultados --- */
  const colar = $("#r-colar");
  if(colar) colar.onclick = () => {
    const saida = $("#r-saida");
    try{
      const novos = lerColagem($("#r-texto").value, S.modalidade);
      const n = guardarResultados(novos);
      const r = aoMudarHistorico(n, "colado");
      saida.innerHTML = `<div class="nota"><strong>${n} concurso${n===1?"":"s"} novo${n===1?"":"s"}</strong>
        de ${novos.length} lido${novos.length===1?"":"s"}. ${r.novas} conferência${r.novas===1?"":"s"}
        automática${r.novas===1?"":"s"}.</div>`;
      setTimeout(pintar, 900);
    }catch(e){
      saida.innerHTML = `<div class="nota atencao">Não importei: ${esc(e.message)}.</div>`;
    }
  };

  const buscar = async (quantos) => {
    const saida = $("#r-saida");
    saida.innerHTML = `<div class="nota"><span class="girando"></span>consultando o serviço da Caixa…</div>`;
    try{
      const ultimo = await buscarNaCaixa(S.modalidade, null);
      const lote = [ultimo];
      for(let i = 1; i < quantos; i++){
        const n = ultimo.concurso - i;
        if(n < 1) break;
        try{ lote.push(await buscarNaCaixa(S.modalidade, n)); }
        catch(e){ break; }   // para no primeiro que falhar; o que veio já vale
      }
      const n = guardarResultados(lote);
      const nome = (FONTES.find(f => f.id === lote[0].fonte) || {}).nome || "fonte desconhecida";
      const r = aoMudarHistorico(n, nome);
      saida.innerHTML = `<div class="nota"><strong>${lote.length} concurso${lote.length===1?"":"s"}
        recebido${lote.length===1?"":"s"}</strong>, ${n} novo${n===1?"":"s"}.
        ${r.novas} conferência${r.novas===1?"":"s"} automática${r.novas===1?"":"s"}.
        <span style="display:block;margin-top:4px;font-size:.9em">Fonte: ${esc(nome)}.</span></div>`;
      setTimeout(pintar, 900);
    }catch(e){
      saida.innerHTML = `<div class="nota atencao">
        <strong>Nenhuma fonte respondeu.</strong>
        <span style="display:block;margin-top:6px;font-family:var(--mono);font-size:.76rem"
          >${esc(e.message)}</span>
        <span style="display:block;margin-top:8px">Se aparece <em>Failed to fetch</em> em
        todas, o navegador está bloqueando por CORS — os serviços de loteria não autorizam
        chamadas de outra origem. Dentro do APK a requisição passa pela camada nativa e
        funciona. Enquanto isso, a colagem abaixo não depende de rede.</span></div>`;
    }
  };
  if($("#r-caixa")) $("#r-caixa").onclick = () => buscar(1);
  if($("#r-varios")) $("#r-varios").onclick = () => buscar(20);

  const tudo = $("#r-tudo");
  if(tudo) tudo.onclick = async () => {
    const saida = $("#r-saida");
    tudo.disabled = true;
    /* Teto de 1200 concursos por vez. Sem teto, a Lotofácil pediria mais de
       três mil requisições de uma vez — o serviço recusaria no meio e a pessoa
       ficaria olhando uma barra parada. Com teto, ela roda de novo e continua. */
    const TETO = 1200;
    try{
      const lote = await buscarHistorico(S.modalidade, TETO, (feitos, alvo, n) => {
        saida.innerHTML = `<div class="nota"><span class="girando"></span>
          ${feitos} concursos recebidos… (buscando o ${n})</div>`;
      });
      const novos = guardarResultados(lote);
      const r = aoMudarHistorico(novos, "histórico completo");
      saida.innerHTML = `<div class="nota"><strong>${lote.length} concursos recebidos</strong>,
        ${novos} novo${novos===1?"":"s"}. ${r.novas} conferência${r.novas===1?"":"s"}
        automática${r.novas===1?"":"s"}.${lote.length >= TETO
          ? " O teto de " + TETO + " foi atingido — rode de novo para continuar de onde parou."
          : ""}</div>`;
      setTimeout(pintar, 1200);
    }catch(e){
      saida.innerHTML = `<div class="nota atencao">A busca falhou: ${esc(e.message)}.
        Use a colagem abaixo — ela não depende de rede.</div>`;
      tudo.disabled = false;
    }
  };

  const rauto = $("#r-auto");
  if(rauto) rauto.onchange = e => {
    S.buscaAutomatica = e.target.checked;
    Guardar.gravar("buscaAutomatica", S.buscaAutomatica);
  };

  /* --- teimosinha --- */
  const criar = $("#t-criar");
  if(criar) criar.onclick = () => {
    const c = MODALIDADES[S.modalidade];
    const dez = marcadasDe(S.modalidade).slice().sort((a,b)=>a-b);
    const de = parseInt($("#t-de").value, 10), n = +$("#t-n").value;
    const saida = $("#t-saida");
    if(!Number.isFinite(de) || de < 1){
      saida.innerHTML = `<div class="nota atencao">Informe o concurso inicial.</div>`; return;
    }
    S.teimosinhas = S.teimosinhas || [];
    S.teimosinhas.push({
      id:`${Date.now().toString(36)}-t`, dezenas:dez, modalidade:S.modalidade,
      metodo:"teimosinha", data:hoje(), deConcurso:de, concursos:n,
      custo: combinacoes(dez.length, c.k) * c.preco * n, conferencias:[]
    });
    Guardar.gravar("teimosinhas", S.teimosinhas);
    conferenciaAutomatica(); pintar();
  };
  document.querySelectorAll("[data-apagar-teimosinha]").forEach(b => b.onclick = () => {
    S.teimosinhas = (S.teimosinhas||[]).filter(t => t.id !== b.dataset.apagarTeimosinha);
    Guardar.gravar("teimosinhas", S.teimosinhas); pintar();
  });

  /* --- aprendizado --- */
  const treinar = $("#ap-treinar");
  if(treinar) treinar.onclick = () => {
    const saida = $("#ap-saida");
    treinar.disabled = true;
    treinar.innerHTML = `<span class="girando"></span>treinando…`;
    /* setTimeout para o navegador pintar o estado "treinando" antes de o laço
       bloquear a linha principal. Sem isso o botão só muda depois de acabar. */
    setTimeout(()=>{
      try{
        const r = aprender(S.modalidade);
        r.assinatura = assinaturaHistorico(S.modalidade);
        r.quando = new Date().toISOString();
        r.automatica = false;
        S.aprendizado[S.modalidade] = r;
        aplicarCorrecao(S.aprendizado);
        Guardar.gravar("aprendizado", S.aprendizado);
        pintar();
      }catch(e){
        saida.innerHTML = `<div class="nota atencao">O treino falhou: ${esc(e.message)}.</div>`;
        treinar.disabled = false; treinar.textContent = "treinar e medir fora da amostra";
      }
    }, 30);
  };

  document.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => {
    S.tipoEstatistica = b.dataset.tipo; window.scrollTo(0,0); pintar();
  });
  document.querySelectorAll("[data-ordem]").forEach(b => b.onclick = () => {
    S.ordemEstatistica = b.dataset.ordem; pintar();
  });

  const auto = $("#ap-auto");
  if(auto) auto.onchange = e => {
    S.autoAnalise = e.target.checked;
    Guardar.gravar("autoAnalise", S.autoAnalise);
    /* Ligar já processa a fila pendente: esperar o próximo concurso deixaria
       a pessoa com a caixa marcada e nenhuma análise à vista.

       Evite aqui o vocabulário de dezena "em atraso", mesmo em comentário e
       mesmo falando de outra coisa: a trava do testar-motor.mjs procura por
       substring, sem olhar contexto. A cegueira é proposital — é a frase da
       falácia do apostador, e sai mais barato não escrevê-la nunca do que
       ensinar a trava a distinguir sentidos. */
    if(S.autoAnalise) analisarPendentes();
  };

  /* --- abrir um jogo salvo na cartela --- */
  document.querySelectorAll("[data-abrir-jogo]").forEach(b => b.onclick = () => {
    S.jogoAberto = S.jogoAberto === b.dataset.abrirJogo ? null : b.dataset.abrirJogo;
    pintar();
  });
}

function acoes(){
  acoesNovas();
  const tam = $("#g-tam");
  if(tam) tam.onchange = e => { S.tamanho = +e.target.value; REFERENCIA = {}; pintar(); };
  const qtd = $("#g-qtd");
  if(qtd) qtd.oninput = e => { S.quantidade = Math.max(1, Math.min(60, +e.target.value||1)); };

  document.querySelectorAll("[data-metodo]").forEach(el=>{
    const escolher = () => {
      if(el.dataset.metodo==="fechamento" && S.modalidade!=="lotofacil") return;
      S.metodo = el.dataset.metodo; pintar();
    };
    el.onclick = escolher;
    el.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); escolher(); } };
  });

  const go = $("#g-go");
  if(go) go.onclick = () => {
    const saida = $("#g-saida");
    const c = MODALIDADES[S.modalidade], t = tamanhoPadrao(S.modalidade);
    go.disabled = true; go.textContent = "montando…";
    setTimeout(()=>{
      try{
        let jogos, extra = "";
        if(S.metodo === "fechamento"){
          const dez = ($("#g-dez").value||"").split(/[\s,;]+/).filter(Boolean).map(Number);
          S.dezenasFechamento = dez;
          S.jFechamento = +$("#g-j").value; S.garantia = +$("#g-gar").value;
          const r = gerarFechamento(S.modalidade, dez, S.jFechamento, S.garantia);
          jogos = r.bilhetes;
          extra = `<div class="kpis" style="margin-top:12px">
            <div class="kpi"><div class="rot">garantia verificada</div>
              <div class="val">${r.garantiaVerificada}</div>
              <div class="sub">se ${S.jFechamento} das suas saírem</div></div>
            <div class="kpi"><div class="rot">custo</div>
              <div class="val" style="font-size:1.05rem">${brl(jogos.length*c.preco)}</div>
              <div class="sub">${jogos.length} jogos, volante inteiro: ${inf(combinacoes(dez.length,c.k))}</div></div>
          </div>`;
        } else {
          jogos = gerarPor(S.metodo, S.modalidade, S.quantidade, t);
        }

        S.ultimoLote = jogos.map((dez,i)=>({
          id: `${Date.now().toString(36)}-${i}`, dezenas: dez,
          modalidade: S.modalidade, metodo: S.metodo, data: hoje(),
          lote: `L${Date.now().toString(36)}`, conferencias: []
        }));
        const loteId = S.ultimoLote[0].lote;
        S.ultimoLote.forEach(j => j.lote = loteId);

        saida.innerHTML = extra + S.ultimoLote.map(j=>`
          <div class="ficha">
            <div class="topo"><span class="id">${esc(METODOS.find(m=>m.id===j.metodo).nome)}</span>
              <span class="selo">${j.dezenas.length} dezenas</span></div>
            <div class="dezenas">${j.dezenas.map(d=>`<span class="dz marcada">${pad(d)}</span>`).join("")}</div>
            ${S.metodo==="rateio" ? `<div style="margin-top:8px;font-size:.78rem;color:var(--secundaria)">
              ${esc(observacoes(j.dezenas, S.modalidade).join(" · "))}</div>` : ""}
          </div>`).join("") + `
          <button class="acao" id="g-salvar" style="margin-top:6px">Salvar ${S.ultimoLote.length} jogo${S.ultimoLote.length>1?"s":""}</button>`;

        $("#g-salvar").onclick = () => {
          S.jogos = S.jogos.concat(S.ultimoLote);
          Guardar.gravar("jogos", S.jogos);
          S.tela = "jogos"; pintar();
        };
      }catch(e){
        saida.innerHTML = `<div class="nota atencao">${esc(e.message)}</div>`;
      }
      go.disabled = false;
      go.textContent = `Gerar ${S.quantidade} jogo${S.quantidade>1?"s":""}`;
    }, 20);
  };

  if($("#b-rep")) $("#b-rep").onchange = e => { S.bancadaRep = Number(e.target.value); };
  if($("#b-qtd")) $("#b-qtd").onchange = e => { S.bancadaQtd = Number(e.target.value); };
  if($("#b-go")) $("#b-go").onclick = () => {
    const go = $("#b-go"), saida = $("#b-saida");
    const rotulo = go.textContent;
    go.disabled = true; go.textContent = "testando…";
    /* Cede o quadro antes de calcular: são milhares de combinações e o botão
       precisa ter mudado de estado na tela antes de a thread travar. */
    setTimeout(() => {
      try{
        const alvos = S.resultados.filter(r => r.modalidade === S.modalidade);
        const opcoes = {repeticoes:S.bancadaRep, quantos:S.bancadaQtd};
        /* Cada alvo é conferido com o concurso ANTERIOR como referência do
           "evita o concurso anterior" — nunca com ele próprio. */
        const partes = alvos.map((r,i) =>
          tabelaBancada(
            bancada(S.modalidade, r.dezenas,
              Object.assign({}, opcoes, {evitar: i>0 ? alvos[i-1].dezenas : null})),
            `concurso ${r.concurso} — ${r.dezenas.map(pad).join(" ")}`
              + (i>0 ? "" : " (sem concurso anterior registrado)"), true));
        /* Recorte agregado primeiro: é onde o ruído encolhe e a leitura passa
           a valer alguma coisa. Só existe com mais de um concurso. */
        if(alvos.length > 1){
          partes.unshift(tabelaBancada(
            bancadaAgregada(S.modalidade, alvos, opcoes),
            `os ${alvos.length} concursos juntos`));
        }
        saida.innerHTML = partes.join("");
      }catch(e){
        saida.innerHTML = `<div class="nota atencao">${esc(e.message)}</div>`;
      }
      go.disabled = false; go.textContent = rotulo;
    }, 20);
  };

  document.querySelectorAll("[data-apagar]").forEach(b => b.onclick = () => {
    if(!confirm("Apagar este lote de jogos?")) return;
    S.jogos = S.jogos.filter(j => j.lote !== b.dataset.apagar);
    Guardar.gravar("jogos", S.jogos); pintar();
  });
  document.querySelectorAll("[data-copiar]").forEach(b => b.onclick = async () => {
    const texto = S.jogos.filter(j=>j.lote===b.dataset.copiar)
      .map(j => j.dezenas.map(pad).join(" ")).join("\n");
    try{ await navigator.clipboard.writeText(texto); b.textContent = "copiado"; }
    catch(e){ b.textContent = "não deu para copiar"; }
    setTimeout(()=> b.textContent = "Copiar lote", 1600);
  });


  const cgo = $("#c-go");
  if(cgo) cgo.onclick = () => {
    const saida = $("#c-saida");
    const c = MODALIDADES[S.modalidade];
    const dezenas = ($("#c-dez").value||"").split(/[\s,;-]+/).filter(Boolean).map(Number);
    const concurso = $("#c-num").value.trim();
    const data = $("#c-data").value;
    if(dezenas.length !== c.k){
      saida.innerHTML = `<div class="nota atencao">A ${esc(c.nome)} sorteia ${c.k} dezenas;
        você digitou ${dezenas.length}.</div>`; return;
    }
    if(new Set(dezenas).size !== dezenas.length){
      saida.innerHTML = `<div class="nota atencao">Há dezenas repetidas no resultado.</div>`; return;
    }
    const fora = dezenas.filter(d => d < c.base || d > c.N + c.base - 1);
    if(fora.length){
      saida.innerHTML = `<div class="nota atencao">Fora do intervalo permitido: ${fora.join(", ")}.</div>`;
      return;
    }
    if(!concurso){
      saida.innerHTML = `<div class="nota atencao">Informe o número do concurso.</div>`; return;
    }

    const alvo = S.jogos.filter(j => j.modalidade === S.modalidade);
    if(!alvo.length){
      saida.innerHTML = `<div class="nota atencao">Nenhum jogo salvo desta modalidade.</div>`;
      return;
    }
    let soma = 0, somaEsperado = 0;
    alvo.forEach(j=>{
      j.conferencias = (j.conferencias||[]).filter(cf => cf.concurso !== concurso);
      const acertos = j.dezenas.filter(d => dezenas.includes(d)).length;
      j.conferencias.push({concurso, data, dezenas, acertos});
      soma += acertos; somaEsperado += esperadoAcertos(j.modalidade, j.dezenas.length);
    });
    S.resultados = S.resultados.filter(r => !(r.concurso===concurso && r.modalidade===S.modalidade));
    S.resultados.push({concurso, data, dezenas, modalidade:S.modalidade});
    Guardar.gravar("jogos", S.jogos); Guardar.gravar("resultados", S.resultados);

    const media = soma/alvo.length, esperado = somaEsperado/alvo.length;
    const dp = desvioAcertos(S.modalidade, alvo[0].dezenas.length)/Math.sqrt(alvo.length);
    const premiou = alvo.filter(j => c.faixas.includes(
      j.conferencias[j.conferencias.length-1].acertos)).length;

    saida.innerHTML = `<div class="carta">
      <h3>Concurso ${esc(concurso)} — ${alvo.length} jogo${alvo.length>1?"s":""} conferido${alvo.length>1?"s":""}</h3>
      ${/* O resultado sai na cartela, e não em chips: é o mesmo objeto que a
             pessoa marcou, agora com o sorteio impresso. Quando há um jogo só,
             a cartela mostra as duas camadas — marcação e sorteio — e o acerto
             é a sobreposição. Com vários jogos seria ambíguo de quem é a
             marcação, então aí a cartela mostra apenas o sorteio, e cada jogo
             tem a sua própria cartela em Meus jogos. */
        alvo.length === 1
          ? cartela(S.modalidade, alvo[0].dezenas,
              {sorteadas:dezenas, selo:`concurso ${concurso}`}) + legendaCartela
          : cartela(S.modalidade, [], {sorteadas:dezenas,
              selo:`concurso ${concurso}`,
              rodape:`<div class="pe"><span>resultado sorteado</span>
                <span>${alvo.length} jogos conferidos — veja cada cartela em Meus jogos</span></div>`})}
      <div class="kpis">
        <div class="kpi"><div class="rot">acertos médios</div><div class="val">${nf(media,2)}</div>
          <div class="sub">acaso: ${nf(esperado,2)}</div></div>
        <div class="kpi"><div class="rot">jogos em faixa de prêmio</div>
          <div class="val">${premiou}</div><div class="sub">de ${alvo.length}</div></div>
      </div>
      ${faixaAcaso(media, esperado, Math.max(dp,0.05))}
    </div>
    ${alvo.map(j=>ficha(j)).join("")}`;
  };

  const tema = $("#btn-tema");
  if(tema) tema.onclick = () => {
    S.tema = S.tema === "claro" ? "escuro" : "claro";
    document.documentElement.dataset.tema = S.tema;
    Guardar.gravar("tema", S.tema);
  };
}

/* ============================ navegação ============================ */
/* ============================ navegação ============================
   Duas camadas, e não uma barra com nove ícones. A barra inferior tem cinco
   seções — o limite prático antes de os alvos ficarem pequenos demais para o
   dedo — e cada seção abre suas telas num controle segmentado. Sem isso, cada
   tela nova encolheria todas as outras.

   Cada tela declara também um subtítulo: o título sozinho ("Bancada") não diz
   o que a tela faz, e a explicação ficava perdida no meio do conteúdo.      */
const SECOES = [
  {id:"gerar", nome:"gerar",
   icone:'<path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="3"/>',
   telas:[
     {id:"gerar", nome:"Automático", titulo:"Gerar jogos",
      sub:"Monta combinações válidas por método. Todos têm a mesma chance de acerto — o que muda é com quantas pessoas você dividiria."},
     {id:"montar", nome:"Manual", titulo:"Montar à mão",
      sub:"Marque as dezenas que quiser. O app mostra as características do jogo e como elas se comparam ao esperado do acaso."}
   ]},
  {id:"jogos", nome:"jogos",
   icone:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/>',
   telas:[
     {id:"jogos", nome:"Meus jogos", titulo:"Meus jogos",
      sub:"Tudo o que você salvou, conferido automaticamente contra os resultados que o app conhece."},
     {id:"teimosinha", nome:"Teimosinha", titulo:"Teimosinha",
      sub:"Repete o mesmo jogo por vários concursos seguidos. O app acompanha o custo total e confere cada concurso sozinho."}
   ]},
  {id:"conferir", nome:"conferir", icone:'<path d="M4 12l5 5L20 6"/>',
   telas:[
     {id:"conferir", nome:"Conferir", titulo:"Conferir",
      sub:"Informe o resultado de um concurso e o app confere todos os seus jogos daquela modalidade."},
     {id:"resultados", nome:"Resultados", titulo:"Histórico de resultados",
      sub:"Os concursos que o app conhece. É esta base que alimenta a análise, a bancada e o aprendizado."}
   ]},
  {id:"analise", nome:"análise",
   icone:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
   telas:[
     {id:"placar", nome:"Placar", titulo:"Placar",
      sub:"Seu resultado acumulado, comparado com o que o acaso teria feito com o mesmo dinheiro."},
     {id:"bancada", nome:"Bancada", titulo:"Bancada de testes",
      sub:"Roda todos os métodos contra o mesmo sorteio e mede se algum se distingue do acaso."},
     {id:"estatisticas", nome:"Estatísticas", titulo:"Estatísticas do histórico",
      sub:"O retrato do que já saiu, sempre ao lado do que o acaso produziria. Descreve o passado; não prevê o próximo."},
     {id:"aprendizado", nome:"Aprendizado", titulo:"Aprendizado por modalidade",
      sub:"Treina um modelo em cada modalidade separadamente e mede, fora da amostra, se ele aprendeu algo."}
   ]},
  {id:"entender", nome:"entender",
   icone:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
   telas:[
     {id:"entender", nome:"Entender", titulo:"Entender",
      sub:"O que este app faz, o que ele não faz, e por quê."}
   ]}
];

const secaoAtual = () => SECOES.find(s => s.telas.some(t => t.id === S.tela)) || SECOES[0];
const telaAtual = () => secaoAtual().telas.find(t => t.id === S.tela) || secaoAtual().telas[0];

function navegacao(){
  const sec = secaoAtual();
  $("#abas").innerHTML = SECOES.map(s=>`
    <button data-secao="${s.id}" ${s.id===sec.id?'aria-current="page"':""}>
      <svg viewBox="0 0 24 24">${s.icone}</svg>${esc(s.nome)}</button>`).join("");
  document.querySelectorAll("[data-secao]").forEach(b => b.onclick = () => {
    const s = SECOES.find(x => x.id === b.dataset.secao);
    /* Entrar numa seção leva à primeira tela dela, salvo quando já se está
       nela — aí o clique é um "voltar ao topo", não uma troca de tela. */
    if(s.id !== sec.id) S.tela = s.telas[0].id;
    window.scrollTo(0,0); pintar();
  });
}

function trilhaModalidade(){
  $("#trilha-mod").innerHTML = Object.entries(MODALIDADES).map(([k,v])=>
    `<button data-mod="${k}" aria-pressed="${k===S.modalidade}">${esc(v.nome)}</button>`).join("");
  document.querySelectorAll("[data-mod]").forEach(b => b.onclick = () => {
    if(b.dataset.mod === S.modalidade) return;
    S.modalidade = b.dataset.mod; S.tamanho = null; REFERENCIA = {};
    Guardar.gravar("modalidade", S.modalidade);
    pintar();
  });
}

function pintar(){
  const sec = secaoAtual(), tela = telaAtual();
  const segmento = sec.telas.length < 2 ? "" :
    `<div class="segmento" role="tablist">${sec.telas.map(t=>
      `<button role="tab" data-tela="${t.id}" aria-selected="${t.id===tela.id}">
        ${esc(t.nome)}</button>`).join("")}</div>`;
  /* O cartão do próximo concurso só aparece onde é contexto para a ação: ao
     montar jogo, ao olhar os jogos e ao conferir. Em Estatísticas ou Entender
     ele seria enfeite roubando o topo da tela. */
  const comProximo = ["gerar","montar","jogos","teimosinha","conferir","resultados"];
  $("#tela").innerHTML = segmento +
    `<div class="titulo"><h1>${esc(tela.titulo)}</h1><p>${esc(tela.sub)}</p></div>` +
    (comProximo.includes(tela.id) ? cartaoProximo(S.modalidade) : "") +
    T[tela.id]() +
    `<div class="aviso-fixo">Nenhum método aumenta a chance de acertar.<br>
     Loteria é gasto de entretenimento, não investimento.</div>`;
  document.querySelectorAll("[data-tela]").forEach(b => b.onclick = () => {
    S.tela = b.dataset.tela; window.scrollTo(0,0); pintar();
  });
  navegacao();
  trilhaModalidade();
  pintarContaAvisos();
  acoes();
}

async function carregarCalibracao(){
  try{
    const r = await fetch("pesos.json", {cache:"no-cache"});
    if(!r.ok) return;
    const c = await r.json();
    if(c && c.pesos_app) CALIBRACAO = c;
  }catch(e){ /* sem arquivo: seguem as hipóteses declaradas */ }
}

(function iniciar(){
  S.jogos = Guardar.ler("jogos", []);
  S.resultados = Guardar.ler("resultados", []);
  S.tema = Guardar.ler("tema", "claro");
  S.avisos = Guardar.ler("avisos", []);
  S.teimosinhas = Guardar.ler("teimosinhas", []);
  S.marcadas = Guardar.ler("marcadas", {});
  S.aprendizado = Guardar.ler("aprendizado", {});
  S.autoAnalise = Guardar.ler("autoAnalise", true);
  S.calibracao = Guardar.ler("calibracao", {});
  S.buscaAutomatica = Guardar.ler("buscaAutomatica", true);
  S.ultimaBusca = Guardar.ler("ultimaBusca", {});
  S.modalidade = Guardar.ler("modalidade", S.modalidade);
  document.documentElement.dataset.tema = S.tema;
  /* Conferir na abertura: quem digitou um resultado e fechou o app antes de
     conferir os jogos encontra tudo conferido ao voltar. */
  conferenciaAutomatica();
  pintar();
  /* Análises pendentes na abertura. Sem isto, quem já tinha histórico ficaria
     esperando o próximo concurso para ver a primeira análise — e quem fechou o
     app no meio de uma análise nunca a veria terminar. Roda depois do pintar()
     para a tela aparecer primeiro; o processamento é fatiado e não trava. */
  if(S.autoAnalise !== false) analisarPendentes();
  /* Busca diária em segundo plano. Não bloqueia a abertura e não avisa quando
     falha: sem sinal é o caso comum, e um aviso a cada abertura offline
     treinaria a pessoa a ignorar o sino. */
  buscaDiaria().then(r => { if(r.novos) pintar(); }).catch(()=>{});

  /* Sino e folha de avisos. Ficam fora de pintar() porque vivem no cabeçalho,
     que não é redesenhado a cada troca de tela. */
  const folha = $("#folha-avisos");
  $("#btn-avisos").onclick = () => {
    pintarAvisos();
    folha.dataset.aberta = "1";
  };
  folha.addEventListener("click", e => {
    if(!e.target.closest("[data-fechar]")) return;
    folha.dataset.aberta = "0";
    /* Fechar marca como lido: o aviso já foi mostrado, e manter o contador
       aceso depois disso treinaria a pessoa a ignorá-lo. */
    S.avisos.forEach(a => a.lido = true);
    Guardar.gravar("avisos", S.avisos);
    pintarContaAvisos();
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && folha.dataset.aberta === "1")
      folha.querySelector("[data-fechar]").click();
  });
  carregarCalibracao().then(()=>{ if(CALIBRACAO && S.tela==="gerar") pintar(); });
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
