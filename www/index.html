    .map(r => (r.rateio || []).find(f => f.faixa === 1))
    .filter(Boolean).map(f => f.ganhadores).sort((a,b)=>a-b);
  const mediana = hist.length ? hist[Math.floor(hist.length/2)] : null;

  return {ganhadores, mediana, r2: cal.r2, n: cal.n, util: cal.util,
          /* Razão entre o seu e o típico: abaixo de 1 é bom para o seu bolso. */
          razao: (mediana !== null && mediana > 0) ? ganhadores / mediana : null};
}

/* ==================== busca de histórico e busca diária ====================
   Não pude testar a chamada real: a rede onde este código foi escrito bloqueia
   o domínio da Caixa. O que está testado é o processamento da resposta, contra
   respostas controladas. Se o formato do serviço mudar, a tela mostra o erro em
   vez de inventar resultado — e a importação por colagem, que não depende de
   rede, continua sendo o caminho garantido. */

//: Intervalo mínimo entre buscas automáticas. Sorteios acontecem no máximo uma
//: vez por dia por modalidade; buscar de hora em hora só gastaria bateria e
//: bateria alheia.
const INTERVALO_BUSCA = 12 * 60 * 60 * 1000;

/* Busca do fim para trás, parando no primeiro erro. Devolver o que já veio é
   melhor que devolver nada: um histórico de 400 concursos ainda calibra e
   ainda faz estatística, e a tela informa quantos vieram. */
async function buscarHistorico(modalidade, quantos, aoProgresso){
  /* Primeiro o arquivo do repositório: uma requisição traz o histórico
     inteiro. Só se ele falhar é que se cai no laço concurso a concurso, que
     custa centenas de requisições para o mesmo resultado. */
  try{
    const tudo = await baixarHistoricoDoRepositorio(modalidade);
    if(aoProgresso) aoProgresso(tudo.length, tudo.length,
      tudo[tudo.length-1].concurso);
    return tudo;
  }catch(e){ /* segue para o caminho lento */ }

  const ultimo = await buscarNaCaixa(modalidade, null);
  const lote = [ultimo];
  if(aoProgresso) aoProgresso(1, quantos, ultimo.concurso);
  for(let i = 1; i < quantos; i++){
    const n = ultimo.concurso - i;
    if(n < 1) break;
    try{
      lote.push(await buscarNaCaixa(modalidade, n));
      if(aoProgresso) aoProgresso(lote.length, quantos, n);
    }catch(e){ break; }
  }
  return lote;
}

/* O que o app sabe sobre o próximo concurso, a partir do último resultado
   guardado. Vem do próprio serviço da Caixa, junto do resultado. */
function proximoConcurso(modalidade){
  const hist = historicoDe(modalidade);
  for(let i = hist.length - 1; i >= 0; i--){
    const r = hist[i];
    if(r.dataProximo || r.estimativaProximo){
      return {
        concurso: r.concursoProximo || (r.concurso + 1),
        data: r.dataProximo || null,
        estimativa: r.estimativaProximo || null,
        acumulou: r.acumulou === true,
        base: r.concurso
      };
    }
  }
  return null;
}

/* Dias até uma data ISO. Compara só a parte da data para não errar por fuso —
   um sorteio "hoje à noite" não pode aparecer como "faltam 0,7 dias". */
function diasAte(iso){
  if(!iso) return null;
  const hoje2 = new Date(hoje() + "T00:00:00");
  const alvo = new Date(String(iso).slice(0,10) + "T00:00:00");
  if(isNaN(alvo)) return null;
  return Math.round((alvo - hoje2) / 86400000);
}

/* Busca diária: roda na abertura, uma vez por modalidade que já tem histórico.
   Só o último concurso — quem quer o histórico inteiro pede explicitamente. */
async function buscaDiaria(){
  if(S.buscaAutomatica === false) return {tentadas:0, novos:0};
  const agora = Date.now();
  const marcas = S.ultimaBusca || {};
  const alvos = Object.keys(MODALIDADES).filter(k =>
    SLUG_CAIXA[k] &&
    historicoDe(k).length > 0 &&
    agora - (marcas[k] || 0) > INTERVALO_BUSCA);
  if(!alvos.length) return {tentadas:0, novos:0};

  let novos = 0, falhas = 0;
  for(const k of alvos){
    try{
      const r = await buscarNaCaixa(k, null);
      novos += guardarResultados([r]);
      marcas[k] = agora;
    }catch(e){ falhas++; }
  }
  S.ultimaBusca = marcas;
  Guardar.gravar("ultimaBusca", marcas);
  if(novos) aoMudarHistorico(novos, "busca diária");
  else if(falhas === alvos.length && alvos.length)
    /* Falhar em todas é sinal de rede ausente ou serviço fora, e não vale um
       aviso — o app funciona sem. Falha parcial também não, pelo mesmo motivo.
       O silêncio aqui é deliberado: avisar "não consegui buscar" toda vez que o
       celular está sem sinal treinaria a pessoa a ignorar o sino. */
    void 0;
  return {tentadas:alvos.length, novos, falhas};
}

/* ==================== calibração de popularidade ====================
   Esta é a única coisa neste app que de fato MELHORA com mais dados. Vale
   explicar por quê, porque a diferença é a linha entre método e promessa.

   Não é possível aprender qual dezena será sorteada: sorteios independentes
   não guardam informação sobre o futuro, e o módulo de Aprendizado existe
   justamente para medir e mostrar isso.

   (A trava de vocabulário do testar-motor.mjs reprova o verbo "sair" no futuro
   mesmo dentro de uma negação — busca por substring, sem contexto. É cega de
   propósito, e sai mais barato escolher outra palavra do que ensiná-la a
   distinguir.)

   É possível aprender o que o PÚBLICO marca. Quando um concurso sorteia
   dezenas com cara de data de nascimento, aparecem muitos ganhadores; quando
   sorteia dezenas espalhadas pelo volante, aparecem poucos. Esse sinal está
   nos ganhadores publicados, e ele é forte, porque descreve comportamento
   humano — que, ao contrário das bolas, tem padrão.

   O que isso muda: NÃO a chance de acertar, que é fixa. Muda o quanto sobra
   para você SE acertar, porque evitar o que muita gente marca significa
   dividir com menos gente. É o único ganho matematicamente real disponível
   numa loteria honesta, e ele cresce quanto mais concursos entram na conta.

   O método: regressão de mínimos quadrados de log(1 + ganhadores da faixa
   principal) sobre as características estruturais do sorteio. O log existe
   porque a contagem de ganhadores é assimétrica — um concurso com data
   redonda pode ter cinquenta vezes mais ganhadores que a mediana, e sem o log
   esse único concurso ditaria todos os coeficientes.

   Coeficiente positivo = a característica atrai ganhadores = é popular.
   Os coeficientes viram os pesos que `escorePopularidade` já consome, então a
   medida substitui a suposição sem trocar mais nada no gerador. */

const ATRIBUTOS_POPULARIDADE = ["ate31", "ate12", "consecutivos", "somaCentral",
  "espacamentoRegular", "mesmaLinha", "mesmaColuna", "terminacoesIguais", "fibonacci"];

//: Mínimo de concursos com ganhadores para a calibração valer alguma coisa.
const MINIMO_CALIBRACAO = 30;

/* Mínimos quadrados por gradiente, com padronização das colunas. Padronizar
   importa: as características vivem em escalas diferentes (fibonacci vai a 3,
   somaCentral fica em [0,1]), e sem isso o gradiente anda torto e converge
   para lugar nenhum. */
function minimosQuadrados(X, y, epocas=600, taxa=0.35){
  const n = X.length, p = X[0].length;
  const media = [], escala = [];
  for(let j = 0; j < p; j++){
    const col = X.map(x => x[j]);
    const mu = col.reduce((a,b)=>a+b,0)/n;
    const sd = Math.sqrt(col.reduce((a,b)=>a+(b-mu)**2,0)/n) || 1;
    media.push(mu); escala.push(sd);
  }
  const Z = X.map(x => x.map((v,j) => (v - media[j]) / escala[j]));
  const muY = y.reduce((a,b)=>a+b,0)/n;

  const w = new Array(p).fill(0);
  let b = muY;
  for(let e = 0; e < epocas; e++){
    const gw = new Array(p).fill(0);
    let gb = 0;
    for(let i = 0; i < n; i++){
      let pred = b;
      for(let j = 0; j < p; j++) pred += w[j] * Z[i][j];
      const err = pred - y[i];
      for(let j = 0; j < p; j++) gw[j] += err * Z[i][j];
      gb += err;
    }
    for(let j = 0; j < p; j++) w[j] -= taxa * gw[j] / n;
    b -= taxa * gb / n;
  }

  const prever = x => {
    let v = b;
    for(let j = 0; j < p; j++) v += w[j] * ((x[j] - media[j]) / escala[j]);
    return v;
  };
  const ssRes = y.reduce((a, yi, i) => a + (yi - prever(X[i]))**2, 0);
  const ssTot = y.reduce((a, yi) => a + (yi - muY)**2, 0);
  return {
    w, b, media, escala, prever,
    r2: ssTot > 0 ? 1 - ssRes/ssTot : 0,
    /* Coeficientes na escala original, que é como os pesos são consumidos. */
    coeficientes: w.map((v, j) => v / escala[j])
  };
}

function calibrarPopularidade(modalidade){
  const c = MODALIDADES[modalidade];
  const hist = historicoDe(modalidade).filter(r =>
    r.rateio && r.rateio.length &&
    r.rateio.some(f => f.faixa === 1 && Number.isFinite(f.ganhadores)));
  if(hist.length < MINIMO_CALIBRACAO)
    return {erro:`faltam ${MINIMO_CALIBRACAO - hist.length} concursos com rateio`,
            tem:hist.length, precisa:MINIMO_CALIBRACAO};

  const X = [], y = [];
  hist.forEach(r => {
    const carac = caracteristicas(r.dezenas, modalidade);
    X.push(ATRIBUTOS_POPULARIDADE.map(k => carac[k] || 0));
    const f = r.rateio.find(x => x.faixa === 1);
    y.push(Math.log(1 + (f ? f.ganhadores : 0)));
  });

  const m = minimosQuadrados(X, y);
  /* Só coeficiente positivo vira peso: negativo significaria "esta forma
     afasta ganhadores", e o gerador de rateio não tem o que fazer com isso
     além de já preferi-la, o que ele faz sozinho ao penalizar as positivas. */
  const pesos = {};
  ATRIBUTOS_POPULARIDADE.forEach((k, j) => {
    pesos[k] = Math.max(0, m.coeficientes[j]);
  });
  const ganhadores = hist.map((r,i) => Math.exp(y[i]) - 1);
  return {
    modalidade, pesos, r2: m.r2, n: hist.length,
    /* O modelo em si, e não só os pesos: com ele dá para PREVER quantos
       ganhadores uma combinação teria. Função não sobrevive ao localStorage,
       então guardamos os números e remontamos a previsão em preverGanhadores(). */
    modelo: {w: m.w, b: m.b, media: m.media, escala: m.escala},
    coeficientes: ATRIBUTOS_POPULARIDADE.map((k, j) =>
      ({nome:k, coeficiente:m.coeficientes[j]})),
    ganhadoresMedio: ganhadores.reduce((a,b)=>a+b,0)/ganhadores.length,
    ganhadoresMaximo: Math.max(...ganhadores),
    quando: new Date().toISOString(),
    /* R² baixo não invalida: comportamento humano é ruidoso e um concurso tem
       um só sorteio. Mas o número fica à vista, porque calibrar com R² de 0,02
       é praticamente não calibrar, e quem usa precisa saber. */
    util: m.r2 >= 0.05
  };
}

/* ==================== estatísticas descritivas ====================
   O que esta seção é: uma descrição honesta do que JÁ saiu. O que ela não é:
   base para escolher o próximo jogo.

   Toda estatística aqui vem acompanhada do que o acaso produziria e da faixa
   em que ele oscila. É a diferença entre esta tela e as tabelas de dezena "em
   alta" que circulam por aí: dizer que a dezena 37 saiu 328 vezes não informa
   nada; dizer que o acaso daria 324 ± 17 informa tudo — porque aí se vê que
   328 é rigorosamente comum.

   (O vocabulário de dezena "em alta" e o seu oposto não aparecem em lugar
   nenhum deste arquivo, nem em comentário. A trava do testar-motor.mjs procura
   por substring, sem olhar contexto, e a cegueira é proposital: sai mais
   barato nunca escrever a frase do que ensinar a trava a separar crítica de
   promessa.)

   Nenhum número desta tela muda a probabilidade do próximo sorteio. Sorteios
   independentes não têm memória, e a variação que se vê aqui é o retrato do
   acaso, não um padrão a explorar. */

function historicoDe(modalidade){
  return S.resultados.filter(r => r.modalidade === modalidade)
    .slice().sort((a,b) => a.concurso - b.concurso);
}

/* Desvio padrão de uma contagem binomial: n tentativas, probabilidade p. */
const dpBinomial = (n, p) => Math.sqrt(n * p * (1 - p));

/* Estatística por dezena: quantas vezes saiu, há quantos concursos não sai, e
   quanto isso se afasta do esperado — em desvios padrão, que é a única forma
   de comparar dezenas de modalidades diferentes. */
function porDezena(modalidade){
  const c = MODALIDADES[modalidade];
  const hist = historicoDe(modalidade);
  const n = hist.length;
  const p = c.k / c.N;
  const esperado = n * p;
  const dp = dpBinomial(n, p) || 1;

  const linhas = [];
  for(let d = c.base; d <= c.N + c.base - 1; d++){
    let vezes = 0, ultima = -1;
    hist.forEach((r, i) => { if(r.dezenas.includes(d)){ vezes++; ultima = i; } });
    linhas.push({
      dezena: d, vezes,
      /* Concursos desde a última aparição. Nunca ter saído devolve n, que é o
         máximo possível, e não infinito. */
      ausencia: ultima < 0 ? n : n - 1 - ultima,
      z: (vezes - esperado) / dp,
      fora: Math.abs(vezes - esperado) > 2 * dp
    });
  }
  return {linhas, n, esperado, dp,
          /* Intervalo de ausência esperado entre aparições: N/k concursos. */
          ausenciaMedia: c.N / c.k};
}

/* Distribuição de uma contagem por concurso (pares, primos, Fibonacci...)
   contra a esperança hipergeométrica. */
function contagemPorConcurso(modalidade, pertence){
  const c = MODALIDADES[modalidade];
  const hist = historicoDe(modalidade);
  if(!hist.length) return null;
  const universo = [];
  for(let d = c.base; d <= c.N + c.base - 1; d++) universo.push(d);
  const quantosNoUniverso = universo.filter(pertence).length;

  const contagens = hist.map(r => r.dezenas.filter(pertence).length);
  const media = contagens.reduce((a,b)=>a+b,0) / contagens.length;
  /* Hipergeométrica: k sorteadas de N, das quais K pertencem ao conjunto.
     média = k·K/N; variância = k·(K/N)·(1−K/N)·(N−k)/(N−1). */
  const pr = quantosNoUniverso / c.N;
  const esperado = c.k * pr;
  const varUm = c.k * pr * (1 - pr) * (c.N - c.k) / Math.max(1, c.N - 1);
  const dpMedia = Math.sqrt(varUm / contagens.length) || 1;

  const dist = {};
  contagens.forEach(v => dist[v] = (dist[v] || 0) + 1);
  return {
    contagens, media, esperado, dpMedia, dist,
    quantosNoUniverso, n: contagens.length,
    dentro: Math.abs(media - esperado) <= 2 * dpMedia
  };
}

/* Repetições em relação ao concurso imediatamente anterior. */
function repeticoesAnterior(modalidade){
  const c = MODALIDADES[modalidade];
  const hist = historicoDe(modalidade);
  if(hist.length < 2) return null;
  const reps = [];
  for(let i = 1; i < hist.length; i++){
    const antes = new Set(hist[i-1].dezenas);
    reps.push(hist[i].dezenas.filter(d => antes.has(d)).length);
  }
  const media = reps.reduce((a,b)=>a+b,0) / reps.length;
  const pr = c.k / c.N;
  const esperado = c.k * pr;
  const varUm = c.k * pr * (1 - pr) * (c.N - c.k) / Math.max(1, c.N - 1);
  const dpMedia = Math.sqrt(varUm / reps.length) || 1;
  const dist = {};
  reps.forEach(v => dist[v] = (dist[v] || 0) + 1);
  return {reps, media, esperado, dpMedia, dist, n: reps.length,
          dentro: Math.abs(media - esperado) <= 2 * dpMedia};
}

/* Soma das dezenas por concurso. */
function somaDasDezenas(modalidade){
  const c = MODALIDADES[modalidade];
  const hist = historicoDe(modalidade);
  if(!hist.length) return null;
  const somas = hist.map(r => r.dezenas.reduce((a,b)=>a+b,0));
  const media = somas.reduce((a,b)=>a+b,0) / somas.length;
  const esperado = c.k * (c.N + 2*c.base - 1) / 2;
  const varUm = c.k * (c.N + 1) * (c.N - c.k) / 12;
  const dpUm = Math.sqrt(varUm) || 1;
  const dpMedia = dpUm / Math.sqrt(somas.length);
  const ordenadas = somas.slice().sort((a,b)=>a-b);
  return {
    somas, media, esperado, dpUm, dpMedia,
    minimo: ordenadas[0], maximo: ordenadas[ordenadas.length-1],
    mediana: ordenadas[Math.floor(ordenadas.length/2)],
    n: somas.length, dentro: Math.abs(media - esperado) <= 2 * dpMedia
  };
}

/* Concursos com ao menos uma dupla consecutiva. */
function sequencias(modalidade){
  const hist = historicoDe(modalidade);
  if(!hist.length) return null;
  const quantidades = hist.map(r => {
    const ord = r.dezenas.slice().sort((a,b)=>a-b);
    let c2 = 0;
    for(let i = 1; i < ord.length; i++) if(ord[i] === ord[i-1] + 1) c2++;
    return c2;
  });
  const comSequencia = quantidades.filter(v => v > 0).length;
  const media = quantidades.reduce((a,b)=>a+b,0) / quantidades.length;
  const c = MODALIDADES[modalidade];
  /* Pares consecutivos esperados: há N−1 pares (d, d+1) possíveis, e a chance
     de ambos saírem é k(k−1)/(N(N−1)). */
  const esperado = (c.N - 1) * c.k * (c.k - 1) / (c.N * (c.N - 1));
  return {quantidades, media, esperado, comSequencia, n: quantidades.length,
          fracaoComSequencia: comSequencia / quantidades.length};
}

/* Ciclo: quantos concursos até TODAS as dezenas terem saído ao menos uma vez.
   O esperado vem do problema do colecionador de figurinhas, adaptado para k
   por rodada: aproximadamente (N/k)·H(N), onde H é o harmônico. */
function ciclos(modalidade){
  const c = MODALIDADES[modalidade];
  const hist = historicoDe(modalidade);
  if(!hist.length) return null;
  const fechados = [];
  let vistos = new Set(), inicio = 0;
  hist.forEach((r, i) => {
    r.dezenas.forEach(d => vistos.add(d));
    if(vistos.size >= c.N){ fechados.push(i - inicio + 1); vistos = new Set(); inicio = i + 1; }
  });
  let harmonico = 0;
  for(let i = 1; i <= c.N; i++) harmonico += 1 / i;
  const esperado = (c.N / c.k) * harmonico;
  const media = fechados.length
    ? fechados.reduce((a,b)=>a+b,0) / fechados.length : null;
  return {fechados, media, esperado, emAberto: vistos.size,
          faltam: c.N - vistos.size, n: hist.length};
}

/* Concentração por linha e por coluna do volante. */
function linhasEColunas(modalidade){
  const c = MODALIDADES[modalidade];
  const cols = GRADE[modalidade] || 10;
  const hist = historicoDe(modalidade);
  if(!hist.length) return null;
  const linhas = {}, colunas = {};
  const nLinhas = Math.ceil(c.N / cols);
  hist.forEach(r => r.dezenas.forEach(d => {
    const idx = d - c.base;
    const li = Math.floor(idx / cols), co = idx % cols;
    linhas[li] = (linhas[li] || 0) + 1;
    colunas[co] = (colunas[co] || 0) + 1;
  }));
  const total = hist.length * c.k;
  const porLinha = [], porColuna = [];
  for(let i = 0; i < nLinhas; i++){
    const dezenasNaLinha = Math.min(cols, c.N - i * cols);
    porLinha.push({i, vezes: linhas[i] || 0,
      esperado: total * dezenasNaLinha / c.N, tamanho: dezenasNaLinha});
  }
  for(let i = 0; i < cols; i++){
    let dezenasNaColuna = 0;
    for(let d = 0; d < c.N; d++) if(d % cols === i) dezenasNaColuna++;
    porColuna.push({i, vezes: colunas[i] || 0,
      esperado: total * dezenasNaColuna / c.N, tamanho: dezenasNaColuna});
  }
  return {porLinha, porColuna, total, cols};
}


/* Cartão do próximo concurso. Devolve string vazia quando não há informação —
   um cartão dizendo "não sei quando é o próximo sorteio" ocuparia o lugar mais
   nobre da tela para não informar nada. */
/* ================= teve ganhador? =================

   Três estados, e não dois. A diferença entre "não teve ganhador" e "não sei"
   é a coisa mais fácil de apagar numa interface e uma das mais caras: quem lê
   "acumulou" acredita que o concurso acumulou. Enquanto o app não tiver o
   rateio daquele concurso, ele precisa dizer que não sabe.

   O dado vem do rateio publicado pela Caixa, faixa 1 (a faixa máxima da
   modalidade). Concursos importados por colagem, ou trazidos antes de o app
   passar a guardar rateio, ficam em "não informado" — e é o certo. */
function ganhadoresDoConcurso(r){
  const faixa1 = (r && r.rateio || []).find(f => f.faixa === 1);
  if(!faixa1 || !Number.isFinite(faixa1.ganhadores))
    return {estado:"desconhecido", rotulo:"ganhadores não informados",
            cor:"var(--secundaria)",
            ajuda:"este concurso entrou sem o rateio; traga-o de novo pela busca para saber"};
  if(faixa1.ganhadores > 0)
    return {estado:"ganhou", ganhadores:faixa1.ganhadores, premio:faixa1.premio,
            rotulo:`${inf(faixa1.ganhadores)} ganhador${faixa1.ganhadores>1?"es":""}`,
            cor:"var(--acaso)"};
  return {estado:"acumulou", ganhadores:0, rotulo:"sem ganhador — acumulou",
          cor:"var(--seu)"};
}

/* O selo, do tamanho de ser lido numa lista. */
function seloGanhadores(r, opcoes){
  const o = Object.assign({premio:true, cidades:true}, opcoes||{});
  const g = ganhadoresDoConcurso(r);
  const partes = [`<span class="selo-ganho ${g.estado}" title="${esc(g.ajuda||"")}">${esc(g.rotulo)}</span>`];
  if(o.premio && g.estado === "ganhou" && Number.isFinite(g.premio) && g.premio > 0)
    partes.push(`<span class="ganho-premio">${brl(g.premio)} cada</span>`);
  if(o.cidades && g.estado === "ganhou" && r.cidades && r.cidades.length)
    partes.push(`<span class="ganho-cidades">${r.cidades.slice(0,4).map(c =>
      esc(`${c.municipio}/${c.uf}${c.ganhadores>1?` (${c.ganhadores})`:""}`)).join(" · ")}${
      r.cidades.length>4 ? ` +${r.cidades.length-4}` : ""}</span>`);
  return `<span class="ganho">${partes.join("")}</span>`;
}

/* Resumo de um lote recém-buscado: quantos deram ganhador, quantos acumularam.
   É a resposta à pergunta que a pessoa faz ao buscar vinte concursos de uma
   vez, e que antes exigia percorrer a lista item a item. */
function resumoGanhadores(lista){
  const conta = {ganhou:0, acumulou:0, desconhecido:0};
  (lista || []).forEach(r => conta[ganhadoresDoConcurso(r).estado]++);
  const partes = [];
  if(conta.ganhou) partes.push(
    `<strong style="color:var(--ganhou-tinta)">${conta.ganhou} com ganhador</strong>`);
  if(conta.acumulou) partes.push(
    `<strong style="color:var(--acumulou-tinta)">${conta.acumulou} acumulado${conta.acumulou>1?"s":""}</strong>`);
  if(conta.desconhecido) partes.push(`${conta.desconhecido} sem essa informação`);
  return {conta, texto: partes.join(" · ")};
}

/* Quantos concursos desta modalidade já trazem a informação. Serve para a tela
   dizer o tamanho do buraco em vez de deixar o usuário descobrir sozinho. */
function coberturaDeGanhadores(modalidade){
  const hist = S.resultados.filter(r => r.modalidade === modalidade);
  const com = hist.filter(r => ganhadoresDoConcurso(r).estado !== "desconhecido");
  return {total: hist.length, com: com.length,
          fracao: hist.length ? com.length / hist.length : 0};
}

function cartaoProximo(modalidade){
  const p = proximoConcurso(modalidade);
  if(!p) return "";
  const c = MODALIDADES[modalidade];
  const dias = diasAte(p.data);
  const quando = dias === null ? "" :
    dias < 0 ? "resultado deve ter saído" :
    dias === 0 ? "hoje" : dias === 1 ? "amanhã" : `em ${dias} dias`;
  return `<div class="proximo">
    ${dias === null || dias < 0 ? "" : `<div class="contagem">
      <b>${dias}</b><span>${dias === 1 ? "dia" : "dias"}</span></div>`}
    <div class="rot">${esc(c.nome)} · concurso ${esc(p.concurso)}</div>
    <div class="valor">${p.estimativa ? brl(p.estimativa) : "prêmio não informado"}</div>
    <div class="quando">${p.data ? esc(new Date(p.data + "T12:00:00")
      .toLocaleDateString("pt-BR", {weekday:"long", day:"2-digit", month:"long"}))
      : "data não informada"}${quando ? ` · ${quando}` : ""}</div>
    ${p.acumulou ? `<span class="selo-acumulou">acumulou</span>` : ""}
  </div>`;
}


/* Barra de progresso com percentual. Existe porque a bancada travava a tela
   sem dar sinal de vida: o botão dizia "testando…" e não havia como saber se
   faltavam dois segundos ou dois minutos — e com histórico grande, faltavam
   minutos. Espera sem medida é indistinguível de travamento. */
function barraProgresso(feitos, total, texto){
  const pct = total > 0 ? Math.min(100, Math.round(100 * feitos / total)) : 0;
  return `<div class="carta" style="margin-bottom:10px">
    <div class="contador" style="margin:0 0 8px">
      <span>${esc(texto || "processando")}</span>
      <b>${pct}%</b></div>
    <div class="barra-teste"><i style="width:${pct}%;transition:width .2s ease"></i></div>
    <div class="pe" style="border:0;padding-left:0;padding-top:2px">
      <span>${inf(feitos)} de ${inf(total)}</span>
      <span>${feitos < total ? "não feche a tela" : "concluído"}</span></div>
  </div>`;
}

/* Executa uma lista de tarefas uma por quadro, atualizando o progresso. É o
   padrão que faltava no app: setTimeout entre passos devolve a linha principal
   ao navegador, então a barra pinta e a tela continua respondendo. Rodar tudo
   num laço só é mais rápido no papel e inutilizável na prática. */
function emFatias(itens, passo, aoProgresso, aoTerminar){
  const saida = [];
  let i = 0;
  const proximo = () => {
    if(i >= itens.length){ if(aoTerminar) aoTerminar(saida); return; }
    try{ saida.push(passo(itens[i], i)); }
    catch(e){ saida.push({erro: e.message}); }
    i++;
    if(aoProgresso) aoProgresso(i, itens.length);
    setTimeout(proximo, 0);
  };
  setTimeout(proximo, 0);
}

/* ==================== a cartela ====================
   Uma função só desenha a cartela em todos os usos: marcação manual, jogo
   salvo, e conferência. Três desenhos separados divergiriam no primeiro ajuste
   — e o volante é a peça de identidade do app, então ele tem de ser o mesmo
   objeto em qualquer tela.

   `sorteadas` pinta o resultado; quando há marcadas E sorteadas, a casa que é
   as duas coisas ganha o contorno âmbar: é o acerto.                       */
function cartela(modalidade, marcadas, opcoes){
  const o = Object.assign({sorteadas:null, interativa:false, rodape:"", selo:""}, opcoes||{});
  const c = MODALIDADES[modalidade];
  const cols = GRADE[modalidade] || 10;
  const marc = new Set(marcadas || []);
  const sort = o.sorteadas ? new Set(o.sorteadas) : null;
  const casas = [];
  for(let d = c.base; d <= c.N + c.base - 1; d++){
    const m = marc.has(d), s = sort && sort.has(d);
    const classe = s && m ? "casa acertou" : s ? "casa sorteada" : "casa";
    casas.push(`<button type="button" class="${classe}" ${o.interativa?"":"disabled"}
      data-casa="${d}" aria-pressed="${m}"
      aria-label="${d}${s?" sorteada":""}${m?" marcada":""}"><span>${pad(d)}</span></button>`);
  }
  const acertos = sort ? [...marc].filter(d => sort.has(d)).length : null;
  return `<div class="cartela">
    <div class="tarja"><b>${esc(c.nome)}</b>
      <span>${o.selo || `${marc.size}/${c.N}`}</span></div>
    <div class="miolo">
      <div class="grade-volante" style="grid-template-columns:repeat(${cols},1fr)"
        ${o.interativa?'id="volante"':""}>${casas.join("")}</div>
    </div>
    ${o.rodape || (acertos !== null
      ? `<div class="pe"><span>${acertos} acerto${acertos===1?"":"s"}</span>
          <span>${marc.size} dezenas marcadas</span></div>`
      : "")}
  </div>`;
}

const legendaCartela = `<div class="legenda-cartela">
  <span><i style="background:var(--tintaPapel)"></i>marcada</span>
  <span><i style="background:var(--acaso)"></i>sorteada</span>
  <!-- O selo do acerto reproduz o que a casa faz: caneta escura sobre a casa
       sorteada, com o fio claro em volta. Antes era um quadrado âmbar, que não
       aparece em lugar nenhum da cartela — legenda que não bate com o desenho
       é pior que legenda nenhuma. -->
  <span><i style="background:var(--acaso);box-shadow:inset 0 0 0 1px #fff,
    inset 0 0 0 3px var(--tintaPapel)"></i>acerto</span>
</div>`;

/* ==================== avisos e conferência automática ====================
   Conferir à mão só funciona para quem lembra de conferir. O motor abaixo roda
   sozinho a cada vez que o histórico muda: percorre os jogos salvos e as
   teimosinhas, confere contra todo concurso que ainda não foi conferido, e
   registra um aviso para cada faixa de prêmio atingida.

   Duas decisões que evitam mentira:

   * Um jogo salvo sem concurso-alvo declarado vale para os concursos **a
     partir da data em que foi salvo** — nunca para trás. Conferir um jogo
     contra um sorteio anterior ao dia em que ele foi criado produziria
     "acertos" que ninguém poderia ter apostado.
   * A conferência é idempotente: reprocessar o mesmo concurso não duplica
     conferência nem aviso, porque a chave é (jogo, concurso).            */

const AVISO_MAX = 200;

function avisar(tipo, titulo, texto, chave){
  /* `chave` torna o aviso idempotente: o mesmo fato não avisa duas vezes. */
  if(chave && S.avisos.some(a => a.chave === chave)) return false;
  S.avisos.unshift({
    id:`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`,
    tipo, titulo, texto, chave, quando:new Date().toISOString(), lido:false
  });
  if(S.avisos.length > AVISO_MAX) S.avisos.length = AVISO_MAX;
  Guardar.gravar("avisos", S.avisos);
  return true;
}

/* ==================== avisos no celular ====================

   Três camadas, da mais capaz para a mais garantida:

   1. LocalNotifications do Capacitor — notificação Android de verdade. É a
      única que toca com o app FECHADO, porque quem dispara é o AlarmManager do
      sistema, e não JavaScript. Só existe dentro do APK.
   2. Notification do navegador — funciona na aba aberta, no computador.
   3. O sino no cabeçalho — sempre funciona, não depende de permissão nem de
      plugin, e é por isso que ele nunca deixou de existir.

   O que este app NÃO faz, e é bom dizer: não existe servidor empurrando aviso
   para o seu celular. Isso exigiria o serviço de push do Google e uma máquina
   nossa no ar — mais uma dependência de terceiro e uma conta a pagar, para um
   app que roda inteiro no aparelho. O que existe é o próprio aparelho tocando
   um alarme na hora marcada, o que cobre "o sorteio de hoje já saiu" sem
   depender de ninguém. */

const Avisos = {
  plugin(){
    try{
      const c = (typeof Capacitor !== "undefined") ? Capacitor : null;
      const p = c && c.Plugins && c.Plugins.LocalNotifications;
      /* isNativePlatform separa o APK do navegador: no navegador o objeto pode
         existir e não fazer nada, e um aviso que não aparece é pior que
         nenhum, porque a pessoa para de conferir. */
      return (p && c.isNativePlatform && c.isNativePlatform()) ? p : null;
    }catch(e){ return null; }
  },

  disponivel(){
    if(this.plugin()) return "nativo";
    if(typeof Notification !== "undefined") return "navegador";
    return "indisponivel";
  },

  async permissao(){
    const p = this.plugin();
    if(p){
      try{
        const atual = await p.checkPermissions();
        if(atual.display === "granted") return "granted";
        const pedido = await p.requestPermissions();
        return pedido.display;
      }catch(e){ return "indisponível"; }
    }
    try{
      if(typeof Notification === "undefined") return "indisponível";
      if(Notification.permission !== "default") return Notification.permission;
      return await Notification.requestPermission();
    }catch(e){ return "indisponível"; }
  },

  /* Id numérico estável a partir de um texto. O Android identifica notificação
     por número inteiro; sem um id estável, reagendar o lembrete do mesmo
     concurso empilharia avisos repetidos em vez de substituir o anterior. */
  id(chave){
    let h = 2166136261;
    for(let i=0;i<chave.length;i++){ h ^= chave.charCodeAt(i); h = Math.imul(h, 16777619); }
    return Math.abs(h % 2000000000) + 1;
  },

  async agora(titulo, texto, chave, destino){
    const p = this.plugin();
    if(p){
      try{
        await p.schedule({notifications:[{
          /* Sem channelId: o canal padrão é criado pelo próprio plugin. Um
             canal nosso exigiria createChannel antes do primeiro agendamento,
             e se essa chamada falhasse o Android 8+ descartaria a notificação
             em silêncio — defeito invisível, que é o pior tipo. */
          id: this.id(chave || titulo), title: titulo, body: texto,
          smallIcon: "ic_stat_icone",
          /* A tela para onde o toque leva. O mockup desenha uma linha de ação
             ("Ver detalhes", "Ver análise") embaixo de cada notificação; o que
             ela faz é isto — abrir o app no lugar certo em vez de na tela
             inicial, que obrigaria a pessoa a procurar o que o aviso já sabia.
             Vai em `extra` porque é o único campo que volta no evento de
             toque. */
          extra: {tela: destino || "inicio"}
        }]});
        return true;
      }catch(e){ /* cai para o navegador */ }
    }
    try{
      if(typeof Notification === "undefined" || Notification.permission !== "granted") return false;
      new Notification(titulo, {body:texto, icon:"icone-192.png", tag: chave || "lotolab"});
      return true;
    }catch(e){ return false; }
  },

  /* Agenda para uma data futura. É o que faz o aviso chegar com o app fechado. */
  async agendar(quando, titulo, texto, chave){
    const p = this.plugin();
    if(!p) return false;
    if(!(quando instanceof Date) || !Number.isFinite(quando.getTime())) return false;
    if(quando.getTime() <= Date.now()) return false;
    try{
      await p.schedule({notifications:[{
        id: this.id(chave), title: titulo, body: texto,
        /* allowWhileIdle atravessa o modo soneca do Android. Sem exigir alarme
           exato: o aviso é "o sorteio já saiu", e alguns minutos a mais não
           mudam nada — enquanto SCHEDULE_EXACT_ALARM é permissão restrita e
           pediria uma justificativa que este app não tem. */
        schedule: {at: quando, allowWhileIdle: true},
        smallIcon: "ic_stat_icone"
      }]});
      return true;
    }catch(e){ return false; }
  },

  async cancelar(chaves){
    const p = this.plugin();
    if(!p || !chaves.length) return false;
    try{
      await p.cancel({notifications: chaves.map(c => ({id: this.id(c)}))});
      return true;
    }catch(e){ return false; }
  },

  async pendentes(){
    const p = this.plugin();
    if(!p) return [];
    try{ return (await p.getPending()).notifications || []; }
    catch(e){ return []; }
  },
};

function notificarSistema(titulo, texto, chave, destino){
  /* Sem await: quem chama está no meio de conferir jogos, e travar essa conta
     esperando o Android responder deixaria a tela parada por nada. */
  Avisos.agora(titulo, texto, chave, destino);
}

/* O toque na notificação abre a tela que o aviso trata. Sem isto o app abre no
   Início e a pessoa procura sozinha o que a notificação já sabia — que é o
   contrário de avisar.

   Silencioso e defensivo de propósito: se o plugin não expuser o evento, o
   único efeito é abrir no Início, como antes. Uma exceção aqui derrubaria a
   inicialização inteira por causa de uma conveniência. */
function ligarToqueNaNotificacao(){
  try{
    const c = (typeof Capacitor !== "undefined") ? Capacitor : null;
    const p = (c && c.isNativePlatform && c.isNativePlatform() && c.Plugins)
      ? c.Plugins.LocalNotifications : null;
    if(!p || typeof p.addListener !== "function") return false;
    p.addListener("localNotificationActionPerformed", (ev) => {
      const alvo = ev && ev.notification && ev.notification.extra
        && ev.notification.extra.tela;
      /* Só navega para tela que existe. Um destino gravado por uma versão
         antiga do app não pode deixar a tela em branco depois de atualizar. */
      const existe = SECOES.some(s => s.telas.some(t => t.id === alvo));
      if(existe) irParaTela(alvo);
    });
    return true;
  }catch(e){ return false; }
}

async function pedirPermissaoDeAviso(){
  return await Avisos.permissao();
}

/* ---- lembrete do próximo sorteio ----

   O caso que motivou tudo: o celular precisa avisar que saiu concurso novo
   mesmo com o app fechado. Sem servidor, o jeito honesto é o alarme do próprio
   aparelho — o app já sabe a data do próximo sorteio de cada modalidade,
   porque a Caixa a publica junto com o resultado.

   Uma hora depois do sorteio, e não na hora: o resultado da Caixa demora a
   sair, e avisar às 20h para a pessoa abrir e não achar nada é pior que não
   avisar. */
const HORA_DO_SORTEIO = 20;        /* 20h, horário de Brasília */
const ATRASO_DO_AVISO = 90;        /* minutos depois do sorteio */

function momentoDoAviso(dataISO){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dataISO || ""))) return null;
  const [a, m, d] = dataISO.split("-").map(Number);
  const quando = new Date(a, m - 1, d, HORA_DO_SORTEIO, 0, 0, 0);
  quando.setMinutes(quando.getMinutes() + ATRASO_DO_AVISO);
  return quando;
}

/* Reagenda os lembretes das modalidades que a pessoa acompanha. Chamado depois
   de cada busca: a data do próximo concurso muda a cada sorteio, e um lembrete
   marcado para a data velha nunca mais tocaria. */
async function reagendarLembretes(){
  if(S.avisarSorteio === false) return {agendados:0, motivo:"desligado"};
  if(!Avisos.plugin()) return {agendados:0, motivo:"sem plugin nativo"};

  const modalidades = [...new Set(S.jogos.map(j => j.modalidade))];
  let agendados = 0;
  for(const mod of modalidades){
    const ultimo = ultimoResultado(mod);
    if(!ultimo || !ultimo.dataProximo) continue;
    const quando = momentoDoAviso(ultimo.dataProximo);
    if(!quando) continue;
    const numero = ultimo.concursoProximo || (Number(ultimo.concurso) + 1);
    const chave = `sorteio:${mod}:${numero}`;
    const quantos = S.jogos.filter(j => j.modalidade === mod).length;
    const ok = await Avisos.agendar(quando,
      `${MODALIDADES[mod].nome} — concurso ${numero}`,
      `O sorteio já saiu. Abra para conferir ${quantos === 1 ? "seu jogo" : `seus ${quantos} jogos`}.`,
      chave);
    if(ok) agendados++;
  }
  return {agendados, modalidades: modalidades.length};
}

/* Faixa de prêmio atingida, ou null. Lotomania premia 0 acerto, e é por isso
   que a comparação é contra a lista de faixas e não contra um mínimo. */
function faixaAtingida(modalidade, acertos){
  const c = MODALIDADES[modalidade];
  return c.faixas.includes(acertos) ? acertos : null;
}

/* Os concursos que um jogo cobre. Para teimosinha é a faixa declarada; para um
   jogo comum, todo concurso conhecido da modalidade a partir da data de
   criação. */
/* Três formas de um jogo dizer a que concursos ele pertence, da mais explícita
   para a mais implícita:

   1. `concursoAlvo` — a pessoa declarou UM concurso ao salvar. Vale só ele.
   2. `deConcurso` + `concursos` — a faixa da teimosinha.
   3. nada declarado — todo concurso da modalidade a partir da data em que o
      jogo foi salvo.

   Os dois primeiros são declarações e valem como tais, mesmo que o concurso já
   tenha sido sorteado quando o jogo entrou: quem digita "concurso 3401" está
   dizendo que jogou nele, e o app não tem como conferir bilhete. A data continua
   mandando no terceiro caso, que é o automático — ali ninguém declarou nada, e
   assumir cobertura para trás inventaria acerto em sorteio anterior ao dia em
   que o jogo existiu. */
function concursosDoJogo(j){
  if(Number.isFinite(j.concursoAlvo))
    return S.resultados.filter(r =>
      r.modalidade === j.modalidade && r.concurso === j.concursoAlvo);
  return S.resultados.filter(r =>
    r.modalidade === j.modalidade &&
    (j.deConcurso
      ? r.concurso >= j.deConcurso && r.concurso <= j.deConcurso + (j.concursos||1) - 1
      : String(r.data || "") >= String(j.data || "")));
}

function conferenciaAutomatica(){
  let novas = 0, premios = 0;
  let melhor = null;
  const todos = S.jogos.concat(S.teimosinhas || []);
  todos.forEach(j => {
    j.conferencias = j.conferencias || [];
    const jaFeitas = new Set(j.conferencias.map(cf => cf.concurso));
    concursosDoJogo(j).forEach(r => {
      if(jaFeitas.has(r.concurso)) return;
      const acertos = j.dezenas.filter(d => r.dezenas.includes(d)).length;
      j.conferencias.push({concurso:r.concurso, data:r.data, dezenas:r.dezenas, acertos});
      novas++;
      const faixa = faixaAtingida(j.modalidade, acertos);
      if(faixa !== null){
        premios++;
        /* Guarda o melhor achado da rodada para a notificação poder dizer
           QUANTO foi. Melhor = mais acertos; empate fica com o primeiro. */
        if(!melhor || acertos > melhor.acertos)
          melhor = {acertos, modalidade:j.modalidade, concurso:r.concurso, jogo:j.id};
        const nome = MODALIDADES[j.modalidade].nome;
        avisar("premio", `${nome}: ${faixa} acerto${faixa===1?"":"s"}`,
          `Concurso ${r.concurso} — o jogo ${j.dezenas.map(pad).join(" ")} está numa faixa de prêmio. Confira no volante oficial antes de comemorar.`,
          `premio:${j.id}:${r.concurso}`);
      }
    });
  });
  if(novas){
    Guardar.gravar("jogos", S.jogos);
    Guardar.gravar("teimosinhas", S.teimosinhas);
  }
  return {novas, premios, melhor};
}

/* Chamado sempre que o histórico muda: confere, avisa quantos concursos
   entraram, e só então notifica o sistema. */
function aoMudarHistorico(quantosConcursos, origem){
  const r = conferenciaAutomatica();
  if(quantosConcursos > 0){
    const titulo = `${quantosConcursos} concurso${quantosConcursos===1?"":"s"} novo${quantosConcursos===1?"":"s"}`;
    const texto = r.novas
      ? `${r.novas} conferência${r.novas===1?"":"s"} feita${r.novas===1?"":"s"} automaticamente` +
        (r.premios ? `, ${r.premios} em faixa de prêmio.` : ", nenhuma em faixa de prêmio.")
      : "Nenhum jogo salvo cobria esses concursos.";
    if(avisar("historico", titulo, `${texto} Origem: ${origem}.`,
              `hist:${origem}:${S.resultados.length}:${Date.now()}`))
      notificarSistema(titulo, texto, null, "resultados");
  }
  /* O aviso do prêmio vem depois e separado do aviso de concurso novo, e diz
     de quanto foi: "seu jogo foi premiado" sem número manda a pessoa abrir o
     app para descobrir que acertou 11 na Lotofácil. */
  if(r.premios){
    const detalhe = r.melhor
      ? `${r.melhor.acertos} acertos na ${MODALIDADES[r.melhor.modalidade].nome}, concurso ${r.melhor.concurso}.`
      : "Abra o LotoLab para ver qual jogo e qual concurso.";
    notificarSistema(
      r.premios === 1 ? "Seu jogo foi premiado" : `${r.premios} jogos premiados`,
      detalhe, `premio:${Date.now()}`, "conferir");
  }
  if(S.autoAnalise !== false) analisarPendentes();
  /* Reagenda o alarme do próximo sorteio: a data mudou agora que entrou
     concurso novo, e o lembrete antigo apontava para uma data que já passou. */
  reagendarLembretes();
  return r;
}

/* ==================== análise automática por concurso ====================
   Cada concurso novo dispara o retreino das modalidades afetadas, e o aviso
   sai quando a análise fica pronta.

   Duas travas, porque "automático" não pode significar "desperdiçado":

   * **Assinatura do histórico.** Se a modalidade não recebeu concurso novo, a
     análise anterior continua exata e não é refeita. Sem isso, importar um
     concurso da Quina retreinaria as oito modalidades à toa.
   * **Uma modalidade por vez, com respiro.** Oito treinos em sequência
     travariam a tela por segundos. Cada um vai num setTimeout, então o app
     continua respondendo enquanto analisa.

   Sobre bateria: eu havia decidido não fazer isto automático por causa do
   custo de reconfirmar, a cada concurso, algo que já se sabe — que não há
   sinal. A decisão não era minha. Fica automático, e quem quiser o
   comportamento anterior desliga em Análise › Aprendizado.                */

function assinaturaHistorico(modalidade){
  const h = S.resultados.filter(r => r.modalidade === modalidade);
  if(!h.length) return "0";
  return `${h.length}:${Math.max(...h.map(r => r.concurso))}`;
}

/* As modalidades que têm histórico bastante E mudaram desde a última análise. */
function modalidadesPendentes(){
  return Object.keys(MODALIDADES).filter(k => {
    const n = S.resultados.filter(r => r.modalidade === k).length;
    if(n < MINIMO_CONCURSOS) return false;
    const anterior = S.aprendizado[k];
    return !anterior || anterior.assinatura !== assinaturaHistorico(k);
  });
}

/* Modalidades cuja pesquisa está atrás do histórico. Critério separado do
   `modalidadesPendentes` do modelo logístico: o mínimo é outro e a memória é
   outra — misturar os dois faria uma pesquisa parar por causa do estado da
   outra camada. */
function pesquisasPendentes(){
  return Object.keys(MODALIDADES).filter(k => {
    if(historicoDe(k).length < MINIMO_PESQUISA) return false;
    const mem = S.pesquisaAdaptativa[k];
    return !mem || mem.assinatura !== assinaturaHistorico(k);
  });
}

/* Evolui uma geração em cada modalidade pendente e julga o campeão. Devolve o
   que rodou, para os testes poderem conferir sem esperar relógio. */
function evoluirPendentes(opcoes){
  const o = Object.assign({geracoes:1}, opcoes || {});
  const fila = pesquisasPendentes();
  const feitas = [];
  for(const k of fila){
    try{
      for(let g = 0; g < o.geracoes; g++) rodarGeracao(k);
      const c = concluirPesquisa(k);
      if(!c.erro) feitas.push({modalidade:k, conclusao:c});
    }catch(e){
      /* Uma modalidade que falha não pode levar as outras junto: a pesquisa é
         acessória, e derrubar a conferência de jogos por causa dela seria
         trocar o essencial pelo experimental. */
      avisar("erro", `Falha na pesquisa de ${MODALIDADES[k].nome}`,
        `${e.message}. As outras modalidades seguem normalmente.`,
        `erroPesquisa:${k}:${assinaturaHistorico(k)}`);
    }
  }
  if(feitas.length) Guardar.gravar("pesquisaAdaptativa", S.pesquisaAdaptativa);
  /* Achado que sobrevive à correção é raro por construção — quando acontece,
     merece aviso, e o aviso diz o que é e o que não é. */
  const sobreviventes = feitas.filter(f => f.conclusao.sobreviveu);
  if(sobreviventes.length){
    const nomes = sobreviventes.map(f => MODALIDADES[f.modalidade].nome).join(", ");
    avisar("pesquisa", `Hipótese sobreviveu à correção: ${nomes}`,
      "Um achado a conferir na tela de Pesquisa. Não é previsão e não vira aposta — " +
      "é motivo para repetir com mais concursos.",
      `pesquisa:${sobreviventes.map(f => f.modalidade + ":" + f.conclusao.assinatura).join("|")}`);
  }
  return feitas;
}

/* Devolve quantas ficaram na fila. O `aoTerminar` existe para os testes
   poderem esperar o fim sem depender de tempo de relógio. */
function analisarPendentes(aoTerminar){
  const fila = modalidadesPendentes();
  if(!fila.length){ if(aoTerminar) aoTerminar([]); return 0; }

  const prontas = [];
  const proxima = () => {
    const k = fila.shift();
    if(k === undefined){
      /* A correção vem antes do aviso: avisar "revisar" e só depois descobrir
         que o achado não sobrevive à correção seria alarme falso entregue. */
      aplicarCorrecao(S.aprendizado);
      Guardar.gravar("aprendizado", S.aprendizado);
      /* O motor de pesquisa evolui junto, uma geracao por modalidade que
         recebeu concurso. Uma so, e nao vinte: isto roda sem ninguem pedir, e
         um motor autonomo que trava o aparelho e desligado no dia seguinte.
         Quem quiser acelerar usa o botao da tela. */
      if(S.pesquisaAutomatica !== false) evoluirPendentes();
      /* A calibração de popularidade também melhora com concurso novo, e é
         barata perto do treino — roda junto, sem fila própria. */
      Object.keys(MODALIDADES).forEach(k => {
        const r = calibrarPopularidade(k);
        if(!r.erro) S.calibracao[k] = r;
      });
      Guardar.gravar("calibracao", S.calibracao);
      if(prontas.length){
        const nomes = prontas.map(x => MODALIDADES[x.modalidade].nome).join(", ");
        const semSinal = prontas.filter(x => !x.aprendeu).length;
        const titulo = prontas.length === 1
          ? `Análise pronta: ${nomes}`
          : `${prontas.length} análises prontas`;
        const texto = semSinal === prontas.length
          ? `${nomes}: nenhum sinal encontrado, que é o resultado esperado de sorteios independentes.`
          : `${nomes}. ${prontas.length - semSinal} com desvio a revisar — desvio não é sinal, veja a tela.`;
        avisar("analise", titulo, texto,
          `analise:${prontas.map(x => x.modalidade + ":" + x.assinatura).join("|")}`);
        notificarSistema(titulo, texto, null, "aprendizado");
      }
      /* Repinta só se a pessoa estiver olhando a tela que mudou. Repintar
         sempre roubaria a rolagem de quem está em outra aba. */
      if(S.tela === "aprendizado") pintar(); else pintarContaAvisos();
      if(aoTerminar) aoTerminar(prontas);
      return;
    }
    try{
      const r = aprender(k);
      if(!r.erro){
        r.assinatura = assinaturaHistorico(k);
        r.quando = new Date().toISOString();
        r.automatica = true;
        S.aprendizado[k] = r;
        prontas.push(r);
      }
    }catch(e){
      avisar("erro", `Falha ao analisar ${MODALIDADES[k].nome}`,
        `${e.message}. As outras modalidades seguem normalmente.`,
        `erroAnalise:${k}:${assinaturaHistorico(k)}`);
    }
    /* Progresso visível quando a pessoa está olhando a tela: sem isto, várias
       modalidades em sequência parecem travamento. */
    const alvo = document.getElementById("ap-saida");
    if(alvo && S.tela === "aprendizado")
      alvo.innerHTML = barraProgresso(prontas.length, prontas.length + fila.length + 1,
        "analisando as modalidades");
    setTimeout(proxima, 0);   // devolve a linha principal entre modalidades
  };
  setTimeout(proxima, 0);
  return fila.length;
}

/* ==================== a central de atividades ====================

   A lista era corrida: quarenta avisos em ordem, sem separação e sem filtro.
   Funciona com cinco; com quarenta, achar "o que aconteceu hoje" vira rolagem.

   Duas divisões, as do mockup:

   * POR DIA — Hoje, Ontem, e depois a data. O agrupamento é por dia de
     calendário, e não por "24 horas atrás": às 00h30, o que aconteceu às 23h
     é ontem, e é assim que a pessoa pensa.
   * POR ASSUNTO — Todas, Análises, Conferências, Sistema.

   `tipo` continua mandando na COR do item (prêmio verde, erro âmbar) e passa a
   ter um GRUPO separado para o filtro. São duas perguntas diferentes — "que
   gravidade tem" e "de que assunto é" — e um campo só para as duas obrigaria a
   escolher qual delas responder errado.                                    */

const GRUPOS_DE_AVISO = {
  conferencia: {nome:"Conferências", tipos:["premio", "historico", "conferencia"]},
  analise:     {nome:"Análises",     tipos:["analise", "pesquisa"]},
  sistema:     {nome:"Sistema",      tipos:["sistema", "erro", "atualizacao"]},
};

/* Um desenho por tipo, como no mockup: cérebro para análise, visto para
   conferência, troféu para prêmio, seta circular para histórico. O ícone repete
   a informação que a cor já dá — e é essa repetição que faz a lista ser
   varrível por quem não distingue as cores. */
const ICONE_AVISO = {
  premio:      '<path d="M7 4h10v4a5 5 0 0 1-10 0Z"/><path d="M7 6H4.5v1.5A3.5 3.5 0 0 0 8 11"/><path d="M17 6h2.5v1.5A3.5 3.5 0 0 1 16 11"/><path d="M12 13v4M9 20h6"/>',
  conferencia: '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/>',
  historico:   '<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/>',
  analise:     '<path d="M12 4a4 4 0 0 0-3.9 4.9A3.5 3.5 0 0 0 8 15.5 3.5 3.5 0 0 0 12 19a3.5 3.5 0 0 0 4-3.5 3.5 3.5 0 0 0-.1-6.6A4 4 0 0 0 12 4Z"/><path d="M12 4v15"/>',
  pesquisa:    '<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/>',
  erro:        '<path d="M12 4 2.5 20h19Z"/><path d="M12 10v4M12 17h.01"/>',
  atualizacao: '<path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 20h16"/>',
  sistema:     '<circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16h.01"/>',
};

function grupoDoAviso(tipo){
  for(const [id, g] of Object.entries(GRUPOS_DE_AVISO))
    if(g.tipos.includes(tipo)) return id;
  /* Tipo novo cai em Sistema em vez de sumir da tela. Um aviso que o filtro
     não conhece tem de aparecer em algum lugar — o contrário é perder aviso
     por ter esquecido de atualizar uma tabela. */
  return "sistema";
}

/* Rótulo do dia. Compara DIAS de calendário, não diferença de horas. */
function diaDoAviso(iso, agora){
  const d = new Date(iso);
  if(!Number.isFinite(d.getTime())) return "sem data";
  const hoje = agora instanceof Date ? new Date(agora) : new Date();
  const soDia = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dif = Math.round((soDia(hoje) - soDia(d)) / 86400000);
  if(dif === 0) return "Hoje";
  if(dif === 1) return "Ontem";
  /* Data no futuro não vira "em 3 dias": o relógio do aparelho pode estar
     errado, e a lista não é lugar de discutir isso. Mostra a data e pronto. */
  return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"long"});
}

/* Agrupa preservando a ordem de chegada (mais recente primeiro), que é a ordem
   em que `avisar()` insere. Um Map mantém a ordem de inserção das chaves, então
   os dias saem na ordem certa sem precisar reordenar depois. */
function avisosPorDia(lista, agora){
  const dias = new Map();
  for(const a of lista){
    const dia = diaDoAviso(a.quando, agora);
    if(!dias.has(dia)) dias.set(dia, []);
    dias.get(dia).push(a);
  }
  return [...dias.entries()].map(([dia, itens]) => ({dia, itens}));
}

function avisosNaoLidos(){ return S.avisos.filter(a => !a.lido).length; }

function pintarContaAvisos(){
  const n = avisosNaoLidos(), b = $("#conta-avisos");
  if(!b) return;
  b.hidden = n === 0;
  b.textContent = n > 9 ? "9+" : String(n);
}

function pintarAvisos(){
  const corpo = $("#corpo-avisos");
  if(!corpo) return;
  const perm = (typeof Notification !== "undefined") ? Notification.permission : "indisponível";
  const cabeca = `<div style="display:flex;justify-content:space-between;align-items:center;
      gap:10px;margin-bottom:12px">
      <h2 style="margin:0">atividades</h2>
      <div class="botoes">
        ${perm === "granted" ? "" :
          `<button class="acao contorno mini" id="a-permitir">permitir notificação</button>`}
        ${S.avisos.length ? `<button class="acao contorno mini" id="a-limpar">limpar</button>` : ""}
      </div></div>`;
  /* Os chips levam a contagem. "Análises" sem número obriga a tocar para
     descobrir que está vazio; com número, a pessoa já sabe antes de tocar. */
  const conta = {todas: S.avisos.length};
  for(const id of Object.keys(GRUPOS_DE_AVISO)) conta[id] = 0;
  S.avisos.forEach(a => conta[grupoDoAviso(a.tipo)]++);

  const filtro = S.filtroAvisos && (S.filtroAvisos === "todas" || GRUPOS_DE_AVISO[S.filtroAvisos])
    ? S.filtroAvisos : "todas";
  const chips = [["todas", "Todas"], ...Object.entries(GRUPOS_DE_AVISO).map(([id,g]) => [id, g.nome])];
  const barra = !S.avisos.length ? "" : `<div class="chips" role="group" aria-label="Filtrar avisos">
    ${chips.map(([id, nome]) => `<button class="chip" data-filtro="${id}"
      aria-pressed="${id===filtro}">${esc(nome)}<i>${conta[id]}</i></button>`).join("")}</div>`;

  const visiveis = filtro === "todas"
    ? S.avisos : S.avisos.filter(a => grupoDoAviso(a.tipo) === filtro);

  const item = a => `<div class="item ${a.tipo==="premio"?"ok":a.tipo==="erro"?"aviso":""} ${a.lido?"":"nao-lido"}">
      <span class="marca-cor"></span>
      <span class="ic-aviso ${esc(grupoDoAviso(a.tipo))}" aria-hidden="true">
        <svg viewBox="0 0 24 24">${ICONE_AVISO[a.tipo] || ICONE_AVISO.sistema}</svg></span>
      <span class="txt"><b>${esc(a.titulo)}</b><span>${esc(a.texto)}</span></span>
      <span class="quando">${esc(new Date(a.quando).toLocaleTimeString("pt-BR",
        {hour:"2-digit", minute:"2-digit"}))}</span>
      ${/* O ponto de status do mockup. Ele NÃO diz "deu certo" — diz que o
            item já foi visto. Verde aceso é aviso novo; apagado é lido. Um
            ponto verde em tudo, sempre, não informa nada. */""}
      <span class="ponto-lido ${a.lido ? "" : "novo"}"
        title="${a.lido ? "já visto" : "novo"}"></span>
    </div>`;

  const lista = !S.avisos.length
    ? `<div class="vazio">Nenhum aviso ainda.<br>Eles aparecem quando novos concursos
        entram no histórico e a conferência automática roda.</div>`
    : !visiveis.length
      /* Filtro vazio não é o mesmo que lista vazia, e a frase precisa dizer
         qual dos dois é — senão parece que o app perdeu os avisos. */
      ? `<div class="vazio">Nenhum aviso em
          <strong>${esc((GRUPOS_DE_AVISO[filtro]||{}).nome || "")}</strong>.<br>
          Os outros ${inf(S.avisos.length)} continuam em <strong>Todas</strong>.</div>`
      : avisosPorDia(visiveis).map(g => `<div class="dia-avisos">
          <div class="dia-rotulo">${esc(g.dia)}<span>${inf(g.itens.length)}</span></div>
          <div class="lista">${g.itens.map(item).join("")}</div>
        </div>`).join("");

  corpo.innerHTML = cabeca + barra + lista;

  /* Mede depois de desenhar: só há rolagem se o conteúdo não coube de fato, e
     isso depende da largura do aparelho e do tamanho de fonte do sistema —
     nenhum dos dois é conhecido na hora de escrever o CSS. */
  const faixa = corpo.querySelector(".chips");
  if(faixa) faixa.classList.toggle("rola", faixa.scrollWidth > faixa.clientWidth + 1);

  document.querySelectorAll("[data-filtro]").forEach(b => b.onclick = () => {
    S.filtroAvisos = b.dataset.filtro;
    /* Não grava: o filtro é da visita. Voltar dias depois e encontrar a lista
       filtrada por um assunto que já se esqueceu de ter escolhido esconde
       aviso novo sem dizer que está escondendo. */
    pintarAvisos();
  });

  const lim = $("#a-limpar");
  if(lim) lim.onclick = () => {
    S.avisos = []; Guardar.gravar("avisos", S.avisos); pintarAvisos(); pintarContaAvisos();
  };
  const perm2 = $("#a-permitir");
  if(perm2) perm2.onclick = async () => {
    const r = await pedirPermissaoDeAviso();
    if(r === "granted") notificarSistema("Notificações ligadas",
      "Você será avisado quando novos concursos forem conferidos.");
    pintarAvisos();
  };
}

/* ==================== importação de resultados ====================
   Duas vias, e a diferença entre elas é declarada na tela:

   * **Colar/arquivo** — funciona sem rede e é o caminho verificado.
   * **Buscar na Caixa** — consulta o serviço público do Portal de Loterias.
     NÃO PUDE TESTAR esta via: o ambiente onde este código foi escrito bloqueia
     o domínio da Caixa. O formato abaixo segue o que o portal publica, mas se
     ele mudar, a tela informa o erro em vez de inventar um resultado.       */

const SLUG_CAIXA = {
  "mega-sena":"megasena", "lotofacil":"lotofacil", "quina":"quina",
  "lotomania":"lotomania", "dupla-sena":"duplasena", "dia-de-sorte":"diadesorte",
  "timemania":"timemania", "mais-milionaria":"maismilionaria"
};

function dataBrParaIso(s){
  const m = String(s||"").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : String(s||"").slice(0,10);
}

/* Converte a resposta do portal no registro do app, e recusa o que não
   reconhece — devolver um resultado pela metade é pior que devolver erro. */
function normalizarCaixa(bruto, modalidade){
  const c = MODALIDADES[modalidade];
  const dezenas = (bruto.listaDezenas || bruto.dezenas || [])
    .map(x => parseInt(String(x), 10)).filter(x => Number.isFinite(x));
  if(dezenas.length !== c.k)
    throw new Error(`o serviço devolveu ${dezenas.length} dezenas, esperava ${c.k}`);
  const concurso = parseInt(bruto.numero ?? bruto.concurso, 10);
  if(!Number.isFinite(concurso)) throw new Error("o serviço não informou o número do concurso");
  const r = {concurso, data:dataBrParaIso(bruto.dataApuracao || bruto.data),
             dezenas:dezenas.sort((a,b)=>a-b), modalidade, origem:"caixa"};
  const trevos = (bruto.trevosSorteados || []).map(x=>parseInt(String(x),10))
    .filter(Number.isFinite);
  if(trevos.length) r.trevos = trevos;

  /* Rateio: quantos ganharam em cada faixa e quanto cada um levou. É o que
     liga o jogo salvo a dinheiro em vez de só a contagem de acertos — e é
     também a matéria-prima da calibração de popularidade mais abaixo. */
  const rateio = (bruto.listaRateioPremio || []).map(f => ({
    faixa: parseInt(f.faixa, 10),
    descricao: String(f.descricaoFaixa || "").trim(),
    ganhadores: parseInt(f.numeroDeGanhadores, 10) || 0,
    premio: Number(f.valorPremio) || 0
  })).filter(f => Number.isFinite(f.faixa));
  if(rateio.length) r.rateio = rateio;

  /* Cidades dos ganhadores. Vem só para a faixa principal, e nem sempre vem. */
  const cidades = (bruto.listaMunicipioUFGanhadores || []).map(g => ({
    municipio: String(g.municipio || "").trim(),
    uf: String(g.uf || "").trim(),
    ganhadores: parseInt(g.ganhadores, 10) || 1,
    canal: String(g.serie || g.nomeFatansiaUL || "").trim()
  })).filter(g => g.municipio);
  if(cidades.length) r.cidades = cidades;

  const estimativa = Number(bruto.valorEstimadoProximoConcurso);
  if(Number.isFinite(estimativa) && estimativa > 0) r.estimativaProximo = estimativa;
  if(bruto.dataProximoConcurso) r.dataProximo = dataBrParaIso(bruto.dataProximoConcurso);
  if(bruto.numeroConcursoProximo) r.concursoProximo = parseInt(bruto.numeroConcursoProximo, 10);
  if(bruto.acumulado === true || bruto.acumulado === false) r.acumulou = bruto.acumulado;
  return r;
}

/* Prêmio que uma aposta levaria num concurso, pelo rateio publicado.
   Devolve null quando o rateio não veio — devolver 0 seria afirmar que não
   ganhou nada, e não saber é diferente de saber que é zero. */
function premioDoAcerto(resultado, acertos, modalidade){
  if(!resultado.rateio || !resultado.rateio.length) return null;
  const c = MODALIDADES[modalidade];
  const posicao = c.faixas.indexOf(acertos);
  if(posicao < 0) return 0;
  /* A faixa 1 da Caixa é a principal, e as faixas do app estão em ordem
     decrescente de acertos — a posição no vetor é o índice da faixa. */
  const f = resultado.rateio.find(x => x.faixa === posicao + 1);
  return f ? f.premio : 0;
}

/* Formato alternativo, publicado por espelhos da API da Caixa. Muda o nome de
   quase tudo, então precisa de conversão própria — e a conversão recusa o que
   não reconhece, em vez de completar com zeros. */
function normalizarEspelho(bruto, modalidade){
  const c = MODALIDADES[modalidade];
  const dezenas = (bruto.dezenas || bruto.dezenasOrdemSorteio || [])
    .map(x => parseInt(String(x), 10)).filter(Number.isFinite);
  if(dezenas.length !== c.k)
    throw new Error(`o espelho devolveu ${dezenas.length} dezenas, esperava ${c.k}`);
  const concurso = parseInt(bruto.concurso ?? bruto.numero, 10);
  if(!Number.isFinite(concurso)) throw new Error("o espelho não informou o concurso");
  const r = {concurso, data: dataBrParaIso(bruto.data || bruto.dataApuracao),
             dezenas: dezenas.sort((a,b)=>a-b), modalidade, origem:"espelho"};
  const prem = (bruto.premiacoes || []).map((f, i) => ({
    faixa: parseInt(f.faixa, 10) || (i + 1),
    descricao: String(f.descricao || f.acertos || "").trim(),
    ganhadores: parseInt(f.ganhadores || f.vencedores, 10) || 0,
    premio: Number(f.valorPremio || f.premio) || 0
  }));
  if(prem.length) r.rateio = prem;
  const locais = (bruto.localGanhadores || []).map(g => ({
    municipio: String(g.municipio || g.cidade || "").trim(),
    uf: String(g.uf || g.estado || "").trim(),
    ganhadores: parseInt(g.ganhadores, 10) || 1,
    canal: String(g.nomeFatansiaUL || "").trim()
  })).filter(g => g.municipio);
  if(locais.length) r.cidades = locais;
  if(bruto.dataProximoConcurso) r.dataProximo = dataBrParaIso(bruto.dataProximoConcurso);
  if(bruto.valorEstimadoProximoConcurso)
    r.estimativaProximo = Number(bruto.valorEstimadoProximoConcurso) || null;
  if(bruto.proximoConcurso) r.concursoProximo = parseInt(bruto.proximoConcurso, 10);
  if(typeof bruto.acumulou === "boolean") r.acumulou = bruto.acumulou;
  return r;
}

/* ---------- as fontes, em ordem de preferência ----------------------------
   Por que mais de uma: o serviço da Caixa não manda cabeçalho de CORS, então
   o NAVEGADOR bloqueia a chamada antes de ela sair — é o "Failed to fetch"
   que aparece na tela. Dentro do APK a requisição passa pela camada nativa e
   o CORS não se aplica, então lá a fonte direta funciona.

   Como o app roda nos dois lugares, ele tenta em cadeia: direto primeiro
   (melhor caminho, e o único oficial), depois espelhos e um proxy de CORS. A
   tela informa qual fonte respondeu, porque saber de onde veio o dado importa.

   NENHUMA destas foi testada por mim: a rede onde este código foi escrito
   bloqueia todos esses domínios. O que está testado é a conversão de cada
   formato, contra respostas controladas. */
/* O repositório do próprio app, servido por raw.githubusercontent.com.
   Vem PRIMEIRO, e é a mudança de arquitetura que faz a busca deixar de
   depender da sorte:

   * CORS liberado — o navegador não bloqueia, ao contrário do serviço da
     Caixa, que é a causa do "Failed to fetch";
   * CDN do GitHub — disponibilidade muito maior que a de um espelho mantido
     por voluntário, que é o que sai do ar;
   * um arquivo por modalidade, com o histórico INTEIRO — uma requisição traz
     tudo, em vez de uma por concurso.

   Quem mantém o arquivo é um GitHub Action que roda duas vezes por dia
   (.github/workflows/resultados.yml). O runner é um servidor: lá não existe
   CORS nem bloqueio de origem. Foi buscar no lugar errado — do aparelho, num
   serviço que não autoriza navegador — que quebrava tudo.

   As fontes seguintes continuam existindo como rede de segurança para o caso
   de o arquivo estar atrasado. */
const REPO_DADOS =
  "https://raw.githubusercontent.com/stringhijocimar-cyber/sorte-2/main/dados";

/* Converte o arquivo do repositório. Ele já vem no formato do app — foi
   gravado pelo mesmo conversor —, então aqui só se escolhe o concurso e se
   valida o que chegou. */
function normalizarRepositorio(bruto, modalidade, concurso){
  const c = MODALIDADES[modalidade];
  const lista = (bruto && bruto.concursos) || [];
  if(!lista.length) throw new Error("o arquivo do repositório está vazio");
  const achado = concurso
    ? lista.find(x => x.concurso === concurso)
    : lista[lista.length - 1];
  if(!achado) throw new Error(`concurso ${concurso} ainda não está no arquivo`);
  if(!Array.isArray(achado.dezenas) || achado.dezenas.length !== c.k)
    throw new Error(`o arquivo trouxe ${(achado.dezenas||[]).length} dezenas, esperava ${c.k}`);
  return Object.assign({}, achado, {modalidade, origem:"repositorio"});
}

/* Baixa o histórico inteiro de uma vez. É o que torna desnecessário pedir
   concurso a concurso — e o que faz o app ter estatística de verdade logo na
   primeira abertura, em vez de depois de alguém colar planilha. */
async function baixarHistoricoDoRepositorio(modalidade){
  const resp = await fetch(`${REPO_DADOS}/${modalidade}.json`,
    {cache:"no-cache", headers:{Accept:"application/json"}});
  if(!resp.ok) throw new Error(`o repositório respondeu ${resp.status}`);
  const bruto = await resp.json();
  const c = MODALIDADES[modalidade];
  const lista = (bruto && bruto.concursos) || [];
  const validos = lista.filter(x =>
    Array.isArray(x.dezenas) && x.dezenas.length === c.k &&
    Number.isFinite(x.concurso));
  if(!validos.length) throw new Error("nenhum concurso válido no arquivo");
  return validos.map(x => Object.assign({}, x, {modalidade, origem:"repositorio"}));
}

const FONTES = [
  {
    id: "repositorio",
    nome: "repositório do app",
    url: (slug, concurso, modalidade) => `${REPO_DADOS}/${modalidade}.json`,
    converter: (json, modalidade, concurso) =>
      normalizarRepositorio(json, modalidade, concurso)
  },
  {
    id: "caixa",
    nome: "Caixa (oficial)",
    url: (slug, concurso) =>
      `https://servicebus2.caixa.gov.br/portaldeloterias/api/${slug}` +
      (concurso ? `/${concurso}` : ""),
    converter: normalizarCaixa
  },
  {
    id: "espelho-guidi",
    nome: "espelho loteriascaixa",
    url: (slug, concurso) =>
      `https://loteriascaixa-api.herokuapp.com/api/${slug}/` + (concurso || "latest"),
    converter: normalizarEspelho
  },
  {
    id: "proxy",
    nome: "Caixa via proxy de CORS",
    /* Último recurso: um proxy público reenvia a resposta da Caixa com o
       cabeçalho que falta. O dado continua sendo o oficial; o que muda é
       quem o entrega. Fica por último porque depende de um terceiro que pode
       sair do ar ou ficar lento. */
    url: (slug, concurso) => "https://api.allorigins.win/raw?url=" +
      encodeURIComponent(`https://servicebus2.caixa.gov.br/portaldeloterias/api/${slug}` +
        (concurso ? `/${concurso}` : "")),
    converter: normalizarCaixa
  }
];

//: Fonte que respondeu por último. Tentar a que já funcionou antes economiza
//: duas requisições falhas em cada busca seguinte.
let FONTE_PREFERIDA = null;

async function buscarNaCaixa(modalidade, concurso){
  const slug = SLUG_CAIXA[modalidade];
  if(!slug) throw new Error("modalidade sem serviço público conhecido");

  const ordem = FONTE_PREFERIDA
    ? [FONTES.find(f => f.id === FONTE_PREFERIDA), ...FONTES.filter(f => f.id !== FONTE_PREFERIDA)]
        .filter(Boolean)
    : FONTES;

  const falhas = [];
  for(const fonte of ordem){
    try{
      const resp = await fetch(fonte.url(slug, concurso, modalidade),
        {cache:"no-cache", headers:{Accept:"application/json"}});
      if(!resp.ok) throw new Error(`respondeu ${resp.status}`);
      const r = fonte.converter(await resp.json(), modalidade, concurso);
      r.fonte = fonte.id;
      FONTE_PREFERIDA = fonte.id;
      return r;
    }catch(e){
      falhas.push(`${fonte.nome}: ${e.message}`);
    }
  }
  /* Erro que nomeia cada tentativa. "Failed to fetch" sozinho não diz se o
     problema é falta de sinal, serviço fora ou bloqueio do navegador. */
  const err = new Error(falhas.join(" · "));
  err.todasFalharam = true;
  throw err;
}

/* Colagem: aceita JSON (array de objetos) ou linhas soltas
   "concurso; data; dezenas". O formato de linha existe porque é o que sai de
   uma planilha, e planilha é o que as pessoas realmente têm. */
function lerColagem(texto, modalidade){
  const t = (texto||"").trim();
  if(!t) throw new Error("nada para importar");
  const c = MODALIDADES[modalidade];
  const saida = [];
  if(t.startsWith("[") || t.startsWith("{")){
    const bruto = JSON.parse(t);
    (Array.isArray(bruto) ? bruto : [bruto]).forEach(o =>
      saida.push(normalizarCaixa(o, modalidade)));
    return saida;
  }
  t.split(/\r?\n/).forEach((linha, i) => {
    const limpa = linha.trim();
    if(!limpa || /concurso/i.test(limpa)) return;      // cabeçalho de planilha
    const campos = limpa.split(/[;\t]|,(?=\s*\d{2}\/)/).map(x=>x.trim());
    const numeros = limpa.match(/\d+/g) || [];
    if(numeros.length < c.k + 1)
      throw new Error(`linha ${i+1}: esperava concurso, data e ${c.k} dezenas`);
    const concurso = parseInt(campos[0] ?? numeros[0], 10);
    const dataBruta = (campos[1] || "").match(/\d{2}\/\d{2}\/\d{4}|\d{4}-\d{2}-\d{2}/);
    const dezenas = limpa.slice(String(campos[0]).length + (campos[1]||"").length + 2)
      .match(/\d+/g);
    const dez = (dezenas || []).map(Number).filter(d => d >= c.base && d <= c.N + c.base - 1);
    if(dez.length < c.k) throw new Error(`linha ${i+1}: só reconheci ${dez.length} dezenas válidas`);
    saida.push({concurso, data: dataBruta ? dataBrParaIso(dataBruta[0]) : hoje(),
                dezenas: dez.slice(0, c.k).sort((a,b)=>a-b), modalidade, origem:"colado"});
  });
  if(!saida.length) throw new Error("nenhuma linha reconhecida");
  return saida;
}

/* Insere sem duplicar: a chave é (modalidade, concurso), e um concurso já
   conhecido é substituído, não repetido. */
function guardarResultados(novos){
  let inseridos = 0;
  novos.forEach(r => {
    const i = S.resultados.findIndex(x =>
      x.modalidade === r.modalidade && x.concurso === r.concurso);
    if(i >= 0) S.resultados[i] = r; else { S.resultados.push(r); inseridos++; }
  });
  S.resultados.sort((a,b)=> a.modalidade === b.modalidade
    ? a.concurso - b.concurso : a.modalidade.localeCompare(b.modalidade));
  Guardar.gravar("resultados", S.resultados);
  return inseridos;
}

/* ==================== aprendizado por modalidade ====================
   Um modelo POR MODALIDADE, treinado e avaliado separadamente. Juntar
   modalidades num modelo só seria mais fácil e estaria errado: o universo, a
   quantidade sorteada e a frequência de sorteios são diferentes, e o modelo
   aprenderia a distinguir modalidade em vez de qualquer coisa sobre dezenas.

   A pergunta que isto responde é honesta: **existe sinal aprendível no
   histórico desta modalidade?** A resposta esperada é não, porque sorteios
   honestos são independentes. O valor do módulo é medir isso em vez de afirmar,
   e mostrar o número.

   O que impede a auto-ilusão:

   * Treino e teste são separados no TEMPO. O modelo é treinado nos concursos
     antigos e medido nos recentes, que ele nunca viu.
   * As características de um concurso são calculadas só com os concursos
     ANTERIORES a ele. Usar o próprio concurso vazaria o alvo e produziria um
     AUC alto e falso.
   * A medida é AUC, não acerto. Com 15 de 25 dezenas sorteadas, um modelo que
     responde "sai" para tudo acerta 60% e não aprendeu nada.
   * Teste de permutação: embaralha os rótulos do teste e recalcula o AUC
     centenas de vezes. Se o AUC real cai dentro dessa nuvem, não há sinal.   */

const JANELA_CURTA = 10, JANELA_LONGA = 50;
const MINIMO_CONCURSOS = 60;

/* Características de uma dezena no instante do concurso `i`, usando apenas os
   concursos [0, i). Nomes e ordem ficam aqui para o relatório poder nomear os
   pesos — um modelo cujos pesos não se pode ler é um modelo em que não se
   pode confiar. */
const NOMES_ATRIBUTOS = ["freq curta", "freq longa", "atraso", "saiu no anterior",
                         "posição no volante"];

function atributosDezena(d, anteriores, c){
  const n = anteriores.length;
  const curta = anteriores.slice(-JANELA_CURTA);
  const longa = anteriores.slice(-JANELA_LONGA);
  const conta = lista => lista.reduce((a,r)=> a + (r.dezenas.includes(d)?1:0), 0);
  /* Atraso: quantos concursos desde a última aparição, normalizado pelo
     intervalo médio esperado (N/k). Sem aparição nenhuma no recorte, o valor
     satura em 1 — e não em infinito, que estouraria o gradiente. */
  let atraso = longa.length;
  for(let j = anteriores.length - 1; j >= 0; j--){
    if(anteriores[j].dezenas.includes(d)){ atraso = anteriores.length - 1 - j; break; }
  }
  const intervaloEsperado = c.N / c.k;
  return [
    curta.length ? conta(curta) / curta.length : 0,
    longa.length ? conta(longa) / longa.length : 0,
    Math.min(1, atraso / (intervaloEsperado * 3)),
    n && anteriores[n-1].dezenas.includes(d) ? 1 : 0,
    (d - c.base) / Math.max(1, c.N - 1)
  ];
}

/* Monta a matriz de treino/teste a partir do histórico de UMA modalidade. */
function dadosAprendizado(modalidade){
  const c = MODALIDADES[modalidade];
  const hist = S.resultados.filter(r => r.modalidade === modalidade)
    .slice().sort((a,b)=> a.concurso - b.concurso);
  if(hist.length < MINIMO_CONCURSOS)
    return {erro:`faltam ${MINIMO_CONCURSOS - hist.length} concursos`,
            tem:hist.length, precisa:MINIMO_CONCURSOS};

  const X = [], y = [], concursoDe = [];
  for(let i = JANELA_LONGA; i < hist.length; i++){
    const anteriores = hist.slice(0, i);
    const sorteadas = new Set(hist[i].dezenas);
    for(let d = c.base; d <= c.N + c.base - 1; d++){
      X.push(atributosDezena(d, anteriores, c));
      y.push(sorteadas.has(d) ? 1 : 0);
      concursoDe.push(i);
    }
  }
  /* Corte temporal: 70% dos CONCURSOS para treino. O corte é por concurso, e
     não por linha, porque as linhas de um mesmo concurso são dependentes entre
     si — dividir no meio de um concurso deixaria o modelo ver parte do alvo. */
  const primeiro = concursoDe[0], ultimo = concursoDe[concursoDe.length-1];
  const corte = primeiro + Math.floor((ultimo - primeiro + 1) * 0.7);
  const treino = [], teste = [];
  concursoDe.forEach((ci, k) => (ci < corte ? treino : teste).push(k));
  return {X, y, treino, teste, hist, concursoDe, nConcursos:hist.length,
          concursosTreino:corte - primeiro, concursosTeste:ultimo - corte + 1};
}

const sigmoide = z => 1 / (1 + Math.exp(-Math.max(-30, Math.min(30, z))));

/* P(Z > z) para a normal padrão, pela aproximação de Abramowitz e Stegun 7.1.26
   (erro < 1,5e-7). Existe porque o teste de permutação tem piso de resolução:
   com 200 permutações não se mede p abaixo de 0,005, e uma busca com centenas
   de hipóteses precisa julgar em 1e-4. */
function caudaNormal(z){
  if(!Number.isFinite(z)) return 0;
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804014327 * Math.exp(-z * z / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
            t * (-1.821255978 + t * 1.330274429))));
  return z >= 0 ? p : 1 - p;
}

/* Regressão logística por gradiente descendente, com regularização L2. Sem
   biblioteca: são vinte linhas, e uma dependência externa aqui significaria o
   app não abrir offline. */
function treinarLogistica(X, y, indices, opcoes){
  const o = Object.assign({epocas:220, taxa:0.6, l2:1e-3}, opcoes||{});
  const p = X[0].length;
  const w = new Array(p).fill(0);
  let b = 0;
  const n = indices.length;
  for(let e = 0; e < o.epocas; e++){
    const gw = new Array(p).fill(0);
    let gb = 0;
    for(const i of indices){
      const xi = X[i];
      let z = b;
      for(let j = 0; j < p; j++) z += w[j] * xi[j];
      const erro = sigmoide(z) - y[i];
      for(let j = 0; j < p; j++) gw[j] += erro * xi[j];
      gb += erro;
    }
    for(let j = 0; j < p; j++) w[j] -= o.taxa * (gw[j]/n + o.l2 * w[j]);
    b -= o.taxa * (gb/n);
  }
  return {w, b, prever(xi){
    let z = this.b;
    for(let j = 0; j < this.w.length; j++) z += this.w[j] * xi[j];
    return sigmoide(z);
  }};
}

/* AUC pela estatística de Mann-Whitney, com empates valendo meio. É a medida
   certa aqui: não depende do ponto de corte nem da proporção de positivos. */
function auc(escores, rotulos){
  const pares = escores.map((s,i)=>[s, rotulos[i]]).sort((a,b)=> a[0]-b[0]);
  let i = 0, somaPostos = 0, positivos = 0;
  while(i < pares.length){
    let j = i;
    while(j+1 < pares.length && pares[j+1][0] === pares[i][0]) j++;
    const posto = (i + j + 2) / 2;                      // postos de 1 a n
    for(let k = i; k <= j; k++) if(pares[k][1] === 1){ somaPostos += posto; positivos++; }
    i = j + 1;
  }
  const negativos = pares.length - positivos;
  if(!positivos || !negativos) return 0.5;
  return (somaPostos - positivos*(positivos+1)/2) / (positivos * negativos);
}

function logLoss(escores, rotulos){
  let s = 0;
  for(let i = 0; i < escores.length; i++){
    const p = Math.min(1-1e-12, Math.max(1e-12, escores[i]));
    s += rotulos[i] ? -Math.log(p) : -Math.log(1-p);
  }
  return s / escores.length;
}

/* Nuvem do acaso: embaralha os rótulos do teste e recalcula o AUC. Não
   retreina o modelo — o que testaria é a associação entre os escores que o
   modelo produziu e os rótulos, que é exatamente a hipótese em questão.
   Retreinar a cada permutação seria mais forte e levaria minutos no aparelho;
   a limitação está declarada na tela.

   O embaralhamento acontece DENTRO de cada concurso, e isso não é detalhe.
   As linhas de um mesmo concurso não são independentes: exatamente k dezenas
   saem, sempre. Embaralhar livremente entre concursos gera sorteios impossíveis
   — um com 3 dezenas, outro com 22 — e a nuvem resultante fica estreita demais.
   Nuvem estreita significa faixa do acaso estreita, e faixa estreita significa
   acusar sinal onde não existe.

   Foi exatamente assim que a primeira versão se comportou: com sorteios
   puramente aleatórios, ela marcou "revisar". Permutando dentro do concurso,
   cada sorteio permutado continua sendo um sorteio possível daquela modalidade,
   e a nuvem passa a descrever o acaso de verdade. */
function permutarAuc(escores, rotulos, repeticoes, rnd=Math.random, grupos){
  const nulos = [];
  const copia = rotulos.slice();
  /* Índices agrupados por concurso. Sem grupos informados, o conjunto inteiro
     vira um bloco só — o comportamento antigo, mantido para quem chama a função
     com dados que não têm estrutura de concurso. */
  const blocos = [];
  if(grupos){
    const porGrupo = new Map();
    grupos.forEach((g, i) => {
      if(!porGrupo.has(g)) porGrupo.set(g, []);
      porGrupo.get(g).push(i);
    });
    porGrupo.forEach(v => blocos.push(v));
  } else {
