<script>
"use strict";

/* ============================ dados base ============================ */
/* Regras vigentes das modalidades. Confirme na fonte oficial antes de
   qualquer uso sério — regras e preços mudam, e é por isso que ficam aqui,
   em um só lugar, e não espalhadas pelo código. */
const MODALIDADES = {
  "mega-sena":  {nome:"Mega-Sena",   N:60,  k:6,  min:6,  max:20, base:1, preco:5.00,
                 faixas:[6,5,4]},
  "lotofacil":  {nome:"Lotofácil",   N:25,  k:15, min:15, max:20, base:1, preco:3.50,
                 faixas:[15,14,13,12,11]},
  "quina":      {nome:"Quina",       N:80,  k:5,  min:5,  max:15, base:1, preco:3.00,
                 faixas:[5,4,3,2]},
  "lotomania":  {nome:"Lotomania",   N:100, k:20, min:50, max:50, base:0, preco:3.00,
                 faixas:[20,19,18,17,16,15,0]},
  "dupla-sena": {nome:"Dupla Sena",  N:50,  k:6,  min:6,  max:15, base:1, preco:2.50,
                 faixas:[6,5,4,3]},
  "dia-de-sorte":{nome:"Dia de Sorte",N:31, k:7,  min:7,  max:15, base:1, preco:2.50,
                 faixas:[7,6,5,4]},
  "timemania":  {nome:"Timemania",   N:80,  k:7,  min:10, max:10, base:1, preco:3.50,
                 faixas:[7,6,5,4,3]},
  "mais-milionaria":{nome:"+Milionária",N:50,k:6, min:6,  max:12, base:1, preco:6.00,
                 faixas:[6,5,4,3,2], trevos:{N:6,k:2,min:2,max:6}}
};

const METODOS = [
  {id:"uniforme", nome:"Sorteio uniforme",
   desc:"Cada combinação com a mesma chance. É a referência — e é tão boa quanto qualquer outra."},
  /* "Otimizado para rateio" foi retirado a pedido do dono do app, e a medida
     dá razão a ele: o método pesava padrões humanos com números SUPOSTOS, não
     medidos. A calibração existe (`calibrarPopularidade`) e precisa de 30
     concursos com ganhadores publicados por modalidade; o histórico deste app
     tem 26 no total, somando as oito. Ela nunca rodou uma vez sequer. Um
     método que se apresenta como "otimizado" apoiado em peso que ninguém
     conferiu é exatamente o tipo de promessa que este app existe para não
     fazer. A função `gerarRateio` continua no arquivo porque outras partes a
     usam como reserva, mas deixou de ser oferecida como estratégia. */
  {id:"cobertura", nome:"Cobertura espalhada",
   desc:"Distribui os jogos pelo volante para que se repitam pouco entre si. Não muda a chance de cada jogo."},
  {id:"antirepeticao", nome:"Evita o concurso anterior",
   desc:"Muita gente repete as dezenas que acabaram de sair. Evitá-las não muda sua chance — muda com quantas pessoas você dividiria."},
  /* "Contraste por restrição" saiu junto com o rateio, e pelo mesmo motivo: era
     o mesmo mecanismo — fugir do que o público marca — trocando peso suave por
     restrição dura, apoiado nos mesmos pesos que nunca foram conferidos com
     ganhadores reais. Manter um e tirar o outro seria devolver pela porta dos
     fundos o que saiu pela frente. */
  {id:"fechamento", nome:"Fechamento com garantia verificada",
   desc:"A partir das dezenas que você marcar, monta jogos com piso de acertos comprovado por enumeração. Disponível na Lotofácil."}
];

/* Nome de exibição de um método, inclusive de métodos que não existem mais.

   Jogos ficam salvos no aparelho com o id do método que os montou. Quando
   "Otimizado para rateio" saiu da lista, todo jogo salvo por ele continuou lá —
   e um `METODOS.find(...).nome` devolveria `undefined.nome` e derrubaria a
   tela de quem tinha esses jogos. Retirar uma opção não pode apagar o passado
   de quem já usou o app. */
const METODOS_APOSENTADOS = {
  rateio: "Otimizado para rateio (retirado)",
  contraste: "Contraste por restrição",
  sugestao: "Sugestão do sistema",
};
function nomeDoMetodo(id){
  const m = METODOS.find(x => x.id === id);
  if(m) return m.nome;
  return METODOS_APOSENTADOS[id] || String(id || "método desconhecido");
}

/* ============================ estado ============================ */
const S = {
  tela:"inicio", modalidade:"lotofacil", metodo:"uniforme", quantidade:3,
  tamanho:null, dezenasFechamento:[], jFechamento:14, garantia:13,
  /* O escuro é o padrão: o azul-marinho com teal é a identidade do app, e
     quem prefere claro troca no cabeçalho — a escolha continua guardada. */
  jogos:[], resultados:[], tema:"escuro", ultimoLote:[],
  bancadaRep:20, bancadaQtd:3, bancadaAlvos:10,
  /* marcadas: dezenas do volante manual, por modalidade, para trocar de
     modalidade e voltar não apagar o que a pessoa já tinha marcado. */
  marcadas:{}, avisos:[], teimosinhas:[], aprendizado:{}, jogoAberto:null,
  autoAnalise:true, tipoEstatistica:"dezenas", ordemEstatistica:"vezes",
  calibracao:{}, buscaAutomatica:true, ultimaBusca:{}, avisarSorteio:true,
  /* Memória do motor de pesquisa, uma entrada por modalidade: população,
     geração, campeão e conclusão. Fica separado de `aprendizado` de propósito
     — são dois inquilinos com ciclos de vida diferentes, e misturá-los faria
     limpar um apagar o outro. */
  pesquisaAdaptativa:{}, pesquisaAutomatica:true, abaPesquisa:"geral",
  /* Pilha de navegação (de onde se veio) e filtro da central de atividades.
     Nenhum dos dois é gravado: são estado da visita, não preferência. */
  pilha:[], filtroAvisos:"todas", serieEvolucao:"auc"
};

/* Persistência tolerante: se o navegador bloquear, o app segue funcionando
   na sessão em vez de quebrar. */
const Guardar = {
  ler(chave, padrao){
    try{ const v = localStorage.getItem("lotolab:"+chave);
      return v ? JSON.parse(v) : padrao; }catch(e){ return padrao; }
  },
  gravar(chave, valor){
    try{ localStorage.setItem("lotolab:"+chave, JSON.stringify(valor)); return true; }
    catch(e){ return false; }
  }
};

/* ============================ utilidades ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = (v,d=2) => Number(v).toLocaleString("pt-BR",
  {minimumFractionDigits:d, maximumFractionDigits:d});
const inf = v => Number(v).toLocaleString("pt-BR");
const brl = v => Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");
const hoje = () => new Date().toISOString().slice(0,10);

function combinacoes(n,k){
  if(k<0||k>n) return 0;
  let r = 1;
  for(let i=1;i<=k;i++) r = r*(n-k+i)/i;
  return Math.round(r);
}
const UNIVERSOS = {};
function universo(m){
  const c = MODALIDADES[m];
  if(!UNIVERSOS[m]) UNIVERSOS[m] = Array.from({length:c.N}, (_,i)=> i + c.base);
  /* Cópia, sempre: quem chama pode ordenar, filtrar ou remover dezenas, e um
     universo compartilhado silenciosamente corrompido é um defeito que só
     aparece três telas depois. */
  return UNIVERSOS[m].slice();
}
function embaralhar(a, rnd=Math.random){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    /* Troca sem `[x[i],x[j]]=[x[j],x[i]]`: a forma bonita aloca um array por
       troca, e isto roda dezenas de milhares de vezes por rodada da bancada. */
    const t = x[i]; x[i] = x[j]; x[j] = t;
  }
  return x;
}

/* Rascunho reaproveitado entre chamadas de sortear(). Seguro porque sortear()
   é síncrona e não chama nada que possa reentrar nela. */
const _urna = [];
function sortear(m, quantos){
  const c = MODALIDADES[m], N = c.N;
  const k = Math.min(quantos, N);
  _urna.length = N;
  for(let i=0;i<N;i++) _urna[i] = i + c.base;
  /* Fisher–Yates PARCIAL: só as `k` primeiras posições precisam ficar prontas.
     Embaralhar as 60 dezenas da Mega inteiras para ficar com 6 desperdiça 54
     trocas, e a bancada sorteia dezenas de milhares de jogos por rodada.

     O subconjunto continua uniforme: a cada passo i, a posição i recebe um
     elemento escolhido com probabilidade igual entre os que ainda não saíram —
     que é exatamente a definição do embaralhamento completo, interrompida
     quando as dezenas necessárias já foram tiradas. */
  const saida = new Array(k);
  for(let i=0;i<k;i++){
    const j = i + Math.floor(Math.random()*(N-i));
    const t = _urna[i]; _urna[i] = _urna[j]; _urna[j] = t;
    saida[i] = _urna[i];
  }
  return saida.sort((a,b)=>a-b);
}
function tamanhoPadrao(m){ return S.tamanho || MODALIDADES[m].min; }

/* ============================ modelo de rateio ============================
   Porta do módulo `premio/impopularidade.py`. Pontua o quanto uma combinação
   PARECE escolhida por gente. Combinação que parece escolhida por gente é
   marcada por mais gente — e divide o prêmio com mais gente.
   Isto NÃO altera a chance de a combinação ser sorteada.               */
const PESOS = {
  ate31:1.20, ate12:0.45, consecutivos:0.55, somaCentral:0.40,
  espacamentoRegular:0.50, mesmaLinha:0.60, mesmaColuna:0.60,
  terminacoesIguais:0.35, contem7:0.15,
  /* Peso baixo, e deliberadamente. Fibonacci é padrão que gente que programa
     acha bonito, não hábito comum de apostador — ao contrário de data de
     nascimento, que domina o volante. Dar peso alto aqui seria fingir uma
     popularidade que não medi. Se a calibração do pesos.json vier dos
     ganhadores reais, ela substitui esta suposição por dado. */
  fibonacci:0.12
};
/* Fibonacci dentro do universo da modalidade. O 1 entra uma vez só — a
   sequência tem 1,1,2,3,5… e repetir a dezena 1 não faz sentido num volante. */
function fibonacciAte(n){
  const saida = new Set();
  let a = 1, b = 2;
  while(a <= n){ saida.add(a); const t = b; b = a + b; a = t; }
  return saida;
}

const GRADE = {"mega-sena":10, "lotofacil":5, "quina":10, "lotomania":10,
               "dupla-sena":10, "dia-de-sorte":7, "timemania":10, "mais-milionaria":10};

/* O que só depende da modalidade fica calculado uma vez. O conjunto de
   Fibonacci, a fração esperada dele no universo e o número de linhas do volante
   não mudam entre um jogo e outro — e caracteristicas() é chamada dezenas de
   milhares de vezes por rodada da bancada, onde reconstruir isso a cada jogo
   custa tempo de tela parada. */
const CONSTANTES_MOD = {};
function constantesDaModalidade(m){
  if(CONSTANTES_MOD[m]) return CONSTANTES_MOD[m];
  const c = MODALIDADES[m], cols = GRADE[m] || 10;
  const fib = fibonacciAte(c.N + c.base - 1);
  let noUniverso = 0;
  fib.forEach(d => { if(d >= c.base) noUniverso++; });
  return (CONSTANTES_MOD[m] = {
    c, cols, fib,
    fracaoFibonacci: noUniverso / c.N,
    /* +1 de folga: a última linha do volante pode ficar incompleta. */
    qtdLinhas: Math.ceil(c.N / cols) + 1,
  });
}

/* Rascunhos reaproveitados entre chamadas. São seguros porque esta função é
   síncrona e não chama nada que possa reentrar nela — o contador é zerado no
   início de cada uso. Sem isso, três arrays nascem e morrem a cada jogo
   avaliado, e a bancada avalia dezenas de milhares deles. */
const _linhas = new Int32Array(64), _colunas = new Int32Array(16), _finais = new Int32Array(10);

function caracteristicas(dez, m){
  const K = constantesDaModalidade(m), c = K.c, cols = K.cols, n = dez.length;
  const ord = dez.slice().sort((a,b)=>a-b);

  _linhas.fill(0, 0, K.qtdLinhas); _colunas.fill(0, 0, cols); _finais.fill(0);
  /* Máximos começam em -Infinity, e não em 0, para que um jogo vazio devolva o
     mesmo que a versão anterior devolvia — o valor nunca aparece na tela, mas
     mudar em silêncio é como um "só arrumei o desempenho" vira um defeito. */
  let maxLinha = -Infinity, maxColuna = -Infinity, maxFinal = -Infinity;
  let consec = 0, soma = 0, ate31 = 0, ate12 = 0, temSete = 0, emFib = 0;
  let somaDifs = 0;

  for(let i=0;i<n;i++){
    const d = ord[i], p = d - c.base;
    const li = (p / cols) | 0, co = p % cols, fi = d % 10;
    if(++_linhas[li] > maxLinha) maxLinha = _linhas[li];
    if(++_colunas[co] > maxColuna) maxColuna = _colunas[co];
    if(++_finais[fi] > maxFinal) maxFinal = _finais[fi];
    soma += d;
    if(d <= 31) ate31++;
    if(d <= 12) ate12++;
    if(d === 7) temSete = 1;
    if(K.fib.has(d)) emFib++;
    if(i > 0){
      const dif = d - ord[i-1];
      if(dif === 1) consec++;
      somaDifs += dif;
    }
  }

  const qtdDifs = n - 1;
  const media = somaDifs / (qtdDifs || 1);
  /* Segunda passada em vez da forma E[x²]−E[x]². A forma de uma passada só
     custaria menos, mas devolve valores que diferem no 13º dígito, e uma
     mudança de desempenho que altera números na tela deixa de ser só
     desempenho. Aqui não há array intermediário, que era o custo real. */
  let somaQuad = 0;
  for(let i=1;i<n;i++){ const e = (ord[i]-ord[i-1]) - media; somaQuad += e*e; }
  const desvio = Math.sqrt(somaQuad / (qtdDifs || 1));
  const somaMedia = n*(c.N + 2*c.base - 1)/2;
  const somaDP = Math.sqrt(n*(c.N+1)*(c.N-n)/12) || 1;
  const esperadoFib = K.fracaoFibonacci;

  return {
    ate31: ate31/n,
    ate12: ate12/n,
    consecutivos: consec/Math.max(n-1,1),
    somaCentral: Math.exp(-0.5*((soma-somaMedia)/somaDP)**2),
    espacamentoRegular: Math.max(0, Math.min(1, 1 - desvio/(media||1))),
    mesmaLinha: maxLinha/n,
    mesmaColuna: maxColuna/n,
    terminacoesIguais: maxFinal/n,
    contem7: temSete,
    /* Fração das dezenas que caem na sequência de Fibonacci, dividida pela
       fração que se esperaria por acaso. 1,0 = exatamente o esperado; acima
       disso, o jogo tem mais Fibonacci do que o acaso costuma dar.

       É normalizado porque a contagem crua não é comparável entre
       modalidades: na Lotofácil 8 dos 25 números são Fibonacci (32%) e na
       Quina são 10 de 80 (12,5%). Sem dividir pelo esperado, todo jogo de
       Lotofácil pareceria "cheio de Fibonacci". */
    fibonacci: esperadoFib > 0 ? Math.min(3, (emFib/n) / esperadoFib) : 0
  };
}

/* Pesos calibrados, se houver. Gerados por
   `python manage.py calibrar --modalidade X --preco Y --exportar app/pesos.json`
   a partir dos ganhadores publicados pela Caixa. Sem o arquivo, valem as
   hipóteses declaradas acima — e o app diz qual dos dois está em uso. */
let CALIBRACAO = null;
function pesosVigentes(){
  /* Ordem de preferência: calibração medida no próprio aparelho, com os
     ganhadores reais desta modalidade; depois o pesos.json externo; por último
     as suposições declaradas em PESOS. Medido ganha de suposto. */
  const local = S.calibracao && S.calibracao[S.modalidade];
  if(local && !local.erro && local.util) return local.pesos;
  return (CALIBRACAO && CALIBRACAO.pesos_app) ? CALIBRACAO.pesos_app : PESOS;
}

let REFERENCIA = {};
function referencia(m){
  if(REFERENCIA[m]) return REFERENCIA[m];
  const n = tamanhoPadrao(m), soma = {}, amostras = 900;
  for(let i=0;i<amostras;i++){
    const c = caracteristicas(sortear(m,n), m);
    for(const k in c) soma[k] = (soma[k]||0) + c[k];
  }
  for(const k in soma) soma[k] /= amostras;
  REFERENCIA[m] = soma;
  return soma;
}

function escorePopularidade(dez, m){
  const c = caracteristicas(dez, m), ref = referencia(m), pesos = pesosVigentes();
  let e = 0;
  for(const k in pesos) e += pesos[k] * ((c[k]||0) - (ref[k]||0));
  return e;
}

function observacoes(dez, m){
  const c = caracteristicas(dez, m), ref = referencia(m), obs = [];
  if(c.ate31 > ref.ate31 + 0.15) obs.push("concentrada em 1–31, faixa das datas de nascimento");
  if(c.consecutivos > 0.30) obs.push("contém sequência consecutiva");
  if(Math.max(c.mesmaLinha,c.mesmaColuna) > 0.55) obs.push("forma desenho no volante");
  if(c.espacamentoRegular > 0.82) obs.push("espaçamento quase constante");
  if(c.somaCentral > 0.92) obs.push("soma exatamente na média");
  if(c.fibonacci > 1.6) obs.push(
    `concentra Fibonacci (${nf(c.fibonacci,1)}× o esperado do acaso)`);
  if(!obs.length) obs.push("sem padrão humano evidente");
  return obs;
}

/* ============================ geradores ============================ */
function gerarUniforme(m, quantos, tam){
  return Array.from({length:quantos}, ()=> sortear(m, tam));
}

function gerarRateio(m, quantos, tam){
  /* Sorteia candidatas UNIFORMEMENTE e fica com as de menor popularidade.
     Nenhuma dezena é privilegiada em momento nenhum: o filtro age sobre o
     rateio esperado, nunca sobre a chance de acerto. */
  const candidatas = Math.min(1400, 220*quantos);
  const lista = [];
  for(let i=0;i<candidatas;i++){
    const j = sortear(m, tam);
    lista.push({j, e: escorePopularidade(j, m)});
  }
  lista.sort((a,b)=> a.e - b.e);
  const saida = [], vistos = new Set();
  for(const c of lista){
    const chave = c.j.join("-");
    if(vistos.has(chave)) continue;
    vistos.add(chave); saida.push(c.j);
    if(saida.length === quantos) break;
  }
  return saida;
}

function gerarCobertura(m, quantos, tam){
  /* Maximiza a distância entre os jogos do lote: escolhe, entre candidatas
     uniformes, a que menos repete dezenas já usadas. Reduz sobreposição entre
     os seus jogos; não altera a chance de nenhum deles. */
  const saida = [];
  for(let q=0;q<quantos;q++){
    let melhor = null, melhorCusto = Infinity;
    for(let i=0;i<260;i++){
      const cand = sortear(m, tam);
      let custo = 0;
      for(const j of saida) custo += cand.filter(d=> j.includes(d)).length ** 2;
      custo += escorePopularidade(cand, m) * 0.5;
      if(custo < melhorCusto){ melhorCusto = custo; melhor = cand; }
    }
    saida.push(melhor);
  }
  return saida;
}

function ultimoResultado(m){
  for(let i=S.resultados.length-1;i>=0;i--)
    if(S.resultados[i].modalidade === m) return S.resultados[i];
  return null;
}

function gerarAntirepeticao(m, quantos, tam, dezenasEvitadas){
  /* Repetir as dezenas do concurso que acabou de sair é um hábito comum de
     quem aposta. Evitá-las não mexe na chance de acerto — a urna não tem
     memória, e o sorteio de amanhã pode repetir cinco dezenas de hoje.

     Este método faz UMA coisa, e é a que o nome diz: entre candidatas
     sorteadas uniformemente, fica com as que menos repetem o último resultado.
     Ele já misturava a isso o escore de popularidade — o modelo que saiu do
     app junto com o "otimizado para rateio" —, e o resultado era um método que
     prometia uma coisa e fazia duas, uma delas apoiada em pesos que ninguém
     nunca conferiu. Agora o desempate entre candidatas com o mesmo número de
     repetidas é a ordem em que foram sorteadas, ou seja, o acaso.

     `dezenasEvitadas` existe para a bancada poder informar QUAL concurso é o
     anterior ao que está sendo conferido. Sem esse parâmetro a bancada usaria
     o último concurso registrado e acabaria testando o método contra o próprio
     sorteio que ele foi mandado evitar — o que produziria um déficit de
     acertos garantido, e falso. */
  const base = dezenasEvitadas || (ultimoResultado(m) || {}).dezenas;
  /* Sem concurso anterior não há o que evitar, e a reserva é o sorteio
     uniforme. Já foi o rateio; deixou de ser quando o rateio saiu das
     estratégias oferecidas — cair num método retirado seria oferecê-lo pela
     porta dos fundos. */
  if(!base) return gerarUniforme(m, quantos, tam);
  const evitar = new Set(base);
  const candidatas = Math.min(1400, 220*quantos);
  const lista = [];
  for(let i=0;i<candidatas;i++){
    const j = sortear(m, tam);
    lista.push({j, e: j.filter(d=>evitar.has(d)).length});
  }
  /* `sort` é estável em JavaScript desde o ES2019: candidatas com o mesmo
     número de repetidas mantêm a ordem em que saíram da urna, que é aleatória.
     É de propósito — não há critério honesto para preferir uma à outra. */
  lista.sort((a,b)=> a.e - b.e);
  const saida = [], vistos = new Set();
  for(const c of lista){
    const chave = c.j.join("-");
    if(vistos.has(chave)) continue;
    vistos.add(chave); saida.push(c.j);
    if(saida.length === quantos) break;
  }
  return saida;
}

function gerarContraste(m, quantos, tam){
  /* Restrição dura em vez de peso suave: a candidata só passa se ficar abaixo
     da referência em TODOS os eixos de padrão humano. Os limites são relativos
     à referência da própria modalidade, então nunca ficam impossíveis — na
     Lotofácil, onde 15 de 25 forçam consecutivos, o limite acompanha.
     Se ainda assim faltar jogo, completa pelo rateio em vez de travar. */
  const ref = referencia(m);
  const tetoDesenho = Math.max(ref.mesmaLinha, ref.mesmaColuna);
  const aceita = dez => {
    const c = caracteristicas(dez, m);
    return c.ate31 <= ref.ate31
        && c.consecutivos <= ref.consecutivos
        && c.somaCentral <= ref.somaCentral
        && Math.max(c.mesmaLinha, c.mesmaColuna) <= tetoDesenho;
  };
  const saida = [], vistos = new Set();
  for(let t=0; t<6000 && saida.length<quantos; t++){
    const j = sortear(m, tam);
    if(!aceita(j)) continue;
    const chave = j.join("-");
    if(vistos.has(chave)) continue;
    vistos.add(chave); saida.push(j);
  }
  if(saida.length < quantos) saida.push(...gerarRateio(m, quantos - saida.length, tam));
  return saida;
}

/* Porta única dos geradores. A bancada de testes chama exatamente o mesmo
   caminho que o botão Gerar — se divergissem, a bancada mediria outra coisa. */
function gerarPor(metodo, m, quantos, tam, contexto){
  if(metodo === "rateio")        return gerarRateio(m, quantos, tam);
  if(metodo === "cobertura")     return gerarCobertura(m, quantos, tam);
  if(metodo === "antirepeticao") return gerarAntirepeticao(m, quantos, tam,
                                          contexto && contexto.evitar);
  if(metodo === "contraste")     return gerarContraste(m, quantos, tam);
  return gerarUniforme(m, quantos, tam);
}

/* Fechamento: cobertura combinatória com garantia VERIFICADA por enumeração.
   Nunca exibimos um piso que não conseguimos provar. */
function combinacoesDe(arr, k){
  const saida = [], atual = [];
  (function rec(inicio){
    if(atual.length === k){ saida.push(atual.slice()); return; }
    for(let i=inicio;i<arr.length;i++){ atual.push(arr[i]); rec(i+1); atual.pop(); }
  })(0);
  return saida;
}

function verificarGarantia(bilhetes, dezenas, j){
  const idx = new Map(dezenas.map((d,i)=>[d,i]));
  const masc = bilhetes.map(b=>{ let m=0; b.forEach(d=> m |= (1 << idx.get(d))); return m; });
  const cenarios = combinacoesDe(dezenas.map((_,i)=>i), j);
  let pior = Infinity;
  for(const cen of cenarios){
    let mc = 0; cen.forEach(i => mc |= (1 << i));
    let melhor = 0;
    for(const mb of masc){
      let x = mb & mc, c = 0;
      while(x){ x &= x-1; c++; }
      if(c > melhor) melhor = c;
    }
    if(melhor < pior) pior = melhor;
  }
  return pior;
}

function gerarFechamento(m, dezenas, j, garantia){
  const c = MODALIDADES[m], tam = c.k;
  dezenas = dezenas.slice().sort((a,b)=>a-b);
  if(dezenas.length < tam) throw new Error(`marque ao menos ${tam} dezenas`);
  if(garantia > Math.min(tam, j)) throw new Error(
    `com ${j} das suas dezenas sorteadas, o máximo alcançável é ${Math.min(tam,j)} acertos`);

  const idx = dezenas.map((_,i)=>i);
  const candidatos = combinacoesDe(idx, tam).map(c=>{ let m2=0; c.forEach(i=> m2 |= (1<<i)); return m2; });
  const cenarios = combinacoesDe(idx, j).map(c=>{ let m2=0; c.forEach(i=> m2 |= (1<<i)); return m2; });
  if(candidatos.length * cenarios.length > 12e6)
    throw new Error("combinação pesada demais para o celular; reduza as dezenas marcadas");

  const conta = x => { let c=0; while(x){ x &= x-1; c++; } return c; };
  const cobre = candidatos.map(cd => cenarios.map(ce => conta(cd & ce) >= garantia));
  if(!cenarios.every((_,s)=> cobre.some(linha => linha[s])))
    throw new Error("garantia inalcançável com estas dezenas; reduza a garantia");

  const descobertos = new Array(cenarios.length).fill(true);
  const escolhidos = [];
  let restantes = cenarios.length;
  while(restantes > 0 && escolhidos.length < 400){
    let melhor = -1, ganho = 0;
    for(let i=0;i<candidatos.length;i++){
      let g = 0;
      for(let s=0;s<descobertos.length;s++) if(descobertos[s] && cobre[i][s]) g++;
      if(g > ganho){ ganho = g; melhor = i; }
    }
    if(melhor < 0) break;
    escolhidos.push(melhor);
    for(let s=0;s<descobertos.length;s++)
      if(descobertos[s] && cobre[melhor][s]){ descobertos[s] = false; restantes--; }
  }
  const bilhetes = escolhidos.map(i =>
    dezenas.filter((_,p)=> candidatos[i] & (1<<p)));
  return {bilhetes, garantiaVerificada: verificarGarantia(bilhetes, dezenas, j),
          piso: Math.max(0, tam + c.k - c.N)};
}

/* ============================ bancada de testes ============================
   Roda TODOS os métodos contra o mesmo concurso e mede quatro coisas.
   Três delas diferem de verdade entre métodos, porque são propriedades da
   combinação, decididas antes do sorteio:
     - rateio esperado (escore de popularidade)
     - sobreposição entre os jogos do lote
     - custo
   A quarta — acertos — NÃO difere. Cada combinação válida tem a mesma chance,
   então a diferença de acertos entre métodos é ruído amostral. A bancada
   mede assim mesmo e mostra a faixa de ruído junto, para que isso deixe de
   ser uma afirmação de quem escreveu o app e passe a ser um número que você
   confere. Ranquear método por acerto produziria um "vencedor" todo concurso,
   sempre por sorte.                                                        */
function sobreposicaoMedia(jogos){
  if(jogos.length < 2) return 0;
  let soma = 0, pares = 0;
  for(let i=0;i<jogos.length;i++)
    for(let k=i+1;k<jogos.length;k++){
      soma += jogos[i].filter(d=> jogos[k].includes(d)).length;
      pares++;
    }
  return soma/pares;
}

/* Erro padrão da média de acertos sobre `n` jogos independentes. */
function erroPadraoAcertos(m, tam, n){
  return desvioAcertos(m, tam) / Math.sqrt(Math.max(n,1));
}

function bancada(m, dezenasSorteadas, opcoes){
  const o = Object.assign({repeticoes:40, quantos:3}, opcoes||{});
  const tam = tamanhoPadrao(m), c = MODALIDADES[m];
  const sorteadas = new Set(dezenasSorteadas);
  /* O fechamento fica de fora: depende de dezenas que você marca à mão, então
     não há como sorteá-lo em pé de igualdade com os outros. */
  const linhas = METODOS.filter(x => x.id !== "fechamento").map(met => {
    const acertos = [];
    let pop = 0, sobre = 0;
    for(let r=0;r<o.repeticoes;r++){
      const lote = gerarPor(met.id, m, o.quantos, tam, {evitar: o.evitar});
      sobre += sobreposicaoMedia(lote);
      lote.forEach(j => {
        acertos.push(j.reduce((a,d)=> a + (sorteadas.has(d)?1:0), 0));
        pop += escorePopularidade(j, m);
      });
    }
    const n = acertos.length;
    const media = acertos.reduce((a,b)=>a+b,0)/n;
    return {
      id: met.id, nome: met.nome, jogos: n,
      media, melhor: Math.max(...acertos),
      popularidade: pop/n,
      sobreposicao: sobre/o.repeticoes,
      custo: o.quantos * c.preco
    };
  });
  const esperado = esperadoAcertos(m, tam);
  const ep = erroPadraoAcertos(m, tam, linhas[0].jogos);
  linhas.forEach(l => l.z = (l.media - esperado) / Math.max(ep, 1e-9));
  return {linhas, esperado, erroPadrao: ep, tamanho: tam};
}

/* Agrega vários concursos. Não dá para somar as dezenas sorteadas num conjunto
   só: cada jogo passaria a ser conferido contra um alvo muito maior, e tanto o
   esperado quanto o desvio deixariam de valer. O certo é rodar concurso a
   concurso e juntar as médias, com o erro padrão caindo pelo total de jogos. */
function bancadaAgregada(m, alvos, opcoes, jaCalculados){
  /* `jaCalculados` evita refazer o trabalho inteiro. A versão anterior rodava
     bancada() de novo em cada concurso que a tela ACABARA de calcular —
     dobrando o custo para produzir exatamente os mesmos números. Com histórico
     grande isso era a diferença entre segundos e minutos de tela parada. */
  const parciais = jaCalculados && jaCalculados.length === alvos.length
    ? jaCalculados
    : alvos.map((r,i) => bancada(m, r.dezenas,
        Object.assign({}, opcoes, {evitar: i>0 ? alvos[i-1].dezenas : null})));
  const base = parciais[0];
  const linhas = base.linhas.map((_, i) => {
    const ls = parciais.map(p => p.linhas[i]);
    const jogos = ls.reduce((a,l)=> a + l.jogos, 0);
    const peso = (sel) => ls.reduce((a,l)=> a + sel(l)*l.jogos, 0)/jogos;
    return {
      id: ls[0].id, nome: ls[0].nome, jogos,
      media: peso(l=>l.media),
      melhor: Math.max(...ls.map(l=>l.melhor)),
      popularidade: peso(l=>l.popularidade),
      sobreposicao: peso(l=>l.sobreposicao),
      custo: ls[0].custo
    };
  });
  const ep = erroPadraoAcertos(m, base.tamanho, linhas[0].jogos);
  linhas.forEach(l => l.z = (l.media - base.esperado)/Math.max(ep,1e-9));
  return {linhas, esperado: base.esperado, erroPadrao: ep, tamanho: base.tamanho};
}

/* Veredito sobre acertos: algum método saiu da faixa de ruído?
   Limite de 3 desvios porque são vários métodos comparados de uma vez — a 2
   desvios, com 5 métodos, um alarme falso seria esperado com frequência. */
function vereditoAcertos(r, umConcursoSo){
  const fora = r.linhas.filter(l => Math.abs(l.z) > 3);
  if(!fora.length)
    return {ok:true, texto:"Nenhum método se separou do acaso além do ruído — que é exatamente o previsto."};
  /* Em um concurso só, desvio grande costuma NÃO ser ruído: se as dezenas
     sorteadas têm cara de aposta humana (baixas, seguidas, soma na média), os
     métodos que fogem desse padrão acertam menos ali de propósito. É efeito
     estrutural, e some quando os concursos se acumulam, porque sorteio real
     sai uniforme. Dizer "é ruído" aqui seria impreciso. */
  const nomes = fora.map(f=>f.nome).join(", ");
  return umConcursoSo
    ? {ok:false, texto:`${nomes} ficou longe da média neste concurso. Em um concurso `
        + `isolado isso costuma ser efeito do próprio sorteio: quando as dezenas sorteadas `
        + `têm cara de aposta humana, os métodos que evitam esse padrão acertam menos ali — `
        + `e mais nos concursos de cara aleatória. Olhe o recorte com todos os concursos juntos.`}
    : {ok:false, texto:`${nomes} saiu da faixa mesmo com os concursos somados. `
        + `Isso ainda pode ser variação com poucos concursos registrados; só significaria `
        + `algo se persistisse ao longo de muitos.`};
}

/* ============================ faixa do acaso ============================
   Peça central da interface: onde uma escolha aleatória teria caído.       */
function faixaAcaso(observado, esperado, desvio, max){
  const L=360, H=38, p=10;
  const amp = Math.max(desvio*3, Math.abs(observado-esperado)*1.4, 1);
  const min = Math.max(0, esperado-amp), sup = Math.min(max ?? esperado+amp, esperado+amp);
  const x = v => p + (Math.min(Math.max(v,min),sup)-min)/((sup-min)||1)*(L-2*p);
  const fora = desvio>0 && Math.abs(observado-esperado) > 2*desvio;
  return `<div class="faixa"><svg viewBox="0 0 ${L} ${H}" role="img"
    aria-label="você fez ${nf(observado,2)}, o acaso faria ${nf(esperado,2)}">
    <rect x="${x(esperado-2*desvio)}" y="11" width="${Math.max(x(esperado+2*desvio)-x(esperado-2*desvio),2)}"
      height="15" rx="3" fill="var(--acaso)" opacity=".15"/>
    <line x1="${p}" y1="18.5" x2="${L-p}" y2="18.5" stroke="var(--linha)"/>
    <line x1="${x(esperado)}" y1="7" x2="${x(esperado)}" y2="30" stroke="var(--acaso)"
      stroke-width="1.6" stroke-dasharray="3 3"/>
    <rect x="${x(observado)-1.6}" y="5" width="3.2" height="27" rx="1.6"
      fill="${fora?"var(--alerta)":"var(--seu)"}"/>
  </svg>
  <div class="legenda">
    <span><i style="border-top:3px solid ${fora?"var(--alerta)":"var(--seu)"}"></i>você ${nf(observado,2)}</span>
    <span><i style="border-top:2px dashed var(--acaso)"></i>acaso ${nf(esperado,2)}</span>
    <span><i style="border-top:7px solid var(--acaso);opacity:.3"></i>faixa normal</span>
  </div></div>`;
}

/* ============================ telas ============================ */

    </div>
    <div class="nota">O piso é verificado testando <strong>todos</strong> os cenários
    possíveis. Se não der para provar, o app avisa em vez de prometer.</div>
  </div>` : ""}

  <button class="acao" id="g-go">Gerar ${S.quantidade} jogo${S.quantidade>1?"s":""}</button>

  aumenta a chance de acertar — ela é fixa e igual para toda combinação válida. A de

  muda quantas dezenas do último sorteio você repete; o fechamento garante um piso
  <em>caso</em> um número mínimo das suas dezenas saia.</div>`;
};

/* A sugestão desenhada: o jogo, cada medida contra o histórico, e o aviso que
   não pode faltar. A barra de cada linha mostra em que fatia dos concursos
   aquela configuração apareceu — é a mesma informação da tabela, para quem lê
   a forma antes de ler o número. */
function tabelaSugestao(s){
  if(s.erro) return `<div class="nota atencao">${esc(s.erro)}</div>`;

  const linhas = s.linhas.map(l => {
    const pct = l.fracao * 100;
    return `<tr>
      <td>${esc(l.nome)}${l.detalhe?`<span class="fraco"> ${esc(l.detalhe)}</span>`:""}</td>
      <td style="text-align:right"><b>${esc(String(l.valor))}</b></td>
      <td style="min-width:96px">
        <div class="barra-med"><i style="width:${Math.min(100, pct*2).toFixed(1)}%"></i></div>
      </td>
      <td style="text-align:right;white-space:nowrap">${nf(pct,1)}%</td>
    </tr>`;
  }).join("");

  const vezes = s.medianaDoAcaso > 0 ? s.menor / s.medianaDoAcaso : 0;

  return `
  <div class="ficha" style="margin-top:12px">
    <div class="topo"><span class="id">sugestão do sistema</span>
      <span class="selo">${s.dezenas.length} dezenas</span></div>
    <div class="dezenas">${s.dezenas.map(d=>`<span class="dz marcada">${pad(d)}</span>`).join("")}</div>
  </div>

  <div class="carta" style="margin-top:10px">
    <div class="contador"><span>a medida mais rara deste jogo</span>
      <b>${nf(s.menor*100,1)}%</b></div>
    <div class="nota" style="margin-top:6px">
      Nenhuma das ${s.linhas.length} medidas cai numa configuração incomum: a mais rara
      ainda apareceu em <strong>${nf(s.menor*100,1)}%</strong> dos ${inf(s.n)} concursos.
      Um jogo sorteado sem critério costuma ter a medida mais rara em
      ${nf(s.medianaDoAcaso*100,1)}% — ${nf(vezes,1)}× menos.
      Escolhido entre ${inf(s.candidatas)} candidatas sorteadas uniformemente.
    </div>
  </div>

  <div class="rolagem" style="margin-top:10px"><table>
    <thead><tr><th>medida</th><th style="text-align:right">no jogo</th>
      <th>frequência no histórico</th><th style="text-align:right">%</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table></div>

  ${(() => {
    const a = aprendizadoNaSugestao(s.modalidade || S.modalidade);
    return `<div class="nota" style="margin-top:10px">
      <strong>O aprendizado entra aqui?</strong> ${a.texto}</div>`;
  })()}

  <div class="nota atencao" style="margin-top:10px">
    <strong>Isto não aumenta a sua chance.</strong> Toda combinação tem exatamente a
    mesma probabilidade, e o próximo sorteio pode perfeitamente ser o mais atípico
    possível — já foi, várias vezes. O que este jogo tem é <em>parecença</em> com o
    retrato médio dos sorteios que já saíram, que foi o que se pediu. Não é previsão,
    e uma configuração comum é comum porque existem <em>mais combinações</em> com ela,
    não porque o sorteio a prefira.
  </div>

  <button class="acao" id="s-salvar" style="margin-top:8px">Salvar este jogo</button>`;
}

/* ==================== o cabeçalho de Meus Jogos ====================
   Quatro números e um botão, respondendo de cima o que a lista abaixo só conta
   depois de rolada: quantos jogos, contra qual concurso, quantos couberam na
   comparação e quantas dezenas bateram no total.

   "Comparados" e "salvos" são diferentes de propósito, e a diferença é o ponto:
   um jogo salvo hoje não é comparável ao sorteio de ontem. Mostrar só o total
   esconderia isso. */
function resumoDeMeusJogos(meus){
  const c = MODALIDADES[S.modalidade];
  const r = ultimoResultado(S.modalidade);
  const cmp = jogosContraConcurso(r);
  /* Reusa `concursosDoJogo`, que é quem conhece as três regras de cobertura —
     concurso declarado, faixa da teimosinha e data. Recontar aqui seria um
     quarto lugar com a mesma lógica, pronto para divergir. */
  const aConferir = S.jogos.concat(S.teimosinhas || [])
    .filter(j => j.modalidade === S.modalidade)
    .reduce((n, j) => n + concursosDoJogo(j).filter(x =>
      !(j.conferencias || []).some(cf => cf.concurso === x.concurso)).length, 0);
  return `<div class="carta">
    <div class="kpis">
      <div class="kpi"><div class="rot">jogos salvos</div>
        <div class="val" style="font-size:1.15rem">${inf(meus.length)}</div>
        <div class="sub">na ${esc(c.nome)}</div></div>
      <div class="kpi"><div class="rot">último concurso</div>
        <div class="val" style="font-size:1.15rem">${r ? esc(r.concurso) : "—"}</div>
        <div class="sub">${r ? esc(r.data || "sem data") : "nenhum guardado"}</div></div>
      ${/* "A conferir" em âmbar é o número que pede ação — o mockup destaca
            justamente ele. Conta concursos que um jogo cobre e que ainda não
            têm conferência registrada, somando todos os jogos. */""}
      <div class="kpi"><div class="rot">a conferir</div>
        <div class="val" style="font-size:1.15rem;${aConferir ? "color:var(--acumulou-tinta)" : ""}"
          >${inf(aConferir)}</div>
        <div class="sub">${aConferir ? "pendentes" : "tudo em dia"}</div></div>
      <div class="kpi"><div class="rot">coincidências</div>
        <div class="val" style="font-size:1.15rem">${inf(cmp.coincidencias)}</div>
        <div class="sub">dezenas, somadas</div></div>
    </div>
    <button class="acao" id="j-conferir" style="margin-top:12px">Conferir os jogos agora</button>
    ${(S.avisoJogos && S.avisoJogos.modalidade === S.modalidade)
      ? `<div class="nota">${esc(S.avisoJogos.texto)}</div>` : ""}
    <div class="nota">Compara cada jogo com o concurso que ele declara, ou com o
    último resultado guardado. Mostra quantas dezenas coincidiram e quais — não
    calcula prêmio nem faixa, porque quem confere bilhete é a Caixa.</div>
  </div>` + ultimasConferencias();
}

/* "Últimas conferências" do mockup: uma linha por concurso conferido, com
   quantos jogos entraram e qual foi o melhor. Atravessa modalidades de
   propósito — é o histórico do que o app fez, e o que ele fez na Quina ontem
   não deixa de ter acontecido porque agora se está olhando a Lotofácil. */
function ultimasConferencias(limite){
  const porConcurso = new Map();
  for(const j of S.jogos.concat(S.teimosinhas || [])){
    for(const cf of (j.conferencias || [])){
      const chave = `${j.modalidade}:${cf.concurso}`;
      const atual = porConcurso.get(chave) ||
        {modalidade:j.modalidade, concurso:cf.concurso, data:cf.data, jogos:0, melhor:0};
      atual.jogos++;
      if(cf.acertos > atual.melhor) atual.melhor = cf.acertos;
      porConcurso.set(chave, atual);
    }
  }
  const linhas = [...porConcurso.values()]
    .sort((a, b) => String(b.data || "").localeCompare(String(a.data || "")) ||
                    b.concurso - a.concurso)
    .slice(0, limite || 6);
  if(!linhas.length) return "";
  return `<section class="carta" style="margin-top:12px">
    <div class="panel-title"><h3>Últimas conferências</h3>
      <span>${inf(porConcurso.size)} concurso${porConcurso.size>1?"s":""}</span></div>
    <div class="conferencias">${linhas.map(l => `
      <div class="linha-conf">
        <span class="quando">${esc(l.data || "—")}</span>
        <span class="qual">${esc(MODALIDADES[l.modalidade].nome)}
          <small>concurso ${esc(l.concurso)}</small></span>
        <span class="quanto2">${inf(l.jogos)} jogo${l.jogos>1?"s":""}
          <small>melhor: ${l.melhor}</small></span>
      </div>`).join("")}</div>
  </section>`;
}

T.jogos = () => {
  if(!S.jogos.length) return `<div class="vazio">Nenhum jogo salvo ainda.<br>
    Gere jogos na primeira aba e toque em <strong>Salvar</strong>.</div>`;

  /* Filtra pela modalidade escolhida no cabeçalho. Sem isto a tela empilhava
     Mega-Sena, Lotofácil e Quina numa lista só — e como cada modalidade tem
     universo e quantidade de dezenas diferentes, a lista misturada não dá para
     ler nem para comparar. A escolha do cabeçalho vale em todas as telas; esta
     era a única que a ignorava. */
  const meus = S.jogos.filter(j => j.modalidade === S.modalidade);
  const outras = S.jogos.length - meus.length;
  const noutras = {};
  S.jogos.forEach(j => { if(j.modalidade !== S.modalidade)
    noutras[j.modalidade] = (noutras[j.modalidade] || 0) + 1; });

  const rodape = !outras ? "" : `<div class="nota">Você tem
    ${outras} jogo${outras===1?"":"s"} em outra${Object.keys(noutras).length===1?"":"s"}
    modalidade${Object.keys(noutras).length===1?"":"s"}:
    ${Object.entries(noutras).map(([k,n]) =>
      `<strong>${esc(MODALIDADES[k].nome)}</strong> (${n})`).join(", ")}.
    Troque no topo da tela para ver.</div>`;

  if(!meus.length) return `<div class="vazio">Nenhum jogo salvo de
    <strong>${esc(MODALIDADES[S.modalidade].nome)}</strong>.</div>` + rodape;

  const porLote = {};
  meus.forEach(j => (porLote[j.lote] = porLote[j.lote] || []).push(j));
  return resumoDeMeusJogos(meus) + Object.entries(porLote).reverse().map(([lote, jogos])=>{
    const p = jogos[0];
    return `<h2 style="margin:14px 0 8px">${esc(MODALIDADES[p.modalidade].nome)} ·
      ${esc(p.data)} · ${esc(p.metodo)}</h2>
    ${jogos.map(j=>ficha(j)).join("")}
    <div class="botoes" style="margin-bottom:16px">
      <button class="acao contorno mini" data-copiar="${esc(lote)}">Copiar lote</button>
      <button class="acao perigo mini" data-apagar="${esc(lote)}">Apagar lote</button>
    </div>`;
  }).join("") + rodape + `<div class="nota">Os jogos ficam guardados só neste
  aparelho. Nada é enviado para lugar nenhum.</div>`;
};

function ficha(j){
  const c = MODALIDADES[j.modalidade];
  const conferencias = (j.conferencias || []).slice().sort((a,b)=>a.concurso-b.concurso);
  const ultima = conferencias[conferencias.length-1];
  const aberto = S.jogoAberto === j.id;
  /* Clicar no jogo abre a cartela dele. A ficha compacta serve para varrer a
     lista; a cartela serve para olhar um jogo — misturar as duas em toda linha
     transformaria a lista num rolo. */
  return `<div class="ficha ${conferencias.length?"conferida":""}">
    <div class="topo">
      <span class="id">#${esc(j.id)}</span>
      ${/* Um jogo com concurso declarado tem regra de comparação diferente dos
            outros. Se isso não aparecer na ficha, a regra fica invisível e o
            jogo parece simplesmente não ter sido conferido. */
        Number.isFinite(j.concursoAlvo)
          ? `<span class="selo">concurso ${esc(j.concursoAlvo)}</span>` : ""}
      ${conferencias.length
        ? `<span class="selo ok">${conferencias.length} conferência${conferencias.length>1?"s":""}</span>`
        : `<span class="selo seu">não conferido</span>`}
    </div>
    <div class="dezenas">${j.dezenas.map(d=>{
      const acertou = ultima && ultima.dezenas.includes(d);
      return `<span class="dz ${acertou?"acertou":""}">${pad(d)}</span>`;
    }).join("")}</div>
    ${ultima ? `<div style="margin-top:9px;font-size:.82rem;color:var(--secundaria)">
      concurso ${esc(ultima.concurso)}: <strong style="color:var(--tinta)">${ultima.acertos} coincidência${ultima.acertos===1?"":"s"}</strong>
      — o acaso faria ${nf(esperadoAcertos(j.modalidade, j.dezenas.length),2)}</div>` : ""}
    <div class="botoes" style="margin-top:10px">
      <button class="acao contorno mini" data-abrir-jogo="${esc(j.id)}"
        aria-expanded="${aberto}">${aberto?"fechar cartela":"ver na cartela"}</button>
    </div>
    ${!aberto ? "" : `<div style="margin-top:12px">
      ${cartela(j.modalidade, j.dezenas, {
        sorteadas: ultima ? ultima.dezenas : null,
        selo: ultima ? `concurso ${ultima.concurso}` : "não conferido"})}
      ${ultima ? legendaCartela : ""}
      ${conferencias.length > 1 ? `<div class="rolagem" style="margin-top:10px"><table>
        <tr><th>concurso</th><th>coincidências</th><th>sorteio</th></tr>
        ${conferencias.map(cf=>{
          /* A coluna "faixa" saiu daqui: carimbava "prêmio" no seu jogo, que é
             afirmação que o app não sustenta. A coluna do SORTEIO fica, porque
             responde outra pergunta — teve ganhador na faixa 1? — e essa é fato
             publicado pela Caixa, não leitura do bilhete de ninguém. */
          const doSorteio = S.resultados.find(r =>
            r.concurso === cf.concurso && r.modalidade === j.modalidade) || {};
          const g = ganhadoresDoConcurso(doSorteio);
          return `<tr><td>${esc(cf.concurso)}</td><td>${cf.acertos}</td>
          <td><span class="ponto-sorteio ${g.estado}" title="${esc(g.rotulo)}"></span>${
            g.estado === "ganhou" ? "teve ganhador"
            : g.estado === "acumulou" ? "acumulou" : "—"}</td></tr>`;
        }).join("")}
      </table></div>` : ""}
    </div>`}
  </div>`;
}

function esperadoAcertos(m, tamanho){
  const c = MODALIDADES[m];
  return c.k * tamanho / c.N;
}
function desvioAcertos(m, tamanho){
  const c = MODALIDADES[m], N=c.N, K=c.k, n=tamanho;
  const v = n*(K/N)*(1-K/N)*((N-n)/(N-1));
  return Math.sqrt(Math.max(v,1e-9));
}

/* ==================== o último concurso contra os jogos salvos ============

   Esta tela existia e mentia por omissão. Ela abria com um formulário vazio
   pedindo o número do concurso e as quinze dezenas — enquanto o app JÁ tinha
   o concurso mais recente guardado e JÁ havia conferido todos os jogos contra
   ele, sozinho, na abertura. Um jogo com 14 acertos na Lotofácil ficava
   invisível aqui: para descobrir, a pessoa tinha de ir até Meus jogos e
   procurar. Pedir para digitar à mão um resultado que o app conhece não é só
   trabalho repetido — é dizer que não sabe.

   O painel abaixo responde, sem clique nenhum, à pergunta que traz a pessoa a
   esta tela: **saiu o sorteio; e os meus jogos?**

   Três cuidados que separam informação de conto:

   * Quem manda é `conferencias`, preenchida por `conferenciaAutomatica()`, e
     nunca uma recontagem feita aqui. Aquela função respeita a regra de que um
     jogo só vale para concursos a partir da data em que foi salvo. Recontar
     por conta própria produziria "acertos" em sorteios anteriores ao dia em
     que o jogo existiu — o número mais fácil de exibir e o mais desonesto.
   * Jogo não coberto aparece dizendo POR QUE não foi conferido, em vez de
     sumir da lista ou aparecer com zero. Zero é uma afirmação; ausência de
     conferência é outra coisa.
   * O painel diz o que o app sabe, não o que existe. O último concurso aqui é
     o mais recente que ele guardou — pode haver um mais novo que ninguém
     buscou, e o botão de atualizar diz isso com essas palavras.            */

function ultimoResultado(modalidade){
  let ultimo = null;
  for(const r of S.resultados)
    if(r.modalidade === modalidade && (!ultimo || r.concurso > ultimo.concurso))
      ultimo = r;
  return ultimo;
}

/* Por que este jogo não tem conferência neste concurso. Retorna null quando
   está tudo certo — ou seja, quando o jogo de fato cobre o concurso. */
function motivoSemConferencia(j, r){
  if(Number.isFinite(j.concursoAlvo) && j.concursoAlvo !== r.concurso)
    return `salvo para o concurso ${j.concursoAlvo}`;
  if(j.deConcurso){
    const fim = j.deConcurso + (j.concursos || 1) - 1;
    /* Número de concurso sai cru, sem separador de milhar: "3.301" lê como
       decimal e não é assim que a Caixa numera. `inf()` serve para contagens. */
    if(r.concurso < j.deConcurso) return `teimosinha começa no ${j.deConcurso}`;
    if(r.concurso > fim) return `teimosinha terminou no ${fim}`;
    return null;
  }
  if(String(r.data || "") < String(j.data || ""))
    return `jogo salvo em ${esc(j.data)}, depois do sorteio`;
  return null;
}

/* Os jogos salvos confrontados com um concurso. Separa em conferidos e não
   conferidos, e ordena os conferidos do melhor para o pior — quem abre esta
   tela quer ver primeiro o melhor que aconteceu. */
function jogosContraConcurso(r){
  /* Este retorno tem de ter EXATAMENTE as mesmas chaves do outro. Ele ficou
     para trás quando `premiados` saiu e `coincidencias` entrou, e o resultado
     apareceu na tela como "COINCIDÊNCIAS: NaN" — `inf(undefined)` — para quem
     tem jogo salvo e nenhum concurso guardado, que é justamente o estado de
     quem acabou de instalar o app. Duas formas de retorno da mesma função é
     defeito esperando data. */
  if(!r) return {conferidos:[], fora:[], melhor:null, coincidencias:0, total:0};
  const todos = S.jogos.concat(S.teimosinhas || [])
    .filter(j => j.modalidade === r.modalidade);
  const conferidos = [], fora = [];
  todos.forEach(j => {
    const cf = (j.conferencias || []).find(x => x.concurso === r.concurso);
    if(cf) conferidos.push({jogo:j, acertos:cf.acertos});
    else fora.push({jogo:j, motivo: motivoSemConferencia(j, r) || "ainda não conferido"});
  });
  conferidos.sort((a,b) => b.acertos - a.acertos);
  return {
    conferidos, fora,
    melhor: conferidos[0] || null,
    coincidencias: conferidos.reduce((n, x) => n + x.acertos, 0),
    total: todos.length,
  };
}

/* A conferência mostra COINCIDÊNCIA, e não prêmio.

   A versão anterior carimbava "faixa de prêmio" no jogo que batia o número de
   acertos de uma faixa. É uma conta fácil de fazer e uma afirmação que o app
   não tem como sustentar: quem decide se um bilhete pagou é a Caixa, contra o
   volante registrado, e não uma comparação de listas guardada no aparelho.
   Entre dizer "você acertou 14 dezenas" e "seu jogo está em faixa de prêmio",
   só a primeira é verificável aqui.

   O que continua: quantas dezenas coincidiram e QUAIS — o suficiente para a
   pessoa decidir se vale conferir o bilhete de verdade. E o cabeçalho do painel
   segue dizendo se o CONCURSO teve ganhador, que é fato publicado pela Caixa
   sobre o sorteio, e não uma leitura do bilhete de ninguém. */
function linhaDoJogo(item, sorteadas){
  const j = item.jogo;
  const esperado = esperadoAcertos(j.modalidade, j.dezenas.length);
  return `<div class="confronto">
    <div class="cabeca-confronto">
      <span class="quanto"><b>${item.acertos}</b> coincidência${item.acertos===1?"":"s"}</span>
      <span class="contexto">${esc(j.metodo || "salvo")} · o acaso faria ${nf(esperado,2)}</span>
    </div>
    <div class="dezenas">${j.dezenas.map(d =>
      `<span class="dz ${sorteadas.includes(d) ? "acertou" : ""}">${pad(d)}</span>`).join("")}</div>
  </div>`;
}

function painelUltimoConcurso(){
  const c = MODALIDADES[S.modalidade];
  const r = ultimoResultado(S.modalidade);
  const salvos = S.jogos.concat(S.teimosinhas || [])
    .filter(j => j.modalidade === S.modalidade).length;

  /* O recado da última busca vem do estado, e não do DOM: `pintar()` redesenha
     a tela inteira e apagaria qualquer coisa escrita direto no elemento. */
  const recado = (S.avisoConferir && S.avisoConferir.modalidade === S.modalidade)
    ? `<div class="nota ${S.avisoConferir.tipo === "atencao" ? "atencao" : ""}"
        >${esc(S.avisoConferir.texto)}</div>` : "";
  const botao = `<button class="acao" id="c-atualizar">Buscar o resultado mais recente</button>
    <div id="c-atualizando"></div>${recado}`;

  if(!r) return `<div class="carta">
    <div class="titulo-painel">último sorteio da ${esc(c.nome)}</div>
    <p class="vazio-painel">O app ainda não tem nenhum concurso da ${esc(c.nome)} guardado,
    então não há o que comparar com ${
      !salvos ? "jogos salvos"
      : salvos === 1 ? "o seu jogo salvo"
      : `os seus ${inf(salvos)} jogos salvos`}.</p>
    ${botao}</div>`;

  const cmp = jogosContraConcurso(r);
  const g = ganhadoresDoConcurso(r);

  /* O cabeçalho do sorteio: que concurso, quando, e o que saiu. Vem antes dos
     jogos porque é o fato; os jogos são a leitura dele. */
  const cabeca = `<div class="sorteio-cabeca">
      <div>
        <div class="titulo-painel">último sorteio que o app tem</div>
        <div class="sorteio-num">${esc(c.nome)} <b>${esc(r.concurso)}</b>
          <span>${esc(r.data || "sem data")}</span></div>
      </div>
      ${seloGanhadores(r, {cidades:false})}
    </div>
    <div class="dezenas sorteio-dezenas">${r.dezenas.map(d =>
      `<span class="dz sorteada">${pad(d)}</span>`).join("")}</div>`;

  if(!cmp.total) return `<div class="carta ${g.estado}">
    ${cabeca}
    <p class="vazio-painel">Você ainda não tem jogos salvos na ${esc(c.nome)}.
    Gere ou monte um jogo e ele passa a ser conferido sozinho a cada concurso novo.</p>
    ${botao}</div>`;

  /* Uma frase que resolve a tela para quem só quer a resposta. Conta
     coincidências, não prêmio: o que o app sabe é quantas dezenas bateram. */
  const resumo = !cmp.conferidos.length
    ? (cmp.total === 1
        ? `O seu jogo da ${esc(c.nome)} não cobre este concurso.`

/* O placar é POR MODALIDADE, e isso não é preferência de layout.

   A versão anterior somava os acertos de todas as loterias e tirava uma média.
   O número saía bonito e não significava nada: o acaso espera 0,6 acerto na
   Mega-Sena e 9,0 na Lotofácil, então a média conjunta mede principalmente
   qual mistura de modalidades a pessoa jogou — não o desempenho dela. Somar
   grandezas com esperanças diferentes é o mesmo erro de somar temperaturas em
   Celsius e Fahrenheit.

   O que continua junto é o dinheiro, porque real é real em qualquer
   modalidade, e o total gasto é a informação que mais importa para quem joga.

   Por método, a comparação vive DENTRO de cada modalidade pela mesma razão. */
function blocoDaModalidade(codigo, conf){
  const c = MODALIDADES[codigo];
  const total = conf.length;
  const media = conf.reduce((a,b)=>a+b.acertos,0)/total;
  const esperado = conf.reduce((a,b)=> a + esperadoAcertos(codigo, b.tamanho), 0)/total;
  /* Erro padrão da média: o desvio de um jogo dividido pela raiz do número de
     jogos. Sem dividir, a faixa ficaria larga demais e nunca acusaria nada. */
  const dp = Math.sqrt(conf.reduce((a,b)=> a + desvioAcertos(codigo,b.tamanho)**2, 0))/total;
  const melhor = conf.reduce((a,b)=> b.acertos>a.acertos ? b : a);
  const dentro = Math.abs(media - esperado) <= 2*Math.max(dp,1e-9);
  const premiados = conf.filter(x => faixaAtingida(codigo, x.acertos) !== null).length;

  const porMetodo = {};
  conf.forEach(cf=>{
    const m = porMetodo[cf.metodo] = porMetodo[cf.metodo] || {n:0, acertos:0, esperado:0};
    m.n++; m.acertos += cf.acertos; m.esperado += esperadoAcertos(codigo, cf.tamanho);
  });

  return `<div class="carta">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;
      margin-bottom:10px">
      <h3>${esc(c.nome)}</h3>
      <span class="selo ${dentro?"ok":"seu"}">${dentro?"dentro do acaso":"fora da faixa"}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="rot">acertos médios</div>
        <div class="val">${nf(media,3)}</div>
        <div class="sub">acaso: ${nf(esperado,3)}</div></div>
      <div class="kpi"><div class="rot">melhor resultado</div>
        <div class="val">${melhor.acertos}</div>
        <div class="sub">concurso ${esc(melhor.concurso)}</div></div>
      <div class="kpi"><div class="rot">jogos conferidos</div>
        <div class="val" style="font-size:1.15rem">${inf(total)}</div>
        <div class="sub">em ${inf(new Set(conf.map(x=>x.concurso)).size)} concursos</div></div>
      <div class="kpi"><div class="rot">em faixa de prêmio</div>
        <div class="val" style="font-size:1.15rem">${inf(premiados)}</div>
        <div class="sub">de ${inf(total)}</div></div>
    </div>
    ${faixaAcaso(media, esperado, Math.max(dp,0.02))}
    <div class="nota ${dentro?"":"atencao"}">
      ${dentro
        ? `Dentro da faixa do acaso nesta modalidade. É o resultado esperado: num sorteio honesto nenhum método muda essa média.`
        : `Fora da faixa normal nesta modalidade. Com poucas conferências isso acontece por variação comum — com o tempo tende a voltar para a linha do acaso.`}
    </div>
    ${Object.keys(porMetodo).length < 2 ? "" : `
      <h2 style="margin:14px 0 8px">por método, dentro da ${esc(c.nome)}</h2>
      <div class="rolagem"><table>
        <thead><tr><th>método</th><th>jogos</th><th>média</th><th>acaso</th><th>diferença</th></tr></thead>
        <tbody>${Object.entries(porMetodo).map(([k,v])=>{
          const m = v.acertos/v.n, e = v.esperado/v.n;
          return `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${nf(m,3)}</td><td>${nf(e,3)}</td>
            <td style="color:${m-e>=0?"var(--acaso)":"var(--alerta)"}">${m-e>=0?"+":""}${nf(m-e,3)}</td></tr>`;
        }).join("")}</tbody></table></div>`}
  </div>`;
}

/* Resumo geral e atalhos — o topo da tela inicial do mockup.

   Ficam no Placar porque é a tela que este app tem mais perto de um painel: ela
   já responde "como estou indo". Inventar uma tela inicial só para hospedar
   quatro números empurraria todas as outras um toque para baixo. */
function resumoGeral(){
  const jogos = S.jogos.length;
  const mods = new Set(S.jogos.map(j => j.modalidade)).size;
  const concursos = S.resultados.length;
  const aConferir = S.jogos.reduce((n, j) =>
    n + concursosDoJogo(j).filter(r =>
      !(j.conferencias||[]).some(cf => cf.concurso === r.concurso)).length, 0);
  const premios = S.jogos.reduce((n, j) =>
    n + (j.conferencias||[]).filter(cf =>
      faixaAtingida(j.modalidade, cf.acertos) !== null).length, 0);

  const cartao = (rot, val, sub, cor) => `<div class="kpi">
    <div class="rot">${esc(rot)}</div>
    <div class="val"${cor?` style="color:${cor}"`:""}>${inf(val)}</div>
    <div class="sub">${esc(sub)}</div></div>`;

  return `<div class="resumo">
    ${cartao("jogos salvos", jogos, "no aparelho")}
    ${cartao("modalidades", mods, "com jogo salvo")}
    ${cartao("concursos", concursos, "no histórico")}
    ${cartao("premiados", premios, premios ? "confira no volante" : "nenhum ainda",
             premios ? "var(--ganhou)" : "var(--secundaria)")}
  </div>
  ${aConferir ? `<div class="nota" style="margin-top:10px">
    <strong>${inf(aConferir)} conferência${aConferir>1?"s":""}</strong> pendente${aConferir>1?"s":""}.
    O app confere sozinho quando o resultado chega.</div>` : ""}`;
}

/* "Prêmios hoje" conta os AVISOS de prêmio registrados hoje, e não uma varredura
   nova das conferências: o aviso é o registro do momento em que o app encontrou

   o número de sempre, todo dia, porque conferência antiga não deixa de existir. */
function premiosDeHoje(){
  const hoje = new Date();
  return (S.avisos || []).filter(a =>
    a.tipo === "premio" && diaDoAviso(a.quando, hoje) === "Hoje").length;

T.placar = () => {
  const porModalidade = {};
  S.jogos.concat(S.teimosinhas||[]).forEach(j =>
    (j.conferencias||[]).forEach(cf => {
      (porModalidade[j.modalidade] = porModalidade[j.modalidade] || []).push({
        ...cf, tamanho:j.dezenas.length, metodo:j.metodo});
    }));

  const codigos = Object.keys(porModalidade);
  if(!codigos.length) return `<div class="vazio">Nenhuma conferência ainda.<br>
    Salve jogos, confira contra os concursos e o placar aparece aqui.</div>`;

  /* Gasto: somável entre modalidades porque real é real. Usa o preço vigente
     da modalidade, e assume aposta simples — o app não guarda o preço pago no
     dia, então este é um total aproximado, e a tela diz isso. */
  let gasto = 0;
  S.jogos.concat(S.teimosinhas||[]).forEach(j => {
    const c = MODALIDADES[j.modalidade];
    const apostas = combinacoes(j.dezenas.length, c.k);
    gasto += apostas * c.preco * ((j.conferencias||[]).length || 0);
  });

  const cabeca = codigos.length < 2 ? "" : `<div class="nota">
    <strong>Cada loteria tem o seu placar.</strong> Somar acertos de modalidades
    diferentes produziria um número sem sentido: o acaso espera
    ${nf(esperadoAcertos("mega-sena", 6),1)} acerto na Mega-Sena e
    ${nf(esperadoAcertos("lotofacil", 15),1)} na Lotofácil. A única coisa somável
    entre elas é o dinheiro.</div>`;

  const totalGasto = `<div class="carta">
    <div class="rot" style="font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;
      color:var(--secundaria);font-weight:600">gasto somado, todas as loterias</div>
    <div class="val num" style="font-size:1.9rem;font-weight:650;margin-top:2px">${brl(gasto)}</div>
    <div class="sub" style="font-size:.7rem;color:var(--secundaria);font-family:var(--mono)">
      ${codigos.length} modalidade${codigos.length>1?"s":""} · preço atual, aposta simples</div>
    <div class="nota" style="margin-bottom:0">Aproximado: o app não guarda o preço pago
      no dia de cada aposta, então usa o preço vigente da modalidade. Loteria é gasto de
      entretenimento — este é o número que importa acompanhar.</div>
  </div>`;

  /* Resumo e atalhos no topo: é a primeira coisa que a pessoa quer saber ao
     abrir a análise, e antes ela precisava rolar até achar. */
  return resumoGeral() + atalhos() + cabeca + totalGasto +
    codigos.sort((a,b)=> porModalidade[b].length - porModalidade[a].length)
      .map(k => blocoDaModalidade(k, porModalidade[k])).join("");
};

  </div>`;
}

T.entender = () => `<div class="prosa">

  <p><strong>Não aumenta a chance de você ganhar.</strong> Nenhum app faz isso, e quem
  disser que faz está vendendo algo que não existe. Em um sorteio honesto, cada concurso é

  informação sobre o próximo resultado.</p>
  <p>Na Mega-Sena, a chance de uma aposta simples é de 1 em ${inf(combinacoes(60,6))}.
  Na Lotofácil, 1 em ${inf(combinacoes(25,15))}. Esses números não se movem com
  frequência, atraso, primos, Fibonacci ou inteligência artificial.</p>

  <h3 style="margin-top:20px">Três coisas que a matemática faz de verdade</h3>
  <ul>
    <li><strong>Rateio.</strong> O prêmio é dividido entre os acertadores, e muita gente
    marca datas, sequências e desenhos no volante — isso é fato conhecido. O que este app

/* ==================== o jogo contra todo o histórico ====================
   A pergunta que todo mundo faz e que nenhum app responde direito: "se eu
   tivesse jogado ISTO em todos os concursos, o que teria acontecido?"

   Os concorrentes mostram a configuração do jogo e um selo de "ótimo". Isto
   aqui mostra o extrato: quantos concursos, quanto teria custado, quanto teria
   voltado, e a distribuição completa de acertos. É o número que decide se vale
   a pena, e é o número que ninguém publica.

   O prêmio usa o rateio real de cada concurso quando ele existe. Onde não
   existe, o concurso entra no custo e no histograma mas NÃO no retorno — e a
   tela informa quantos ficaram de fora. Estimar prêmio ausente inflaria o
   retorno com número inventado, que é exatamente o vício que este app
   combate. */
function retrospectiva(dezenas, modalidade){
  const c = MODALIDADES[modalidade];
  const hist = historicoDe(modalidade);
  if(hist.length < 10) return {erro:`faltam ${10 - hist.length} concursos`, tem:hist.length};

  const apostas = combinacoes(dezenas.length, c.k);
  const custoPorConcurso = apostas * c.preco;
  const distribuicao = {};
  let retorno = 0, premiados = 0, semRateio = 0, melhor = null;

  hist.forEach(r => {
    const acertos = dezenas.filter(d => r.dezenas.includes(d)).length;
    distribuicao[acertos] = (distribuicao[acertos] || 0) + 1;
    const faixa = faixaAtingida(modalidade, acertos);
    if(faixa === null) return;
    premiados++;
    const p = premioDoAcerto(r, acertos, modalidade);
    if(p === null){ semRateio++; return; }
    retorno += p;
    if(!melhor || p > melhor.premio)
      melhor = {concurso:r.concurso, data:r.data, acertos, premio:p};
  });

  const custo = custoPorConcurso * hist.length;
  return {
    n: hist.length, apostas, custoPorConcurso, custo, retorno,
    liquido: retorno - custo,
    roi: custo > 0 ? (retorno - custo) / custo : 0,
    distribuicao, premiados, semRateio, melhor,
    de: hist[0].concurso, ate: hist[hist.length-1].concurso,
    /* Acertos esperados por concurso, para comparar o observado com o acaso —
       um jogo pode ter tido sorte no recorte, e sem essa linha o extrato
       viraria propaganda de si mesmo. */
    esperado: esperadoAcertos(modalidade, dezenas.length)
  };
}

/* ==================== perfil do jogo contra o histórico ====================
   Para cada característica do jogo marcado, diz em que fração dos concursos
   passados aquela mesma configuração apareceu.

   Existe um app popular que faz esta tabela e pinta de VERDE "Ótimo" a
   configuração mais comum, de VERMELHO "Fora do padrão" a rara. O dado é bom;
   o veredito está de cabeça para baixo.

   Toda combinação válida tem exatamente a mesma probabilidade — 1 em
   50.063.860 na Mega-Sena, seja 1-2-3-4-5-6 ou qualquer outra. O que a
   configuração comum indica não é qualidade: é que MUITA GENTE marca parecido.
   E dividir o prêmio com muita gente é o oposto de ótimo.

   Aqui a coluna de veredito diz o que o número significa de fato: quão típico
   é, e o que isso implica para o rateio. Comum não é bom nem ruim para acertar
   — é ruim para o quanto sobra. */

function ehPrimo(n){
  if(n < 2) return false;
  for(let i = 2; i * i <= n; i++) if(n % i === 0) return false;
  return true;
}

/* Moldura: dezenas na borda do volante. Miolo: o resto. É um dos desenhos que
   mais aparecem marcados, junto com linha e coluna cheias. */
function naMoldura(d, modalidade){
  const c = MODALIDADES[modalidade];
  const cols = GRADE[modalidade] || 10;
  const idx = d - c.base;
  const li = Math.floor(idx / cols), co = idx % cols;
  const ultimaLinha = Math.floor((c.N - 1) / cols);
  return li === 0 || li === ultimaLinha || co === 0 || co === cols - 1;
}

//: As medidas do perfil. Cada uma sabe extrair seu valor de um conjunto de
//: dezenas — e é a MESMA função aplicada ao jogo e a cada concurso passado,
//: que é o que faz a comparação ser honesta.
function medidasDoPerfil(modalidade){
  const c = MODALIDADES[modalidade];
  const fib = fibonacciAte(c.N + c.base - 1);
  return [
    {id:"paridade", nome:"Pares / ímpares",
     valor: d => `${d.filter(x=>x%2===0).length}/${d.filter(x=>x%2!==0).length}`},
    {id:"soma", nome:"Soma das dezenas",
     valor: d => d.reduce((a,b)=>a+b,0),
     /* A soma quase nunca se repete exatamente; comparar por faixa é o que faz
        a porcentagem significar alguma coisa. A faixa é um décimo do desvio
        padrão teórico, arredondado. */
     faixa: true},
    {id:"moldura", nome:"Moldura / miolo",
     valor: d => { const m = d.filter(x=>naMoldura(x, modalidade)).length;
       return `${m}/${d.length - m}`; }},
    {id:"mult3", nome:"Múltiplos de 3", valor: d => d.filter(x=>x%3===0).length},
    {id:"primos", nome:"Primos", valor: d => d.filter(ehPrimo).length},
    {id:"fibonacci", nome:"Fibonacci", valor: d => d.filter(x=>fib.has(x)).length},
    {id:"inicial", nome:"Menor dezena", valor: d => Math.min(...d)},
    {id:"final", nome:"Maior dezena", valor: d => Math.max(...d)},
    {id:"consecutivos", nome:"Pares consecutivos",
     valor: d => { const o = d.slice().sort((a,b)=>a-b); let n = 0;
       for(let i=1;i<o.length;i++) if(o[i]===o[i-1]+1) n++; return n; }}
  ];
}

/* Quão típica é cada característica do jogo, medida no histórico real.
   `repetidasDoAnterior` entra à parte porque depende de qual concurso é o
   anterior, e só faz sentido quando há um. */
function perfilDoJogo(dezenas, modalidade){
  const hist = historicoDe(modalidade);
  const c = MODALIDADES[modalidade];
  if(hist.length < 20) return {erro:`faltam ${20 - hist.length} concursos`, tem:hist.length};

  const dpSoma = Math.sqrt(c.k * (c.N + 1) * (c.N - c.k) / 12) || 1;
  const larguraSoma = Math.max(1, Math.round(dpSoma / 5));

  const linhas = medidasDoPerfil(modalidade).map(m => {
    const meu = m.valor(dezenas);
    let iguais;
    if(m.faixa){
      iguais = hist.filter(r => Math.abs(m.valor(r.dezenas) - meu) <= larguraSoma).length;
    } else {
      iguais = hist.filter(r => String(m.valor(r.dezenas)) === String(meu)).length;
    }
    const fracao = iguais / hist.length;
    return {id:m.id, nome:m.nome, valor:meu, concursos:iguais, fracao,
            detalhe: m.faixa ? `± ${larguraSoma}` : ""};
  });

  /* Repetidas do concurso anterior: comparado com a distribuição histórica de
     repetições entre concursos consecutivos. */
  const ultimo = hist[hist.length - 1];
  if(ultimo){
    const meu = dezenas.filter(d => ultimo.dezenas.includes(d)).length;
    let iguais = 0, total = 0;
    for(let i = 1; i < hist.length; i++){
      const antes = new Set(hist[i-1].dezenas);
      if(hist[i].dezenas.filter(d => antes.has(d)).length === meu) iguais++;
      total++;
    }
    if(total) linhas.push({id:"repetidas", nome:"Repetidas do último concurso",
      valor: meu, concursos: iguais, fracao: iguais/total,
      detalhe: `concurso ${ultimo.concurso}`});
  }

  /* Quão típico é o jogo INTEIRO: a média geométrica das frações. Uma média
     simples deixaria uma característica muito comum mascarar uma raríssima, e
     é justamente a rara que decide com quanta gente se divide. */
  const positivas = linhas.map(l => Math.max(l.fracao, 1/(hist.length*2)));
  const tipicidade = Math.exp(
    positivas.reduce((a,f)=>a+Math.log(f),0) / positivas.length);

  return {linhas, n: hist.length, tipicidade};
}

/* A leitura de uma fração. Comum não é bom nem ruim para acertar; é ruim para
   o quanto sobra. É esta função que inverte o veredito do app de referência. */
/* ==================== sugestão do sistema ====================

   Um jogo montado com TODAS as estatísticas que o app mede, e sem estratégia
   nenhuma por trás.

   O que ela faz, exatamente: sorteia candidatas uniformemente e escolhe aquela
   cuja medida MAIS RARA ainda é comum no histórico. Nenhuma das dez medidas
   fica num extremo — nem soma alta demais, nem pares de menos, nem sequência
   longa, nem desenho no volante.

   O que ela NÃO faz, e o app repete isto na tela: aumentar a chance. Toda
   combinação de seis dezenas tem exatamente a mesma probabilidade, e a
   sorteada semana que vem pode perfeitamente ser a mais atípica possível — já
   foi, várias vezes. Um jogo "típico" não é mais provável; ele apenas se
   parece com o retrato médio dos sorteios que já saíram, que foi o que se
   pediu.

   Por que o critério é o MÍNIMO e não a média: com média, uma medida
   raríssima passa escondida atrás de nove comuns, e é justamente a rara que
   define o caráter do jogo. Maximizar o mínimo obriga TODAS a se comportarem.

   Por que a comparação é com o histórico e não com a fórmula: a teoria diz
   quanto deveria dar; o histórico diz quanto deu. Onde os dois discordam,
   quem responde à pergunta "com todas as estatísticas que você tem" é o
   histórico. */

const CANDIDATAS_SUGESTAO = 600;

/* Distribuição observada de cada medida, calculada UMA vez sobre o histórico.
   Sem isto, cada candidata varreria os 3.272 concursos da Lotofácil dez vezes
   — 20 milhões de comparações para montar um jogo. */
function distribuicoesDoHistorico(modalidade){
  const hist = historicoDe(modalidade);
  const c = MODALIDADES[modalidade];
  if(hist.length < 20) return null;

  const dpSoma = Math.sqrt(c.k * (c.N + 1) * (c.N - c.k) / 12) || 1;
  const larguraSoma = Math.max(1, Math.round(dpSoma / 5));
  const medidas = medidasDoPerfil(modalidade);

  const tabelas = medidas.map(m => {
    const contagem = new Map();
    let soma = 0;
    for(const r of hist){
      const v = m.valor(r.dezenas);
      const chave = String(v);
      contagem.set(chave, (contagem.get(chave) || 0) + 1);
      if(m.faixa) soma += Number(v);
    }
    /* A soma quase nunca se repete exatamente; a comparação é por faixa, e
       para isso guarda-se a lista ordenada e a busca binária faz o resto. */
    const ordenados = m.faixa
      ? hist.map(r => Number(m.valor(r.dezenas))).sort((a,b)=>a-b) : null;
    return {medida:m, contagem, ordenados, media: soma/hist.length};
  });

  /* Repetidas do concurso anterior: distribuição entre concursos consecutivos. */
  const repeticoes = new Map();
  let paresConsecutivos = 0;
  for(let i = 1; i < hist.length; i++){
    const antes = new Set(hist[i-1].dezenas);
    const q = hist[i].dezenas.filter(d => antes.has(d)).length;
    repeticoes.set(q, (repeticoes.get(q) || 0) + 1);
    paresConsecutivos++;
  }

  return {hist, n: hist.length, tabelas, larguraSoma,
          repeticoes, paresConsecutivos, ultimo: hist[hist.length - 1]};
}

/* Quantos concursos do histórico caem em [alvo-largura, alvo+largura]. */
function quantosNaFaixa(ordenados, alvo, largura){
  const limite = (x) => {           /* primeiro índice com valor >= x */
    let lo = 0, hi = ordenados.length;
    while(lo < hi){ const meio = (lo + hi) >> 1;
      if(ordenados[meio] < x) lo = meio + 1; else hi = meio; }
    return lo;
  };
  return limite(alvo + largura + 1) - limite(alvo - largura);
}

/* Perfil de uma candidata contra as distribuições já montadas. Devolve as
   linhas e a fração da medida mais rara. */
function perfilRapido(dezenas, dist){
  const linhas = [];
  let menor = 1;
  for(const t of dist.tabelas){
    const valor = t.medida.valor(dezenas);
    const iguais = t.medida.faixa
      ? quantosNaFaixa(t.ordenados, Number(valor), dist.larguraSoma)
      : (t.contagem.get(String(valor)) || 0);
    const fracao = iguais / dist.n;
    if(fracao < menor) menor = fracao;
    linhas.push({id:t.medida.id, nome:t.medida.nome, valor,
      concursos:iguais, fracao,
      detalhe: t.medida.faixa ? `± ${dist.larguraSoma}` : ""});
  }
  if(dist.ultimo && dist.paresConsecutivos){
    const q = dezenas.filter(d => dist.ultimo.dezenas.includes(d)).length;
    const iguais = dist.repeticoes.get(q) || 0;
    const fracao = iguais / dist.paresConsecutivos;
    if(fracao < menor) menor = fracao;
    linhas.push({id:"repetidas", nome:"Repetidas do último concurso", valor:q,
      concursos:iguais, fracao, detalhe:`concurso ${dist.ultimo.concurso}`});
  }
  return {linhas, menor};
}

/* O aprendizado desta loteria entrou na sugestão?

   Esta função existe por causa de uma pergunta direta: "depois de aprender, o
   app sugere números usando o que aprendeu?". A resposta honesta é NÃO — e o
   app precisa dizer isso na própria tela, em vez de deixar a dúvida de pé.

   O motivo não é preguiça de ligar as duas coisas: é que o modelo, medido fora
   da amostra nas oito loterias, NÃO ACHOU NADA. AUC entre 0,494 e 0,511, onde
   0,5 é "não distingue". Um modelo assim ainda produz uma ordem entre as
   dezenas — e usar essa ordem mudaria quais números saem sem mudar a chance de
   nenhum, criando a impressão de que há inteligência onde só há ruído. É
   exatamente a mentira que este app existe para não contar.

   A porta fica aberta e a condição é explícita: se algum dia o modelo de uma
   loteria achar sinal que sobreviva à correção de Holm, `aprendeu` fica
   verdadeiro, o app avisa, e aí a conversa muda — com número medido. */
function aprendizadoNaSugestao(modalidade){
  const r = S.aprendizado && S.aprendizado[modalidade];
  if(!r || r.erro)
    return {usa:false, estado:"não medido",
      texto:`O aprendizado desta loteria ainda não rodou, então a sugestão não
        teria o que usar. Ela vem só das estatísticas do histórico.`};
  if(r.aprendeu)
    return {usa:false, estado:"achou algo", auc:r.auc, p:r.p,
      texto:`O modelo desta loteria encontrou um desvio que sobreviveu à correção
        (AUC ${nf(r.auc,4)}, p ${nf(r.p,3)}). Mesmo assim a sugestão
        <strong>não</strong> o usa: um desvio medido é motivo para investigar na
        tela de Aprendizado, e não para virar sugestão de dezena. Veja lá antes
        de concluir qualquer coisa.`};
  return {usa:false, estado:"não achou nada", auc:r.auc, p:r.p,
    texto:`O modelo desta loteria foi treinado e medido fora da amostra:
      <strong>AUC ${nf(r.auc,4)}</strong> (0,5 é "não distingue nada", p ${nf(r.p,3)}).
      Ele não achou sinal — e por isso a sugestão <strong>não usa</strong> o que
      ele aprendeu. Usar a ordem de um modelo que não distingue nada mudaria os
      números sem mudar a chance de nenhum deles.`};
}

function sugestaoDoSistema(modalidade, tamanho, opcoes){
  const o = Object.assign({candidatas: CANDIDATAS_SUGESTAO, semente: null}, opcoes||{});
  const dist = distribuicoesDoHistorico(modalidade);
  if(!dist){
    const hist = historicoDe(modalidade);
    return {erro:`faltam ${20 - hist.length} concursos desta modalidade para a ` +
      `sugestão sair das estatísticas em vez de sair do nada`, tem:hist.length};
  }
  const tam = tamanho || tamanhoPadrao(modalidade);

  /* Semente opcional: a mesma sugestão pode ser reproduzida e conferida. Sem
     semente, cada toque no botão oferece um jogo diferente — o que é honesto,
     porque não existe UM jogo certo. */
  const rnd = o.semente == null ? Math.random : geradorSemeado(o.semente);
  const sortearComRnd = () => {
    const urna = [];
    for(let i=0;i<MODALIDADES[modalidade].N;i++) urna.push(i + MODALIDADES[modalidade].base);
    const saida = [];
    for(let i=0;i<tam;i++){
      const j = i + Math.floor(rnd() * (urna.length - i));
      const t = urna[i]; urna[i] = urna[j]; urna[j] = t;
      saida.push(urna[i]);
    }
    return saida.sort((a,b)=>a-b);
  };

  let melhor = null;
  for(let i=0;i<o.candidatas;i++){
    const cand = sortearComRnd();
    const p = perfilRapido(cand, dist);
    if(!melhor || p.menor > melhor.menor) melhor = {dezenas:cand, ...p};
  }

  /* Referência honesta: o que uma candidata QUALQUER costuma dar. Sem isso, o
     número "a medida mais rara aparece em 21% dos concursos" não significa
     nada — não dá para saber se é bom, ruim ou o normal. */
  const amostra = [];
  for(let i=0;i<120;i++) amostra.push(perfilRapido(sortearComRnd(), dist).menor);
  amostra.sort((a,b)=>a-b);
  const medianaDoAcaso = amostra[Math.floor(amostra.length/2)];

  return {modalidade, dezenas: melhor.dezenas, linhas: melhor.linhas,
          menor: melhor.menor, medianaDoAcaso, n: dist.n,
          candidatas: o.candidatas, tam};
}

function lerTipicidade(fracao){
  if(fracao >= 0.20) return {rotulo:"muito comum", cor:"var(--alerta)",
    leitura:"muita gente marca assim — mais gente para dividir"};
  if(fracao >= 0.08) return {rotulo:"comum", cor:"var(--seu)",
    leitura:"configuração frequente no volante"};
  if(fracao >= 0.02) return {rotulo:"incomum", cor:"var(--secundaria)",
    leitura:"aparece pouco no histórico"};
  return {rotulo:"raro", cor:"var(--acaso)",
    leitura:"quase ninguém marca assim — menos gente para dividir"};
}


/* Quantas pessoas dividiriam o prêmio com você.

   Esta é a única previsão honesta que este app faz, e vale explicar por que ela
   é diferente de tudo que recusamos até aqui.

   Prever qual dezena sai é impossível: a urna não tem memória. Prever quanta
   gente marca uma combinação é outra coisa — é prever COMPORTAMENTO HUMANO, que
   tem padrão forte e estável. Data de nascimento, sequência, desenho no
   volante: as pessoas repetem isso concurso após concurso, e os ganhadores
   publicados registram esse hábito.

   O que sai daqui: a estimativa de ganhadores da faixa principal SE a sua
   combinação for sorteada. E daí o prêmio esperado, que é o valor do rateio
   dividido por quantos dividiriam.

   Isto NÃO aumenta sua chance de acertar — ela continua 1 em 50.063.860 na
   Mega-Sena, para qualquer combinação. Aumenta quanto sobra para você quando
   acerta, que é a única alavanca real numa loteria honesta. */
function preverGanhadores(dezenas, modalidade){
  const cal = S.calibracao && S.calibracao[modalidade];
  if(!cal || cal.erro || !cal.modelo) return null;
  const m = cal.modelo;
  const carac = caracteristicas(dezenas, modalidade);
  const x = ATRIBUTOS_POPULARIDADE.map(k => carac[k] || 0);
  let z = m.b;
  for(let j = 0; j < m.w.length; j++)
    z += m.w[j] * ((x[j] - m.media[j]) / m.escala[j]);
  /* O modelo previu log(1 + ganhadores); desfazendo o log volta à contagem.
     Nunca abaixo de zero: ganhador negativo não existe. */
  const ganhadores = Math.max(0, Math.exp(z) - 1);

  /* Mediana histórica, como referência do que é "normal" nesta modalidade. */
  const hist = historicoDe(modalidade)
