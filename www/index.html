<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061522">
<meta name="description" content="Gerador e conferidor de jogos das loterias brasileiras, com comparação honesta contra o acaso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<!-- apple-touch-icon não aceita SVG: o iOS ignora e fica sem ícone na tela de
     início. Aqui vai o PNG, gerado do mesmo icone.svg. -->
<link rel="apple-touch-icon" href="icone-192.png">
<title>LotoLab — jogos e conferência</title>
<style>
/* ------------------------------------------------------------------
   Direção visual: ficha de conferência, não cassino.
   Sem verde-feltro, sem moeda, sem trevo, sem brilho, sem animação de
   celebração. A peça de identidade é a FICHA DE JOGO — cartão com a
   grade de dezenas — e, depois da conferência, a FAIXA DO ACASO, que
   mostra onde uma escolha aleatória teria caído.
   Porcelana + tinta naval + dois sinais: teal para o acaso, âmbar para
   o que é seu.
------------------------------------------------------------------ */
:root{
  --fundo:#EEF5F6; --carta:#FFFFFF; --tinta:#0B1E27; --secundaria:#657D86;
  /* O teal do pacote (#2BE0C1) é claro demais para virar texto sobre branco —
     no claro ele desce para um tom que passa em contraste, mantendo a família.
     O escuro fica com o valor original do pacote. */
  --acaso:#0B8B78; --acaso-fundo:#0B8B78; --seu:#9A6A10; --alerta:#B0324C;
  --linha:#D7E4E6; --trama:#EDF5F6;
  /* Verde e amarelo do resultado do concurso. São cores PRÓPRIAS, e não o
     --acaso e o --seu: teal já quer dizer "o acaso" e âmbar "o seu" na
     interface inteira, e reaproveitá-los aqui faria a mesma cor significar
     duas coisas diferentes na mesma tela. Estas duas dizem uma coisa só:
     saiu ganhador, ou acumulou. */
  --ganhou:#12703A; --ganhou-tinta:#0C5B2E;
  --acumulou:#8A6A00; --acumulou-tinta:#6E5400;
  --veu:rgba(15,30,46,.045);
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:19px;
  --sombra:0 1px 2px rgba(15,30,46,.05),0 12px 28px -20px rgba(15,30,46,.45);
  --sombra-alta:0 2px 4px rgba(15,30,46,.06),0 20px 44px -26px rgba(15,30,46,.55);
  --topo:env(safe-area-inset-top,0px); --base:env(safe-area-inset-bottom,0px);
  /* Largura da coluna de leitura. Cabeçalho, conteúdo e abas se alinham a
     ela, para que os três leiam como uma peça só em tela larga. */
  --coluna:720px;
  --barra:62px; /* altura da barra de abas; dita o respiro do fim do main */
  /* Escala de espaço. Existir num só lugar é o que faz o ritmo da página ser
     uma decisão, e não o acúmulo de números escolhidos um a um. */
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:34px;
  /* Papel da cartela. Fica fora de --carta porque a cartela não segue o tema
     da interface: papel de lotérica é creme no claro e continua papel no
     escuro, apenas rebaixado, senão a marca de caneta perde o contraste. */
  --papel:#FBF8F1; --tintaPapel:#1A1A17; --grade:#CFC9BC;
}
/* Azul-marinho e teal: a identidade visual pedida, com os valores do pacote
   premium. O escuro passou a ser o tema PADRÃO — é ele que dá a cara do app —
   e o claro continua inteiro para quem usa o celular no sol. */
html[data-tema="escuro"]{
  /* Valores do pacote, sem retoque: bg, panel, panel2, line, text, muted,
     teal, teal2, red. É o que faz as dez telas antigas herdarem a paleta nova
     em vez de conviverem com duas. */
  --fundo:#061521; --carta:#081A28; --tinta:#F5FBFD; --secundaria:#91A5B0;
  --acaso:#24D9B7; --acaso-fundo:#10A98F; --seu:#F0B65D; --alerta:#FF735F;
  --linha:#17384A; --trama:#0B2232;
  --ganhou:#4BD07A; --ganhou-tinta:#7FE3A2;
  --acumulou:#F0B65D; --acumulou-tinta:#F7CE8C;
  --veu:rgba(255,255,255,.04);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 12px 28px -20px rgba(0,0,0,.8);
  --sombra-alta:0 2px 4px rgba(0,0,0,.35),0 20px 44px -26px rgba(0,0,0,.9);
  --papel:#E8E3D8; --tintaPapel:#14140F; --grade:#A9A296;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--sans);
  font-size:16px;line-height:1.55;overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
h1{font-size:1.42rem;letter-spacing:-.03em}
h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--secundaria);
  font-weight:600}
h3{font-size:1rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select,input{font-family:inherit;font-size:1rem;color:inherit}
:focus-visible{outline:2px solid var(--acaso);outline-offset:2px}

/* ---------- estrutura ---------- */
header{position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--fundo) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  padding:calc(var(--topo) + 12px) 16px 10px;border-bottom:1px solid var(--linha)}
@supports not (backdrop-filter:blur(2px)){header{background:var(--fundo)}}
/* Três colunas de larguras iguais nas pontas: sem isso o título centraria no
   espaço que sobra entre o ☰ e o sino, e como os dois têm o mesmo tamanho a
   conta só fecha por acidente. Com a grade, fecha por construção. */
.cabeca{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:12px;
  max-width:var(--coluna);margin:0 auto}
.marca-titulo{text-align:center;line-height:1.15;min-width:0}
.marca-titulo b{display:block;font-size:1.35rem;font-weight:700;color:var(--acaso);
  letter-spacing:-.02em}
.marca-titulo span{display:block;font-size:.7rem;color:var(--secundaria);margin-top:1px}
.menu{background:none;border:0;padding:0;width:38px;height:38px;display:grid;
  place-items:center;cursor:pointer;color:var(--tinta);justify-self:start}
.menu svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round}

/* A gaveta entra pela esquerda, e não de baixo como a folha de atividades:
   são dois objetos diferentes e vindos de lugares diferentes da tela, o que
   por si só já diz qual é qual antes de ler o conteúdo. */
.gaveta .corpo{top:0;bottom:0;left:0;right:auto;width:min(84vw,320px);
  max-height:none;border-radius:0 var(--r) var(--r) 0;
  transform:translateX(-100%);transition:transform .22s ease}
.gaveta[data-aberta="1"] .corpo{transform:translateX(0)}
.gaveta-topo{display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:18px}
.gaveta-mods{display:grid;gap:6px}
.gaveta-mods button{text-align:left;background:var(--fundo);color:var(--secundaria);
  border:1px solid var(--linha);border-radius:11px;padding:11px 12px;
  font-family:inherit;font-size:.88rem;cursor:pointer}
.gaveta-mods button[aria-pressed="true"]{
  background:color-mix(in srgb,var(--acaso) 14%,var(--carta));
  border-color:color-mix(in srgb,var(--acaso) 52%,transparent);color:var(--tinta);
  font-weight:600}
@media (prefers-reduced-motion:reduce){ .gaveta .corpo{transition:none} }
.marca{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:600;
  font-size:1rem;letter-spacing:-.03em}
.marca span{color:var(--acaso)}
.marca svg{width:26px;height:26px;display:block;flex:none}
main{padding:14px 16px calc(var(--barra) + 45px + var(--base));
  max-width:var(--coluna);margin:0 auto}

/* ---------- trilha de modalidade: uma escolha, válida em todas as telas ----
   Antes cada tela tinha o seu próprio <select> de modalidade, e trocar numa
   não trocava nas outras — o usuário podia gerar na Quina e conferir na
   Lotofácil sem perceber. A escolha subiu para o cabeçalho: é global, fica
   sempre visível, e não há como as telas discordarem entre si.            */
.trilha{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:10px -16px 0;padding:0 16px 2px;scroll-snap-type:x proximity}
.trilha::-webkit-scrollbar{display:none}
.trilha button{flex:none;scroll-snap-align:start;background:var(--carta);
  border:1px solid var(--linha);border-radius:20px;padding:6px 13px;font-size:.8rem;
  color:var(--secundaria);cursor:pointer;white-space:nowrap;font-weight:550;
  transition:color .16s ease,border-color .16s ease,background .16s ease}
.trilha button:hover{border-color:var(--secundaria)}
/* Ativa em teal vazado, no lugar do bloco de tinta cheia. Em fundo
   azul-marinho um retângulo preto some; o contorno luminoso é o que se lê. */
.trilha button[aria-pressed="true"]{
  background:color-mix(in srgb,var(--acaso) 14%,transparent);
  border-color:color-mix(in srgb,var(--acaso) 62%,transparent);
  color:var(--acaso);font-weight:650;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--acaso) 22%,transparent);
  color:var(--carta)}

/* ---------- controle segmentado: as telas dentro de uma seção ---------- */
.segmento{display:flex;gap:2px;background:var(--trama);border-radius:12px;padding:3px;
  margin-bottom:var(--e3)}
.segmento button{flex:1;background:none;border:0;border-radius:9px;padding:8px 6px;
  font-size:.82rem;font-weight:600;color:var(--secundaria);cursor:pointer;
  transition:background .16s ease,color .16s ease}
.segmento button[aria-selected="true"]{background:var(--carta);color:var(--tinta);
  box-shadow:0 1px 2px rgba(15,30,46,.09)}

/* ---------- título de tela com subtítulo ---------- */
.titulo{margin-bottom:var(--e3)}
.titulo p{margin:3px 0 0;font-size:.85rem;color:var(--secundaria);line-height:1.45}

/* Cabeçalho de subtela: seta à esquerda, título centrado. A grade tem uma
   terceira coluna da mesma largura da seta, vazia — sem ela o título centra
   no espaço QUE SOBRA e fica visivelmente fora do meio da tela. */
.titulo.com-volta{display:grid;grid-template-columns:38px 1fr 38px;
  align-items:center;column-gap:4px}
.titulo.com-volta h1{grid-column:2;text-align:center;font-size:1.25rem;
  margin:0;overflow-wrap:anywhere}
.titulo.com-volta p{grid-column:1 / -1;text-align:center;margin-top:6px}
.voltar{grid-column:1;justify-self:start;width:38px;height:38px;display:grid;
  place-items:center;background:none;border:1px solid var(--linha);
  border-radius:11px;color:var(--tinta);cursor:pointer;padding:0}
.voltar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.voltar:hover{border-color:var(--secundaria)}

/* ---------- sino de avisos ---------- */
.sino{position:relative;background:none;border:1px solid var(--linha);border-radius:11px;
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--tinta)}
.sino svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.sino b{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--alerta);color:#fff;font-family:var(--mono);
  font-size:.6rem;display:grid;place-items:center;border:2px solid var(--fundo)}
/* `display:grid` acima vence o [hidden] do navegador, e o contador aparecia
   com "0". Precisa ser explícito. */
.sino b[hidden]{display:none}

/* ---------- folha inferior (avisos) ---------- */
.folha{position:fixed;inset:0;z-index:50;display:none}
.folha[data-aberta="1"]{display:block}
.folha .fundo{position:absolute;inset:0;background:rgba(15,30,46,.42);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.folha .corpo{position:absolute;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;
  background:var(--fundo);border-radius:var(--r) var(--r) 0 0;
  padding:var(--e4) var(--e4) calc(var(--e5) + var(--base));
  max-width:var(--coluna);margin:0 auto;box-shadow:var(--sombra-alta)}
.folha .alca{width:38px;height:4px;border-radius:2px;background:var(--linha);
  margin:0 auto var(--e3)}

/* ---------- cartela: a forma do volante de lotérica ------------------------
   A referência é o cartão de papel: fundo creme, grade impressa contínua (uma
   linha entre células, não uma borda por célula), número pequeno no canto e a
   marca ocupando a casa inteira, como caneta preta.

   Deliberadamente NÃO reproduz a identidade da Caixa — nada de logo, nome de
   marca ou paleta oficial. Imitar a forma ajuda a reconhecer o gesto; imitar a
   marca seria se passar por eles.                                          */
.cartela{background:var(--papel);border:1px solid var(--linha);border-radius:12px;
  overflow:hidden;box-shadow:var(--sombra);margin-bottom:var(--e3)}
.cartela .tarja{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 12px;background:var(--tinta);color:var(--carta)}
.cartela .tarja b{font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;
  font-weight:650}
.cartela .tarja span{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;
  opacity:.72}
.cartela .miolo{padding:10px}
/* A grade impressa: colapsada, com a linha desenhada pela própria célula. */
.grade-volante{display:grid;gap:0;border:1px solid var(--grade);border-radius:4px;
  overflow:hidden;background:var(--grade)}
.casa{position:relative;aspect-ratio:1;background:var(--papel);border:0;
  margin:0 1px 1px 0;padding:0;display:grid;place-items:center;cursor:pointer;
  font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--tintaPapel);
  font-variant-numeric:tabular-nums;transition:background .1s ease,color .1s ease}
.casa:hover:not(:disabled){background:color-mix(in srgb,var(--seu) 12%,var(--papel))}
/* A marca de caneta: um retângulo dentro da casa, e não a casa inteira
   invertida. A casa inteira lê como seleção de interface; o retângulo com a
   margem de papel em volta lê como alguém que passou a caneta.

   O número fica num <span> com z-index próprio. Sem isso ele desaparece: o
   ::before é posicionado, e conteúdo posicionado pinta ACIMA do texto em fluxo
   do mesmo contexto de empilhamento — a marca cobria o dígito inteiro. */
.casa span{position:relative;z-index:1}
.casa[aria-pressed="true"]{color:var(--papel)}
.casa[aria-pressed="true"]::before{content:"";position:absolute;inset:9%;
  border-radius:4px;background:var(--tintaPapel)}
/* Sorteada é o resultado impresso na casa; acerto é a caneta sobre ela — as
   duas camadas juntas, como conferir o papel contra o resultado. */
.casa.sorteada{background:var(--acaso);color:#fff}
.casa.acertou{background:var(--acaso)}
.casa.acertou::before{background:var(--tintaPapel);
  box-shadow:0 0 0 1.5px color-mix(in srgb,#fff 70%,transparent)}
.casa:disabled{cursor:default;color:color-mix(in srgb,var(--tintaPapel) 40%,var(--papel))}
.cartela .pe{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;
  border-top:1px dashed var(--grade);font-family:var(--mono);font-size:.66rem;
  color:var(--secundaria);flex-wrap:wrap}
.legenda-cartela{display:flex;gap:12px;flex-wrap:wrap;font-size:.66rem;
  color:var(--secundaria);font-family:var(--mono);margin-top:var(--e2)}
.legenda-cartela i{display:inline-block;width:11px;height:11px;border-radius:2px;
  vertical-align:-1px;margin-right:4px}
.contador{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:.76rem;color:var(--secundaria);margin:var(--e3) 0 var(--e2)}
.contador b{font-size:1.05rem;color:var(--tinta)}

/* ---------- lista de linhas (avisos, resultados, teimosinha) ---------- */
.lista{display:flex;flex-direction:column;gap:var(--e2)}
.item{display:flex;gap:var(--e3);align-items:flex-start;background:var(--carta);
  border:1px solid var(--linha);border-radius:13px;padding:var(--e3)}
.item .marca-cor{flex:none;width:3px;align-self:stretch;border-radius:2px;
  background:var(--secundaria)}
.item.ok .marca-cor{background:var(--acaso)}
.item.aviso .marca-cor{background:var(--seu)}

/* Concurso com ganhador: verde. Acumulado: amarelo. O concurso INTEIRO muda de
   cor, e não só o selo — numa lista de quarenta, a cor é o que se lê primeiro,
   e ler quarenta selos um a um é o que se estava tentando evitar.
   A cor nunca vai sozinha: o selo de texto continua ali, porque quem não
   distingue verde de amarelo precisa da mesma informação. */
.item.ganhou{border-color:color-mix(in srgb,var(--ganhou) 42%,var(--linha));
  background:color-mix(in srgb,var(--ganhou) 7%,var(--carta))}
.item.ganhou .marca-cor{background:var(--ganhou);width:4px}
.item.ganhou .txt b{color:var(--ganhou-tinta)}
.item.acumulou{border-color:color-mix(in srgb,var(--acumulou) 45%,var(--linha));
  background:color-mix(in srgb,var(--acumulou) 8%,var(--carta))}
.item.acumulou .marca-cor{background:var(--acumulou);width:4px}
.item.acumulou .txt b{color:var(--acumulou-tinta)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:.9rem}
.item .txt span{display:block;font-size:.78rem;color:var(--secundaria)}
.item .quando{font-family:var(--mono);font-size:.62rem;color:var(--secundaria);flex:none}
.nao-lido{background:color-mix(in srgb,var(--acaso) 6%,var(--carta))}

/* ---------- central de atividades: chips e grupos por dia ---------- */
/* Em 412px os quatro chips cabem; em 390 e 360 a faixa rola. Quando rola, o
   `mask-image` esmaece a borda direita para o último chip cortado ler como
   "tem mais, arraste" em vez de "quebrou" — corte seco é indistinguível de
   defeito de layout.

   O esmaecimento vem da classe `.rola`, posta por medição depois de desenhar,
   e não sempre: aplicá-lo de forma fixa apagaria a borda de um chip que cabe
   inteiro, que é o caso justamente da tela mais comum. */
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  margin:0 0 14px;padding-bottom:2px}
.chips.rola{mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;
  background:var(--fundo);color:var(--secundaria);border:1px solid var(--linha);
  border-radius:99px;padding:7px 8px;font-size:.74rem;font-family:inherit;
  cursor:pointer;white-space:nowrap}
.chip i{font-style:normal;font-family:var(--mono);font-size:.62rem;
  background:var(--trama);color:var(--secundaria);border-radius:99px;
  padding:1px 4px;min-width:15px;text-align:center}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--acaso) 14%,var(--carta));
  border-color:color-mix(in srgb,var(--acaso) 52%,transparent);color:var(--tinta)}
.chip[aria-pressed="true"] i{background:var(--acaso);color:var(--fundo)}
/* Chips de modalidade na tela Resultados, como no mockup. Reusam `.chip` — é o
   mesmo objeto com a mesma função, e dar-lhe duas aparências pelo lugar em que
   aparece seria inventar dialeto. */
.chips-mod{margin-bottom:10px}
.acoes-topo{display:flex;justify-content:flex-end;margin-bottom:10px}

/* Cartão de concurso: número e data em cima, bolas no meio, estado embaixo.
   A faixa de cor na borda esquerda é a mesma gramática da ficha de jogo. */
.concursos{display:grid;gap:10px}
.concurso{position:relative;background:var(--carta);border:1px solid var(--linha);
  border-radius:var(--r);padding:13px 34px 12px 15px;box-shadow:var(--sombra);
  overflow:hidden;text-align:left;width:100%;font-family:inherit;color:inherit;
  cursor:default}
.concurso::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;
  background:var(--linha)}
.concurso.ganhou::before{background:var(--ganhou)}
.concurso.acumulou::before{background:var(--acumulou)}
.concurso.ganhou{border-color:color-mix(in srgb,var(--ganhou) 42%,var(--linha));
  background:color-mix(in srgb,var(--ganhou) 7%,var(--carta))}
.concurso.acumulou{border-color:color-mix(in srgb,var(--acumulou) 45%,var(--linha));
  background:color-mix(in srgb,var(--acumulou) 8%,var(--carta))}
.concurso-topo{display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;margin-bottom:9px}
.concurso-topo b{font-size:.98rem}
.concurso-topo time{font-family:var(--mono);font-size:.7rem;color:var(--secundaria);
  flex:none}
.concurso-detalhe{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.concurso .chevron{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--secundaria);display:grid;place-items:center}
.concurso .chevron svg{width:17px;height:17px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Os ajustes de busca saíram do topo e ficam recolhidos no fim da tela. */
.ajustes{margin-top:16px}
.ajustes summary{cursor:pointer;padding:11px 13px;border:1px solid var(--linha);
  border-radius:12px;background:var(--carta);font-size:.86rem;color:var(--secundaria)}
.ajustes[open] summary{margin-bottom:10px;color:var(--tinta)}

/* Painel "Geração atual": anel à esquerda, funil à direita. */
.geracao-linha{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.funil{flex:1;min-width:150px;display:grid;gap:9px}
.funil div{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.funil span{font-size:.76rem;color:var(--secundaria);line-height:1.3}
.funil b{font-family:var(--mono);font-size:1.15rem;font-weight:650;color:var(--tinta);
  font-variant-numeric:tabular-nums;flex:none}

/* Ícone quadrado por tipo, na cor do GRUPO — a mesma dos chips de filtro, para
   olho e filtro falarem a mesma língua. */
.ic-aviso{width:34px;height:34px;flex:none;border-radius:11px;display:grid;
  place-items:center;align-self:flex-start}
.ic-aviso svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ic-aviso.conferencia{background:color-mix(in srgb,var(--acaso) 15%,transparent);
  color:var(--acaso)}
.ic-aviso.analise{background:color-mix(in srgb,#6f8dff 20%,transparent);color:#93a8ff}
.ic-aviso.sistema{background:color-mix(in srgb,#a06bff 18%,transparent);color:#c19cff}
.ponto-lido{width:8px;height:8px;border-radius:50%;flex:none;align-self:center;
  background:transparent;box-shadow:inset 0 0 0 1px var(--linha)}
.ponto-lido.novo{background:var(--acaso);box-shadow:none}

/* Últimas conferências: data | modalidade+concurso | jogos+melhor. */
.conferencias{display:grid;gap:1px;background:var(--linha);border-radius:12px;
  overflow:hidden}
.linha-conf{display:grid;grid-template-columns:auto 1fr auto;gap:10px;
  align-items:center;padding:10px 12px;background:var(--carta);font-size:.8rem}
.linha-conf .quando{font-family:var(--mono);font-size:.68rem;color:var(--secundaria)}
.linha-conf .qual{min-width:0;color:var(--tinta)}
.linha-conf .qual small,.linha-conf .quanto2 small{display:block;font-size:.68rem;
  color:var(--secundaria);margin-top:1px}
.linha-conf .quanto2{text-align:right;color:var(--tinta);flex:none}

/* Histórico de gerações: uma linha por geração, a atual destacada. */
.geracoes{display:grid;gap:1px;background:var(--linha);border-radius:12px;overflow:hidden}
.linha-ger{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:8px;
  align-items:center;padding:10px 12px;background:var(--carta)}
.linha-ger.atual{background:color-mix(in srgb,var(--acaso) 9%,var(--carta))}
.linha-ger .ger b{display:block;font-size:.86rem}
.linha-ger .ger small{display:block;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--acaso);margin-top:1px}
.linha-ger .med{font-size:.62rem;color:var(--secundaria);line-height:1.3;text-align:right}
.linha-ger .med b{display:block;font-family:var(--mono);font-size:.88rem;
  color:var(--tinta);font-variant-numeric:tabular-nums;margin-top:2px}

.dia-avisos{margin-bottom:16px}
/* O rótulo do dia gruda no topo ao rolar: numa lista longa, saber em que dia
   se está sem ter de rolar de volta é metade do motivo de agrupar. */
.dia-rotulo{position:sticky;top:0;z-index:1;display:flex;align-items:baseline;
  gap:8px;padding:6px 0 8px;background:var(--carta);
  font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--secundaria)}
.dia-rotulo span{font-size:.6rem;opacity:.7}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;
  /* Uma coluna por aba, derivada da quantidade real: um número fixo aqui
     deixa coluna vazia assim que ABAS muda de tamanho. */
  grid-auto-flow:column;grid-auto-columns:1fr;
  background:color-mix(in srgb,var(--carta) 92%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--linha);padding-bottom:var(--base)}
/* Em tela larga a barra acompanha a coluna em vez de atravessar a página. */
@media (min-width:760px){
  nav{width:var(--coluna);margin-inline:auto;
    border-inline:1px solid var(--linha);border-radius:var(--r) var(--r) 0 0;
    box-shadow:var(--sombra-alta)}
}
@supports not (backdrop-filter:blur(2px)){nav{background:var(--carta)}}
nav button{position:relative;background:none;border:0;padding:13px 1px 11px;display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--secundaria);font-size:.58rem;
  cursor:pointer;letter-spacing:.03em;transition:color .18s ease}
/* Aba ativa em teal, e não em tinta: no pacote é o teal que marca onde você
   está, e é o que faz a barra inferior parecer parte da identidade em vez de
   uma régua cinza. */
nav button[aria-current="page"]{color:var(--acaso)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:30px;height:3px;border-radius:0 0 4px 4px;
  background:var(--acaso);box-shadow:0 0 12px color-mix(in srgb,var(--acaso) 55%,transparent)}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .18s ease}
nav button[aria-current="page"] svg{stroke-width:2.2}


/* ---------- cartão do próximo concurso ------------------------------------
   A primeira coisa que se vê ao abrir. Fundo de tinta naval em vez de carta
   branca porque ele é o único bloco que não é conteúdo de trabalho: é o
   contexto de tudo o que vem abaixo, e precisa se distinguir sem gritar.
   Nada de dourado, nada de brilho — o valor é grande por si só.            */
.proximo{position:relative;overflow:hidden;border-radius:var(--r);
  background:linear-gradient(150deg,var(--tinta) 0%,
    color-mix(in srgb,var(--tinta) 82%,var(--acaso)) 100%);
  color:var(--carta);padding:15px 16px;margin-bottom:var(--e3);
  box-shadow:var(--sombra-alta)}
.proximo::after{content:"";position:absolute;right:-28px;top:-28px;width:130px;
  height:130px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acaso) 34%,transparent) 0%,
    transparent 70%);pointer-events:none}
.proximo .rot{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;
  letter-spacing:.14em;opacity:.72}
.proximo .valor{font-family:var(--mono);font-size:1.75rem;font-weight:650;
  letter-spacing:-.03em;margin:3px 0 1px;line-height:1.15}
.proximo .quando{font-size:.82rem;opacity:.82}
.proximo .selo-acumulou{display:inline-block;font-family:var(--mono);font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:20px;
  border:1px solid color-mix(in srgb,var(--carta) 45%,transparent);margin-top:8px}
.proximo .contagem{position:absolute;right:16px;top:15px;text-align:right}

/* Selo de ganhadores. Três estados com três pesos visuais diferentes, porque
   "não sei" não pode parecer um resultado: ele é discreto e vazado, enquanto
   ter ganhador e acumular são afirmações e ficam preenchidas. */
/* ===================== VISUAL DO PACOTE sorte2_mockup_exact =====================
   O CSS do pacote entra INTEIRO e sem retoque — é o que garante que a tela
   fique igual ao mockup, e não parecida. Os tokens dele viram os tokens do
   tema escuro do app, para as telas antigas herdarem a mesma paleta.
   Regras de body/header/nav/main foram retiradas porque o app já tem as suas
   e duas definições do mesmo elemento é sempre uma a mais. */
:root{
  /* Nomes originais do pacote, de propósito: as regras dele referenciam
     var(--text), var(--teal), var(--line). Renomear quebra tudo em silêncio —
     a tela sai com texto escuro sobre fundo escuro, que foi o que aconteceu. */
  --bg:#061521;
  --panel:#081a28;
  --panel2:#0b2232;
  --panel3:#0d293b;
  --line:#17384a;
  --text:#f5fbfd;
  --muted:#91a5b0;
  --teal:#24d9b7;
  --teal2:#10a98f;
  --blue:#4e72ff;
  --purple:#934fff;
  --green:#2faa55;
  --green2:#57c56e;
  --red:#ff735f;
  --cyan:#5bd7ff;
  --radius:18px;
  --shadow:0 16px 50px rgba(0,0,0,.25);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px)
};
}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini-card{padding:12px;text-align:center}.mini-card strong{display:block;font-size:21px}.mini-card small{color:var(--muted);font-size:8px}.teal{color:var(--teal)}.red{color:var(--red)}

.generation-list{display:grid;gap:8px;margin-top:12px}.gen-row{padding:11px;border-radius:12px;border:1px solid var(--line);background:#081b29}.gen-top{display:flex;justify-content:space-between;gap:8px}.gen-top b{font-size:10px}.gen-metrics{font-size:8px;color:var(--muted);display:flex;gap:12px;margin-top:4px}
.good-banner{margin-top:12px;padding:12px;border-radius:11px;border:1px solid rgba(36,217,183,.38);background:rgba(0,137,91,.20);color:#72ebce;font-size:9px}

.draws{display:grid;gap:8px}.draw-card{padding:12px}.draw-top{display:flex;justify-content:space-between;align-items:center}.draw-top b{font-size:10px}.draw-top time{font-size:8px;color:var(--muted)}.balls{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.ball{min-width:29px;height:29px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:linear-gradient(180deg,#4bb658,#258f3d);font-size:9px;font-weight:800}
.search{width:100%;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:0 12px;margin-bottom:10px}
.modal{position:fixed;inset:0;z-index:90;display:none}.modal.open{display:block}.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(5px)}

.activity-item{padding:11px;display:grid;grid-template-columns:46px 1fr;gap:9px;margin-bottom:8px}.activity-icon{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:19px}.activity-item.analysis .activity-icon{background:rgba(36,217,183,.12);color:var(--teal)}.activity-item.sync .activity-icon{background:rgba(47,170,85,.12);color:var(--green2)}.activity-item.system .activity-icon{background:rgba(147,79,255,.12);color:#c49cff}.activity-top{display:flex;justify-content:space-between;gap:9px}.activity-top b{font-size:9px}.activity-top time{font-size:7px;color:var(--muted)}.activity-item p{margin:3px 0 0;color:var(--muted);font-size:8px}

.toast-wrap{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:120;width:min(400px,calc(100% - 24px));display:grid;gap:8px}.toast{padding:12px;border-radius:14px;background:linear-gradient(135deg,#103a2e,#0b2b23);border:1px solid #2a6c54;box-shadow:var(--shadow)}.toast b{display:block;font-size:10px}.toast span{display:block;color:#cde8dd;font-size:8px;margin-top:2px}

/* Cartões de atalho com ícone colorido, e a grade de resumo — as duas peças da
   primeira tela do mockup. As três cores (teal, azul, roxo) não são decoração:
   marcam destinos diferentes, e repetem no ícone da central de atividades. */
.atalhos{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--e2);margin-top:var(--e3)}
@media(max-width:400px){ .atalhos{grid-template-columns:repeat(2,1fr)} }
.atalho{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  padding:var(--e3);display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;
  transition:border-color .16s ease,transform .12s ease}
.atalho:hover{border-color:color-mix(in srgb,var(--acaso) 40%,var(--linha))}
.atalho:active{transform:translateY(1px)}
.atalho .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.atalho .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.atalho.teal .ic{background:color-mix(in srgb,var(--acaso) 16%,transparent);color:var(--acaso)}
.atalho.azul .ic{background:color-mix(in srgb,#5A7FFF 18%,transparent);color:#7E9BFF}
.atalho.roxo .ic{background:color-mix(in srgb,#A16BFF 18%,transparent);color:#B98CFF}
.atalho b{font-size:.86rem;font-weight:650}
.atalho span{font-size:.7rem;color:var(--secundaria);line-height:1.3}

/* Resumo rápido: quatro números grandes em grade 2x2. */
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:var(--e2);margin-top:var(--e2)}
.resumo .kpi{padding:var(--e3) var(--e4)}
.resumo .kpi .val{font-size:1.55rem}

/* ---------- tela de pesquisa: hero, veredito e traços ----------
   Direção visual trazida do pacote de upgrade, reescrita sobre os tokens que o
   app já tem. Adotar a paleta dele por cima teria dado dois sistemas de cor no
   mesmo aplicativo — o dele chama de primária um teal que aqui já quer dizer
   "o acaso", e a mesma cor passaria a significar duas coisas. O que veio foram
   os RECURSOS: hero com selo, cartão de veredito, linhas de traço e barra em
   gradiente. */
.pq-hero{display:grid;grid-template-columns:1fr auto;gap:var(--e4);align-items:center;
  padding:var(--e5);border-radius:var(--r);border:1px solid var(--linha);
  background:linear-gradient(135deg,var(--carta),
    color-mix(in srgb,var(--acaso) 7%,var(--carta)));
  box-shadow:var(--sombra)}
.pq-hero h2{font-size:1.5rem;line-height:1.1;margin:0 0 6px}
.pq-hero p{margin:0;color:var(--secundaria);font-size:.84rem;max-width:46ch}
.pq-orbe{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,
    color-mix(in srgb,var(--acaso) 38%,white),var(--acaso));
  box-shadow:0 0 0 8px color-mix(in srgb,var(--acaso) 8%,transparent);
  color:#fff;font-family:var(--mono);font-weight:700;font-size:.9rem;letter-spacing:.04em}
@media(max-width:520px){ .pq-hero{grid-template-columns:1fr} .pq-orbe{display:none} }

.pq-selo{display:inline-block;padding:4px 9px;border-radius:99px;font-family:var(--mono);
  font-size:.58rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:var(--trama);color:var(--secundaria)}
.pq-veredito{padding:var(--e4);border-radius:var(--r);border:1px solid var(--linha);
  background:var(--carta);margin-top:var(--e3)}
.pq-veredito.acaso{border-color:color-mix(in srgb,var(--acaso) 30%,var(--linha))}
.pq-veredito.acaso .pq-selo{background:color-mix(in srgb,var(--acaso) 14%,transparent);
  color:var(--acaso)}
.pq-veredito.sinal{border-color:color-mix(in srgb,var(--seu) 42%,var(--linha))}
.pq-veredito.sinal .pq-selo{background:color-mix(in srgb,var(--seu) 16%,transparent);
  color:var(--seu)}
.pq-veredito h3{margin:9px 0 5px;font-size:1.06rem}
.pq-veredito p{margin:0;color:var(--secundaria);font-size:.86rem;line-height:1.55}
.pq-inline{display:flex;gap:var(--e4);flex-wrap:wrap;margin-top:var(--e3);
  padding-top:var(--e3);border-top:1px solid var(--linha);
  font-family:var(--mono);font-size:.66rem;color:var(--secundaria)}
.pq-inline b{color:var(--tinta)}

/* Linha de traço: rótulo, barra e valor. Serve para ler quatro recortes de
   walk-forward de relance, sem virar tabela. */
.pq-traco{display:grid;grid-template-columns:74px 1fr 52px;align-items:center;gap:var(--e2);
  font-family:var(--mono);font-size:.66rem;color:var(--secundaria);margin:6px 0}
.pq-traco i{height:6px;background:var(--trama);border-radius:99px;overflow:hidden;
  position:relative}
.pq-traco i::after{content:"";position:absolute;top:0;bottom:0;left:50%;
  width:var(--w,0);transform:translateX(var(--dx,0));background:var(--acaso);
  border-radius:99px}
.pq-traco.negativo i::after{background:var(--seu)}
.pq-traco b{text-align:right;color:var(--tinta);font-weight:600}
.pq-eixo{display:grid;grid-template-columns:74px 1fr 52px;gap:var(--e2);
  font-family:var(--mono);font-size:.58rem;color:var(--secundaria);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.pq-eixo span:nth-child(2){text-align:center}

.ganho{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
/* Mesma leitura nos cartões: uma faixa na borda esquerda, na cor do resultado. */
.carta.ganhou,.nota.ganhou{border-left:4px solid var(--ganhou)}
.carta.acumulou,.nota.acumulou{border-left:4px solid var(--acumulou)}
.selo-ganho{font-family:var(--mono);font-size:.6rem;letter-spacing:.07em;
  text-transform:uppercase;padding:2px 8px;border-radius:20px;white-space:nowrap}
.selo-ganho.ganhou{background:color-mix(in srgb,var(--ganhou) 15%,transparent);
  color:var(--ganhou-tinta);border:1px solid color-mix(in srgb,var(--ganhou) 45%,transparent)}
.selo-ganho.acumulou{background:color-mix(in srgb,var(--acumulou) 18%,transparent);
  color:var(--acumulou-tinta);border:1px solid color-mix(in srgb,var(--acumulou) 50%,transparent)}
.selo-ganho.desconhecido{background:transparent;color:var(--secundaria);
  border:1px dashed var(--linha)}
.ganho-premio{font-family:var(--mono);font-size:.72rem;color:var(--tinta)}
.ganho-cidades{font-size:.72rem;color:var(--secundaria);flex-basis:100%}
.ponto-sorteio{display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:6px;vertical-align:middle;background:var(--linha)}
.ponto-sorteio.ganhou{background:var(--ganhou)}
.ponto-sorteio.acumulou{background:var(--acumulou)}
.ponto-sorteio.desconhecido{background:transparent;box-shadow:inset 0 0 0 1px var(--linha)}
.proximo .contagem b{display:block;font-family:var(--mono);font-size:1.6rem;
  font-weight:650;line-height:1}
.proximo .contagem span{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;
  opacity:.72}


/* ---------- fluidez ------------------------------------------------------
   O app trocava de tela instantaneamente, e instantâneo sem transição lê como
   corte seco: a pessoa perde a noção de que a tela mudou e de onde veio. Um
   movimento curto orienta; um longo irrita. 160ms é o intervalo em que o olho
   registra a mudança sem esperar por ela.

   Tudo aqui é desligado por prefers-reduced-motion, no fim do arquivo.       */
@media (prefers-reduced-motion:no-preference){
  main{animation:entraTela .16s ease-out both}
  @keyframes entraTela{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* A trilha e o segmentado deslizam o realce em vez de pular. */
  .trilha button,.segmento button,nav button{transition:background .16s ease,
    color .16s ease,border-color .16s ease,transform .1s ease}
  .trilha button:active,.segmento button:active{transform:scale(.96)}
  .acao{transition:transform .1s ease,opacity .16s ease,box-shadow .16s ease,
    background .16s ease}
  .acao:active{transform:scale(.985) translateY(1px)}
  .item,.cartela,.proximo{transition:box-shadow .18s ease,transform .18s ease}
  .ficha:active{transform:scale(.995)}
}

/* Rolagem com inércia no iOS e sem "pulo" ao trocar de tela. */
main{-webkit-overflow-scrolling:touch}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* A cartela ganha a textura do papel de lotérica: uma trama muito fraca, que
   só aparece de perto — de longe lê como papel, não como padrão. */
.cartela .miolo{
  background-image:
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.012) 3px 4px),
    repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.012) 3px 4px)}
/* Picote na borda de cima, como cartela destacada do bloco. */
.cartela .tarja{position:relative}
.cartela .tarja::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:2px;background-image:radial-gradient(circle at 3px 50%,
    var(--papel) 1.6px,transparent 1.7px);background-size:7px 2px}

/* ---------- blocos ---------- */
.carta{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  padding:15px;box-shadow:var(--sombra);margin-bottom:12px}
.campo{display:block;margin-bottom:12px}
.campo label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--secundaria);margin-bottom:5px;font-weight:600}
select,input[type=number],input[type=text],input[type=date]{width:100%;padding:11px 12px;
  background:var(--fundo);border:1px solid var(--linha);border-radius:11px;
  transition:border-color .16s ease,box-shadow .16s ease}
select:focus,input:focus{border-color:var(--acaso);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acaso) 16%,transparent);outline:none}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Teal com texto escuro, no lugar de tinta com texto claro. É o gesto mais
   reconhecível do pacote, e o que faz a ação principal saltar do azul-marinho.
   O texto usa --fundo (quase preto no escuro, quase branco no claro), então o
   contraste se resolve sozinho nos dois temas. */
.acao{width:100%;padding:15px;border:0;border-radius:15px;
  background:linear-gradient(135deg,var(--acaso),var(--acaso-fundo));
  color:var(--fundo);font-weight:750;cursor:pointer;letter-spacing:.02em;
  transition:transform .12s ease,opacity .16s ease,box-shadow .16s ease;
  box-shadow:0 10px 26px -12px color-mix(in srgb,var(--acaso) 60%,transparent)}
.acao:active{transform:translateY(1px)}
/* A variante de contorno continua sóbria: duas ações em teal na mesma tela
   brigariam entre si e nenhuma seria a principal. */
.acao.contorno,.acao.secundaria{background:transparent;color:var(--tinta);
  box-shadow:inset 0 0 0 1.5px var(--linha)}
.acao:disabled{opacity:.5;box-shadow:none}
.acao.contorno{background:transparent;color:var(--tinta);border:1px solid var(--linha);
  box-shadow:none}
.acao.contorno:hover{background:var(--veu)}
.acao.perigo{background:transparent;color:var(--alerta);border:1px solid var(--alerta);
  box-shadow:none}
.acao.aviao{background:var(--acaso);color:#fff}
.mini{padding:9px 12px;font-size:.85rem;border-radius:10px;width:auto}
.botoes{display:flex;gap:8px;flex-wrap:wrap}
.girando{display:inline-block;width:13px;height:13px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;vertical-align:-2px;margin-right:7px;
  animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.girando{animation:none}}

/* ---------- ficha de jogo: a peça de identidade ---------- */
.ficha{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  padding:13px;margin-bottom:10px;position:relative;overflow:hidden;
  box-shadow:var(--sombra)}
.ficha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;
  background:var(--seu)}
.ficha.conferida::before{background:var(--acaso)}
.ficha .topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:9px}
.ficha .id{font-family:var(--mono);font-size:.68rem;color:var(--secundaria);
  letter-spacing:.08em}
.dezenas{display:flex;flex-wrap:wrap;gap:5px}
.dz{font-family:var(--mono);font-size:.85rem;font-weight:600;min-width:35px;height:35px;
  display:grid;place-items:center;border:1px solid var(--linha);border-radius:10px;
  background:var(--fundo);font-variant-numeric:tabular-nums}

/* Bolas do resultado sorteado. É a peça mais repetida da interface — aparece em
   toda linha de histórico — e é o que faz a lista parecer resultado de loteria
   em vez de tabela de banco de dados. Verde e redonda, como no volante. */
.bolas{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.bola{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:.78rem;font-weight:650;font-variant-numeric:tabular-nums;
  color:var(--ganhou);background:color-mix(in srgb,var(--ganhou) 13%,transparent);
  border:1.5px solid color-mix(in srgb,var(--ganhou) 45%,transparent)}
@media(max-width:380px){ .bola{width:31px;height:31px;font-size:.72rem} }
.dz.acertou{background:var(--acaso);border-color:var(--acaso);color:#fff;
  box-shadow:0 2px 8px -3px color-mix(in srgb,var(--acaso) 70%,transparent)}
.dz.marcada{border-color:var(--seu);color:var(--seu)}
.dz.trevo{border-color:var(--acaso);color:var(--acaso);border-radius:50%}

/* ---------- o último sorteio contra os jogos salvos ----------
   A dezena SORTEADA e a dezena ACERTADA não podem ter a mesma cara. A de cima
   é o que a Caixa sorteou; a de baixo é o encontro entre aquilo e o seu jogo.
   Pintar as duas de verde chapado faria a tela inteira parecer acerto. */
.dz.sorteada{border-color:color-mix(in srgb,var(--ganhou) 45%,transparent);
  color:var(--ganhou);background:color-mix(in srgb,var(--ganhou) 12%,transparent)}
.sorteio-cabeca{display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;flex-wrap:wrap}
.titulo-painel{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--secundaria)}
.sorteio-num{font-size:1.02rem;color:var(--secundaria);margin-top:3px}
.sorteio-num b{font-family:var(--mono);font-size:1.35rem;font-weight:650;
  color:var(--tinta);font-variant-numeric:tabular-nums}
.sorteio-num span{display:block;font-size:.76rem;margin-top:1px}
.sorteio-dezenas{margin-top:10px}
.resumo-confronto{margin:13px 0 4px;padding-top:12px;border-top:1px solid var(--linha);
  font-size:.88rem;color:var(--secundaria);line-height:1.5}
.resumo-confronto b{color:var(--tinta)}

/* Um bloco por jogo. A faixa na borda esquerda repete a gramática da .ficha:
   sem faixa é jogo comum, faixa acesa é faixa de prêmio. */
.confronto{position:relative;margin-top:10px;padding:10px 11px 11px 13px;
  border:1px solid var(--linha);border-radius:12px;background:var(--fundo)}
.confronto::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:12px 0 0 12px;background:var(--linha)}
.confronto.premiado::before{background:var(--acaso)}
.confronto.premiado{border-color:color-mix(in srgb,var(--acaso) 38%,var(--linha))}
.cabeca-confronto{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin-bottom:9px}
.quanto{font-size:.82rem;color:var(--secundaria)}
.quanto b{font-family:var(--mono);font-size:1.5rem;font-weight:650;color:var(--tinta);
  font-variant-numeric:tabular-nums;margin-right:2px}
.cabeca-confronto .contexto{font-size:.72rem;color:var(--secundaria);
  flex-basis:100%;line-height:1.4}
.vazio-painel{margin:9px 0 12px;font-size:.86rem;color:var(--secundaria);line-height:1.5}
.fora-do-concurso{margin-top:11px;font-size:.8rem;color:var(--secundaria)}
.fora-do-concurso summary{cursor:pointer;padding:4px 0}
.linha-fora{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:6px 0;border-top:1px solid var(--linha);font-size:.74rem}
.linha-fora .num{font-family:var(--mono);color:var(--tinta)}

/* ---------- faixa do acaso ---------- */
.faixa{margin-top:11px}
.faixa svg{display:block;width:100%;height:38px;overflow:visible}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.66rem;color:var(--secundaria);
  font-family:var(--mono);margin-top:5px}
.legenda i{display:inline-block;width:14px;height:0;vertical-align:middle;margin-right:4px}

/* ---------- indicadores ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  padding:13px;box-shadow:var(--sombra)}
.kpi .rot{font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--secundaria);font-weight:700}
.kpi .val{font-family:var(--mono);font-size:1.72rem;font-weight:700;letter-spacing:-.025em;
  margin-top:3px;color:var(--acaso)}
.kpi .sub{font-size:.7rem;color:var(--secundaria);font-family:var(--mono)}

/* ---------- avisos ---------- */
.nota{border-left:3px solid var(--acaso);background:var(--carta);border-radius:0 10px 10px 0;
  padding:10px 12px;font-size:.85rem;color:var(--secundaria);margin:10px 0}
.nota strong{color:var(--tinta)}
.nota.atencao{border-left-color:var(--alerta)}
.selo{display:inline-block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border:1px solid var(--linha);border-radius:20px;
  color:var(--secundaria)}
.selo.ok{color:var(--acaso);border-color:var(--acaso)}
.selo.seu{color:var(--seu);border-color:var(--seu)}
.vazio{text-align:center;color:var(--secundaria);padding:34px 16px;font-size:.9rem}
.metodo{border:1px solid var(--linha);border-radius:13px;padding:12px;margin-bottom:8px;
  cursor:pointer;background:var(--carta);transition:border-color .16s ease,box-shadow .16s ease}
.metodo:hover{border-color:var(--secundaria)}
.metodo[aria-checked="true"]{border-color:var(--tinta);
  box-shadow:inset 0 0 0 1px var(--tinta),var(--sombra)}
.metodo b{display:block;font-size:.94rem}
.metodo span{display:block;font-size:.78rem;color:var(--secundaria);margin-top:2px}
.prosa{font-size:.92rem}
.prosa p{margin:.7em 0}
.prosa ul{padding-left:1.15em;margin:.5em 0}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.78rem}
th{text-align:left;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--secundaria);padding:6px 7px;border-bottom:1px solid var(--linha)}
td{padding:6px 7px;border-bottom:1px solid var(--trama)}
.aviso-fixo{font-size:.72rem;color:var(--secundaria);text-align:center;margin:18px 0 4px;
  line-height:1.45}

/* ---------- busca do resultado oficial ---------- */
.busca{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.busca .acao{flex:1}
.origem{display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--secundaria);
  font-family:var(--mono);margin-top:9px}
.origem b{color:var(--acaso);font-weight:600}
.pilula{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;
  border:1px solid var(--linha);color:var(--secundaria)}
.pilula.oficial{color:var(--acaso);border-color:var(--acaso)}
.pilula.manual{color:var(--seu);border-color:var(--seu)}

/* ---------- aderência: barras de frequência contra a faixa do acaso ---------- */
.grade-freq{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.cel{border:1px solid var(--linha);border-radius:9px;padding:5px 3px 4px;text-align:center;
  background:var(--carta)}
.cel .n{font-family:var(--mono);font-size:.72rem;font-weight:600}
.cel .b{height:26px;display:flex;align-items:flex-end;justify-content:center;margin-top:3px}
.cel .b i{display:block;width:9px;border-radius:2px 2px 0 0;background:var(--acaso);
  opacity:.75;min-height:1px}
.cel.fora .b i{background:var(--alerta);opacity:1}
.cel .c{font-family:var(--mono);font-size:.58rem;color:var(--secundaria);margin-top:2px}
.cel.fora{border-color:var(--alerta)}
.escala{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.6rem;
  color:var(--secundaria);margin-top:7px}
.barra-teste{height:9px;border-radius:5px;background:var(--trama);overflow:hidden;
  position:relative;margin:9px 0 5px}
.barra-teste i{position:absolute;top:0;bottom:0;left:0;background:var(--acaso);border-radius:5px}
.barra-teste.fora i{background:var(--alerta)}

/* Barra da tabela de medidas da sugestão. Mais baixa que a barra-teste porque
   aparece dez vezes seguidas dentro de uma tabela, e altura de barra de
   progresso ali viraria uma escada. */
