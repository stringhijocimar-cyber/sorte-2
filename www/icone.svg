<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="LotoLab">
  <!-- Trevo de quatro folhas.

       Geométrico de propósito: quatro folhas em forma de coração, giradas de
       90° em 90° a partir do centro, com um vinco reto em cada uma. Trevo
       desenhado à mão fica bonito grande e vira mancha aos 24px do cabeçalho —
       esta construção lê nos dois tamanhos porque é a mesma forma repetida,
       sem detalhe que precise sobreviver à redução.

       As cores são as do app: teal do acaso em três folhas, âmbar do "seu" em
       uma. A folha diferente não é enfeite — é a assinatura do app inteiro,
       que separa o que é acaso do que é seu. -->
  <defs>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA090"/><stop offset="1" stop-color="#0E6E62"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB3A3"/><stop offset="1" stop-color="#12796C"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E6E62"/><stop offset="1" stop-color="#0A5249"/>
    </linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9A73C"/><stop offset="1" stop-color="#B26B00"/>
    </linearGradient>
  </defs>

  <!-- Caule: uma curva só, saindo por baixo. -->
  <path d="M32 34q3.6 9.8-2.2 18.4" fill="none" stroke="#0A5249"
        stroke-width="3.4" stroke-linecap="round"/>

  <!-- Uma folha, repetida em quatro rotações. O caminho é um coração feito de
       dois arcos que fecham na diagonal — o vinco fica na própria borda. -->
  <g transform="translate(32 28)">
    <g transform="rotate(-45)">
      <path d="M0 0V-14a9.9 9.9 0 0 1 14 0h0a9.9 9.9 0 0 1 0 14Z" fill="url(#f1)"/>
    </g>
    <g transform="rotate(45)">
      <path d="M0 0V-14a9.9 9.9 0 0 1 14 0h0a9.9 9.9 0 0 1 0 14Z" fill="url(#f4)"/>
    </g>
    <g transform="rotate(135)">
      <path d="M0 0V-14a9.9 9.9 0 0 1 14 0h0a9.9 9.9 0 0 1 0 14Z" fill="url(#f2)"/>
    </g>
    <g transform="rotate(225)">
      <path d="M0 0V-14a9.9 9.9 0 0 1 14 0h0a9.9 9.9 0 0 1 0 14Z" fill="url(#f3)"/>
    </g>
    <!-- Miolo: o ponto que costura as quatro folhas e dá centro à marca. -->
    <circle r="2.6" fill="#FBF8F1" opacity=".92"/>
  </g>
</svg>
